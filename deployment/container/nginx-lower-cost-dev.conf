worker_processes auto;
pid /tmp/nginx.pid;
# NGINX request-error messages cannot redact URLs/IPs; use sanitized access status and health alarms.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No URLs, query strings, IPs, headers, cookies or request bodies in access logs.
    map $request_method $operationalMethod {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        OPTIONS OPTIONS;
    }
    log_format operational escape=json '{"event":"http_access","time":"$time_iso8601","requestId":"$request_id","method":"$operationalMethod","status":"$status","bytes":"$body_bytes_sent","durationSeconds":"$request_time"}';
    access_log /dev/stdout operational;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $uri $assetCache {
        default "no-store";
        "~*-[a-z0-9]{8,}\.(js|css)$" "private, max-age=31536000, immutable";
    }
    server {
        listen 8443 ssl;
        ssl_certificate /run/credentials/server.crt;
        ssl_certificate_key /run/credentials/server.key;
        ssl_client_certificate /run/credentials/trust.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        # The CA chain alone is insufficient: only Gateway's dedicated identity is authorized.
        if ($ssl_client_s_dn != "CN=gateway.lookahead-dev.internal") { return 403; }
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $assetCache always;
        # This server holds no sessions or API credentials. Gateway owns these paths; no credentials are forwarded to static Web.
        location ~ ^/(api|bff|content|auth|oauth2|login|logout|local-previews)(/|$) { return 404; }
        location ~ /\. { return 404; }
        location ~* \.(map|pem|key|p12|pfx|jks|keystore)$ { return 404; }
        location = /health {
            default_type application/json;
            # Readiness also fails if the built shell is absent.
            if (!-f $document_root/index.html) { return 503; }
            return 200 '{"status":"UP"}';
        }
        # Missing assets must never receive index.html with a misleading 200.
        location ~* \.[^/]+$ { try_files $uri =404; }
        location /assets/ { try_files $uri =404; }
        location /formatters/ { try_files $uri =404; }
        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ /index.html;
        }
    }
    server {
        listen 127.0.0.1:8081;
        root /usr/share/nginx/html;
        location = /health {
            default_type application/json;
            if (!-f $document_root/index.html) { return 503; }
            return 200 '{"status":"UP"}';
        }
        location / { return 404; }
    }

}
