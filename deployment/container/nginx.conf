worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Access logs carry the path without its query string and the Gateway's request ID (X-Request-Id).
    # Still no query strings, IPs, cookies, other headers or request bodies.
    map $request_method $operationalMethod {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        OPTIONS OPTIONS;
    }
    # Only a well-formed lowercase UUID from Gateway is trusted; anything else gets nginx's own ID.
    map $http_x_request_id $lookaheadRequestId {
        default $request_id;
        "~^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_request_id;
    }
    # The path the browser asked for, cut at "?" so the query string never reaches the log. $uri would show
    # /index.html for every app page, because try_files rewrites it before the line is written.
    map $request_uri $operationalPath {
        default "";
        "~^(?<requestedPath>[^?]*)" $requestedPath;
    }
    map $status $operationalLevel {
        default INFO;
        "~^5" WARN;
    }
    log_format operational escape=json '{"event":"http_access","time":"$time_iso8601","level":"$operationalLevel","service":"web","requestId":"$lookaheadRequestId","method":"$operationalMethod","path":"$operationalPath","status":"$status","bytes":"$body_bytes_sent","durationSeconds":"$request_time"}';
    access_log /dev/stdout operational;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $uri $assetCache {
        default "no-store";
        "~*-[a-z0-9]{8,}\.(js|css)$" "private, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $assetCache always;
        # This server holds no sessions or API credentials. ALB routes these to Gateway.
        location ~ ^/(api|bff|content|auth|oauth2|login|logout|local-previews)(/|$) { return 404; }
        location ~ /\. { return 404; }
        location ~* \.(map|pem|key|p12|pfx|jks|keystore)$ { return 404; }
        location = /health {
            default_type application/json;
            # Readiness also fails if the built shell is absent.
            if (!-f $document_root/index.html) { return 503; }
            return 200 '{"status":"UP"}';
        }
        # Missing assets must never receive index.html with a misleading 200.
        location ~* \.[^/]+$ { try_files $uri =404; }
        location /assets/ { try_files $uri =404; }
        location /formatters/ { try_files $uri =404; }
        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ /index.html;
        }
    }
}
