worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No URLs, query strings, IPs, headers, cookies or request bodies in access logs.
    map $request_method $operationalMethod {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        OPTIONS OPTIONS;
    }
    log_format operational escape=json '{"event":"http_access","time":"$time_iso8601","requestId":"$request_id","method":"$operationalMethod","status":"$status","bytes":"$body_bytes_sent","durationSeconds":"$request_time"}';
    access_log /dev/stdout operational;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $uri $assetCache {
        default "no-store";
        "~*-[a-z0-9]{8,}\.(js|css)$" "private, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $assetCache always;
        # This server holds no sessions or API credentials. ALB routes these to Gateway.
        location ~ ^/(api|bff|content|auth|oauth2|login|logout|local-previews)(/|$) { return 404; }
        location ~ /\. { return 404; }
        location ~* \.(map|pem|key|p12|pfx|jks|keystore)$ { return 404; }
        location = /health {
            default_type application/json;
            # Readiness also fails if the built shell is absent.
            if (!-f $document_root/index.html) { return 503; }
            return 200 '{"status":"UP"}';
        }
        # Missing assets must never receive index.html with a misleading 200.
        location ~* \.[^/]+$ { try_files $uri =404; }
        location /assets/ { try_files $uri =404; }
        location /formatters/ { try_files $uri =404; }
        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ /index.html;
        }
    }
}
