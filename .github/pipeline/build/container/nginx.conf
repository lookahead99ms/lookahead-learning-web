worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Access log (plain logs, owner decision 2026-11-17): one plain line per request, readable without a schema. Shape:
    #   <time> <LEVEL> <METHOD> <path> <status> <bytes> B <seconds> s[ upstream <address> status <status>]  [request <id8>]
    #   2026-11-17T20:45:30+00:00 INFO  GET /learn/two-pointers 200 31204 B 0.003 s  [request b3e6a0d7]
    #   2026-11-17T21:16:40+00:00 ERROR GET /health 503 0 B 0.000 s  [request 0c8e5b21]
    # Level: INFO below 500, ERROR for 5xx (an nginx 5xx is something to act on; the deploy log scan searches for ERROR).
    # Bytes: plain bytes with the unit B (nginx cannot divide, so no kB/MB rounding); the same choice in both nginx configs.
    # Path: the one the browser asked for, cut at "?". Request id: Gateway's X-Request-Id when it is a lowercase UUID, else
    # nginx's own id; the bracket shows its first 8 characters so one search finds the Web, Gateway and Domain lines.
    # Still no query strings, IPs, cookies, other headers or request bodies.
    map $request_method $operationalMethod {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        OPTIONS OPTIONS;
    }
    # Only a well-formed lowercase UUID from Gateway is trusted; anything else gets nginx's own ID.
    map $http_x_request_id $lookaheadRequestId {
        default $request_id;
        "~^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_request_id;
    }
    map $lookaheadRequestId $operationalRequestId {
        default "";
        "~^(?<requestIdPrefix>[0-9a-f]{8})" $requestIdPrefix;
    }
    # The path the browser asked for, cut at "?" so the query string never reaches the log. $uri would show
    # /index.html for every app page, because try_files rewrites it before the line is written.
    map $request_uri $operationalPath {
        default "";
        "~^(?<requestedPath>[^?]*)" $requestedPath;
    }
    # INFO carries one trailing space so the level column is five characters wide, like the Java services' lines.
    map $status $operationalLevel {
        default "INFO ";
        "~^5" ERROR;
    }
    # A 5xx line appends what nginx knows about the upstream answer. This server proxies nothing, so the detail is empty
    # today; upstream connect failures and other diagnostics are reported by error_log at warn instead.
    map "$status $upstream_addr $upstream_status" $operationalUpstream {
        default "";
        "~^5[0-9]{2} (?<upstreamAddress>.+) (?<upstreamStatus>[^ ]+)$" " upstream $upstreamAddress status $upstreamStatus";
    }
    log_format operational '$time_iso8601 $operationalLevel $operationalMethod $operationalPath $status $body_bytes_sent B $request_time s$operationalUpstream  [request $operationalRequestId]';
    access_log /dev/stdout operational;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $uri $assetCache {
        default "no-store";
        "~*-[a-z0-9]{8,}\.(js|css)$" "private, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $assetCache always;
        # This server holds no sessions or API credentials. ALB routes these to Gateway.
        location ~ ^/(api|bff|content|auth|oauth2|login|logout|local-previews)(/|$) { return 404; }
        location ~ /\. { return 404; }
        location ~* \.(map|pem|key|p12|pfx|jks|keystore)$ { return 404; }
        location = /health {
            default_type application/json;
            # Readiness also fails if the built shell is absent.
            if (!-f $document_root/index.html) { return 503; }
            return 200 '{"status":"UP"}';
        }
        # Missing assets must never receive index.html with a misleading 200.
        location ~* \.[^/]+$ { try_files $uri =404; }
        location /assets/ { try_files $uri =404; }
        location /formatters/ { try_files $uri =404; }
        location / {
            limit_except GET HEAD { deny all; }
            # DLV-969: $uri/index.html, never $uri/: a route snapshot folder (learn/index.html) would make nginx answer
            # 301 /learn -> /learn/, and the DEV Gateway refuses to relay redirects (502). This serves the snapshot directly.
            try_files $uri $uri/index.html /index.html;
        }
    }
}
