name: Learning Web CI
run-name: "${{ github.workflow }} | ${{ github.head_ref || github.ref_name }} | ${{ github.event_name }} | #${{ github.run_number }}"

on:
  workflow_call:
    inputs:
      release-version:
        type: string
        default: ''
      export-image:
        type: boolean
        default: false
      source-sha:
        type: string
        required: false
        default: ''
        description: Tag-resolved application commit to build; empty builds the triggering commit
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: learning-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build Angular application
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RELEASE_VERSION: ${{ inputs.release-version }}
      SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
      CODEQL_ACTION_OVERLAY_ANALYSIS: 'false'

    steps:
      - name: Check out the selected source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch the executed workflow commit for image binding
        if: inputs.export-image == true
        run: git fetch origin "$GITHUB_SHA"

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the declared npm version
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Test security gates with synthetic pass and fail reports
        run: npm run test:security-gates

      - name: Test container scanner failure and inventory gates
        run: python3 -m unittest discover -s tools/security -p 'test_*.py'

      - name: Install the verified container scanner
        run: python3 tools/security/container_scan.py install

      - name: Scan container configuration and source for secrets
        run: python3 tools/security/container_scan.py config

      - name: Install the verified secret scanner
        run: npm run security:install-secret-scanner

      - name: Verify secret detection and safe reporting
        run: npm run test:secret-scanner

      - name: Scan source and reachable history for secrets
        env:
          SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SECURITY_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        run: npm run security:secrets

      - name: Verify dependency vulnerabilities and SBOM coverage
        run: npm run security:dependencies

      - name: Set up Python for release verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Install hash-locked release coverage tooling
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tools/release/requirements-coverage.txt

      - name: Verify immutable image binding
        env:
          COVERAGE_FILE: ${{ runner.temp }}/web-release.coverage
        run: |
          python -m coverage run --source=tools/release -m unittest discover -s tools/release -p 'test_*.py'
          python -m coverage report --include='*/release_version.py,*/pipeline_tag.py,*/image.py,*/registry.py' --fail-under=85

      - name: Verify Git release tag before building
        if: inputs.export-image == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/release_version.py check --app web

      - name: Verify web release metadata
        run: node --test --experimental-test-coverage --test-coverage-lines=85 --test-coverage-include=scripts/release-metadata.mjs scripts/release-metadata.test.mjs


      - name: Initialize JavaScript and TypeScript analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          tools: linked
          build-mode: none
          queries: security-extended
          config-file: .github/codeql.yml
          dependency-caching: false

      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          output: .codex-scratch/security/codeql
          upload: never
          upload-database: false

      - name: Enforce CodeQL severity and analysis completion
        run: npm run security:sarif -- .codex-scratch/security/codeql

      - name: Install dependencies
        run: npm ci --include=prod --include=dev --include=optional --include=peer --no-audit --no-fund

      - name: Test installed dependency security regressions
        run: npm run test:security-runtime

      - name: Verify private-content boundary
        run: npm run validate:source-boundary

      - name: Verify public release candidate
        run: npm run validate:public-readiness

      - name: Validate public demo content
        run: npm run validate:content

      - name: Validate synthetic content contracts
        run: npm run validate:content:ci

      - name: Test canonical content contract
        run: npm run test:content-contract

      - name: Require full application line coverage of at least 85 percent
        run: npm run test:coverage

      - name: Test content inventory with synthetic fixtures
        run: npm run test:content-audit

      - name: Test loading profiler with synthetic fixtures
        run: npm run test:dsa-profile

      - name: Test browser budget evaluator
        run: npm run test:browser-profile

      - name: Build public demo application
        run: npm run build:ci

      - name: Test protected container artifact boundary
        run: npm run test:container-boundary

      - name: Build and verify protected Web container locally
        run: |
          docker build --build-arg "RELEASE_VERSION=${RELEASE_VERSION:-dev}" --build-arg "SOURCE_REVISION=$SOURCE_SHA" --platform linux/amd64 --iidfile /tmp/lookahead-web-image-id .
          docker build --build-arg "RELEASE_VERSION=${RELEASE_VERSION:-dev}" --build-arg "SOURCE_REVISION=$SOURCE_SHA" --platform linux/amd64 --target toolchain --iidfile /tmp/lookahead-web-toolchain-id .
          docker build --build-arg "RELEASE_VERSION=${RELEASE_VERSION:-dev}" --build-arg "SOURCE_REVISION=$SOURCE_SHA" --platform linux/amd64 --target build --iidfile /tmp/lookahead-web-builder-id .
          npm run test:container -- "$(cat /tmp/lookahead-web-image-id)"
          WEB_TLS_TEST_IMAGE="$(cat /tmp/lookahead-web-image-id)" python3 scripts/container/test_injected_tls.py -v

      - name: Scan pinned OS bases and exact toolchain, builder and Web images
        run: python3 tools/security/container_scan.py images --toolchain "$(cat /tmp/lookahead-web-toolchain-id)" --builder "$(cat /tmp/lookahead-web-builder-id)" --image "$(cat /tmp/lookahead-web-image-id)"

      - name: Export the exact scanned release image
        if: inputs.export-image == true
        run: python3 tools/release/image.py export --image "$(cat /tmp/lookahead-web-image-id)" --directory "$RUNNER_TEMP/release-image"

      - name: Retain immutable image for the same release run
        if: inputs.export-image == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-image-${{ inputs.source-sha || github.sha }}
          path: ${{ runner.temp }}/release-image/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
