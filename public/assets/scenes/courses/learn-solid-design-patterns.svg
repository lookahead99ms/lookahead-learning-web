<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="An Order event fans out to three listeners while two threads take turns through a lock">
  <style>
    .learn-solid-design-patterns-card { fill: var(--scene-card, #fff); stroke: var(--scene-line, #cfdfdc); stroke-width: 2; }
    .learn-solid-design-patterns-soft { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 2; }
    .learn-solid-design-patterns-ink { fill: var(--scene-ink, #102a33); font-family: system-ui, sans-serif; font-weight: 700; }
    .learn-solid-design-patterns-wire { stroke: var(--scene-muted, #536970); stroke-width: 2; fill: none; }
    .learn-solid-design-patterns-icon { fill: none; stroke: var(--scene-learn, #0f8a8a); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .learn-solid-design-patterns-ev { fill: var(--scene-accent, #006c73); animation: learn-solid-design-patterns-fan 6s ease-in infinite; animation-delay: -3s; }
    .learn-solid-design-patterns-e1 { offset-path: path("M112 52 L216 22"); }
    .learn-solid-design-patterns-e2 { offset-path: path("M112 52 L216 52"); }
    .learn-solid-design-patterns-e3 { offset-path: path("M112 52 L216 82"); }
    .learn-solid-design-patterns-lane { stroke: var(--scene-line, #cfdfdc); stroke-width: 4; stroke-linecap: round; }
    .learn-solid-design-patterns-t1 { fill: var(--scene-link, #245a88); animation: learn-solid-design-patterns-t1 6s linear infinite; animation-delay: -3s; }
    .learn-solid-design-patterns-t2 { fill: var(--scene-grow, #b8457a); animation: learn-solid-design-patterns-t2 6s linear infinite; animation-delay: -3s; }
    @keyframes learn-solid-design-patterns-fan { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 45% { offset-distance: 100%; opacity: 1; } 55%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes learn-solid-design-patterns-t1 { 0% { transform: translateX(0); } 20% { transform: translateX(118px); } 45% { transform: translateX(160px); } 60%, 100% { transform: translateX(270px); opacity: 1; } }
    @keyframes learn-solid-design-patterns-t2 { 0% { transform: translateX(0); } 20%, 50% { transform: translateX(104px); } 65% { transform: translateX(160px); } 90%, 100% { transform: translateX(270px); } }
  </style>

  <!-- observer: Order publishes to listeners -->
  <rect class="learn-solid-design-patterns-soft" x="16" y="34" width="96" height="36" rx="10"/>
  <text class="learn-solid-design-patterns-ink" x="64" y="57" font-size="16" text-anchor="middle">Order</text>
  <path class="learn-solid-design-patterns-wire" d="M112 52 L216 22 M112 52 L216 52 M112 52 L216 82" stroke-dasharray="4 4"/>
  <circle class="learn-solid-design-patterns-ev learn-solid-design-patterns-e1" r="5"/>
  <circle class="learn-solid-design-patterns-ev learn-solid-design-patterns-e2" r="5"/>
  <circle class="learn-solid-design-patterns-ev learn-solid-design-patterns-e3" r="5"/>

  <!-- listener: email -->
  <rect class="learn-solid-design-patterns-card" x="218" y="8" width="44" height="28" rx="7"/>
  <rect class="learn-solid-design-patterns-icon" x="229" y="15" width="22" height="14" rx="2"/>
  <path class="learn-solid-design-patterns-icon" d="M229 16 l11 7 l11 -7"/>
  <!-- listener: stock box -->
  <rect class="learn-solid-design-patterns-card" x="218" y="38" width="44" height="28" rx="7"/>
  <path class="learn-solid-design-patterns-icon" d="M230 46 l10 -4 l10 4 v12 l-10 4 l-10 -4 z M230 46 l10 4 l10 -4 M240 50 v12"/>
  <!-- listener: analytics -->
  <rect class="learn-solid-design-patterns-card" x="218" y="68" width="44" height="28" rx="7"/>
  <path class="learn-solid-design-patterns-icon" d="M230 89 v-6 M237 89 v-11 M244 89 v-8 M251 89 v-14"/>
  <text class="learn-solid-design-patterns-ink" x="270" y="57" font-size="16">notify</text>

  <!-- concurrency: two threads, one lock -->
  <path class="learn-solid-design-patterns-lane" d="M20 126 H300 M20 160 H300"/>
  <rect x="150" y="112" width="36" height="62" rx="6" fill="var(--scene-accent-soft, #dcefed)" opacity="0.8"/>
  <g>
    <path d="M161 110 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="var(--scene-ink, #102a33)" stroke-width="2.5"/>
  </g>
  <rect x="157" y="108" width="22" height="16" rx="3" fill="var(--scene-ink, #102a33)"/>
  <text class="learn-solid-design-patterns-ink" x="198" y="148" font-size="16">lock</text>
  <circle class="learn-solid-design-patterns-t1" cx="28" cy="126" r="8"/>
  <circle class="learn-solid-design-patterns-t2" cx="28" cy="160" r="8"/>
</svg>
