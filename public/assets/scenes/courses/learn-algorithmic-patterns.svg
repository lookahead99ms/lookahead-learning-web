<rect class="learn-algorithmic-patterns-cell" x="264" y="34" width="30" height="30" rx="4"/><text class="learn-algorithmic-patterns-tm" x="279" y="54">8</text>
</g>
<text class="learn-algorithmic-patterns-t" x="26" y="104" font-size="16">two pointers</text>
<g font-size="16" text-anchor="middle">
<rect class="learn-algorithmic-patterns-cell" x="26" y="114" width="30" height="30" rx="4"/><text class="learn-algorithmic-patterns-tm" x="41" y="134">1</text>
