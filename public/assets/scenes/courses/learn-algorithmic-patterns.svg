<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A three-cell window slides along an array, and two pointers walk inward from both ends of a sorted array">
<style>
.learn-algorithmic-patterns-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.learn-algorithmic-patterns-tm { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: var(--scene-ink, #102a33); font-weight: 600; }
.learn-algorithmic-patterns-cell { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.learn-algorithmic-patterns-win { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 2.5; animation: learn-algorithmic-patterns-kf-win 6s steps(1) infinite; }
@keyframes learn-algorithmic-patterns-kf-win { 0% { transform: translateX(0); } 20% { transform: translateX(34px); } 40% { transform: translateX(68px); } 60% { transform: translateX(102px); } 80%, 100% { transform: translateX(136px); } }
.learn-algorithmic-patterns-l { fill: var(--scene-learn, #0f8a8a); animation: learn-algorithmic-patterns-kf-l 6s steps(1) infinite; }
@keyframes learn-algorithmic-patterns-kf-l { 0% { transform: translateX(0); } 25% { transform: translateX(34px); } 50% { transform: translateX(68px); } 75%, 100% { transform: translateX(102px); } }
.learn-algorithmic-patterns-r { fill: var(--scene-accent, #006c73); animation: learn-algorithmic-patterns-kf-r 6s steps(1) infinite; }
@keyframes learn-algorithmic-patterns-kf-r { 0% { transform: translateX(0); } 25% { transform: translateX(-34px); } 50% { transform: translateX(-68px); } 75%, 100% { transform: translateX(-102px); } }
.learn-algorithmic-patterns-win, .learn-algorithmic-patterns-l, .learn-algorithmic-patterns-r { animation-delay: -3s; }
</style>
<text class="learn-algorithmic-patterns-t" x="26" y="22" font-size="16">sliding window</text>
<rect class="learn-algorithmic-patterns-win" x="22" y="30" width="106" height="38" rx="7"/>
<g font-size="16" text-anchor="middle">
