<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A container image is shipped into a cluster node, and Kubernetes scales the service from two pods to four">
<style>
.grow-docker-kubernetes-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); }
.grow-docker-kubernetes-tm { font-family: ui-monospace, Menlo, monospace; fill: var(--scene-ink, #102a33); }
.grow-docker-kubernetes-b { font-weight: 700; }
.grow-docker-kubernetes-box { fill: var(--scene-card, #fff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.grow-docker-kubernetes-soft { fill: var(--scene-accent-soft, #dcefed); }
.grow-docker-kubernetes-card { fill: var(--scene-card, #fff); }
.grow-docker-kubernetes-acc { fill: var(--scene-accent, #006c73); }
.grow-docker-kubernetes-mut { fill: var(--scene-muted, #536970); }
.grow-docker-kubernetes-linef { fill: var(--scene-line, #cfdfdc); }
.grow-docker-kubernetes-good { fill: var(--scene-good, #1f7a4d); }
.grow-docker-kubernetes-bad { fill: var(--scene-bad, #b3261e); }
.grow-docker-kubernetes-warn { fill: var(--scene-warn, #a15c00); }
.grow-docker-kubernetes-grow { fill: var(--scene-grow, #b8457a); }
.grow-docker-kubernetes-wire { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 1.5; }
.grow-docker-kubernetes-sacc { fill: none; stroke: var(--scene-accent, #006c73); stroke-width: 2; }
.grow-docker-kubernetes-sgood { fill: none; stroke: var(--scene-good, #1f7a4d); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.grow-docker-kubernetes-scard { fill: none; stroke: var(--scene-card, #fff); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.grow-docker-kubernetes-sbad { fill: none; stroke: var(--scene-bad, #b3261e); stroke-width: 2; }

.grow-docker-kubernetes-flow { fill: none; stroke: var(--scene-accent, #006c73); stroke-width: 2.5; stroke-dasharray: 6 6; animation: grow-docker-kubernetes-kf-flow 1s linear infinite; }
@keyframes grow-docker-kubernetes-kf-flow { to { stroke-dashoffset: -24; } }
.grow-docker-kubernetes-pod { transform-box: fill-box; transform-origin: center; animation: grow-docker-kubernetes-kf-pod 7s ease-out infinite; animation-delay: -3s; }
.grow-docker-kubernetes-pod.grow-docker-kubernetes-late { animation-name: grow-docker-kubernetes-kf-pod2; }
@keyframes grow-docker-kubernetes-kf-pod { 0%, 38% { transform: scale(0); opacity: 0; } 46%, 92% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
@keyframes grow-docker-kubernetes-kf-pod2 { 0%, 46% { transform: scale(0); opacity: 0; } 54%, 92% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
.grow-docker-kubernetes-r2 { animation: grow-docker-kubernetes-kf-r2 7s infinite; animation-delay: -3s; }
@keyframes grow-docker-kubernetes-kf-r2 { 0%, 38% { opacity: 1; } 42%, 94% { opacity: 0; } 98%, 100% { opacity: 1; } }
.grow-docker-kubernetes-r4 { animation: grow-docker-kubernetes-kf-r4 7s infinite; animation-delay: -3s; }
@keyframes grow-docker-kubernetes-kf-r4 { 0%, 38% { opacity: 0; } 42%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
</style>
<!-- image layers -->
<g transform="translate(16 46)">
  <rect class="grow-docker-kubernetes-soft" x="0" y="0" width="84" height="88" rx="12"/>
  <rect class="grow-docker-kubernetes-box" x="14" y="54" width="56" height="16" rx="4"/>
  <rect class="grow-docker-kubernetes-box" x="14" y="36" width="56" height="16" rx="4"/>
  <rect class="grow-docker-kubernetes-acc" x="14" y="18" width="56" height="16" rx="4"/>
</g>
<text class="grow-docker-kubernetes-t grow-docker-kubernetes-b" x="58" y="158" font-size="16" text-anchor="middle">image</text>
<path class="grow-docker-kubernetes-flow" d="M106 90 H130"/>
<path class="grow-docker-kubernetes-wire" d="M126 84 L134 90 L126 96"/>

<!-- cluster node -->
<rect class="grow-docker-kubernetes-box" x="140" y="20" width="166" height="142" rx="12"/>
<text class="grow-docker-kubernetes-tm grow-docker-kubernetes-b grow-docker-kubernetes-r2" x="154" y="44" font-size="16">replicas: 2</text>
<text class="grow-docker-kubernetes-tm grow-docker-kubernetes-b grow-docker-kubernetes-r4" x="154" y="44" font-size="16">replicas: 4</text>
<g transform="translate(156 58)">
  <rect class="grow-docker-kubernetes-acc" x="0" y="0" width="62" height="40" rx="8"/><rect class="grow-docker-kubernetes-scard" x="22" y="10" width="18" height="18" rx="3"/>
  <rect class="grow-docker-kubernetes-acc" x="72" y="0" width="62" height="40" rx="8"/><rect class="grow-docker-kubernetes-scard" x="94" y="10" width="18" height="18" rx="3"/>
  <g class="grow-docker-kubernetes-pod"><rect class="grow-docker-kubernetes-acc" x="0" y="50" width="62" height="40" rx="8"/><rect class="grow-docker-kubernetes-scard" x="22" y="60" width="18" height="18" rx="3"/></g>
  <g class="grow-docker-kubernetes-pod grow-docker-kubernetes-late"><rect class="grow-docker-kubernetes-acc" x="72" y="50" width="62" height="40" rx="8"/><rect class="grow-docker-kubernetes-scard" x="94" y="60" width="18" height="18" rx="3"/></g>
</g>
</svg>
