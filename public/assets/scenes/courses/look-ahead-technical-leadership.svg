<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Two options gather evidence, the stronger one is chosen, and the decision flows down to the team while an engineer climbs to the next level">
<style>
.look-ahead-technical-leadership-box{fill:var(--scene-card,#fff);stroke:var(--scene-ink,#102a33);stroke-width:1.6}
.look-ahead-technical-leadership-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:600;fill:var(--scene-ink,#102a33)}
.look-ahead-technical-leadership-wire{stroke:var(--scene-muted,#536970);stroke-width:1.8;fill:none;stroke-dasharray:5 4}
.look-ahead-technical-leadership-ga{transform-box:fill-box;transform-origin:bottom;animation:look-ahead-technical-leadership-ga 7s ease-in-out infinite;animation-delay:-3s}
.look-ahead-technical-leadership-gb{transform-box:fill-box;transform-origin:bottom;animation:look-ahead-technical-leadership-gb 7s ease-in-out infinite;animation-delay:-3s}
.look-ahead-technical-leadership-pick{animation:look-ahead-technical-leadership-pick 7s ease-in-out infinite;animation-delay:-3s}
.look-ahead-technical-leadership-check{animation:look-ahead-technical-leadership-check 7s ease-in-out infinite;animation-delay:-3s}
.look-ahead-technical-leadership-flow{animation:look-ahead-technical-leadership-flow 7s linear infinite;animation-delay:-3s}
.look-ahead-technical-leadership-climb{animation:look-ahead-technical-leadership-climb 7s ease-in-out infinite;animation-delay:-3s}
@keyframes look-ahead-technical-leadership-ga{0%{transform:scaleY(.2)}30%,100%{transform:scaleY(.55)}}
@keyframes look-ahead-technical-leadership-gb{0%{transform:scaleY(.2)}30%,100%{transform:scaleY(1)}}
@keyframes look-ahead-technical-leadership-pick{0%,30%{stroke:var(--scene-ink,#102a33);stroke-width:1.6}36%,94%{stroke:var(--scene-good,#1f7a4d);stroke-width:3}100%{stroke:var(--scene-ink,#102a33);stroke-width:1.6}}
@keyframes look-ahead-technical-leadership-check{0%,32%{opacity:0}38%,94%{opacity:1}100%{opacity:0}}
@keyframes look-ahead-technical-leadership-flow{0%,38%{opacity:0;transform:translateY(0)}42%{opacity:1}64%{opacity:1;transform:translateY(30px)}68%,100%{opacity:0;transform:translateY(30px)}}
@keyframes look-ahead-technical-leadership-climb{0%,20%{transform:translateY(0)}50%,100%{transform:translateY(-52px)}}
</style>
<rect x="0" y="0" width="320" height="180" rx="12" fill="var(--scene-card,#fff)"/>
<!-- option A -->
<rect class="look-ahead-technical-leadership-box" x="16" y="16" width="104" height="80" rx="8"/>
<text class="look-ahead-technical-leadership-t" x="68" y="36" text-anchor="middle">Option A</text>
<g fill="var(--scene-line,#cfdfdc)"><rect class="look-ahead-technical-leadership-ga" x="36" y="46" width="14" height="40"/><rect class="look-ahead-technical-leadership-ga" x="61" y="56" width="14" height="30"/><rect class="look-ahead-technical-leadership-ga" x="86" y="50" width="14" height="36"/></g>
<!-- option B -->
<rect class="look-ahead-technical-leadership-box look-ahead-technical-leadership-pick" x="136" y="16" width="104" height="80" rx="8"/>
<text class="look-ahead-technical-leadership-t" x="188" y="36" text-anchor="middle">Option B</text>
<g fill="var(--scene-learn,#0f8a8a)"><rect class="look-ahead-technical-leadership-gb" x="156" y="54" width="14" height="32"/><rect class="look-ahead-technical-leadership-gb" x="181" y="46" width="14" height="40"/><rect class="look-ahead-technical-leadership-gb" x="206" y="50" width="14" height="36"/></g>
<g class="look-ahead-technical-leadership-check"><circle cx="240" cy="16" r="10" fill="var(--scene-good,#1f7a4d)"/><path d="M235 16 l4 4 l6 -8" stroke="var(--scene-card,#fff)" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
<!-- decision to team -->
<path class="look-ahead-technical-leadership-wire" d="M188 96 V112 M56 112 H220 M56 112 V126 M138 112 V126 M220 112 V126"/>
<g class="look-ahead-technical-leadership-flow"><circle cx="56" cy="112" r="4" fill="var(--scene-grow,#b8457a)"/><circle cx="138" cy="112" r="4" fill="var(--scene-grow,#b8457a)"/><circle cx="220" cy="112" r="4" fill="var(--scene-grow,#b8457a)"/></g>
<g fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="1.8">
<circle cx="56" cy="140" r="9"/><path d="M40 168 a16 14 0 0 1 32 0z"/>
<circle cx="138" cy="140" r="9"/><path d="M122 168 a16 14 0 0 1 32 0z"/>
<circle cx="220" cy="140" r="9"/><path d="M204 168 a16 14 0 0 1 32 0z"/>
</g>
<!-- growth ladder -->
<g stroke="var(--scene-ink,#102a33)" stroke-width="2" stroke-linecap="round"><path d="M258 40 V168 M300 40 V168 M258 64 H300 M258 96 H300 M258 128 H300 M258 160 H300"/></g>
<g class="look-ahead-technical-leadership-climb"><circle cx="279" cy="136" r="9" fill="var(--scene-ahead,#2f6fb3)" stroke="var(--scene-ink,#102a33)" stroke-width="1.6"/><path d="M265 162 a14 14 0 0 1 28 0z" fill="var(--scene-ahead,#2f6fb3)" stroke="var(--scene-ink,#102a33)" stroke-width="1.6"/></g>
</svg>
