<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A typed Java list accepts another Order, while a String is rejected at compile time">
<style>
.learn-core-java-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.learn-core-java-tm { font-family: ui-monospace, Menlo, monospace; fill: var(--scene-ink, #102a33); font-weight: 700; }
.learn-core-java-tray { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 2; }
.learn-core-java-slot { fill: none; stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; stroke-dasharray: 4 4; }
.learn-core-java-ord { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 2; }
.learn-core-java-ln { fill: var(--scene-accent, #006c73); }
.learn-core-java-str { fill: var(--scene-card, #ffffff); stroke: var(--scene-warn, #a15c00); stroke-width: 2; }
.learn-core-java-strt { font-family: ui-monospace, Menlo, monospace; fill: var(--scene-warn, #a15c00); font-weight: 700; }
.learn-core-java-x { fill: none; stroke: var(--scene-bad, #b3261e); stroke-width: 3; stroke-linecap: round; }
.learn-core-java-bad { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-bad, #b3261e); font-weight: 700; }
.learn-core-java-drop { animation: learn-core-java-kf-drop 6s ease-in-out -3s infinite; }
.learn-core-java-push { animation: learn-core-java-kf-push 6s ease-in-out -3s infinite; }
.learn-core-java-xmark { animation: learn-core-java-kf-x 6s linear -3s infinite; }
@keyframes learn-core-java-kf-drop { 0% { transform: translateY(-40px); opacity: 0; } 12% { opacity: 1; } 28% { transform: translateY(0); opacity: 1; } 88% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
@keyframes learn-core-java-kf-push { 0% { transform: translateX(36px); opacity: 0; } 30% { transform: translateX(36px); opacity: 1; } 48% { transform: translateX(0); } 58% { transform: translateX(14px); } 90% { transform: translateX(14px); opacity: 1; } 100% { transform: translateX(36px); opacity: 0; } }
@keyframes learn-core-java-kf-x { 0%, 47% { opacity: 0; } 50%, 90% { opacity: 1; } 100% { opacity: 0; } }
</style>
<g transform="translate(0 14)">
<text class="learn-core-java-tm" x="20" y="42" font-size="16">List&lt;Order&gt;</text>
<rect class="learn-core-java-tray" x="20" y="54" width="196" height="64" rx="10"/>
<rect class="learn-core-java-slot" x="164" y="64" width="40" height="44" rx="6"/>
<g>
  <rect class="learn-core-java-ord" x="32" y="64" width="40" height="44" rx="6"/>
  <rect class="learn-core-java-ln" x="40" y="74" width="24" height="4" rx="2"/><rect class="learn-core-java-ln" x="40" y="84" width="18" height="4" rx="2" opacity=".6"/><rect class="learn-core-java-ln" x="40" y="94" width="22" height="4" rx="2" opacity=".6"/>
  <rect class="learn-core-java-ord" x="78" y="64" width="40" height="44" rx="6"/>
  <rect class="learn-core-java-ln" x="86" y="74" width="24" height="4" rx="2"/><rect class="learn-core-java-ln" x="86" y="84" width="18" height="4" rx="2" opacity=".6"/><rect class="learn-core-java-ln" x="86" y="94" width="22" height="4" rx="2" opacity=".6"/>
</g>
<g class="learn-core-java-drop">
  <rect class="learn-core-java-ord" x="124" y="64" width="40" height="44" rx="6"/>
  <rect class="learn-core-java-ln" x="132" y="74" width="24" height="4" rx="2"/><rect class="learn-core-java-ln" x="132" y="84" width="18" height="4" rx="2" opacity=".6"/><rect class="learn-core-java-ln" x="132" y="94" width="22" height="4" rx="2" opacity=".6"/>
</g>
<g class="learn-core-java-push">
  <rect class="learn-core-java-str" x="222" y="70" width="64" height="32" rx="16"/>
  <text class="learn-core-java-strt" x="254" y="91" font-size="16" text-anchor="middle">"hi"</text>
</g>
<g class="learn-core-java-xmark">
  <path class="learn-core-java-x" d="M168 125 L178 135 M178 125 L168 135"/>
</g>
<text class="learn-core-java-bad" x="304" y="135" font-size="16" text-anchor="end">won't compile</text>
</g>
</svg>
