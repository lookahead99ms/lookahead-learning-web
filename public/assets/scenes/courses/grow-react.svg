<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="React state changes from cart 2 to 3, props flow down, and only the two components that use it re-render">
<style>
.grow-react-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.grow-react-tm { font-family: ui-monospace, Menlo, monospace; fill: var(--scene-ink, #102a33); font-weight: 600; }
.grow-react-card { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.grow-react-soft { fill: var(--scene-accent-soft, #dcefed); }
.grow-react-line { fill: var(--scene-line, #cfdfdc); }
.grow-react-acc { fill: var(--scene-accent, #006c73); }
.grow-react-grow { fill: var(--scene-grow, #b8457a); }
.grow-react-good { fill: var(--scene-good, #1f7a4d); }
.grow-react-link { fill: var(--scene-link, #245a88); }
.grow-react-mut { fill: var(--scene-muted, #536970); }
.grow-react-wire { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 1.5; }
.grow-react-dash { fill: none; stroke: var(--scene-accent, #006c73); stroke-width: 1.8; stroke-dasharray: 4 4; }
.grow-react-white { fill: var(--scene-card, #ffffff); }

.grow-react-a-v2 { animation: grow-react-v2 6s ease-in-out infinite; animation-delay: -3s; }
.grow-react-a-v3 { animation: grow-react-v3 6s ease-in-out infinite; animation-delay: -3s; }
@keyframes grow-react-v2 { 0%,20% { opacity: 1; } 26%,94% { opacity: 0; } 100% { opacity: 1; } }
@keyframes grow-react-v3 { 0%,20% { opacity: 0; } 26%,94% { opacity: 1; } 100% { opacity: 0; } }
.grow-react-a-pl { animation: grow-react-pl 6s linear infinite; animation-delay: -3s; }
.grow-react-a-pr { animation: grow-react-pr 6s linear infinite; animation-delay: -3s; }
@keyframes grow-react-pl { 0%,24% { transform: translate(0,0); opacity: 0; } 28% { opacity: 1; } 46% { transform: translate(-95px,40px); opacity: 1; } 50%,100% { transform: translate(-95px,40px); opacity: 0; } }
@keyframes grow-react-pr { 0%,24% { transform: translate(0,0); opacity: 0; } 28% { opacity: 1; } 46% { transform: translate(95px,40px); opacity: 1; } 50%,100% { transform: translate(95px,40px); opacity: 0; } }
.grow-react-a-hl { animation: grow-react-hl 6s ease-out infinite; animation-delay: -3s; }
@keyframes grow-react-hl { 0%,46% { opacity: 0; } 52% { opacity: 1; } 80% { opacity: .9; } 92%,100% { opacity: 0; } }
.grow-react-a-spin { transform-origin: 30px 28px; animation: grow-react-spin 8s linear infinite; animation-delay: -3s; }
@keyframes grow-react-spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) { [class*="grow-react-a-"] { animation: none !important; } }
</style>
<g class="grow-react-a-spin"><ellipse cx="30" cy="28" rx="16" ry="6.5" class="grow-react-wire" style="stroke: var(--scene-link,#245a88)"/><ellipse cx="30" cy="28" rx="16" ry="6.5" transform="rotate(60 30 28)" class="grow-react-wire" style="stroke: var(--scene-link,#245a88)"/><ellipse cx="30" cy="28" rx="16" ry="6.5" transform="rotate(-60 30 28)" class="grow-react-wire" style="stroke: var(--scene-link,#245a88)"/></g><circle cx="30" cy="28" r="3" class="grow-react-link"/>
<rect class="grow-react-card" x="108" y="22" width="104" height="40" rx="9"/><rect class="grow-react-soft" x="108" y="22" width="104" height="40" rx="9" opacity=".6"/>
<g class="grow-react-a-v2"><text class="grow-react-tm" x="160" y="47" font-size="16" text-anchor="middle">cart: 2</text></g>
<g class="grow-react-a-v3"><text class="grow-react-tm" x="160" y="47" font-size="16" text-anchor="middle" style="fill: var(--scene-accent,#006c73)">cart: 3</text></g>
<path class="grow-react-wire" d="M140 62 L60 96 M160 62 V96 M180 62 L260 96"/>
<rect class="grow-react-card" x="22" y="96" width="76" height="34" rx="8"/><g class="grow-react-a-hl"><rect x="22" y="96" width="76" height="34" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/></g><rect class="grow-react-mut" x="34" y="106" width="52" height="5" rx="2.5" opacity=".5"/><rect class="grow-react-mut" x="34" y="116" width="34" height="5" rx="2.5" opacity=".35"/><rect class="grow-react-card" x="122" y="96" width="76" height="34" rx="8"/><rect class="grow-react-mut" x="134" y="106" width="52" height="5" rx="2.5" opacity=".5"/><rect class="grow-react-mut" x="134" y="116" width="34" height="5" rx="2.5" opacity=".35"/><rect class="grow-react-card" x="222" y="96" width="76" height="34" rx="8"/><g class="grow-react-a-hl"><rect x="222" y="96" width="76" height="34" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/></g><rect class="grow-react-mut" x="234" y="106" width="52" height="5" rx="2.5" opacity=".5"/><rect class="grow-react-mut" x="234" y="116" width="34" height="5" rx="2.5" opacity=".35"/>
<g class="grow-react-a-pl"><circle class="grow-react-grow" cx="155" cy="70" r="5"/></g>
<g class="grow-react-a-pr"><circle class="grow-react-grow" cx="165" cy="70" r="5"/></g>
<text class="grow-react-t" x="160" y="160" font-size="16" text-anchor="middle">only changed parts re-render</text>

</svg>
