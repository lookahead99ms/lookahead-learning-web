<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A list keeps items in order and accepts a duplicate, a set rejects the duplicate, and a map looks up a value by its key">
<style>
.learn-java-data-structures-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.learn-java-data-structures-slot { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.learn-java-data-structures-set { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 2; }
.learn-java-data-structures-a { fill: var(--scene-learn, #0f8a8a); }
.learn-java-data-structures-b { fill: var(--scene-grow, #b8457a); }
.learn-java-data-structures-c { fill: var(--scene-ahead, #2f6fb3); }
.learn-java-data-structures-d { fill: var(--scene-warn, #a15c00); }
.learn-java-data-structures-key { fill: none; stroke: var(--scene-text, #28434a); stroke-width: 2.2; stroke-linecap: round; }
.learn-java-data-structures-arrow { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.learn-java-data-structures-hl { fill: none; stroke: var(--scene-accent, #006c73); stroke-width: 2.5; }
.learn-java-data-structures-x { stroke: var(--scene-bad, #b3261e); stroke-width: 3; stroke-linecap: round; }

.learn-java-data-structures-add { animation: learn-java-data-structures-kf-add 6s infinite; }
@keyframes learn-java-data-structures-kf-add { 0%, 8% { transform: translateY(34px); opacity: 0; } 22%, 90% { transform: translateY(0); opacity: 1; } 96%, 100% { transform: translateY(0); opacity: 0; } }
.learn-java-data-structures-dup { animation: learn-java-data-structures-kf-dup 6s infinite; }
@keyframes learn-java-data-structures-kf-dup { 0%, 26% { transform: translateY(-14px); opacity: 0; } 32% { transform: translateY(-14px); opacity: 1; } 42% { transform: translateY(0); } 46% { transform: translateY(-6px); } 50%, 76% { transform: translateY(-4px); opacity: 1; } 82%, 100% { transform: translateY(-14px); opacity: 0; } }
.learn-java-data-structures-no { animation: learn-java-data-structures-kf-no 6s infinite; }
@keyframes learn-java-data-structures-kf-no { 0%, 42% { opacity: 0; } 45%, 78% { opacity: 1; } 82%, 100% { opacity: 0; } }
.learn-java-data-structures-look { animation: learn-java-data-structures-kf-look 6s steps(1) infinite; }
@keyframes learn-java-data-structures-kf-look { 0% { transform: translateY(0); } 33% { transform: translateY(36px); } 66% { transform: translateY(72px); } }

.learn-java-data-structures-add, .learn-java-data-structures-dup, .learn-java-data-structures-no, .learn-java-data-structures-look { animation-delay: -3s; }
</style>

<!-- List: ordered slots, duplicates allowed -->
<text class="learn-java-data-structures-t" x="56" y="30" font-size="16" text-anchor="middle">List</text>
<rect class="learn-java-data-structures-slot" x="22" y="44" width="68" height="26" rx="5"/><circle class="learn-java-data-structures-a" cx="56" cy="57" r="8"/>
<rect class="learn-java-data-structures-slot" x="22" y="76" width="68" height="26" rx="5"/><circle class="learn-java-data-structures-b" cx="56" cy="89" r="8"/>
<rect class="learn-java-data-structures-slot" x="22" y="108" width="68" height="26" rx="5"/><circle class="learn-java-data-structures-a" cx="56" cy="121" r="8"/>
<rect class="learn-java-data-structures-slot" x="22" y="140" width="68" height="26" rx="5" style="stroke-dasharray: 4 3"/>
<g class="learn-java-data-structures-add"><circle class="learn-java-data-structures-c" cx="56" cy="153" r="8"/></g>

<!-- Set: unique members, duplicate bounces off -->
<text class="learn-java-data-structures-t" x="160" y="30" font-size="16" text-anchor="middle">Set</text>
<circle class="learn-java-data-structures-set" cx="160" cy="114" r="46"/>
<circle class="learn-java-data-structures-a" cx="144" cy="104" r="9"/>
<circle class="learn-java-data-structures-b" cx="176" cy="102" r="9"/>
<circle class="learn-java-data-structures-c" cx="160" cy="132" r="9"/>
<g class="learn-java-data-structures-dup"><circle class="learn-java-data-structures-a" cx="160" cy="56" r="9"/></g>
<g class="learn-java-data-structures-no"><path class="learn-java-data-structures-x" d="M176 46 L188 58 M188 46 L176 58"/></g>

<!-- Map: key to value lookup -->
<text class="learn-java-data-structures-t" x="264" y="30" font-size="16" text-anchor="middle">Map</text>
<g>
  <circle class="learn-java-data-structures-key" cx="234" cy="66" r="6"/><path class="learn-java-data-structures-key" d="M240 66 H254 M250 66 V71"/>
  <path class="learn-java-data-structures-arrow" d="M260 66 H278 M273 61 L278 66 L273 71"/><circle class="learn-java-data-structures-b" cx="294" cy="66" r="9"/>
  <circle class="learn-java-data-structures-key" cx="234" cy="102" r="6"/><path class="learn-java-data-structures-key" d="M240 102 H254 M250 102 V107 M246 102 V106"/>
  <path class="learn-java-data-structures-arrow" d="M260 102 H278 M273 97 L278 102 L273 107"/><circle class="learn-java-data-structures-d" cx="294" cy="102" r="9"/>
  <circle class="learn-java-data-structures-key" cx="234" cy="138" r="6"/><path class="learn-java-data-structures-key" d="M240 138 H254 M246 138 V143"/>
  <path class="learn-java-data-structures-arrow" d="M260 138 H278 M273 133 L278 138 L273 143"/><circle class="learn-java-data-structures-c" cx="294" cy="138" r="9"/>
</g>
<g class="learn-java-data-structures-look"><rect class="learn-java-data-structures-hl" x="222" y="52" width="88" height="28" rx="7"/></g>
</svg>
