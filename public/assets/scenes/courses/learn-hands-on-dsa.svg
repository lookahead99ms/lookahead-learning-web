<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A step cursor traces a loop line by line while the test list turns green one case at a time">
<style>
.learn-hands-on-dsa-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.learn-hands-on-dsa-tm { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: var(--scene-ink, #102a33); font-weight: 600; }
.learn-hands-on-dsa-panel { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.learn-hands-on-dsa-line { fill: var(--scene-muted, #536970); opacity: .5; }
.learn-hands-on-dsa-step { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 1.5; animation: learn-hands-on-dsa-kf-step 6s steps(1) infinite; }
@keyframes learn-hands-on-dsa-kf-step { 0% { transform: translateY(0); } 20% { transform: translateY(24px); } 40% { transform: translateY(48px); } 60% { transform: translateY(72px); } 80%, 100% { transform: translateY(24px); } }
.learn-hands-on-dsa-arrow { fill: var(--scene-accent, #006c73); animation: learn-hands-on-dsa-kf-step 6s steps(1) infinite; }
.learn-hands-on-dsa-dot { fill: var(--scene-line, #cfdfdc); }
.learn-hands-on-dsa-ok { opacity: 0; animation: learn-hands-on-dsa-kf-ok 6s steps(1) infinite; }
@keyframes learn-hands-on-dsa-kf-ok { 0% { opacity: 0; } 30%, 100% { opacity: 1; } }
.learn-hands-on-dsa-ok2 { opacity: 0; animation: learn-hands-on-dsa-kf-ok2 6s steps(1) infinite; }
@keyframes learn-hands-on-dsa-kf-ok2 { 0% { opacity: 0; } 55%, 100% { opacity: 1; } }
.learn-hands-on-dsa-ok3 { opacity: 0; animation: learn-hands-on-dsa-kf-ok3 6s steps(1) infinite; }
@keyframes learn-hands-on-dsa-kf-ok3 { 0% { opacity: 0; } 80%, 100% { opacity: 1; } }
.learn-hands-on-dsa-step, .learn-hands-on-dsa-arrow, .learn-hands-on-dsa-ok, .learn-hands-on-dsa-ok2, .learn-hands-on-dsa-ok3 { animation-delay: -3s; }
</style>
<!-- code being traced -->
<rect class="learn-hands-on-dsa-panel" x="14" y="16" width="180" height="150" rx="10"/>
<rect class="learn-hands-on-dsa-step" x="22" y="30" width="164" height="22" rx="4"/>
<path class="learn-hands-on-dsa-arrow" d="M6 34 l8 7 l-8 7z"/>
<rect class="learn-hands-on-dsa-line" x="30" y="37" width="70" height="8" rx="4"/>
<text class="learn-hands-on-dsa-tm" x="30" y="70" font-size="16">while lo &lt; hi</text>
<rect class="learn-hands-on-dsa-line" x="44" y="85" width="110" height="8" rx="4"/>
<rect class="learn-hands-on-dsa-line" x="44" y="109" width="90" height="8" rx="4"/>
<rect class="learn-hands-on-dsa-line" x="30" y="133" width="60" height="8" rx="4"/>
<!-- tests -->
<rect class="learn-hands-on-dsa-panel" x="206" y="16" width="100" height="150" rx="10"/>
<text class="learn-hands-on-dsa-t" x="220" y="42" font-size="16">tests</text>
<g transform="translate(220 64)">
<circle class="learn-hands-on-dsa-dot" cx="10" cy="10" r="10"/><rect class="learn-hands-on-dsa-line" x="28" y="6" width="38" height="8" rx="4"/>
<g class="learn-hands-on-dsa-ok"><circle cx="10" cy="10" r="10" style="fill: var(--scene-good, #1f7a4d)"/><path d="M5 10 l3.5 3.5 l6.5 -7" fill="none" stroke="var(--scene-card, #ffffff)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g transform="translate(220 96)">
<circle class="learn-hands-on-dsa-dot" cx="10" cy="10" r="10"/><rect class="learn-hands-on-dsa-line" x="28" y="6" width="30" height="8" rx="4"/>
<g class="learn-hands-on-dsa-ok2"><circle cx="10" cy="10" r="10" style="fill: var(--scene-good, #1f7a4d)"/><path d="M5 10 l3.5 3.5 l6.5 -7" fill="none" stroke="var(--scene-card, #ffffff)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g transform="translate(220 128)">
<circle class="learn-hands-on-dsa-dot" cx="10" cy="10" r="10"/><rect class="learn-hands-on-dsa-line" x="28" y="6" width="40" height="8" rx="4"/>
<g class="learn-hands-on-dsa-ok3"><circle cx="10" cy="10" r="10" style="fill: var(--scene-good, #1f7a4d)"/><path d="M5 10 l3.5 3.5 l6.5 -7" fill="none" stroke="var(--scene-card, #ffffff)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
</svg>
