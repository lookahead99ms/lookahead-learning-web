<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="An injected service feeds an Angular form on the orders route; each field validates and Save turns on">
<style>
.grow-angular-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.grow-angular-tm { font-family: ui-monospace, Menlo, monospace; fill: var(--scene-ink, #102a33); font-weight: 600; }
.grow-angular-card { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.grow-angular-soft { fill: var(--scene-accent-soft, #dcefed); }
.grow-angular-line { fill: var(--scene-line, #cfdfdc); }
.grow-angular-acc { fill: var(--scene-accent, #006c73); }
.grow-angular-grow { fill: var(--scene-grow, #b8457a); }
.grow-angular-good { fill: var(--scene-good, #1f7a4d); }
.grow-angular-link { fill: var(--scene-link, #245a88); }
.grow-angular-mut { fill: var(--scene-muted, #536970); }
.grow-angular-wire { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 1.5; }
.grow-angular-dash { fill: none; stroke: var(--scene-accent, #006c73); stroke-width: 1.8; stroke-dasharray: 4 4; }
.grow-angular-white { fill: var(--scene-card, #ffffff); }

.grow-angular-a-d1 { animation: grow-angular-d1 6s linear infinite; animation-delay: -3s; }
.grow-angular-a-d2 { animation: grow-angular-d2 6s linear infinite; animation-delay: -3s; }
@keyframes grow-angular-d1 { 0% { transform: translate(0,0); opacity: 0; } 6% { opacity: 1; } 30% { transform: translate(-64px,-28px); opacity: 1; } 34%,100% { transform: translate(-64px,-28px); opacity: 0; } }
@keyframes grow-angular-d2 { 0%,30% { transform: translate(0,0); opacity: 0; } 36% { opacity: 1; } 60% { transform: translate(-116px,13px); opacity: 1; } 64%,100% { transform: translate(-116px,13px); opacity: 0; } }
.grow-angular-a-c1 { animation: grow-angular-c1 6s ease-out infinite; animation-delay: -3s; }
.grow-angular-a-c2 { animation: grow-angular-c2 6s ease-out infinite; animation-delay: -3s; }
.grow-angular-a-btn { animation: grow-angular-btn 6s ease-out infinite; animation-delay: -3s; }
@keyframes grow-angular-c1 { 0%,30% { opacity: 0; } 36%,94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes grow-angular-c2 { 0%,60% { opacity: 0; } 66%,94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes grow-angular-btn { 0%,66% { opacity: .3; } 72%,94% { opacity: 1; } 100% { opacity: .3; } }

@media (prefers-reduced-motion: reduce) { [class*="grow-angular-a-"] { animation: none !important; } }
</style>
<rect class="grow-angular-card" x="14" y="14" width="196" height="152" rx="10"/>
<circle class="grow-angular-mut" cx="28" cy="29" r="3.5" opacity=".45"/><circle class="grow-angular-mut" cx="40" cy="29" r="3.5" opacity=".45"/>
<rect class="grow-angular-soft" x="52" y="19" width="148" height="20" rx="10"/>
<text class="grow-angular-tm" x="64" y="34" font-size="16">/orders</text>
<rect class="grow-angular-line" x="14" y="45" width="196" height="1.5"/>
<rect class="grow-angular-white" x="30" y="58" width="130" height="24" rx="5" style="stroke: var(--scene-line,#cfdfdc); stroke-width:1.5"/>
<rect class="grow-angular-mut" x="40" y="67" width="60" height="6" rx="3" opacity=".5"/>
<rect class="grow-angular-white" x="30" y="94" width="130" height="24" rx="5" style="stroke: var(--scene-line,#cfdfdc); stroke-width:1.5"/>
<rect class="grow-angular-mut" x="40" y="103" width="44" height="6" rx="3" opacity=".5"/>
<g class="grow-angular-a-c1"><circle class="grow-angular-good" cx="180" cy="70" r="9"/><path d="M175.5 70 l3 3 l6 -6" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="grow-angular-a-c2"><circle class="grow-angular-good" cx="180" cy="106" r="9"/><path d="M175.5 106 l3 3 l6 -6" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="grow-angular-a-btn"><rect class="grow-angular-acc" x="30" y="130" width="76" height="26" rx="6"/><text x="68" y="148" font-size="16" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="var(--scene-card,#fff)">Save</text></g>
<path d="M266 18 l20 7 l-3 26 l-17 9 l-17 -9 l-3 -26 z" class="grow-angular-grow" opacity=".9"/>
<path d="M266 27 l-8 22 h4 l1.6 -4.6 h4.8 l1.6 4.6 h4 z M266 35 l1.6 5.4 h-3.2 z" class="grow-angular-white" fill-rule="evenodd"/>
<rect class="grow-angular-card" x="226" y="98" width="82" height="46" rx="10"/>
<rect class="grow-angular-soft" x="226" y="98" width="82" height="46" rx="10" opacity=".55"/>
<text class="grow-angular-t" x="267" y="126" font-size="16" text-anchor="middle">Service</text>
<path class="grow-angular-dash" d="M226 112 L162 84"/><path class="grow-angular-dash" d="M226 130 L110 143"/>
<g class="grow-angular-a-d1"><circle class="grow-angular-grow" cx="226" cy="112" r="5"/></g>
<g class="grow-angular-a-d2"><circle class="grow-angular-grow" cx="226" cy="130" r="5"/></g>

</svg>
