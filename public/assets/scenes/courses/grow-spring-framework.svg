<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="The Spring container wires beans together, then wraps the service bean in a transactional proxy">
<style>
.grow-spring-framework-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.grow-spring-framework-m { font-family: ui-monospace, Menlo, monospace; fill: var(--scene-ink, #102a33); font-weight: 700; }
.grow-spring-framework-box { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 2; }
.grow-spring-framework-soft { fill: var(--scene-accent-soft, #dcefed); }
.grow-spring-framework-acc { fill: var(--scene-accent, #006c73); }
.grow-spring-framework-ln { fill: var(--scene-line, #cfdfdc); }
.grow-spring-framework-mut { fill: var(--scene-muted, #536970); }
.grow-spring-framework-good { fill: var(--scene-good, #1f7a4d); }
.grow-spring-framework-warn { fill: var(--scene-warn, #a15c00); }
.grow-spring-framework-wire { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 2; stroke-dasharray: 4 5; }

.grow-spring-framework-frame { fill: var(--scene-card, #ffffff); stroke: var(--scene-learn, #0f8a8a); stroke-width: 2; stroke-dasharray: 6 5; }
.grow-spring-framework-bean { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 2; }
.grow-spring-framework-seam { fill: none; stroke: var(--scene-accent, #006c73); stroke-width: 2; stroke-linecap: round; }
.grow-spring-framework-wireup { fill: none; stroke: var(--scene-accent, #006c73); stroke-width: 2.5; stroke-dasharray: 30; animation: grow-spring-framework-kwire 7s ease-in-out infinite; }
.grow-spring-framework-w2 { animation-name: grow-spring-framework-kwire2; }
@keyframes grow-spring-framework-kwire { 0%, 6% { stroke-dashoffset: 30; } 18%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 30; } }
@keyframes grow-spring-framework-kwire2 { 0%, 18% { stroke-dashoffset: 30; } 30%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 30; } }
.grow-spring-framework-head { fill: var(--scene-accent, #006c73); animation: grow-spring-framework-khead 7s infinite; }
.grow-spring-framework-h2 { animation-name: grow-spring-framework-khead2; }
@keyframes grow-spring-framework-khead { 0%, 16% { opacity: 0; } 18%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes grow-spring-framework-khead2 { 0%, 28% { opacity: 0; } 30%, 94% { opacity: 1; } 100% { opacity: 0; } }
.grow-spring-framework-proxy { animation: grow-spring-framework-kproxy 7s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes grow-spring-framework-kproxy { 0%, 34% { opacity: 0; transform: scale(1.25); } 42%, 94% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
.grow-spring-framework-pxr { fill: none; stroke: var(--scene-grow, #b8457a); stroke-width: 2.5; stroke-dasharray: 7 5; }
.grow-spring-framework-tag { fill: var(--scene-card, #ffffff); stroke: var(--scene-grow, #b8457a); stroke-width: 2; }
.grow-spring-framework-wireup, .grow-spring-framework-head, .grow-spring-framework-proxy { animation-delay: -3s; }
</style>
<rect class="grow-spring-framework-frame" x="10" y="14" width="300" height="156" rx="12"/>
<text class="grow-spring-framework-t" x="26" y="40" font-size="16">Spring container</text>
<!-- beans -->
<g transform="translate(58 116)"><ellipse class="grow-spring-framework-bean" rx="30" ry="19"/><path class="grow-spring-framework-seam" d="M-16 4 C-6 -8 6 8 16 -4"/></g>
<g transform="translate(160 116)"><ellipse class="grow-spring-framework-bean" rx="30" ry="19"/><path class="grow-spring-framework-seam" d="M-16 4 C-6 -8 6 8 16 -4"/></g>
<g transform="translate(262 116)"><ellipse class="grow-spring-framework-bean" rx="30" ry="19"/><path class="grow-spring-framework-seam" d="M-16 4 C-6 -8 6 8 16 -4"/></g>
<!-- injection wires (dependency flows into the consumer) -->
<path class="grow-spring-framework-wireup" d="M90 116 H112"/>
<path class="grow-spring-framework-head" d="M112 109 L120 116 L112 123 Z"/>
<path class="grow-spring-framework-wireup grow-spring-framework-w2" d="M201 116 H222"/>
<path class="grow-spring-framework-head grow-spring-framework-h2" d="M222 109 L230 116 L222 123 Z"/>
<!-- transactional proxy around the service bean -->
<g class="grow-spring-framework-proxy">
<rect class="grow-spring-framework-pxr" x="123" y="88" width="74" height="56" rx="14"/>
<rect class="grow-spring-framework-tag" x="86" y="58" width="148" height="26" rx="13"/>
<text class="grow-spring-framework-m" x="160" y="76" font-size="16" text-anchor="middle">@Transactional</text>
</g>
</svg>
