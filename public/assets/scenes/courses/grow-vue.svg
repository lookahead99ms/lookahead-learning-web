<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Adding an item updates one shared store and both the header and cart badges change from 2 to 3 together">
<style>
.grow-vue-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.grow-vue-tm { font-family: ui-monospace, Menlo, monospace; fill: var(--scene-ink, #102a33); font-weight: 600; }
.grow-vue-card { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.grow-vue-soft { fill: var(--scene-accent-soft, #dcefed); }
.grow-vue-line { fill: var(--scene-line, #cfdfdc); }
.grow-vue-acc { fill: var(--scene-accent, #006c73); }
.grow-vue-grow { fill: var(--scene-grow, #b8457a); }
.grow-vue-good { fill: var(--scene-good, #1f7a4d); }
.grow-vue-link { fill: var(--scene-link, #245a88); }
.grow-vue-mut { fill: var(--scene-muted, #536970); }
.grow-vue-wire { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 1.5; }
.grow-vue-dash { fill: none; stroke: var(--scene-accent, #006c73); stroke-width: 1.8; stroke-dasharray: 4 4; }
.grow-vue-white { fill: var(--scene-card, #ffffff); }

.grow-vue-a-v2 { animation: grow-vue-v2 6s ease-in-out infinite; animation-delay: -3s; }
.grow-vue-a-v3 { animation: grow-vue-v3 6s ease-in-out infinite; animation-delay: -3s; }
@keyframes grow-vue-v2 { 0%,20% { opacity: 1; } 26%,94% { opacity: 0; } 100% { opacity: 1; } }
@keyframes grow-vue-v3 { 0%,20% { opacity: 0; } 26%,94% { opacity: 1; } 100% { opacity: 0; } }
.grow-vue-a-w2 { animation: grow-vue-w2 6s linear infinite; animation-delay: -3s; }
@keyframes grow-vue-w2 { 0%,24% { transform: translate(0,0); opacity: 0; } 28% { opacity: 1; } 44% { transform: translate(0,34px); opacity: 1; } 48%,100% { transform: translate(0,34px); opacity: 0; } }
.grow-vue-a-ring { transform-box: fill-box; transform-origin: center; animation: grow-vue-ring 6s ease-out infinite; animation-delay: -3s; }
@keyframes grow-vue-ring { 0%,40% { opacity: 0; transform: scale(.85); } 46% { opacity: 1; transform: scale(1); } 88% { opacity: 1; } 94%,100% { opacity: 0; } }
.grow-vue-a-tap { animation: grow-vue-tap 6s ease-in-out infinite; animation-delay: -3s; }
@keyframes grow-vue-tap { 0%,94%,100% { transform: translate(0,0); } 2% { transform: translate(0,2px); } 6% { transform: translate(0,0); } }

@media (prefers-reduced-motion: reduce) { [class*="grow-vue-a-"] { animation: none !important; } }
</style>
<path d="M14 16 h12 l8 14 l8 -14 h12 l-20 34 z" class="grow-vue-good" opacity=".9"/><path d="M24 16 h5 l5 8.6 l5 -8.6 h5 l-10 17.3 z" class="grow-vue-t"/>
<rect class="grow-vue-card" x="112" y="14" width="96" height="44" rx="10"/><rect class="grow-vue-soft" x="112" y="14" width="96" height="44" rx="10" opacity=".6"/>
<text class="grow-vue-t" x="160" y="42" font-size="16" text-anchor="middle">store</text>
<rect class="grow-vue-card" x="14" y="92" width="130" height="72" rx="10"/>
<text class="grow-vue-t" x="28" y="114" font-size="16">Header</text>
<g class="grow-vue-a-ring"><circle cx="118" cy="110" r="17" fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="2"/></g>
<circle class="grow-vue-good" cx="118" cy="110" r="13"/>
<g class="grow-vue-a-v2"><text x="118" y="115" font-size="16" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="var(--scene-card,#fff)">2</text></g>
<g class="grow-vue-a-v3"><text x="118" y="115" font-size="16" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="var(--scene-card,#fff)">3</text></g>
<rect class="grow-vue-mut" x="28" y="134" width="90" height="6" rx="3" opacity=".4"/><rect class="grow-vue-mut" x="28" y="148" width="60" height="6" rx="3" opacity=".3"/>
<rect class="grow-vue-card" x="176" y="92" width="130" height="72" rx="10"/>
<text class="grow-vue-t" x="190" y="114" font-size="16">Cart</text>
<g class="grow-vue-a-ring"><circle cx="280" cy="110" r="17" fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="2"/></g>
<circle class="grow-vue-good" cx="280" cy="110" r="13"/>
<g class="grow-vue-a-v2"><text x="280" y="115" font-size="16" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="var(--scene-card,#fff)">2</text></g>
<g class="grow-vue-a-v3"><text x="280" y="115" font-size="16" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="var(--scene-card,#fff)">3</text></g>
<rect class="grow-vue-soft" x="190" y="130" width="102" height="24" rx="6"/>
<g class="grow-vue-a-tap"><rect class="grow-vue-acc" x="232" y="134" width="56" height="16" rx="5"/><path d="M256 142 h8 M260 138 v8" stroke="var(--scene-card,#fff)" stroke-width="2" stroke-linecap="round"/></g>
<path class="grow-vue-dash" d="M208 36 C250 36 260 60 260 92"/><path class="grow-vue-dash" d="M112 36 C70 36 60 60 60 92"/>
<g class="grow-vue-a-w2"><circle class="grow-vue-grow" cx="60" cy="56" r="5"/><circle class="grow-vue-grow" cx="260" cy="56" r="5"/></g>

</svg>
