<circle class="blaze-design-fundamentals-ahead blaze-design-fundamentals-rep2" cx="134" cy="52" r="6"/>
<text class="blaze-design-fundamentals-t" x="304" y="58" font-size="16" text-anchor="end">replicas</text>
<path d="M16 112 H304" stroke="var(--scene-line, #cfdfdc)" stroke-width="1.5"/>
