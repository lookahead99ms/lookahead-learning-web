<g class=""><rect class="blaze-design-fundamentals-acc" x="176" y="132" width="24" height="24" rx="4" opacity=".85"/></g>
<g class="blaze-design-fundamentals-out"><rect class="blaze-design-fundamentals-acc" x="210" y="132" width="24" height="24" rx="4" opacity=".85"/></g>
</g>
