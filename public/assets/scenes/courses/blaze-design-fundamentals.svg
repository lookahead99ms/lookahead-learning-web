<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A write is copied to two replicas that both confirm, while messages flow through a queue to a consumer">
<style>
.blaze-design-fundamentals-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.blaze-design-fundamentals-box { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 2; }
.blaze-design-fundamentals-soft { fill: var(--scene-accent-soft, #dcefed); }
.blaze-design-fundamentals-softs { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 2; }
.blaze-design-fundamentals-acc { fill: var(--scene-accent, #006c73); }
.blaze-design-fundamentals-ahead { fill: var(--scene-ahead, #2f6fb3); }
.blaze-design-fundamentals-good { fill: var(--scene-good, #1f7a4d); }
.blaze-design-fundamentals-warn { fill: var(--scene-warn, #a15c00); }
.blaze-design-fundamentals-bad { fill: var(--scene-bad, #b3261e); }
.blaze-design-fundamentals-mut { fill: var(--scene-muted, #536970); }
.blaze-design-fundamentals-card { fill: var(--scene-card, #ffffff); }
.blaze-design-fundamentals-wire { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 2; }
.blaze-design-fundamentals-dash { fill: none; stroke: var(--scene-link, #245a88); stroke-width: 2; stroke-dasharray: 5 4; }
.blaze-design-fundamentals-check { fill: none; stroke: var(--scene-good, #1f7a4d); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

.blaze-design-fundamentals-go { animation: blaze-design-fundamentals-kf-go 6s linear infinite; animation-delay: -3.4s; }
.blaze-design-fundamentals-rep1 { animation: blaze-design-fundamentals-kf-rep1 6s linear infinite; animation-delay: -3.4s; }
.blaze-design-fundamentals-rep2 { animation: blaze-design-fundamentals-kf-rep2 6s linear infinite; animation-delay: -3.4s; }
.blaze-design-fundamentals-fill { animation: blaze-design-fundamentals-kf-fill 6s infinite; animation-delay: -3.4s; }
.blaze-design-fundamentals-ok { animation: blaze-design-fundamentals-kf-ok 6s infinite; animation-delay: -3.4s; }
.blaze-design-fundamentals-belt { animation: blaze-design-fundamentals-kf-belt 1.6s linear infinite; animation-delay: -0.8s; }
.blaze-design-fundamentals-in { animation: blaze-design-fundamentals-kf-in 1.6s linear infinite; animation-delay: -0.8s; }
.blaze-design-fundamentals-out { animation: blaze-design-fundamentals-kf-out 1.6s linear infinite; animation-delay: -0.8s; }
@keyframes blaze-design-fundamentals-kf-go { 0% { transform: translate(0,0); opacity: 1; } 22% { transform: translate(64px,0); opacity: 1; } 24%, 100% { transform: translate(64px,0); opacity: 0; } }
@keyframes blaze-design-fundamentals-kf-rep1 { 0%, 24% { transform: translate(0,0); opacity: 0; } 25% { opacity: 1; } 46% { transform: translate(78px,-26px); opacity: 1; } 48%, 100% { transform: translate(78px,-26px); opacity: 0; } }
@keyframes blaze-design-fundamentals-kf-rep2 { 0%, 24% { transform: translate(0,0); opacity: 0; } 25% { opacity: 1; } 46% { transform: translate(78px,26px); opacity: 1; } 48%, 100% { transform: translate(78px,26px); opacity: 0; } }
@keyframes blaze-design-fundamentals-kf-fill { 0%, 46% { opacity: 0; } 52%, 90% { opacity: 1; } 100% { opacity: 0; } }
@keyframes blaze-design-fundamentals-kf-ok { 0%, 50% { opacity: 0; } 56%, 90% { opacity: 1; } 100% { opacity: 0; } }
@keyframes blaze-design-fundamentals-kf-belt { from { transform: translate(0,0); } to { transform: translate(34px,0); } }
@keyframes blaze-design-fundamentals-kf-in { 0%, 60% { opacity: 0; } 100% { opacity: 1; } }
@keyframes blaze-design-fundamentals-kf-out { 0% { opacity: 1; } 40%, 100% { opacity: 0; } }
</style>
<rect class="blaze-design-fundamentals-box" x="18" y="30" width="30" height="48" rx="6"/><rect class="blaze-design-fundamentals-soft" x="23" y="37" width="20" height="30" rx="2"/>
