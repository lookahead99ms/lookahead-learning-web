<g class="blaze-design-fundamentals-fill"><path class="blaze-design-fundamentals-softs" d="M192 64 V94 A20 6 0 0 0 232 94 V64 Z"/><ellipse class="blaze-design-fundamentals-softs" cx="212" cy="64" rx="20" ry="6"/></g>
<path class="blaze-design-fundamentals-check blaze-design-fundamentals-ok" d="M242 78 l6 7 l11 -13"/>
<circle class="blaze-design-fundamentals-ahead blaze-design-fundamentals-go" cx="34" cy="54" r="6"/>
