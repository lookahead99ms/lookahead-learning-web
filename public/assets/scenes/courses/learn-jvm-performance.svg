<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="The profile shows price() as the widest frame; it runs hot, the JIT compiles it to native code, its frame narrows and the benchmark score climbs to 412 ops per millisecond with tight error bars">
<style>
.lc-jperf-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.lc-jperf-tm { font-family: ui-monospace, Menlo, monospace; fill: var(--scene-ink, #102a33); font-weight: 700; }
.lc-jperf-tcm { font-family: ui-monospace, Menlo, monospace; fill: var(--scene-card, #ffffff); font-weight: 700; }
.lc-jperf-tc { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-card, #ffffff); font-weight: 700; }
.lc-jperf-sh { fill: var(--scene-ink, #102a33); opacity: .08; }
.lc-jperf-slab { fill: var(--scene-ink, #102a33); opacity: .14; }
.lc-jperf-box { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 2; }
.lc-jperf-soft { fill: var(--scene-accent-soft, #dcefed); }
.lc-jperf-ln { fill: var(--scene-line, #cfdfdc); }
.lc-jperf-mut { fill: var(--scene-muted, #536970); }
.lc-jperf-acc { fill: var(--scene-accent, #006c73); }
.lc-jperf-warn { fill: var(--scene-warn, #a15c00); }
.lc-jperf-pin { stroke: var(--scene-muted, #536970); stroke-width: 2.5; stroke-linecap: round; }
.lc-jperf-err { fill: none; stroke: var(--scene-ink, #102a33); stroke-width: 2; stroke-linecap: round; }

.lc-jperf-heat { transform-origin: 24px 64px; animation: lc-jperf-kf-heat 8s ease-in infinite; }
@keyframes lc-jperf-kf-heat { 0% { transform: scaleX(.1); } 30%, 94% { transform: scaleX(1); } 100% { transform: scaleX(.1); } }
.lc-jperf-hotp { animation: lc-jperf-kf-hotp 8s infinite; }
@keyframes lc-jperf-kf-hotp { 0%, 6% { opacity: 1; } 12% { opacity: .55; } 18% { opacity: 1; } 24% { opacity: .55; } 30%, 100% { opacity: 1; } }
.lc-jperf-hot { transform-origin: 14px 0; animation: lc-jperf-kf-hot 8s ease-in-out infinite; }
@keyframes lc-jperf-kf-hot { 0%, 40% { transform: scaleX(1); } 54%, 94% { transform: scaleX(.62); } 100% { transform: scaleX(1); } }
.lc-jperf-jit { animation: lc-jperf-kf-jit 8s infinite; }
@keyframes lc-jperf-kf-jit { 0%, 30% { opacity: .35; } 32%, 94% { opacity: 1; } 100% { opacity: .35; } }
.lc-jperf-chip { animation: lc-jperf-kf-chip 8s infinite; }
@keyframes lc-jperf-kf-chip { 0%, 34% { opacity: 0; transform: translateX(-10px); } 40%, 94% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(0); } }
.lc-jperf-after { transform-origin: 0 146px; animation: lc-jperf-kf-after 8s ease-out infinite; }
@keyframes lc-jperf-kf-after { 0%, 40% { transform: scaleY(.3); } 54%, 94% { transform: scaleY(1); } 100% { transform: scaleY(.3); } }
.lc-jperf-score { animation: lc-jperf-kf-score 8s infinite; }
@keyframes lc-jperf-kf-score { 0%, 54% { opacity: 0; } 58%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }

.lc-jperf-heat, .lc-jperf-hotp, .lc-jperf-hot, .lc-jperf-jit, .lc-jperf-chip, .lc-jperf-after, .lc-jperf-score { animation-delay: -5.6s; }
@media (prefers-reduced-motion: reduce) { .lc-jperf-heat, .lc-jperf-hotp, .lc-jperf-hot, .lc-jperf-jit, .lc-jperf-chip, .lc-jperf-after, .lc-jperf-score { animation-play-state: paused; } }
</style>

<!-- the hot method -->
<ellipse class="lc-jperf-sh" cx="59" cy="80" rx="44" ry="4"/>
<rect class="lc-jperf-slab" x="14" y="22" width="90" height="54" rx="7"/>
<rect class="lc-jperf-box" x="14" y="18" width="90" height="54" rx="7"/>
<path class="lc-jperf-soft" d="M21 19 H97 a6 6 0 0 1 6 6 V37 H15 V25 a6 6 0 0 1 6 -6z"/>
<text class="lc-jperf-tm" x="24" y="33" font-size="13">price()</text>
<rect class="lc-jperf-ln" x="24" y="43" width="58" height="5" rx="2.5"/>
<rect class="lc-jperf-ln" x="24" y="52" width="42" height="5" rx="2.5"/>
<rect class="lc-jperf-ln" x="24" y="62" width="70" height="5" rx="2.5"/>
<rect class="lc-jperf-warn lc-jperf-heat" x="24" y="62" width="70" height="5" rx="2.5"/>

<!-- JIT turns it into native code -->
<g class="lc-jperf-jit">
  <rect class="lc-jperf-acc" x="110" y="20" width="32" height="18" rx="9"/>
  <text class="lc-jperf-tc" x="126" y="33" font-size="11" text-anchor="middle">JIT</text>
  <path d="M110 47 H140 m-6 -6 l6 6 l-6 6" fill="none" stroke="var(--scene-accent, #006c73)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g class="lc-jperf-chip">
  <ellipse class="lc-jperf-sh" cx="172" cy="78" rx="26" ry="3"/>
  <path class="lc-jperf-pin" d="M160 20 V24 M172 20 V24 M184 20 V24 M160 68 V72 M172 68 V72 M184 68 V72 M146 34 H150 M146 46 H150 M146 58 H150 M194 34 H198 M194 46 H198 M194 58 H198"/>
  <rect class="lc-jperf-acc" x="150" y="24" width="44" height="44" rx="5"/>
  <rect x="161" y="35" width="22" height="22" rx="3" fill="var(--scene-card, #ffffff)" opacity=".3"/>
  <text class="lc-jperf-t" x="172" y="92" font-size="12" text-anchor="middle">native</text>
</g>

<!-- profile: a flame graph -->
<rect class="lc-jperf-ln" x="14" y="150" width="186" height="16" rx="3"/>
<text class="lc-jperf-tm" x="20" y="162" font-size="11">main</text>
<rect class="lc-jperf-ln" x="14" y="132" width="128" height="16" rx="3"/>
<text class="lc-jperf-tm" x="20" y="144" font-size="11">handle</text>
<rect class="lc-jperf-ln" x="145" y="132" width="55" height="16" rx="3"/>
<text class="lc-jperf-tm" x="151" y="144" font-size="11">log</text>
<rect class="lc-jperf-ln" x="121" y="114" width="21" height="16" rx="3"/>
<g class="lc-jperf-hot">
  <rect class="lc-jperf-warn lc-jperf-hotp" x="14" y="114" width="104" height="16" rx="3"/>
  <rect class="lc-jperf-ln" x="14" y="96" width="44" height="16" rx="3"/>
  <rect class="lc-jperf-ln" x="61" y="96" width="34" height="16" rx="3"/>
</g>
<text class="lc-jperf-tcm" x="20" y="126" font-size="11">price</text>

<!-- benchmark score -->
<ellipse class="lc-jperf-sh" cx="261" cy="173" rx="48" ry="4"/>
<rect class="lc-jperf-slab" x="214" y="22" width="94" height="146" rx="8"/>
<rect class="lc-jperf-box" x="214" y="18" width="94" height="146" rx="8"/>
<g class="lc-jperf-score">
  <text class="lc-jperf-tm" x="250" y="44" font-size="16" text-anchor="middle" style="fill: var(--scene-accent, #006c73)">412</text>
  <text class="lc-jperf-t" x="286" y="44" font-size="12" text-anchor="middle">± 3</text>
  <text class="lc-jperf-t" x="261" y="62" font-size="11" text-anchor="middle">ops/ms</text>
</g>
<path d="M224 146 H298" stroke="var(--scene-line, #cfdfdc)" stroke-width="2"/>
<rect class="lc-jperf-mut" x="228" y="122" width="22" height="24" rx="2" opacity=".5"/>
<path class="lc-jperf-err" d="M239 112 V132 M234 112 H244 M234 132 H244"/>
<rect class="lc-jperf-acc lc-jperf-after" x="270" y="78" width="22" height="68" rx="2"/>
<path class="lc-jperf-err lc-jperf-score" d="M281 73 V83 M276 73 H286 M276 83 H286"/>
<text class="lc-jperf-t" x="239" y="158" font-size="10" text-anchor="middle">before</text>
<text class="lc-jperf-t" x="281" y="158" font-size="10" text-anchor="middle">after</text>
</svg>
