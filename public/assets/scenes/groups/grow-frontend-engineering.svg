<text class="grow-frontend-engineering-t" x="337" y="128" font-size="16" text-anchor="middle">API</text>
<g class="grow-frontend-engineering-a-pk1"><circle class="grow-frontend-engineering-grow" cx="300" cy="104" r="5"/></g>
