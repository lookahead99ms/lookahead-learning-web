<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="A dashboard page and its phone layout fill their cards with data arriving from an API">
<style>
.grow-frontend-engineering-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.grow-frontend-engineering-tm { font-family: ui-monospace, Menlo, monospace; fill: var(--scene-ink, #102a33); font-weight: 600; }
.grow-frontend-engineering-card { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.grow-frontend-engineering-soft { fill: var(--scene-accent-soft, #dcefed); }
.grow-frontend-engineering-line { fill: var(--scene-line, #cfdfdc); }
.grow-frontend-engineering-acc { fill: var(--scene-accent, #006c73); }
.grow-frontend-engineering-grow { fill: var(--scene-grow, #b8457a); }
.grow-frontend-engineering-good { fill: var(--scene-good, #1f7a4d); }
.grow-frontend-engineering-link { fill: var(--scene-link, #245a88); }
.grow-frontend-engineering-mut { fill: var(--scene-muted, #536970); }
.grow-frontend-engineering-wire { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 1.5; }
.grow-frontend-engineering-dash { fill: none; stroke: var(--scene-accent, #006c73); stroke-width: 1.8; stroke-dasharray: 4 4; }
.grow-frontend-engineering-white { fill: var(--scene-card, #ffffff); }

.grow-frontend-engineering-a-pk1 { animation: grow-frontend-engineering-pk1 6s linear infinite; animation-delay: -3s; }
.grow-frontend-engineering-a-pk2 { animation: grow-frontend-engineering-pk2 6s linear infinite; animation-delay: -3s; }
@keyframes grow-frontend-engineering-pk1 { 0% { transform: translate(0,0); opacity: 0; } 8% { opacity: 1; } 40% { transform: translate(-12px,0); opacity: 1; } 46%,100% { transform: translate(-12px,0); opacity: 0; } }
@keyframes grow-frontend-engineering-pk2 { 0%,30% { transform: translate(0,0); opacity: 0; } 36% { opacity: 1; } 64% { transform: translate(14px,0); opacity: 1; } 70%,100% { transform: translate(14px,0); opacity: 0; } }
.grow-frontend-engineering-a-f1 { animation: grow-frontend-engineering-fill 6s ease-in-out infinite; animation-delay: -3s; }
.grow-frontend-engineering-a-f2 { animation: grow-frontend-engineering-fill 6s ease-in-out infinite; animation-delay: -2.6s; }
.grow-frontend-engineering-a-f3 { animation: grow-frontend-engineering-fill 6s ease-in-out infinite; animation-delay: -2.2s; }
.grow-frontend-engineering-a-m { animation: grow-frontend-engineering-fillm 6s ease-in-out infinite; animation-delay: -4.6s; }
@keyframes grow-frontend-engineering-fill { 0%,40% { opacity: 0; } 50%,92% { opacity: 1; } 100% { opacity: 0; } }
@keyframes grow-frontend-engineering-fillm { 0%,64% { opacity: 0; } 72%,92% { opacity: 1; } 100% { opacity: 0; } }
.grow-frontend-engineering-a-cur { animation: grow-frontend-engineering-cur 6s ease-in-out infinite; animation-delay: -3s; }
@keyframes grow-frontend-engineering-cur { 0%,20% { transform: translate(0,0); } 45%,70% { transform: translate(60px,-22px); } 100% { transform: translate(0,0); } }

@media (prefers-reduced-motion: reduce) { [class*="grow-frontend-engineering-a-"] { animation: none !important; } }
</style>
