<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="A tree is walked node by node, a row of bars sorts itself, and two growth curves show how cost rises with input size">
<style>
.learn-data-structures-algorithms-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.learn-data-structures-algorithms-panel { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.learn-data-structures-algorithms-edge { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 2; }
.learn-data-structures-algorithms-node { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 2; }
.learn-data-structures-algorithms-on { fill: var(--scene-learn, #0f8a8a); opacity: 0; animation: learn-data-structures-algorithms-kf-visit 7s infinite; }
@keyframes learn-data-structures-algorithms-kf-visit { 0%, 2% { opacity: 0; } 5%, 70% { opacity: 1; } 76%, 100% { opacity: 0; } }
.learn-data-structures-algorithms-n0 { animation-delay: -3s; }
.learn-data-structures-algorithms-n1 { animation-delay: -2.4s; }
.learn-data-structures-algorithms-n2 { animation-delay: -1.8s; }
.learn-data-structures-algorithms-n3 { animation-delay: -1.2s; }
.learn-data-structures-algorithms-n4 { animation-delay: -0.6s; }
.learn-data-structures-algorithms-n5 { animation-delay: 0s; }
.learn-data-structures-algorithms-bar { fill: var(--scene-accent, #006c73); }
.learn-data-structures-algorithms-b1 { animation: learn-data-structures-algorithms-kf-b1 7s steps(1) infinite; }
.learn-data-structures-algorithms-b2 { animation: learn-data-structures-algorithms-kf-b2 7s steps(1) infinite; }
.learn-data-structures-algorithms-b3 { animation: learn-data-structures-algorithms-kf-b3 7s steps(1) infinite; }
.learn-data-structures-algorithms-b4 { animation: learn-data-structures-algorithms-kf-b4 7s steps(1) infinite; }
.learn-data-structures-algorithms-b5 { animation: learn-data-structures-algorithms-kf-b5 7s steps(1) infinite; }
/* slots are 22px apart. Start order heights: 50,20,80,35,65 -> sorted 20,35,50,65,80 */
@keyframes learn-data-structures-algorithms-kf-b1 { 0% { transform: translateX(0); } 33% { transform: translateX(0); } 66% { transform: translateX(44px); } }
@keyframes learn-data-structures-algorithms-kf-b2 { 0% { transform: translateX(0); } 33% { transform: translateX(0); } 66% { transform: translateX(-22px); } }
@keyframes learn-data-structures-algorithms-kf-b3 { 0% { transform: translateX(0); } 33% { transform: translateX(44px); } 66% { transform: translateX(88px); } }
@keyframes learn-data-structures-algorithms-kf-b4 { 0% { transform: translateX(0); } 33% { transform: translateX(0); } 66% { transform: translateX(-44px); } }
@keyframes learn-data-structures-algorithms-kf-b5 { 0% { transform: translateX(0); } 33% { transform: translateX(-44px); } 66% { transform: translateX(-66px); } }
.learn-data-structures-algorithms-done { fill: var(--scene-good, #1f7a4d); opacity: 0; animation: learn-data-structures-algorithms-kf-done 7s steps(1) infinite; }
@keyframes learn-data-structures-algorithms-kf-done { 0% { opacity: 0; } 66% { opacity: 1; } }
.learn-data-structures-algorithms-axis { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 2; }
.learn-data-structures-algorithms-lin { fill: none; stroke: var(--scene-good, #1f7a4d); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 160; animation: learn-data-structures-algorithms-kf-draw 7s ease-out infinite; }
.learn-data-structures-algorithms-sq { fill: none; stroke: var(--scene-bad, #b3261e); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 160; animation: learn-data-structures-algorithms-kf-draw 7s ease-out infinite; }
@keyframes learn-data-structures-algorithms-kf-draw { 0% { stroke-dashoffset: 160; } 55%, 100% { stroke-dashoffset: 0; } }
.learn-data-structures-algorithms-b1, .learn-data-structures-algorithms-b2, .learn-data-structures-algorithms-b3, .learn-data-structures-algorithms-b4, .learn-data-structures-algorithms-b5, .learn-data-structures-algorithms-done, .learn-data-structures-algorithms-lin, .learn-data-structures-algorithms-sq { animation-delay: -3s; }
</style>
<!-- tree: walked in order -->
<rect class="learn-data-structures-algorithms-panel" x="14" y="20" width="140" height="160" rx="12"/>
<path class="learn-data-structures-algorithms-edge" d="M84 52 L50 104 M84 52 L118 104 M50 104 L34 152 M50 104 L66 152 M118 104 L118 152"/>
<circle class="learn-data-structures-algorithms-node" cx="84" cy="52" r="13"/>
<circle class="learn-data-structures-algorithms-node" cx="50" cy="104" r="13"/>
<circle class="learn-data-structures-algorithms-node" cx="118" cy="104" r="13"/>
<circle class="learn-data-structures-algorithms-node" cx="34" cy="152" r="13"/>
<circle class="learn-data-structures-algorithms-node" cx="66" cy="152" r="13"/>
<circle class="learn-data-structures-algorithms-node" cx="118" cy="152" r="13"/>
<circle class="learn-data-structures-algorithms-on learn-data-structures-algorithms-n0" cx="84" cy="52" r="8"/>
<circle class="learn-data-structures-algorithms-on learn-data-structures-algorithms-n1" cx="50" cy="104" r="8"/>
<circle class="learn-data-structures-algorithms-on learn-data-structures-algorithms-n2" cx="34" cy="152" r="8"/>
<circle class="learn-data-structures-algorithms-on learn-data-structures-algorithms-n3" cx="66" cy="152" r="8"/>
<circle class="learn-data-structures-algorithms-on learn-data-structures-algorithms-n4" cx="118" cy="104" r="8"/>
<circle class="learn-data-structures-algorithms-on learn-data-structures-algorithms-n5" cx="118" cy="152" r="8"/>
<!-- bars: sorting -->
<rect class="learn-data-structures-algorithms-panel" x="170" y="20" width="140" height="160" rx="12"/>
<g transform="translate(187 0)">
<rect class="learn-data-structures-algorithms-bar learn-data-structures-algorithms-b1" x="0" y="100" width="16" height="50" rx="3"/>
<rect class="learn-data-structures-algorithms-bar learn-data-structures-algorithms-b2" x="22" y="130" width="16" height="20" rx="3"/>
<rect class="learn-data-structures-algorithms-bar learn-data-structures-algorithms-b3" x="44" y="70" width="16" height="80" rx="3"/>
<rect class="learn-data-structures-algorithms-bar learn-data-structures-algorithms-b4" x="66" y="115" width="16" height="35" rx="3"/>
<rect class="learn-data-structures-algorithms-bar learn-data-structures-algorithms-b5" x="88" y="85" width="16" height="65" rx="3"/>
<path class="learn-data-structures-algorithms-axis" d="M-4 154 H108"/>
<g class="learn-data-structures-algorithms-done"><circle cx="18" cy="48" r="11"/><path d="M12 48 l4 4 l8 -8" fill="none" stroke="var(--scene-card, #ffffff)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<!-- growth curves -->
<rect class="learn-data-structures-algorithms-panel" x="326" y="20" width="140" height="160" rx="12"/>
<path class="learn-data-structures-algorithms-axis" d="M342 36 V160 H452"/>
<path class="learn-data-structures-algorithms-lin" d="M344 158 L448 112"/>
<path class="learn-data-structures-algorithms-sq" d="M344 158 Q 410 156 430 40"/>
<text class="learn-data-structures-algorithms-t" x="384" y="52" font-size="16" text-anchor="end" style="fill: var(--scene-bad, #b3261e)">O(n²)</text>
<text class="learn-data-structures-algorithms-t" x="452" y="140" font-size="16" text-anchor="end" style="fill: var(--scene-good, #1f7a4d)">O(n)</text>
</svg>
