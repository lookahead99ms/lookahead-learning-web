<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Retrieved context feeds a model, and every answer must pass an evaluation gate before it ships">
<style>
.grow-ai-engineering-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.grow-ai-engineering-box { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.grow-ai-engineering-ln { fill: var(--scene-line, #cfdfdc); }
.grow-ai-engineering-soft { fill: var(--scene-accent-soft, #dcefed); }
.grow-ai-engineering-model { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 2; }
.grow-ai-engineering-star { fill: var(--scene-accent, #006c73); transform-origin: 240px 92px; animation: grow-ai-engineering-pulse 7s ease-in-out infinite; }
@keyframes grow-ai-engineering-pulse { 0%, 14%, 26%, 100% { transform: scale(1); } 18%, 22% { transform: scale(1.18); } }
.grow-ai-engineering-wire { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 2; stroke-dasharray: 6 6; animation: grow-ai-engineering-flow 1.4s linear infinite; }
@keyframes grow-ai-engineering-flow { to { stroke-dashoffset: -12; } }
.grow-ai-engineering-doc { animation: grow-ai-engineering-docin 7s ease-in-out infinite; }
@keyframes grow-ai-engineering-docin { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 16% { transform: translateX(70px); opacity: 1; } 20%, 100% { transform: translateX(80px); opacity: 0; } }
.grow-ai-engineering-out { animation: grow-ai-engineering-outmove 7s ease-in-out infinite; }
@keyframes grow-ai-engineering-outmove { 0%, 20% { transform: translateX(0); opacity: 0; } 24% { opacity: 1; } 34% { transform: translateX(46px); opacity: 1; } 38%, 100% { transform: translateX(52px); opacity: 0; } }
.grow-ai-engineering-chk { fill: var(--scene-line, #cfdfdc); }
.grow-ai-engineering-c1 { animation: grow-ai-engineering-ok1 7s infinite; }
.grow-ai-engineering-c2 { animation: grow-ai-engineering-ok2 7s infinite; }
.grow-ai-engineering-c3 { animation: grow-ai-engineering-ok3 7s infinite; }
@keyframes grow-ai-engineering-ok1 { 0%, 36% { fill: var(--scene-line, #cfdfdc); } 40%, 96% { fill: var(--scene-good, #1f7a4d); } 100% { fill: var(--scene-line, #cfdfdc); } }
@keyframes grow-ai-engineering-ok2 { 0%, 46% { fill: var(--scene-line, #cfdfdc); } 50%, 96% { fill: var(--scene-good, #1f7a4d); } 100% { fill: var(--scene-line, #cfdfdc); } }
@keyframes grow-ai-engineering-ok3 { 0%, 56% { fill: var(--scene-line, #cfdfdc); } 60%, 96% { fill: var(--scene-good, #1f7a4d); } 100% { fill: var(--scene-line, #cfdfdc); } }
.grow-ai-engineering-tick { fill: none; stroke: var(--scene-card, #ffffff); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.grow-ai-engineering-shield { fill: var(--scene-good, #1f7a4d); animation: grow-ai-engineering-ship 7s infinite; }
@keyframes grow-ai-engineering-ship { 0%, 62% { opacity: .15; } 66%, 96% { opacity: 1; } 100% { opacity: .15; } }
.grow-ai-engineering-doc, .grow-ai-engineering-out, .grow-ai-engineering-star, .grow-ai-engineering-c1, .grow-ai-engineering-c2, .grow-ai-engineering-c3, .grow-ai-engineering-shield { animation-delay: -3s; }
</style>
<!-- context documents -->
<g>
  <rect class="grow-ai-engineering-box" x="36" y="44" width="76" height="96" rx="8"/>
  <rect class="grow-ai-engineering-box" x="28" y="52" width="76" height="96" rx="8"/>
  <rect class="grow-ai-engineering-box" x="20" y="60" width="76" height="96" rx="8"/>
  <rect class="grow-ai-engineering-ln" x="32" y="76" width="52" height="6" rx="3"/>
  <rect class="grow-ai-engineering-soft" x="32" y="90" width="44" height="6" rx="3"/>
  <rect class="grow-ai-engineering-ln" x="32" y="104" width="52" height="6" rx="3"/>
  <rect class="grow-ai-engineering-soft" x="32" y="118" width="36" height="6" rx="3"/>
  <rect class="grow-ai-engineering-ln" x="32" y="132" width="48" height="6" rx="3"/>
</g>
<text class="grow-ai-engineering-t" x="58" y="184" font-size="16" text-anchor="middle">context</text>
<path class="grow-ai-engineering-wire" d="M120 92 H190"/>
<g class="grow-ai-engineering-doc"><rect class="grow-ai-engineering-box" x="112" y="80" width="18" height="24" rx="3"/><rect class="grow-ai-engineering-ln" x="116" y="86" width="10" height="3"/><rect class="grow-ai-engineering-ln" x="116" y="93" width="10" height="3"/></g>
<!-- model -->
<rect class="grow-ai-engineering-model" x="196" y="48" width="88" height="88" rx="18"/>
<path class="grow-ai-engineering-star" d="M240 66 C243 84 248 89 266 92 C248 95 243 100 240 118 C237 100 232 95 214 92 C232 89 237 84 240 66 Z"/>
<text class="grow-ai-engineering-t" x="240" y="184" font-size="16" text-anchor="middle">model</text>
<path class="grow-ai-engineering-wire" d="M290 92 H346"/>
<g class="grow-ai-engineering-out"><rect x="290" y="82" width="22" height="20" rx="10" class="grow-ai-engineering-model"/></g>
<!-- eval gate -->
<rect class="grow-ai-engineering-box" x="352" y="36" width="112" height="120" rx="10"/>
<rect class="grow-ai-engineering-ln" x="364" y="54" width="54" height="8" rx="4"/>
<circle class="grow-ai-engineering-chk grow-ai-engineering-c1" cx="442" cy="58" r="9"/><path class="grow-ai-engineering-tick" d="M437.5 58 l3 3 l5.5 -6"/>
<rect class="grow-ai-engineering-ln" x="364" y="80" width="46" height="8" rx="4"/>
<circle class="grow-ai-engineering-chk grow-ai-engineering-c2" cx="442" cy="84" r="9"/><path class="grow-ai-engineering-tick" d="M437.5 84 l3 3 l5.5 -6"/>
<rect class="grow-ai-engineering-ln" x="364" y="106" width="58" height="8" rx="4"/>
<circle class="grow-ai-engineering-chk grow-ai-engineering-c3" cx="442" cy="110" r="9"/><path class="grow-ai-engineering-tick" d="M437.5 110 l3 3 l5.5 -6"/>
<path class="grow-ai-engineering-shield" d="M408 126 l14 5 v8 c0 6 -6 10 -14 12 c-8 -2 -14 -6 -14 -12 v-8 Z"/>
<text class="grow-ai-engineering-t" x="408" y="184" font-size="16" text-anchor="middle">eval gate</text>
</svg>
