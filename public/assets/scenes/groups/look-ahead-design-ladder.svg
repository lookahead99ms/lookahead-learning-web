<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="A four-step ladder: Fundamentals, Patterns, Systems, then Design Rounds, with a learner climbing one step at a time">
<style>
.look-ahead-design-ladder-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.look-ahead-design-ladder-step { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 2; }
.look-ahead-design-ladder-box { fill: var(--scene-card, #ffffff); stroke: var(--scene-ink, #102a33); stroke-width: 2; }
.look-ahead-design-ladder-acc { fill: var(--scene-accent, #006c73); }
.look-ahead-design-ladder-ahead { fill: var(--scene-ahead, #2f6fb3); }
.look-ahead-design-ladder-good { fill: var(--scene-good, #1f7a4d); }
.look-ahead-design-ladder-wire { fill: none; stroke: var(--scene-ink, #102a33); stroke-width: 2; }
.look-ahead-design-ladder-hand { fill: none; stroke: var(--scene-ink, #102a33); stroke-width: 2; stroke-linecap: round; }
.look-ahead-design-ladder-legs { fill: none; stroke: var(--scene-ahead, #2f6fb3); stroke-width: 5; stroke-linecap: round; }

.look-ahead-design-ladder-climb { animation: look-ahead-design-ladder-kf-climb 8s ease-in-out infinite; }
.look-ahead-design-ladder-on1, .look-ahead-design-ladder-on2, .look-ahead-design-ladder-on3, .look-ahead-design-ladder-on4 { animation-duration: 8s; animation-iteration-count: infinite; }
.look-ahead-design-ladder-on1 { animation-name: look-ahead-design-ladder-kf-on1; }
.look-ahead-design-ladder-on2 { animation-name: look-ahead-design-ladder-kf-on2; }
.look-ahead-design-ladder-on3 { animation-name: look-ahead-design-ladder-kf-on3; }
.look-ahead-design-ladder-on4 { animation-name: look-ahead-design-ladder-kf-on4; }
@keyframes look-ahead-design-ladder-kf-climb { 0%, 16% { transform: translate(0, 0); } 24%, 38% { transform: translate(140px, -34px); } 46%, 60% { transform: translate(238px, -68px); } 68%, 90% { transform: translate(336px, -102px); } 97%, 100% { transform: translate(0, 0); } }
@keyframes look-ahead-design-ladder-kf-on1 { 0%, 18% { opacity: 1; } 24%, 94% { opacity: .6; } 100% { opacity: 1; } }
@keyframes look-ahead-design-ladder-kf-on2 { 0%, 20% { opacity: .6; } 26%, 40% { opacity: 1; } 46%, 100% { opacity: .6; } }
@keyframes look-ahead-design-ladder-kf-on3 { 0%, 42% { opacity: .6; } 48%, 62% { opacity: 1; } 68%, 100% { opacity: .6; } }
@keyframes look-ahead-design-ladder-kf-on4 { 0%, 64% { opacity: .6; } 70%, 92% { opacity: 1; } 98%, 100% { opacity: .6; } }

.look-ahead-design-ladder-climb, .look-ahead-design-ladder-on1, .look-ahead-design-ladder-on2, .look-ahead-design-ladder-on3, .look-ahead-design-ladder-on4 { animation-delay: -3.4s; }
</style>
<!-- Steps: each one is labelled; nothing is left empty. -->
<rect class="look-ahead-design-ladder-step" x="8" y="150" width="142" height="42" rx="5"/>
<rect class="look-ahead-design-ladder-step" x="150" y="116" width="98" height="76" rx="5"/>
<rect class="look-ahead-design-ladder-step" x="248" y="82" width="98" height="110" rx="5"/>
<rect class="look-ahead-design-ladder-step" x="346" y="48" width="126" height="144" rx="5"/>
<text class="look-ahead-design-ladder-t" x="79" y="178" font-size="19" text-anchor="middle">Fundamentals</text>
<text class="look-ahead-design-ladder-t" x="199" y="178" font-size="19" text-anchor="middle">Patterns</text>
<text class="look-ahead-design-ladder-t" x="297" y="178" font-size="19" text-anchor="middle">Systems</text>
<text class="look-ahead-design-ladder-t" x="409" y="156" font-size="19" text-anchor="middle">Design</text>
<text class="look-ahead-design-ladder-t" x="409" y="178" font-size="19" text-anchor="middle">Rounds</text>
<!-- Icons: building blocks, a pattern, a small system, a timed whiteboard round. -->
<g class="look-ahead-design-ladder-on1"><path class="look-ahead-design-ladder-box" d="M58 122 V142 A14 5 0 0 0 86 142 V122 Z"/><ellipse class="look-ahead-design-ladder-box" cx="72" cy="122" rx="14" ry="5"/><rect class="look-ahead-design-ladder-acc" x="96" y="126" width="12" height="18" rx="2"/><rect class="look-ahead-design-ladder-acc" x="112" y="126" width="12" height="18" rx="2"/><rect class="look-ahead-design-ladder-acc" x="104" y="108" width="12" height="16" rx="2"/></g>
<g class="look-ahead-design-ladder-on2"><g transform="translate(8 0)"><path class="look-ahead-design-ladder-wire" d="M188 96 L214 84 M188 96 L214 96 M188 96 L214 108"/><circle class="look-ahead-design-ladder-ahead" cx="184" cy="96" r="7"/><circle class="look-ahead-design-ladder-good" cx="218" cy="84" r="5.5"/><circle class="look-ahead-design-ladder-good" cx="218" cy="96" r="5.5"/><circle class="look-ahead-design-ladder-good" cx="218" cy="108" r="5.5"/></g></g>
<g class="look-ahead-design-ladder-on3"><g transform="translate(14 0)"><path class="look-ahead-design-ladder-wire" d="M280 52 H292 M310 52 V58"/><rect class="look-ahead-design-ladder-box" x="262" y="42" width="18" height="20" rx="3"/><rect class="look-ahead-design-ladder-box" x="292" y="40" width="36" height="20" rx="3"/><path class="look-ahead-design-ladder-step" d="M298 64 V74 A12 4 0 0 0 322 74 V64 Z"/><ellipse class="look-ahead-design-ladder-step" cx="310" cy="64" rx="12" ry="4"/></g></g>
<g class="look-ahead-design-ladder-on4"><rect class="look-ahead-design-ladder-box" x="384" y="8" width="54" height="34" rx="4"/><path class="look-ahead-design-ladder-hand" d="M392 18 h10 v9 h-10 Z M402 22 H414 M414 16 h14 v12 h-14 Z"/><circle cx="454" cy="26" r="11" fill="var(--scene-card, #ffffff)" stroke="var(--scene-warn, #a15c00)" stroke-width="3"/><path class="look-ahead-design-ladder-hand" d="M454 19 V26 L459 29"/></g>
<!-- The learner climbs one step at a time. -->
<g class="look-ahead-design-ladder-climb"><circle class="look-ahead-design-ladder-ahead" cx="26" cy="122" r="7"/><path class="look-ahead-design-ladder-legs" d="M26 131 V146"/></g>
</svg>
