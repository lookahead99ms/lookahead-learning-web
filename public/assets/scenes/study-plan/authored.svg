<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img" aria-label="A prepared path: Learn, then Grow, then Look Ahead, already reviewed and ready to save or adjust">
<style>
.study-plan-authored-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.study-plan-authored-tile { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.study-plan-authored-route { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 2; stroke-dasharray: 5 4; }
.study-plan-authored-learn { fill: var(--scene-learn, #006c73); }
.study-plan-authored-grow { fill: var(--scene-grow, #a84328); }
.study-plan-authored-ahead { fill: var(--scene-ahead, #245a88); }
.study-plan-authored-badge { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 1.5; }
.study-plan-authored-ok { fill: none; stroke: var(--scene-good, #1f7a4d); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.study-plan-authored-walk { animation: study-plan-authored-kf-walk 6s ease-in-out infinite; }
@keyframes study-plan-authored-kf-walk { 0%, 8% { transform: translate(0, 0); } 36%, 44% { transform: translate(104px, 38px); } 72%, 100% { transform: translate(204px, 76px); } }
.study-plan-authored-done { animation: study-plan-authored-kf-done 6s infinite; }
@keyframes study-plan-authored-kf-done { 0%, 70% { opacity: 0; } 76%, 100% { opacity: 1; } }
.study-plan-authored-walk, .study-plan-authored-done { animation-delay: -4.6s; }
</style>
<path class="study-plan-authored-route" d="M56 54 C56 70 90 75 116 75 M160 92 C160 108 180 113 198 113"/>
<rect class="study-plan-authored-tile" x="12" y="20" width="92" height="34" rx="8"/><rect class="study-plan-authored-learn" x="12" y="20" width="6" height="34" rx="3"/><text class="study-plan-authored-t" x="62" y="42" font-size="15" text-anchor="middle">Learn</text>
<rect class="study-plan-authored-tile" x="116" y="58" width="92" height="34" rx="8"/><rect class="study-plan-authored-grow" x="116" y="58" width="6" height="34" rx="3"/><text class="study-plan-authored-t" x="166" y="80" font-size="15" text-anchor="middle">Grow</text>
<rect class="study-plan-authored-tile" x="198" y="96" width="114" height="34" rx="8"/><rect class="study-plan-authored-ahead" x="198" y="96" width="6" height="34" rx="3"/><text class="study-plan-authored-t" x="258" y="118" font-size="15" text-anchor="middle">Look Ahead</text>
<g class="study-plan-authored-walk"><circle class="study-plan-authored-ahead" cx="92" cy="16" r="7"/></g>
<g class="study-plan-authored-done"><rect class="study-plan-authored-badge" x="12" y="100" width="150" height="30" rx="15"/><path class="study-plan-authored-ok" d="M26 115 l5 5 l9 -10"/><text class="study-plan-authored-t" x="48" y="120" font-size="14">Ready to go</text></g>
</svg>
