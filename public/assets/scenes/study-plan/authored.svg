<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img" aria-label="Prepared plans such as Backend SDE, SDE II and Coding interviews; the chosen plan climbs from Learn to Grow to Look Ahead, reviewed and ready to save or adjust">
<style>
.study-plan-authored-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.study-plan-authored-plan-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-muted, #536970); font-weight: 600; }
.study-plan-authored-plan-on { fill: var(--scene-ink, #102a33); }
.study-plan-authored-tile { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.study-plan-authored-plan { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.2; }
.study-plan-authored-plan-picked { fill: var(--scene-card, #ffffff); stroke: var(--scene-accent, #006c73); stroke-width: 2; }
.study-plan-authored-route { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 2; stroke-dasharray: 5 4; }
.study-plan-authored-learn { fill: var(--scene-learn, #006c73); }
.study-plan-authored-grow { fill: var(--scene-grow, #a84328); }
.study-plan-authored-ahead { fill: var(--scene-ahead, #245a88); }
.study-plan-authored-badge { fill: var(--scene-accent-soft, #dcefed); stroke: var(--scene-accent, #006c73); stroke-width: 1.5; }
.study-plan-authored-ok { fill: none; stroke: var(--scene-good, #1f7a4d); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.study-plan-authored-walk { animation: study-plan-authored-kf-walk 6s ease-in-out infinite; }
@keyframes study-plan-authored-kf-walk { 0%, 8% { transform: translate(0, 0); } 36%, 44% { transform: translate(60px, -40px); } 72%, 100% { transform: translate(116px, -80px); } }
.study-plan-authored-done { animation: study-plan-authored-kf-done 6s infinite; }
@keyframes study-plan-authored-kf-done { 0%, 70% { opacity: 0; } 76%, 100% { opacity: 1; } }
.study-plan-authored-walk, .study-plan-authored-done { animation-delay: -4.6s; }
</style>
<!-- Prepared plans on the left; the picked one (outlined) is the path that climbs on the right. -->
<rect class="study-plan-authored-plan-picked" x="8" y="14" width="100" height="24" rx="12"/><text class="study-plan-authored-plan-t study-plan-authored-plan-on" x="58" y="30" font-size="11" text-anchor="middle">Backend SDE</text>
<rect class="study-plan-authored-plan" x="8" y="44" width="100" height="24" rx="12"/><text class="study-plan-authored-plan-t" x="58" y="60" font-size="11" text-anchor="middle">SDE II</text>
<rect class="study-plan-authored-plan" x="8" y="74" width="100" height="24" rx="12"/><text class="study-plan-authored-plan-t" x="58" y="90" font-size="10.5" text-anchor="middle">Coding interviews</text>
<!-- The path steps up: Learn, then Grow, then Look Ahead. -->
<path class="study-plan-authored-route" d="M159 104 C159 88 166 79 180 79 M222 64 C222 48 222 39 230 39"/>
<rect class="study-plan-authored-tile" x="120" y="104" width="78" height="30" rx="8"/><rect class="study-plan-authored-learn" x="120" y="104" width="6" height="30" rx="3"/><text class="study-plan-authored-t" x="162" y="124" font-size="14" text-anchor="middle">Learn</text>
<rect class="study-plan-authored-tile" x="180" y="64" width="78" height="30" rx="8"/><rect class="study-plan-authored-grow" x="180" y="64" width="6" height="30" rx="3"/><text class="study-plan-authored-t" x="222" y="84" font-size="14" text-anchor="middle">Grow</text>
<rect class="study-plan-authored-tile" x="230" y="24" width="84" height="30" rx="8"/><rect class="study-plan-authored-ahead" x="230" y="24" width="6" height="30" rx="3"/><text class="study-plan-authored-t" x="275" y="44" font-size="13" text-anchor="middle">Look Ahead</text>
<g class="study-plan-authored-walk"><circle class="study-plan-authored-ahead" cx="192" cy="100" r="7"/></g>
<g class="study-plan-authored-done"><rect class="study-plan-authored-badge" x="8" y="110" width="106" height="26" rx="13"/><path class="study-plan-authored-ok" d="M18 123 l4 4 l8 -9"/><text class="study-plan-authored-t" x="35" y="127" font-size="11.5">Ready to go</text></g>
</svg>
