<g class="tlra-loop tlra-c2"><rect x="86" y="104" width="24" height="12" rx="6" fill="var(--scene-link,#2f6fb3)"/><path d="M92 116l-3 5 7-5Z" fill="var(--scene-link,#2f6fb3)"/></g>
<g class="tlra-loop tlra-c3"><rect x="70" y="124" width="24" height="12" rx="6" fill="var(--scene-grow,#b8457a)"/><path d="M76 136l-3 5 7-5Z" fill="var(--scene-grow,#b8457a)"/></g>
<g class="tlra-loop tlra-ok" style="transform-origin:120px 146px"><circle cx="120" cy="146" r="13" fill="var(--scene-good,#1f7a4d)"/><path d="M113 146l5 5 9-10" fill="none" stroke="var(--scene-card,#fff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<g fill="none" stroke="var(--scene-muted,#536970)" stroke-width="1.6" stroke-dasharray="3 4"><path d="M128 92L212 44"/><path d="M128 104L212 96"/><path d="M128 116L212 148"/></g>
<g fill="var(--scene-ahead,#2f6fb3)"><circle class="tlra-loop tlra-d1" cx="128" cy="92" r="3.5"/><circle class="tlra-loop tlra-d2" cx="128" cy="104" r="3.5"/><circle class="tlra-loop tlra-d3" cx="128" cy="116" r="3.5"/></g>
<g id="tlra-folders" stroke="var(--scene-ink,#102a33)" stroke-width="2" stroke-linejoin="round">
<path d="M214 26h22l5 6h43v26h-70Z" fill="var(--scene-accent-soft,#dcefed)"/>
<path d="M214 78h22l5 6h43v26h-70Z" fill="var(--scene-accent-soft,#dcefed)"/>
<path d="M214 130h22l5 6h43v26h-70Z" fill="var(--scene-accent-soft,#dcefed)"/></g>
<g class="tlra-loop tlra-file"><path d="M222 34h20l5 5v16h-25Z" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="1.6" stroke-linejoin="round"/><text class="tlra-s" x="234.5" y="50" text-anchor="middle">19</text></g>
<g class="tlra-loop tlra-file"><path d="M222 86h20l5 5v16h-25Z" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="1.6" stroke-linejoin="round"/><text class="tlra-s" x="234.5" y="102" text-anchor="middle">11</text></g>
<g class="tlra-loop tlra-file"><path d="M222 138h20l5 5v16h-25Z" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="1.6" stroke-linejoin="round"/><text class="tlra-s" x="234.5" y="154" text-anchor="middle">5</text></g>
<g class="tlra-loop tlra-old"><path d="M219 104l31-17" stroke="var(--scene-warn,#a15c00)" stroke-width="3" stroke-linecap="round"/></g>
<g class="tlra-loop tlra-new"><path d="M254 86h20l5 5v16h-25Z" fill="var(--scene-card,#fff)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2" stroke-linejoin="round"/><text class="tlra-s" x="266.5" y="102" text-anchor="middle">16</text></g>
</svg>
