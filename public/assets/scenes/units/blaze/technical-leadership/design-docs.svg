<g fill="var(--scene-ahead,#2f6fb3)"><circle cx="262" cy="132" r="9"/><path d="M248 156c0-10 6-14 14-14s14 4 14 14z"/></g>
<g class="tl-dd-loop tl-dd-ok1" style="transform-origin:292px 40px"><circle cx="292" cy="40" r="9" fill="var(--scene-good,#1f7a4d)"/><path d="M287.5 40l3 3 5-6" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="tl-dd-loop tl-dd-ok2" style="transform-origin:292px 90px"><circle cx="292" cy="90" r="9" fill="var(--scene-good,#1f7a4d)"/><path d="M287.5 90l3 3 5-6" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="tl-dd-loop tl-dd-ok3" style="transform-origin:292px 140px"><circle cx="292" cy="140" r="9" fill="var(--scene-good,#1f7a4d)"/><path d="M287.5 140l3 3 5-6" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
