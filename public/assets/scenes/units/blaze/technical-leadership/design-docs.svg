<text x="116.5" y="80.5" text-anchor="middle" font-size="11" font-weight="700" fill="var(--scene-card,#fff)">?</text><text x="116.5" y="94.5" text-anchor="middle" font-size="11" font-weight="700" fill="var(--scene-card,#fff)">?</text></g>
<g class="tl-dd-loop tl-dd-done"><rect x="110" y="70" width="13" height="13" rx="3" fill="var(--scene-good,#1f7a4d)"/><rect x="110" y="84" width="13" height="13" rx="3" fill="var(--scene-good,#1f7a4d)"/>
<path d="M113 76.5l2.5 2.5 4.5-5M113 90.5l2.5 2.5 4.5-5" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g stroke="var(--scene-ink,#102a33)" stroke-width="1.5" fill="var(--scene-card,#fff)"><rect x="112" y="108" width="14" height="10" rx="2"/><rect x="134" y="108" width="14" height="10" rx="2"/><rect x="156" y="108" width="14" height="10" rx="2" fill="var(--scene-accent-soft,#dcefed)"/></g>
<path d="M126 113h8M148 113h8" stroke="var(--scene-ink,#102a33)" stroke-width="1.5"/>
