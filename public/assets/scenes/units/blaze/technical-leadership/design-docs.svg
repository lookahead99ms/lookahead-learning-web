<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A tech lead sends a design doc that opens with the decision; its open questions turn into checks and three approvers sign off one after another">
<style>
.tl-dd-loop{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6.4s;animation-timing-function:ease-in-out}
.tl-dd-send{animation-name:tl-dd-send}
.tl-dd-out1{animation-name:tl-dd-out1}
.tl-dd-out2{animation-name:tl-dd-out2}
.tl-dd-out3{animation-name:tl-dd-out3}
.tl-dd-open{animation-name:tl-dd-open}
.tl-dd-done{animation-name:tl-dd-done}
.tl-dd-ok1{animation-name:tl-dd-ok1}
.tl-dd-ok2{animation-name:tl-dd-ok2}
.tl-dd-ok3{animation-name:tl-dd-ok3}
@keyframes tl-dd-send{0%{transform:translate(0,0);opacity:0}3%{opacity:1}16%{transform:translate(30px,0);opacity:1}19%,100%{transform:translate(30px,0);opacity:0}}
@keyframes tl-dd-out1{0%,38%{transform:translate(0,0);opacity:0}40%{opacity:1}52%{transform:translate(66px,-50px);opacity:1}55%,100%{transform:translate(66px,-50px);opacity:0}}
@keyframes tl-dd-out2{0%,46%{transform:translate(0,0);opacity:0}48%{opacity:1}60%{transform:translate(66px,0);opacity:1}63%,100%{transform:translate(66px,0);opacity:0}}
@keyframes tl-dd-out3{0%,54%{transform:translate(0,0);opacity:0}56%{opacity:1}68%{transform:translate(66px,50px);opacity:1}71%,100%{transform:translate(66px,50px);opacity:0}}
@keyframes tl-dd-open{0%,26%{opacity:1}34%,94%{opacity:0}100%{opacity:1}}
@keyframes tl-dd-done{0%,26%{opacity:0}34%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes tl-dd-ok1{0%,53%{opacity:0;transform:scale(.4)}57%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0}}
@keyframes tl-dd-ok2{0%,61%{opacity:0;transform:scale(.4)}65%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0}}
@keyframes tl-dd-ok3{0%,69%{opacity:0;transform:scale(.4)}73%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.tl-dd-loop{animation-play-state:paused}}
</style>
