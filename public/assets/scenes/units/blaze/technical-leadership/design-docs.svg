<g fill="var(--scene-ink,#102a33)" opacity=".09"><ellipse cx="44" cy="132" rx="36" ry="4"/><ellipse cx="140" cy="156" rx="44" ry="5"/><ellipse cx="262" cy="58" rx="20" ry="3"/><ellipse cx="262" cy="108" rx="20" ry="3"/><ellipse cx="262" cy="158" rx="20" ry="3"/></g>
<circle cx="44" cy="66" r="12" fill="var(--scene-accent,#006c73)"/>
<path d="M24 100c0-14 9-20 20-20s20 6 20 20z" fill="var(--scene-accent,#006c73)"/>
