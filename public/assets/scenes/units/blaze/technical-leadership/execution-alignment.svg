<rect x="10" y="108" width="76" height="50" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-grow,#b8457a)" stroke-width="2.5"/><text class="blaze-technical-leadership-execution-alignment-t" x="48" y="138" text-anchor="middle">Team B</text>
