<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Two teams linked by a dependency handoff moving toward a shared milestone"><style>.blaze-technical-leadership-execution-alignment-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.blaze-technical-leadership-execution-alignment-bg{fill:var(--scene-card,#fff)}.blaze-technical-leadership-execution-alignment-tok{animation:blaze-technical-leadership-execution-alignment-move 6s linear infinite -3s}
.blaze-technical-leadership-execution-alignment-ms{animation:blaze-technical-leadership-execution-alignment-pulse 6s ease-in-out infinite -3s;transform-origin:278px 40px}
.blaze-technical-leadership-execution-alignment-bar{fill:var(--scene-line,#cfdfdc)}
@keyframes blaze-technical-leadership-execution-alignment-move{0%{transform:translateX(0)}100%{transform:translateX(120px)}}
@keyframes blaze-technical-leadership-execution-alignment-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}</style><rect class="blaze-technical-leadership-execution-alignment-bg" width="320" height="180"/>
