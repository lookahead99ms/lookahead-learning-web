<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Tsholofelo scrolls a large sheet on her laptop; a block of rows arrives from the server, she types 18.42 into the active cell, it shows as pending and then saved">
<style>
