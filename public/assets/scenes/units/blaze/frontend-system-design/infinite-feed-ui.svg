<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Zawadi scrolls phone listings on her phone; the next page arrives from the listings API before she reaches the end, and a 6 new listings pill appears at the top instead of pushing the list down">
<style>
.ifeed-a{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-5.6s;animation-timing-function:ease-in-out}
@media (prefers-reduced-motion: reduce){.ifeed-a{animation-play-state:paused!important}}
.ifeed-scroll{animation-name:ifeed-scroll;animation-timing-function:linear}
@keyframes ifeed-scroll{0%{transform:translateY(0)}100%{transform:translateY(-112px)}}
.ifeed-page{animation-name:ifeed-page}
@keyframes ifeed-page{0%,8%{opacity:0;transform:translateX(0)}12%{opacity:1}34%{opacity:1;transform:translateX(-50px)}38%,100%{opacity:0;transform:translateX(-50px)}}
.ifeed-ok{animation-name:ifeed-ok}
@keyframes ifeed-ok{0%,34%{opacity:0}38%,58%{opacity:1}62%,100%{opacity:0}}
.ifeed-new{animation-name:ifeed-new}
@keyframes ifeed-new{0%,52%{opacity:0;transform:translateY(-6px)}58%,94%{opacity:1;transform:none}100%{opacity:0;transform:none}}
</style>
