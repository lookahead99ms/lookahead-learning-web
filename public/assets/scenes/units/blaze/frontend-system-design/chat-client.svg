<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Dilnoza sends a message from her phone while the signal is gone; it waits with a clock, goes to the chat server when the signal returns and gets a tick, while the assistant's reply grows line by line and Kemal from support joins the chat">
<style>
.chatc-a{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-5.6s;animation-timing-function:ease-in-out}
@media (prefers-reduced-motion: reduce){.chatc-a{animation-play-state:paused!important}}
.chatc-l1{animation-name:chatc-l1;transform-box:fill-box;transform-origin:left center}
@keyframes chatc-l1{0%{transform:scaleX(.1)}10%,100%{transform:scaleX(1)}}
.chatc-l2{animation-name:chatc-l2;transform-box:fill-box;transform-origin:left center}
@keyframes chatc-l2{0%,8%{transform:scaleX(0)}18%,100%{transform:scaleX(1)}}
.chatc-me{animation-name:chatc-me}
@keyframes chatc-me{0%,20%{opacity:0;transform:translateY(6px)}24%,100%{opacity:1;transform:none}}
.chatc-clock{animation-name:chatc-clock}
@keyframes chatc-clock{0%,20%{opacity:0}24%,50%{opacity:1}53%,100%{opacity:0}}
.chatc-tick{animation-name:chatc-tick}
@keyframes chatc-tick{0%,50%{opacity:0}53%,96%{opacity:1}100%{opacity:0}}
.chatc-off{animation-name:chatc-off}
@keyframes chatc-off{0%,18%{opacity:0}22%,38%{opacity:1}42%,100%{opacity:0}}
.chatc-dot{animation-name:chatc-dot}
@keyframes chatc-dot{0%,40%{opacity:0;transform:translateX(0)}42%{opacity:1}50%{opacity:1;transform:translateX(58px)}52%,100%{opacity:0;transform:translateX(58px)}}
.chatc-join{animation-name:chatc-join}
@keyframes chatc-join{0%,60%{opacity:0;transform:translateY(-6px)}65%,96%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.chatc-kb{animation-name:chatc-kb}
@keyframes chatc-kb{0%,66%{opacity:0;transform:translateY(6px)}71%,96%{opacity:1;transform:none}100%{opacity:0;transform:none}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<ellipse cx="50" cy="160" rx="32" ry="5" fill="var(--scene-ink,#102a33)" opacity=".08"/>
<ellipse cx="146" cy="173" rx="52" ry="4" fill="var(--scene-ink,#102a33)" opacity=".1"/>
<ellipse cx="276" cy="140" rx="30" ry="5" fill="var(--scene-ink,#102a33)" opacity=".08"/>
<circle cx="50" cy="86" r="15" fill="var(--scene-accent,#006c73)"/>
<path d="M20 156c0-22 13-40 30-40s30 18 30 40Z" fill="var(--scene-accent,#006c73)"/>
<path d="M76 136l20-6" stroke="var(--scene-accent,#006c73)" stroke-width="8" stroke-linecap="round"/>
<rect x="100" y="12" width="92" height="160" rx="13" fill="var(--scene-ink,#102a33)"/>
<rect x="104" y="24" width="84" height="138" rx="4" fill="var(--scene-accent-soft,#dcefed)"/>
<rect x="136" y="16" width="20" height="3" rx="1.5" fill="var(--scene-line,#cfdfdc)"/>
<rect x="104" y="24" width="84" height="16" rx="4" fill="var(--scene-card,#fff)"/>
<circle cx="113" cy="32" r="4.5" fill="var(--scene-accent,#006c73)"/>
<rect x="121" y="30" width="30" height="4" rx="2" fill="var(--scene-ink,#102a33)" opacity=".5"/>
<g class="chatc-a chatc-join"><circle cx="178" cy="32" r="4.5" fill="var(--scene-link,#245a88)"/><circle cx="178" cy="32" r="6.5" fill="none" stroke="var(--scene-card,#fff)" stroke-width="1.5"/></g>
<rect x="108" y="46" width="62" height="34" rx="6" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)"/>
<rect x="111" y="49" width="15" height="9" rx="3" fill="var(--scene-accent,#006c73)"/>
<text x="118.5" y="56.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="var(--scene-card,#fff)">AI</text>
<rect class="chatc-a chatc-l1" x="112" y="62" width="52" height="4" rx="2" fill="var(--scene-ink,#102a33)" opacity=".55"/>
<rect class="chatc-a chatc-l2" x="112" y="70" width="38" height="4" rx="2" fill="var(--scene-ink,#102a33)" opacity=".55"/>
<g class="chatc-a chatc-me"><rect x="126" y="88" width="58" height="22" rx="6" fill="var(--scene-accent,#006c73)"/><rect x="131" y="94" width="38" height="4" rx="2" fill="var(--scene-card,#fff)"/><rect x="131" y="101" width="26" height="4" rx="2" fill="var(--scene-card,#fff)"/></g>
<g class="chatc-a chatc-clock"><circle cx="177" cy="116" r="5" fill="var(--scene-card,#fff)" stroke="var(--scene-warn,#a15c00)" stroke-width="1.5"/><path d="M177 113.5v3l2 1.5" stroke="var(--scene-warn,#a15c00)" stroke-width="1.3" fill="none" stroke-linecap="round"/></g>
<g class="chatc-a chatc-tick"><circle cx="177" cy="116" r="5.5" fill="var(--scene-good,#1f7a4d)"/><path d="M174.5 116l2 2 3.5-4" stroke="var(--scene-card,#fff)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="chatc-a chatc-kb"><rect x="108" y="126" width="56" height="22" rx="6" fill="var(--scene-card,#fff)" stroke="var(--scene-link,#245a88)" stroke-width="1.5"/><rect x="112" y="132" width="40" height="4" rx="2" fill="var(--scene-link,#245a88)"/><rect x="112" y="139" width="28" height="4" rx="2" fill="var(--scene-link,#245a88)" opacity=".7"/></g>
<path d="M194 92H250" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="3 5"/>
<g class="chatc-a chatc-off"><circle cx="222" cy="92" r="9" fill="var(--scene-warn,#a15c00)"/><path d="M218 88l8 8M226 88l-8 8" stroke="var(--scene-card,#fff)" stroke-width="2" stroke-linecap="round"/></g>
<g class="chatc-a chatc-dot"><circle cx="196" cy="92" r="4.5" fill="var(--scene-accent,#006c73)"/></g>
<rect x="252" y="72" width="48" height="58" rx="5" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<path d="M252 72l8-8h48l-8 8Z" fill="var(--scene-line,#cfdfdc)" stroke="var(--scene-ink,#102a33)" stroke-width="2" stroke-linejoin="round"/>
<path d="M300 72l8-8v58l-8 8Z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<g fill="var(--scene-line,#cfdfdc)"><rect x="258" y="82" width="28" height="6" rx="2"/><rect x="258" y="96" width="28" height="6" rx="2"/><rect x="258" y="110" width="28" height="6" rx="2"/></g>
<g fill="var(--scene-good,#1f7a4d)"><circle cx="292" cy="85" r="2"/><circle cx="292" cy="99" r="2"/><circle cx="292" cy="113" r="2"/></g>
</svg>
