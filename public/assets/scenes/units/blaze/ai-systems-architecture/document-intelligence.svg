.blaze-ai-systems-architecture-document-intelligence-scan{animation:blaze-ai-systems-architecture-document-intelligence-scan 6s ease-in-out infinite;animation-delay:-3s}
.blaze-ai-systems-architecture-document-intelligence-drop{animation:blaze-ai-systems-architecture-document-intelligence-drop 6s ease-in-out infinite;animation-delay:-3s}
@keyframes blaze-ai-systems-architecture-document-intelligence-scan{0%,100%{transform:translateY(0)}50%{transform:translateY(96px)}}
@keyframes blaze-ai-systems-architecture-document-intelligence-drop{0%,25%{transform:translate(0,-10px);opacity:.3}55%,90%{transform:translate(0,0);opacity:1}100%{transform:translate(0,-10px);opacity:.3}}
