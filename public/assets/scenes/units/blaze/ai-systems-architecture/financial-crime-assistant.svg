</g>
<g fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="2.5"><circle cx="36" cy="98" r="7"/><circle cx="74" cy="96" r="7"/><circle cx="112" cy="95" r="7"/><circle cx="150" cy="97" r="7"/></g>
