<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Several cash deposits just under the reporting threshold line pile up on a timeline, a case file gathers them, and an analyst stamps the decision">
<style>
.blaze-ai-systems-architecture-financial-crime-assistant-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.blaze-ai-systems-architecture-financial-crime-assistant-pull{animation:blaze-ai-systems-architecture-financial-crime-assistant-pull 6s ease-in-out infinite;animation-delay:-3s}
.blaze-ai-systems-architecture-financial-crime-assistant-stamp{animation:blaze-ai-systems-architecture-financial-crime-assistant-stamp 6s ease-in-out infinite;animation-delay:-3s;transform-origin:268px 98px}
@keyframes blaze-ai-systems-architecture-financial-crime-assistant-pull{0%,20%{stroke-dashoffset:24}60%,100%{stroke-dashoffset:0}}
@keyframes blaze-ai-systems-architecture-financial-crime-assistant-stamp{0%,40%{transform:translateY(-14px) rotate(-12deg)}60%,100%{transform:translateY(0) rotate(-12deg)}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
