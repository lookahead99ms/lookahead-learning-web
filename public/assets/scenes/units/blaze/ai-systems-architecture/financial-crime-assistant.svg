<path d="M14 124H176" stroke="var(--scene-ink,#102a33)" stroke-width="3" stroke-linecap="round"/>
<path d="M30 124v6M68 124v6M106 124v6M144 124v6" stroke="var(--scene-muted,#536970)" stroke-width="2.5" stroke-linecap="round"/>
