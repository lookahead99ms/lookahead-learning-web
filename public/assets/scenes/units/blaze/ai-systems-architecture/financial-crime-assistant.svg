<path d="M202 38h22l6 8h30a6 6 0 0 1 6 6v62a6 6 0 0 1-6 6h-58a6 6 0 0 1-6-6V44a6 6 0 0 1 6-6z" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"/>
<g fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="2"><rect x="212" y="60" width="16" height="10" rx="2"/><rect x="236" y="60" width="16" height="10" rx="2"/><rect x="212" y="76" width="16" height="10" rx="2"/><rect x="236" y="76" width="16" height="10" rx="2"/></g>
<path d="M212 98h40M212 106h28" stroke="var(--scene-accent,#006c73)" stroke-width="3" stroke-linecap="round"/>
