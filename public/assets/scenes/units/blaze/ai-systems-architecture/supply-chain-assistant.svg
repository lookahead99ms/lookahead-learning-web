<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A late shipment truck with a delay clock, a draining stock level heading for a stock-out date on the calendar, and an alternate supplier option waiting for the buyer to approve">
