.blaze-ai-systems-architecture-supply-chain-assistant-drain{animation:blaze-ai-systems-architecture-supply-chain-assistant-drain 6s ease-in-out infinite;animation-delay:-3s;transform-origin:30px 134px}
.blaze-ai-systems-architecture-supply-chain-assistant-ok{animation:blaze-ai-systems-architecture-supply-chain-assistant-ok 6s ease-in-out infinite;animation-delay:-3s}
@keyframes blaze-ai-systems-architecture-supply-chain-assistant-hand{to{transform:rotate(360deg)}}
@keyframes blaze-ai-systems-architecture-supply-chain-assistant-drain{0%,20%{transform:scaleY(1)}70%,100%{transform:scaleY(.55)}}
@keyframes blaze-ai-systems-architecture-supply-chain-assistant-ok{0%,30%{stroke-width:2.5}60%,90%{stroke-width:5}100%{stroke-width:2.5}}
</style>
