<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" class="message-queue-root" role="img" aria-label="A shop keeps adding order messages to the end of a log while billing and email each read it at their own pace, and nothing is deleted when they read.">
<style>
.message-queue-root text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.message-queue-t{fill:var(--scene-ink,#102a33)}
.message-queue-tx{fill:var(--scene-text,#28434a)}
.message-queue-mut{fill:var(--scene-muted,#536970)}
.message-queue-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.message-queue-soft{fill:var(--scene-accent-soft,#dcefed)}
.message-queue-acc{fill:var(--scene-accent,#006c73)}
.message-queue-ln{fill:var(--scene-line,#cfdfdc)}
.message-queue-cardf{fill:var(--scene-card,#fff)}
.message-queue-good{fill:var(--scene-good,#1f7a4d)}
.message-queue-warn{fill:var(--scene-warn,#a15c00)}
.message-queue-bad{fill:var(--scene-bad,#b3261e)}
.message-queue-link{fill:var(--scene-link,#245a88)}
.message-queue-out{fill:var(--scene-bubble-out,#d4ecea)}
.message-queue-sk{fill:none;stroke:var(--scene-muted,#536970);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.message-queue-sa{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.message-queue-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:1.5;stroke-dasharray:3 3}
.message-queue-a{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-3.2s}
.message-queue-e6{animation-name:message-queue-e6}@keyframes message-queue-e6{0%,6%{opacity:0;transform:translateY(-30px)}14%,94%{opacity:1;transform:none}100%{opacity:0}}
.message-queue-e7{animation-name:message-queue-e7}@keyframes message-queue-e7{0%,44%{opacity:0;transform:translateY(-30px)}52%,94%{opacity:1;transform:none}100%{opacity:0}}
.message-queue-bill{animation-name:message-queue-bill}@keyframes message-queue-bill{0%,10%{transform:translateX(107.5px)}18%,30%{transform:translateX(137px)}38%,56%{transform:translateX(166.5px)}64%,100%{transform:translateX(196px)}}
.message-queue-mail{animation-name:message-queue-mail}@keyframes message-queue-mail{0%,30%{transform:translateX(48.5px)}42%,70%{transform:translateX(78px)}82%,100%{transform:translateX(107.5px)}}
@media (prefers-reduced-motion: reduce){.message-queue-root *{animation-play-state:paused!important}}
</style>
<rect x="6.0" y="44" width="26" height="28" rx="5" class="message-queue-box"/><rect x="35.5" y="44" width="26" height="28" rx="5" class="message-queue-box"/><rect x="65.0" y="44" width="26" height="28" rx="5" class="message-queue-box"/><rect x="94.5" y="44" width="26" height="28" rx="5" class="message-queue-box"/><rect x="124.0" y="44" width="26" height="28" rx="5" class="message-queue-box"/><rect x="153.5" y="44" width="26" height="28" rx="5" class="message-queue-box"/><rect x="183.0" y="44" width="26" height="28" rx="5" class="message-queue-box"/><rect x="212.5" y="44" width="26" height="28" rx="5" class="message-queue-box"/><g><rect x="10.0" y="52" width="18" height="13" rx="2" class="message-queue-cardf" stroke="var(--scene-accent,#006c73)" stroke-width="1.4"/><path d="M10.0 53 l9 7 l9 -7" stroke="var(--scene-accent,#006c73)" stroke-width="1.4" fill="none"/></g><g><rect x="39.5" y="52" width="18" height="13" rx="2" class="message-queue-cardf" stroke="var(--scene-accent,#006c73)" stroke-width="1.4"/><path d="M39.5 53 l9 7 l9 -7" stroke="var(--scene-accent,#006c73)" stroke-width="1.4" fill="none"/></g><g><rect x="69.0" y="52" width="18" height="13" rx="2" class="message-queue-cardf" stroke="var(--scene-accent,#006c73)" stroke-width="1.4"/><path d="M69.0 53 l9 7 l9 -7" stroke="var(--scene-accent,#006c73)" stroke-width="1.4" fill="none"/></g><g><rect x="98.5" y="52" width="18" height="13" rx="2" class="message-queue-cardf" stroke="var(--scene-accent,#006c73)" stroke-width="1.4"/><path d="M98.5 53 l9 7 l9 -7" stroke="var(--scene-accent,#006c73)" stroke-width="1.4" fill="none"/></g><g><rect x="128.0" y="52" width="18" height="13" rx="2" class="message-queue-cardf" stroke="var(--scene-accent,#006c73)" stroke-width="1.4"/><path d="M128.0 53 l9 7 l9 -7" stroke="var(--scene-accent,#006c73)" stroke-width="1.4" fill="none"/></g><g><rect x="157.5" y="52" width="18" height="13" rx="2" class="message-queue-cardf" stroke="var(--scene-accent,#006c73)" stroke-width="1.4"/><path d="M157.5 53 l9 7 l9 -7" stroke="var(--scene-accent,#006c73)" stroke-width="1.4" fill="none"/></g><g class="message-queue-a message-queue-e6"><rect x="187.0" y="52" width="18" height="13" rx="2" class="message-queue-cardf" stroke="var(--scene-accent,#006c73)" stroke-width="1.4"/><path d="M187.0 53 l9 7 l9 -7" stroke="var(--scene-accent,#006c73)" stroke-width="1.4" fill="none"/></g><g class="message-queue-a message-queue-e7"><rect x="216.5" y="52" width="18" height="13" rx="2" class="message-queue-cardf" stroke="var(--scene-accent,#006c73)" stroke-width="1.4"/><path d="M216.5 53 l9 7 l9 -7" stroke="var(--scene-accent,#006c73)" stroke-width="1.4" fill="none"/></g><g transform="translate(206 4)"><path d="M0 14 L14 2 L28 14 V24 H0Z" class="message-queue-soft"/><path d="M4 14 h20" stroke="var(--scene-accent,#006c73)" stroke-width="2"/></g>
<path d="M220 30 v12" class="message-queue-sl"/>
<g class="message-queue-a message-queue-bill"><path d="M0 74 l-6 8 h12z" class="message-queue-acc"/><rect x="-28" y="82" width="56" height="20" rx="10" class="message-queue-acc"/><text x="0" y="97" font-size="13" font-weight="700" text-anchor="middle" class="message-queue-cardf">billing</text></g>
<g class="message-queue-a message-queue-mail"><path d="M0 104 l-6 8 h12z" class="message-queue-link"/><rect x="-28" y="112" width="56" height="20" rx="10" class="message-queue-link"/><text x="0" y="127" font-size="13" font-weight="700" text-anchor="middle" class="message-queue-cardf">email</text></g>
</svg>
