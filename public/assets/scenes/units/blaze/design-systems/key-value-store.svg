<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" class="key-value-store-root" role="img" aria-label="A cart is saved to three copies in three zones, the save is confirmed once two copies have it, and the slow third copy catches up a moment later.">
<style>
.key-value-store-root text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.key-value-store-t{fill:var(--scene-ink,#102a33)}
.key-value-store-tx{fill:var(--scene-text,#28434a)}
.key-value-store-mut{fill:var(--scene-muted,#536970)}
.key-value-store-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.key-value-store-soft{fill:var(--scene-accent-soft,#dcefed)}
.key-value-store-acc{fill:var(--scene-accent,#006c73)}
.key-value-store-ln{fill:var(--scene-line,#cfdfdc)}
.key-value-store-cardf{fill:var(--scene-card,#fff)}
.key-value-store-good{fill:var(--scene-good,#1f7a4d)}
.key-value-store-warn{fill:var(--scene-warn,#a15c00)}
.key-value-store-bad{fill:var(--scene-bad,#b3261e)}
.key-value-store-link{fill:var(--scene-link,#245a88)}
.key-value-store-out{fill:var(--scene-bubble-out,#d4ecea)}
.key-value-store-sk{fill:none;stroke:var(--scene-muted,#536970);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.key-value-store-sa{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.key-value-store-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:1.5;stroke-dasharray:3 3}
.key-value-store-a{animation-duration:7s;animation-iteration-count:infinite;animation-delay:-3s}
.key-value-store-c1{animation-name:key-value-store-c1}@keyframes key-value-store-c1{0%,6%{transform:translate(0,0);opacity:0}8%{opacity:1}22%,100%{transform:translate(-80px,47px);opacity:1}}
.key-value-store-c2{animation-name:key-value-store-c2}@keyframes key-value-store-c2{0%,6%{transform:translate(0,0);opacity:0}8%{opacity:1}24%,100%{transform:translate(0,47px);opacity:1}}
.key-value-store-c3{animation-name:key-value-store-c3}@keyframes key-value-store-c3{0%,6%{transform:translate(0,0);opacity:0}8%{opacity:1}30%{transform:translate(40px,24px);opacity:1}31%,62%{transform:translate(40px,24px);opacity:.35}74%,100%{transform:translate(80px,47px);opacity:1}}
.key-value-store-k1{animation-name:key-value-store-k1}@keyframes key-value-store-k1{0%,22%{opacity:0}25%,100%{opacity:1}}
.key-value-store-k2{animation-name:key-value-store-k2}@keyframes key-value-store-k2{0%,24%{opacity:0}27%,100%{opacity:1}}
.key-value-store-k3{animation-name:key-value-store-k3}@keyframes key-value-store-k3{0%,74%{opacity:0}77%,100%{opacity:1}}
.key-value-store-ok{animation-name:key-value-store-ok}@keyframes key-value-store-ok{0%,28%{opacity:0}32%,72%{opacity:1}76%,100%{opacity:0}}
.key-value-store-ok3{animation-name:key-value-store-ok3}@keyframes key-value-store-ok3{0%,74%{opacity:0}78%,100%{opacity:1}}
.key-value-store-slow{animation-name:key-value-store-slow}@keyframes key-value-store-slow{0%,30%{opacity:0}33%,70%{opacity:1}74%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.key-value-store-root *{animation-play-state:paused!important}}
</style>
<rect x="88" y="6" width="64" height="34" rx="9" class="key-value-store-box"/><path d="M104 16 h5 l4 12 h12 M112 21 h14" stroke="var(--scene-accent,#006c73)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="115" cy="32" r="2" class="key-value-store-acc"/><circle cx="125" cy="32" r="2" class="key-value-store-acc"/>
<rect x="10" y="84" width="60" height="40" rx="8" class="key-value-store-box"/><rect x="20" y="94" width="40" height="6" rx="3" class="key-value-store-ln"/><rect x="20" y="106" width="40" height="6" rx="3" class="key-value-store-ln"/>
<g class="key-value-store-a key-value-store-k1"><circle cx="66" cy="86" r="8" class="key-value-store-good"/><path d="M62 86 l3 3 l5 -6" stroke="var(--scene-card,#fff)" stroke-width="2" fill="none"/></g><rect x="90" y="84" width="60" height="40" rx="8" class="key-value-store-box"/><rect x="100" y="94" width="40" height="6" rx="3" class="key-value-store-ln"/><rect x="100" y="106" width="40" height="6" rx="3" class="key-value-store-ln"/>
<g class="key-value-store-a key-value-store-k2"><circle cx="146" cy="86" r="8" class="key-value-store-good"/><path d="M142 86 l3 3 l5 -6" stroke="var(--scene-card,#fff)" stroke-width="2" fill="none"/></g><rect x="170" y="84" width="60" height="40" rx="8" class="key-value-store-box"/><rect x="180" y="94" width="40" height="6" rx="3" class="key-value-store-ln"/><rect x="180" y="106" width="40" height="6" rx="3" class="key-value-store-ln"/>
<g class="key-value-store-a key-value-store-k3"><circle cx="226" cy="86" r="8" class="key-value-store-good"/><path d="M222 86 l3 3 l5 -6" stroke="var(--scene-card,#fff)" stroke-width="2" fill="none"/></g>
<rect class="key-value-store-a key-value-store-slow" x="168" y="82" width="64" height="44" rx="9" fill="none" stroke="var(--scene-warn,#a15c00)" stroke-width="2" stroke-dasharray="4 3"/>
<g class="key-value-store-a key-value-store-c1"><rect x="106" y="43" width="28" height="18" rx="9" class="key-value-store-acc"/><path d="M114 49 h3 l2 6 h5 M118 52 h7" stroke="var(--scene-card,#fff)" stroke-width="1.6" fill="none" stroke-linecap="round"/></g><g class="key-value-store-a key-value-store-c2"><rect x="106" y="43" width="28" height="18" rx="9" class="key-value-store-acc"/><path d="M114 49 h3 l2 6 h5 M118 52 h7" stroke="var(--scene-card,#fff)" stroke-width="1.6" fill="none" stroke-linecap="round"/></g><g class="key-value-store-a key-value-store-c3"><rect x="106" y="43" width="28" height="18" rx="9" class="key-value-store-acc"/><path d="M114 49 h3 l2 6 h5 M118 52 h7" stroke="var(--scene-card,#fff)" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>
<g class="key-value-store-a key-value-store-ok"><rect x="164" y="8" width="70" height="28" rx="9" class="key-value-store-good" fill-opacity=".15"/><text x="199" y="27" font-size="14" font-weight="700" text-anchor="middle" class="key-value-store-good">2 of 3 &#10003;</text></g>
<g class="key-value-store-a key-value-store-ok3"><rect x="164" y="8" width="70" height="28" rx="9" class="key-value-store-good" fill-opacity=".15"/><text x="199" y="27" font-size="14" font-weight="700" text-anchor="middle" class="key-value-store-good">3 of 3 &#10003;</text></g>
</svg>
