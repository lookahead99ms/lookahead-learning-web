<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" role="img" aria-label="Abebe books the last room; the booking and its event are saved together, the app restarts, and the saved event still reaches search, which changes from 1 room left to sold out.">
<style>
.outbox-cdc-t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-ink,#102a33)}
.outbox-cdc-mu{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-muted,#536970)}
.outbox-cdc-g{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-good,#1f7a4d)}
.outbox-cdc-w{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-warn,#a15c00)}
.outbox-cdc-b{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-bad,#b3261e)}
.outbox-cdc-a{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-accent,#006c73)}
.outbox-cdc-mono{font-family:ui-monospace,Menlo,monospace}
.outbox-cdc-card{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.outbox-cdc-soft{fill:var(--scene-accent-soft,#dcefed)}
.outbox-cdc-acc{fill:var(--scene-accent,#006c73)}
.outbox-cdc-gd{fill:var(--scene-good,#1f7a4d)}
.outbox-cdc-wn{fill:var(--scene-warn,#a15c00)}
.outbox-cdc-bd{fill:var(--scene-bad,#b3261e)}
.outbox-cdc-ink{fill:var(--scene-ink,#102a33)}
.outbox-cdc-mf{fill:var(--scene-muted,#536970)}
.outbox-cdc-lf{fill:var(--scene-line,#cfdfdc)}
.outbox-cdc-cf{fill:var(--scene-card,#fff)}
.outbox-cdc-sa{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.outbox-cdc-sg{fill:none;stroke:var(--scene-good,#1f7a4d);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.outbox-cdc-sw{fill:none;stroke:var(--scene-warn,#a15c00);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.outbox-cdc-sb{fill:none;stroke:var(--scene-bad,#b3261e);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.outbox-cdc-sm{fill:none;stroke:var(--scene-muted,#536970);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.outbox-cdc-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.outbox-cdc-si{fill:none;stroke:var(--scene-ink,#102a33);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.outbox-cdc-s1{animation:outbox-cdc-s1 9s -3.6s infinite;}
@keyframes outbox-cdc-s1{0%,65%{opacity:1}66%,100%{opacity:0}}
.outbox-cdc-s2{animation:outbox-cdc-s2 9s -3.6s infinite;}
@keyframes outbox-cdc-s2{0%,65%{opacity:0}66%,96%{opacity:1}97%,100%{opacity:0}}
.outbox-cdc-bolt{animation:outbox-cdc-bolt 9s -3.6s infinite;}
@keyframes outbox-cdc-bolt{0%,29%{opacity:0}31%,44%{opacity:1}46%,100%{opacity:0}}
.outbox-cdc-dim{animation:outbox-cdc-dim 9s -3.6s infinite;}
@keyframes outbox-cdc-dim{0%,29%{opacity:1}31%,44%{opacity:.3}47%,100%{opacity:1}}
.outbox-cdc-ev{animation:outbox-cdc-ev 9s -3.6s infinite;}
@keyframes outbox-cdc-ev{0%,48%{opacity:0;transform:translate(0,0)}50%{opacity:1;transform:translate(0,0)}64%{opacity:1;transform:translate(34px,0)}66%,100%{opacity:0;transform:translate(34px,0)}}
</style>
<g class="outbox-cdc-dim"><rect class="outbox-cdc-card" x="6" y="22" width="32" height="44" rx="8"/><circle class="outbox-cdc-acc" cx="22" cy="44" r="7"/></g>
<path class="outbox-cdc-bolt outbox-cdc-wn" d="M25 24 l-10 24 h8 l-4 18 l13 -26 h-8 z"/>
<path class="outbox-cdc-sm" style="stroke-width:2" d="M40 44 H50"/>
<rect class="outbox-cdc-card" x="52" y="10" width="72" height="68" rx="8"/>
<rect class="outbox-cdc-soft" x="58" y="18" width="60" height="22" rx="4"/><rect class="outbox-cdc-acc" x="63" y="26" width="30" height="6" rx="2"/>
<rect class="outbox-cdc-wn" x="58" y="48" width="60" height="22" rx="4" style="opacity:.28"/><path class="outbox-cdc-sw" style="stroke-width:2" d="M64 59 h24"/>
<g class="outbox-cdc-ev"><rect class="outbox-cdc-wn" x="108" y="53" width="18" height="12" rx="2.5"/></g>
<rect class="outbox-cdc-card" x="140" y="20" width="96" height="52" rx="8"/><circle class="outbox-cdc-sm" cx="158" cy="34" r="6" style="stroke-width:2"/><path class="outbox-cdc-sm" style="stroke-width:2" d="M162 38 l6 6"/>
<g class="outbox-cdc-s1"><text class="outbox-cdc-w" x="188" y="62" font-size="16" font-weight="700" text-anchor="middle">1 left</text>
</g><g class="outbox-cdc-s2"><text class="outbox-cdc-g" x="188" y="62" font-size="15" font-weight="700" text-anchor="middle">Sold out ✓</text>
</g>
<text class="outbox-cdc-t" x="88" y="106" font-size="15" font-weight="700" text-anchor="middle">Saved together</text>

</svg>
