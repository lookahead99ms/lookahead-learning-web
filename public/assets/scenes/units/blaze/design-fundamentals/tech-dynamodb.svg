<g class="tech-dynamodb-i1"><rect class="tech-dynamodb-card" x="20" y="20" width="30" height="40" rx="8"/><circle class="tech-dynamodb-acc" cx="30" cy="36" r="5"/><circle class="tech-dynamodb-acc" cx="40" cy="36" r="5"/><rect class="tech-dynamodb-lf" x="26" y="48" width="18" height="5" rx="2"/></g>
<g class="tech-dynamodb-i2"><rect class="tech-dynamodb-card" x="56" y="20" width="30" height="40" rx="8"/><circle class="tech-dynamodb-acc" cx="66" cy="36" r="5"/><circle class="tech-dynamodb-acc" cx="76" cy="36" r="5"/><rect class="tech-dynamodb-lf" x="62" y="48" width="18" height="5" rx="2"/></g>
<circle class="tech-dynamodb-mf" cx="144" cy="24" r="8"/><path class="tech-dynamodb-mf" d="M129 58 a15 15 0 0 1 30 0z"/>

<circle class="tech-dynamodb-mf" cx="178" cy="24" r="8"/><path class="tech-dynamodb-mf" d="M163 58 a15 15 0 0 1 30 0z"/>

<circle class="tech-dynamodb-mf" cx="212" cy="24" r="8"/><path class="tech-dynamodb-mf" d="M197 58 a15 15 0 0 1 30 0z"/>

<g class="tech-dynamodb-o1"><path class="tech-dynamodb-sg" style="stroke-width:3" d="M136 78 l5 5 l10 -11"/></g><g class="tech-dynamodb-o2"><path class="tech-dynamodb-sg" style="stroke-width:3" d="M170 78 l5 5 l10 -11"/></g><g class="tech-dynamodb-o3"><path class="tech-dynamodb-sb" style="stroke-width:3" d="M211 76 l14 14 m0 -14 l-14 14"/></g>
<g class="tech-dynamodb-c2"><text class="tech-dynamodb-w" x="54" y="100" font-size="20" font-weight="700" text-anchor="middle">2 left</text>
</g><g class="tech-dynamodb-c1"><text class="tech-dynamodb-w" x="54" y="100" font-size="20" font-weight="700" text-anchor="middle">1 left</text>
</g><g class="tech-dynamodb-c0"><text class="tech-dynamodb-b" x="54" y="100" font-size="20" font-weight="700" text-anchor="middle">Sold out</text>
</g>
</svg>
