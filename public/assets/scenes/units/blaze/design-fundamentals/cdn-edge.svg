<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" role="img" aria-label="One copy of episode 8 travels to each city, then viewers there play it from nearby">
<style>
.cdn-edge-t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-ink,#102a33)}
.cdn-edge-b{font-weight:700}
.cdn-edge-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.cdn-edge-soft{fill:var(--scene-accent-soft,#dcefed)}
.cdn-edge-acc{fill:var(--scene-accent,#006c73)}
.cdn-edge-good{fill:var(--scene-good,#1f7a4d)}
.cdn-edge-track{fill:var(--scene-line,#cfdfdc)}
.cdn-edge-ln{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:2}
.cdn-edge-dash{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:2;stroke-dasharray:4 4}
@media (prefers-reduced-motion:reduce){[class*="cdn-edge-a"]{animation-play-state:paused!important}}
.cdn-edge-acopy0{animation:cdn-edge-copy0 8s infinite;animation-delay:-3s;}
@keyframes cdn-edge-copy0{0%,0%{transform:translate(0,0);opacity:0}0.5%{transform:translate(0,0);opacity:1}12%,13%{transform:translate(-80px,26px);opacity:1}17%,100%{transform:translate(-80px,26px);opacity:0}}
.cdn-edge-aedge0{animation:cdn-edge-edge0 8s infinite;animation-delay:-3s;}
@keyframes cdn-edge-edge0{0%,12%{opacity:0}14%,95%{opacity:1}100%{opacity:0}}
.cdn-edge-acopy1{animation:cdn-edge-copy1 8s infinite;animation-delay:-3s;}
@keyframes cdn-edge-copy1{0%,4%{transform:translate(0,0);opacity:0}4.5%{transform:translate(0,0);opacity:1}16%,17%{transform:translate(0px,26px);opacity:1}21%,100%{transform:translate(0px,26px);opacity:0}}
.cdn-edge-aedge1{animation:cdn-edge-edge1 8s infinite;animation-delay:-3s;}
@keyframes cdn-edge-edge1{0%,16%{opacity:0}18%,95%{opacity:1}100%{opacity:0}}
.cdn-edge-acopy2{animation:cdn-edge-copy2 8s infinite;animation-delay:-3s;}
@keyframes cdn-edge-copy2{0%,8%{transform:translate(0,0);opacity:0}8.5%{transform:translate(0,0);opacity:1}20%,21%{transform:translate(80px,26px);opacity:1}25%,100%{transform:translate(80px,26px);opacity:0}}
.cdn-edge-aedge2{animation:cdn-edge-edge2 8s infinite;animation-delay:-3s;}
@keyframes cdn-edge-edge2{0%,20%{opacity:0}22%,95%{opacity:1}100%{opacity:0}}
.cdn-edge-aplay{animation:cdn-edge-play 8s infinite;animation-delay:-3s;transform-box:fill-box;transform-origin:left center;}
@keyframes cdn-edge-play{0%,24%{transform:scaleX(0)}95%{transform:scaleX(1)}100%{transform:scaleX(0)}}
</style>
<rect x="86" y="4" width="68" height="26" rx="7" class="cdn-edge-box" style="stroke:var(--scene-accent,#006c73);stroke-width:2"/>
<text class="cdn-edge-t cdn-edge-b" x="120" y="23" font-size="14" text-anchor="middle">1 copy</text>
