<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" class="multi-step-processes-root" role="img" aria-label="A trip holds a flight and a hotel, the car fails, so both holds are released and the card is never charged.">
<style>
.multi-step-processes-root text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.multi-step-processes-t{fill:var(--scene-ink,#102a33)}
.multi-step-processes-tx{fill:var(--scene-text,#28434a)}
.multi-step-processes-mut{fill:var(--scene-muted,#536970)}
.multi-step-processes-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.multi-step-processes-soft{fill:var(--scene-accent-soft,#dcefed)}
.multi-step-processes-acc{fill:var(--scene-accent,#006c73)}
.multi-step-processes-ln{fill:var(--scene-line,#cfdfdc)}
.multi-step-processes-cardf{fill:var(--scene-card,#fff)}
.multi-step-processes-good{fill:var(--scene-good,#1f7a4d)}
.multi-step-processes-warn{fill:var(--scene-warn,#a15c00)}
.multi-step-processes-bad{fill:var(--scene-bad,#b3261e)}
.multi-step-processes-link{fill:var(--scene-link,#245a88)}
.multi-step-processes-out{fill:var(--scene-bubble-out,#d4ecea)}
.multi-step-processes-sk{fill:none;stroke:var(--scene-muted,#536970);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.multi-step-processes-sa{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.multi-step-processes-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:1.5;stroke-dasharray:3 3}
.multi-step-processes-badrow{fill:var(--scene-bad,#b3261e);fill-opacity:.2;animation:multi-step-processes-carfail 7s -3s infinite}
.multi-step-processes-fh{animation:multi-step-processes-fh 7s -3s infinite}.multi-step-processes-fr{animation:multi-step-processes-fr 7s -3s infinite}.multi-step-processes-hh{animation:multi-step-processes-hh 7s -3s infinite}.multi-step-processes-hr{animation:multi-step-processes-hr 7s -3s infinite}
.multi-step-processes-cc{animation:multi-step-processes-cc 7s -3s infinite}.multi-step-processes-cf{animation:multi-step-processes-carfail 7s -3s infinite}.multi-step-processes-wait{animation:multi-step-processes-wait 7s -3s infinite}.multi-step-processes-done{animation:multi-step-processes-done 7s -3s infinite}
@keyframes multi-step-processes-fh{0%,3%{opacity:0}5%,31%{opacity:1}33%,100%{opacity:0}}
@keyframes multi-step-processes-fr{0%,31%{opacity:0}33%,96%{opacity:1}100%{opacity:0}}
@keyframes multi-step-processes-hh{0%,10%{opacity:0}12%,35%{opacity:1}37%,100%{opacity:0}}
@keyframes multi-step-processes-hr{0%,35%{opacity:0}37%,96%{opacity:1}100%{opacity:0}}
@keyframes multi-step-processes-cc{0%,15%{opacity:0}17%,25%{opacity:1}27%,100%{opacity:0}}
@keyframes multi-step-processes-carfail{0%,25%{opacity:0}27%,96%{opacity:1}100%{opacity:0}}
@keyframes multi-step-processes-wait{0%,38%{opacity:1}40%,100%{opacity:0}}
@keyframes multi-step-processes-done{0%,38%{opacity:0}41%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.multi-step-processes-root *{animation-play-state:paused!important}}
</style>
<rect x="6" y="8" width="140" height="34" rx="9" class="multi-step-processes-soft"/>
<g transform="translate(14 15)" class="multi-step-processes-sk" style="stroke:var(--scene-text,#28434a);stroke-width:1.8"><path d="M2 10 H20 M12 2 L16 10 L12 18 M4 6 L5 10 L4 14"/></g><rect x="6" y="50" width="140" height="34" rx="9" class="multi-step-processes-soft"/>
<g transform="translate(14 57)" class="multi-step-processes-sk" style="stroke:var(--scene-text,#28434a);stroke-width:1.8"><path d="M3 2 H17 V18 H3 Z M7 7 V9 M13 7 V9 M7 13 V15 M13 13 V15"/></g><rect x="6" y="92" width="140" height="34" rx="9" class="multi-step-processes-soft"/>
<g transform="translate(14 99)" class="multi-step-processes-sk" style="stroke:var(--scene-text,#28434a);stroke-width:1.8"><path d="M2 14 V9 L5 3 H15 L18 9 V14 Z"/><circle cx="6" cy="16" r="2"/><circle cx="14" cy="16" r="2"/></g>
<rect x="6" y="92" width="140" height="34" rx="9" class="multi-step-processes-badrow"/>
<text x="138" y="31" font-size="14" font-weight="700" text-anchor="end" class="multi-step-processes-good multi-step-processes-fh">held &#10003;</text>
<text x="138" y="31" font-size="14" text-anchor="end" class="multi-step-processes-warn multi-step-processes-fr">&#8634; released</text>
<text x="138" y="73" font-size="14" font-weight="700" text-anchor="end" class="multi-step-processes-good multi-step-processes-hh">held &#10003;</text>
<text x="138" y="73" font-size="14" text-anchor="end" class="multi-step-processes-warn multi-step-processes-hr">&#8634; released</text>
<text x="138" y="115" font-size="14" text-anchor="end" class="multi-step-processes-mut multi-step-processes-cc">checking&#8230;</text>
<text x="138" y="115" font-size="14" font-weight="700" text-anchor="end" class="multi-step-processes-bad multi-step-processes-cf">no car &#10007;</text>
<rect x="158" y="14" width="76" height="50" rx="8" class="multi-step-processes-acc"/>
<rect x="166" y="22" width="16" height="12" rx="2" class="multi-step-processes-cardf" opacity=".55"/>
<text x="226" y="55" font-size="16" font-weight="700" text-anchor="end" class="multi-step-processes-cardf">$823</text>
<g class="multi-step-processes-wait"><circle cx="196" cy="100" r="3" class="multi-step-processes-mut"/><circle cx="196" cy="100" r="3" class="multi-step-processes-mut" opacity=".5"/><path d="M180 100 h32" class="multi-step-processes-sl"/></g>
<g class="multi-step-processes-done"><text x="196" y="94" font-size="14" font-weight="700" text-anchor="middle" class="multi-step-processes-good">Not charged</text><path d="M182 108 l8 8 l16 -16" class="multi-step-processes-sa" style="stroke:var(--scene-good,#1f7a4d);stroke-width:3"/></g>
</svg>
