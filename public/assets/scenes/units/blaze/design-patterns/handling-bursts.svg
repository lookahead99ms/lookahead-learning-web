<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" class="handling-bursts-root" role="img" aria-label="A huge sale email blast is held back behind a limit while a single password reset slips through to the inbox in two seconds.">
<style>
.handling-bursts-root text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.handling-bursts-t{fill:var(--scene-ink,#102a33)}
.handling-bursts-tx{fill:var(--scene-text,#28434a)}
.handling-bursts-mut{fill:var(--scene-muted,#536970)}
.handling-bursts-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.handling-bursts-soft{fill:var(--scene-accent-soft,#dcefed)}
.handling-bursts-acc{fill:var(--scene-accent,#006c73)}
.handling-bursts-ln{fill:var(--scene-line,#cfdfdc)}
.handling-bursts-cardf{fill:var(--scene-card,#fff)}
.handling-bursts-good{fill:var(--scene-good,#1f7a4d)}
.handling-bursts-warn{fill:var(--scene-warn,#a15c00)}
.handling-bursts-bad{fill:var(--scene-bad,#b3261e)}
.handling-bursts-link{fill:var(--scene-link,#245a88)}
.handling-bursts-out{fill:var(--scene-bubble-out,#d4ecea)}
.handling-bursts-sk{fill:none;stroke:var(--scene-muted,#536970);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.handling-bursts-sa{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.handling-bursts-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:1.5;stroke-dasharray:3 3}
.handling-bursts-go{animation:handling-bursts-go 2s linear infinite}
@keyframes handling-bursts-go{0%{transform:translateX(0);opacity:1}70%{transform:translateX(24px);opacity:1}85%,100%{transform:translateX(30px);opacity:0}}
.handling-bursts-g1{animation-delay:-3s}.handling-bursts-g2{animation-delay:-3.7s}.handling-bursts-g3{animation-delay:-4.4s}
.handling-bursts-rs{animation:handling-bursts-rs 6s -3s infinite}
@keyframes handling-bursts-rs{0%,4%{transform:translateX(0);opacity:0}8%{opacity:1}30%{transform:translateX(100px);opacity:1}36%,100%{transform:translateX(116px);opacity:0}}
.handling-bursts-rs2{animation-delay:-1.2s}
.handling-bursts-row{animation:handling-bursts-row 6s -3s infinite}
@keyframes handling-bursts-row{0%,33%{opacity:0}37%,95%{opacity:1}100%{opacity:0}}
.handling-bursts-rej{animation:handling-bursts-rej 6s -3s infinite}
@keyframes handling-bursts-rej{0%,30%{transform:translateX(0);opacity:0}34%{opacity:1}42%{transform:translateX(20px)}52%,80%{transform:translateX(-2px);opacity:1}88%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.handling-bursts-root *{animation-play-state:paused!important}}
</style>
<rect x="6" y="10" width="124" height="38" rx="19" class="handling-bursts-box"/>
<g transform="translate(14 23)"><rect width="18" height="12" rx="2" class="handling-bursts-box"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g><g transform="translate(34 23)"><rect width="18" height="12" rx="2" class="handling-bursts-box"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g><g transform="translate(54 23)"><rect width="18" height="12" rx="2" class="handling-bursts-box"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g><g transform="translate(74 23)"><rect width="18" height="12" rx="2" class="handling-bursts-box"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g><g transform="translate(94 23)"><rect width="18" height="12" rx="2" class="handling-bursts-box"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g>
<rect x="118" y="6" width="4" height="46" rx="2" class="handling-bursts-warn"/>
<g class="handling-bursts-go handling-bursts-g1"><g transform="translate(110 23)"><rect width="18" height="12" rx="2" class="handling-bursts-out"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g></g><g class="handling-bursts-go handling-bursts-g2"><g transform="translate(110 23)"><rect width="18" height="12" rx="2" class="handling-bursts-out"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g></g><g class="handling-bursts-go handling-bursts-g3"><g transform="translate(110 23)"><rect width="18" height="12" rx="2" class="handling-bursts-out"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g></g>
<g class="handling-bursts-rej"><g transform="translate(14 56)"><rect width="18" height="12" rx="2" class="handling-bursts-box"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g><rect x="14" y="56" width="18" height="12" rx="2" fill="none" stroke="var(--scene-bad,#b3261e)" stroke-width="1.8"/></g>
<text x="8" y="82" font-size="13" font-weight="700" class="handling-bursts-bad">429 &#215;</text>
<rect x="6" y="94" width="124" height="28" rx="14" class="handling-bursts-box"/>
<g class="handling-bursts-rs"><g transform="translate(14 102)"><rect width="18" height="12" rx="2" class="handling-bursts-acc"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g></g><g class="handling-bursts-rs handling-bursts-rs2"><g transform="translate(14 102)"><rect width="18" height="12" rx="2" class="handling-bursts-acc"/><path d="M1.5 2 L9 7.5 L16.5 2" class="handling-bursts-sk" style="stroke-width:1.2"/></g></g>
<rect x="150" y="8" width="84" height="116" rx="12" class="handling-bursts-box"/>
<circle cx="170" cy="28" r="7" class="handling-bursts-ln"/><rect x="182" y="24" width="40" height="8" rx="4" class="handling-bursts-ln"/>
<g class="handling-bursts-row"><rect x="158" y="44" width="68" height="30" rx="7" class="handling-bursts-soft"/><text x="192" y="65" font-size="14" font-weight="700" text-anchor="middle" class="handling-bursts-good">2 s &#10003;</text></g>
<rect x="158" y="80" width="68" height="14" rx="6" class="handling-bursts-out"/><rect x="158" y="100" width="68" height="14" rx="6" class="handling-bursts-out"/>
<path d="M130 109 H150" class="handling-bursts-sa"/>
</svg>
