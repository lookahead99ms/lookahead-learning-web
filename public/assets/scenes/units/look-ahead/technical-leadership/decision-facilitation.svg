<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Options scored on shared criteria, one chosen, dissent noted, review date set"><style>.look-ahead-technical-leadership-decision-facilitation-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.look-ahead-technical-leadership-decision-facilitation-bg{fill:var(--scene-card,#fff)}.look-ahead-technical-leadership-decision-facilitation-opt{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:2}
.look-ahead-technical-leadership-decision-facilitation-win{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-good,#1f7a4d);stroke-width:3;animation:look-ahead-technical-leadership-decision-facilitation-pick 6s ease-in-out infinite -3s}
.look-ahead-technical-leadership-decision-facilitation-tick{fill:none;stroke:var(--scene-good,#1f7a4d);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;animation:look-ahead-technical-leadership-decision-facilitation-draw 6s ease-in-out infinite}
.look-ahead-technical-leadership-decision-facilitation-flag{fill:var(--scene-warn,#a15c00)}
.look-ahead-technical-leadership-decision-facilitation-stamp{animation:look-ahead-technical-leadership-decision-facilitation-stamp 6s ease-in-out infinite -3s;transform-origin:250px 62px}
.look-ahead-technical-leadership-decision-facilitation-bar{fill:var(--scene-line,#cfdfdc)}
@keyframes look-ahead-technical-leadership-decision-facilitation-draw{0%,10%{stroke-dashoffset:20}35%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:20}}
@keyframes look-ahead-technical-leadership-decision-facilitation-pick{0%,30%{stroke:var(--scene-line,#cfdfdc)}45%,90%{stroke:var(--scene-good,#1f7a4d)}100%{stroke:var(--scene-line,#cfdfdc)}}
@keyframes look-ahead-technical-leadership-decision-facilitation-stamp{0%,40%{opacity:0;transform:scale(1.6)}55%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}</style><rect class="look-ahead-technical-leadership-decision-facilitation-bg" width="320" height="180"/>
