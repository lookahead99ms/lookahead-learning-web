<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A winding roadmap from now through next to later, with branching options and fog ahead"><style>.look-ahead-technical-leadership-strategy-roadmaps-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.look-ahead-technical-leadership-strategy-roadmaps-bg{fill:var(--scene-card,#fff)}.look-ahead-technical-leadership-strategy-roadmaps-dot{animation:look-ahead-technical-leadership-strategy-roadmaps-go 7s ease-in-out infinite -3s}
.look-ahead-technical-leadership-strategy-roadmaps-fog{animation:look-ahead-technical-leadership-strategy-roadmaps-fog 7s ease-in-out infinite -3s}
@keyframes look-ahead-technical-leadership-strategy-roadmaps-go{0%{transform:translate(0,0)}100%{transform:translate(0,0)}}
@keyframes look-ahead-technical-leadership-strategy-roadmaps-fog{0%,100%{opacity:.55}50%{opacity:.85}}
@keyframes look-ahead-technical-leadership-strategy-roadmaps-walk{0%{offset-distance:0%}100%{offset-distance:100%}}
.look-ahead-technical-leadership-strategy-roadmaps-walker{offset-path:path("M30 130 C80 130 90 70 140 80 S210 120 250 60");animation:look-ahead-technical-leadership-strategy-roadmaps-walk 7s linear infinite -3s}</style><rect class="look-ahead-technical-leadership-strategy-roadmaps-bg" width="320" height="180"/>
<path d="M30 130 C80 130 90 70 140 80 S210 120 250 60" fill="none" stroke="var(--scene-line,#cfdfdc)" stroke-width="12" stroke-linecap="round"/>
