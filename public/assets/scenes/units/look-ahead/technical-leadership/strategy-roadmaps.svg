<path d="M140 80 C160 50 180 40 200 36" fill="none" stroke="var(--scene-muted,#536970)" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/>
<circle cx="200" cy="36" r="6" fill="var(--scene-card,#fff)" stroke="var(--scene-muted,#536970)" stroke-width="3"/>
<circle cx="30" cy="130" r="9" fill="var(--scene-learn,#0f8a8a)"/><circle cx="140" cy="80" r="9" fill="var(--scene-ahead,#2f6fb3)"/>
