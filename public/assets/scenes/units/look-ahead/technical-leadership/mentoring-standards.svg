<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A senior engineer reviews a junior's change and leaves teaching comments"><style>.look-ahead-technical-leadership-mentoring-standards-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.look-ahead-technical-leadership-mentoring-standards-bg{fill:var(--scene-card,#fff)}.look-ahead-technical-leadership-mentoring-standards-c1{animation:look-ahead-technical-leadership-mentoring-standards-pop 6s ease-in-out infinite -3s;transform-origin:230px 40px}
.look-ahead-technical-leadership-mentoring-standards-c2{animation:look-ahead-technical-leadership-mentoring-standards-pop 6s ease-in-out infinite -1s;transform-origin:230px 100px}
.look-ahead-technical-leadership-mentoring-standards-tick{fill:none;stroke:var(--scene-good,#1f7a4d);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;animation:look-ahead-technical-leadership-mentoring-standards-draw 6s ease-in-out infinite -3s}
.look-ahead-technical-leadership-mentoring-standards-bar{fill:var(--scene-line,#cfdfdc)}
@keyframes look-ahead-technical-leadership-mentoring-standards-pop{0%,5%{opacity:0;transform:scale(.6)}20%,85%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes look-ahead-technical-leadership-mentoring-standards-draw{0%,40%{stroke-dashoffset:30}60%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:30}}</style><rect class="look-ahead-technical-leadership-mentoring-standards-bg" width="320" height="180"/>
<rect x="104" y="14" width="96" height="124" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2.5"/>
<rect class="look-ahead-technical-leadership-mentoring-standards-bar" x="116" y="28" width="60" height="8" rx="4"/><rect x="116" y="46" width="72" height="8" rx="4" fill="var(--scene-ahead,#2f6fb3)" opacity=".5"/><rect class="look-ahead-technical-leadership-mentoring-standards-bar" x="116" y="64" width="48" height="8" rx="4"/><rect x="116" y="82" width="66" height="8" rx="4" fill="var(--scene-bad,#b3261e)" opacity=".45"/><rect class="look-ahead-technical-leadership-mentoring-standards-bar" x="116" y="100" width="54" height="8" rx="4"/>
<path class="look-ahead-technical-leadership-mentoring-standards-tick" d="M150 112 l9 9 18-20" style="display:none"/>
