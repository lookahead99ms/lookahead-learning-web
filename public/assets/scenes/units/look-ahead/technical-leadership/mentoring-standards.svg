<g class="look-ahead-technical-leadership-mentoring-standards-c2"><rect x="206" y="82" width="102" height="34" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-grow,#b8457a)" stroke-width="2"/><text class="look-ahead-technical-leadership-mentoring-standards-t" x="257" y="104" text-anchor="middle">Try this</text></g>
