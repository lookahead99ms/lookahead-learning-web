<circle cx="292" cy="50" r="13" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-learn,#0f8a8a)" stroke-width="2.5" class="look-ahead-behavioral-carl-carl-foundations-bulb"/>
<path class="look-ahead-behavioral-carl-carl-foundations-g" d="M287 62h10M292 57v10" style="stroke:var(--scene-learn,#0f8a8a)"/>
