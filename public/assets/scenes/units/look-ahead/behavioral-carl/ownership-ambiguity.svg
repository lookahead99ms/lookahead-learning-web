<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="ownership-ambiguity">
<style>
.look-ahead-behavioral-carl-ownership-ambiguity-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.look-ahead-behavioral-carl-ownership-ambiguity-tc{text-anchor:middle}

.look-ahead-behavioral-carl-ownership-ambiguity-me{animation:look-ahead-behavioral-carl-ownership-ambiguity-mv 6s infinite -2.4s}
@keyframes look-ahead-behavioral-carl-ownership-ambiguity-mv{0%,12%{transform:translateX(0)}30%,50%{transform:translateX(128px)}70%,100%{transform:translateX(0)}}
.look-ahead-behavioral-carl-ownership-ambiguity-gear{transform-box:fill-box;transform-origin:center;animation:look-ahead-behavioral-carl-ownership-ambiguity-sp 6s infinite -2.4s}
@keyframes look-ahead-behavioral-carl-ownership-ambiguity-sp{0%,40%{transform:rotate(0)}}
.look-ahead-behavioral-carl-ownership-ambiguity-bad{animation:look-ahead-behavioral-carl-ownership-ambiguity-b 6s infinite -2.4s}.look-ahead-behavioral-carl-ownership-ambiguity-good{animation:look-ahead-behavioral-carl-ownership-ambiguity-g 6s infinite -2.4s}
@keyframes look-ahead-behavioral-carl-ownership-ambiguity-b{0%,55%{opacity:1}65%,100%{opacity:0}}
@keyframes look-ahead-behavioral-carl-ownership-ambiguity-g{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}
.look-ahead-behavioral-carl-ownership-ambiguity-pulse{transform-box:fill-box;transform-origin:center;animation:look-ahead-behavioral-carl-ownership-ambiguity-pl 1.4s ease-in-out infinite}
@keyframes look-ahead-behavioral-carl-ownership-ambiguity-pl{50%{transform:scale(1.15)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
