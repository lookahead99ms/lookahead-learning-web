<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="scenario-bank">
<style>
.look-ahead-behavioral-carl-scenario-bank-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.look-ahead-behavioral-carl-scenario-bank-tc{text-anchor:middle}

.look-ahead-behavioral-carl-scenario-bank-c{animation:look-ahead-behavioral-carl-scenario-bank-pick 6s infinite;animation-delay:var(--d);transform-box:fill-box;transform-origin:bottom center}
@keyframes look-ahead-behavioral-carl-scenario-bank-pick{0%,10%{transform:translateY(0)}18%,34%{transform:translateY(-14px)}42%,100%{transform:translateY(0)}}
.look-ahead-behavioral-carl-scenario-bank-mag{animation:look-ahead-behavioral-carl-scenario-bank-sweep 6s infinite -3s}
@keyframes look-ahead-behavioral-carl-scenario-bank-sweep{0%{transform:translateX(-96px)}18%,34%{transform:translateX(-96px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="320" height="180" rx="10" fill="var(--scene-card,#fff)"/>

<g>
<g class="look-ahead-behavioral-carl-scenario-bank-c" style="--d:-2.5s"><rect x="40" y="58" width="42" height="64" rx="5" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/><rect x="48" y="68" width="26" height="6" rx="3" fill="var(--scene-accent,#006c73)"/><rect x="48" y="82" width="26" height="4" rx="2" fill="var(--scene-muted,#536970)"/></g>
<g class="look-ahead-behavioral-carl-scenario-bank-c" style="--d:-4s"><rect x="92" y="58" width="42" height="64" rx="5" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-link,#245a88)" stroke-width="2"/><rect x="100" y="68" width="26" height="6" rx="3" fill="var(--scene-link,#245a88)"/><rect x="100" y="82" width="26" height="4" rx="2" fill="var(--scene-muted,#536970)"/></g>
<g class="look-ahead-behavioral-carl-scenario-bank-c" style="--d:-5.5s"><rect x="144" y="58" width="42" height="64" rx="5" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2"/><rect x="152" y="68" width="26" height="6" rx="3" fill="var(--scene-good,#1f7a4d)"/><rect x="152" y="82" width="26" height="4" rx="2" fill="var(--scene-muted,#536970)"/></g>
<g class="look-ahead-behavioral-carl-scenario-bank-c" style="--d:-1s"><rect x="196" y="58" width="42" height="64" rx="5" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-grow,#b8457a)" stroke-width="2"/><rect x="204" y="68" width="26" height="6" rx="3" fill="var(--scene-grow,#b8457a)"/><rect x="204" y="82" width="26" height="4" rx="2" fill="var(--scene-muted,#536970)"/></g>
<g class="look-ahead-behavioral-carl-scenario-bank-c" style="--d:-3s"><rect x="248" y="58" width="42" height="64" rx="5" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-warn,#a15c00)" stroke-width="2"/><rect x="256" y="68" width="26" height="6" rx="3" fill="var(--scene-warn,#a15c00)"/><rect x="256" y="82" width="26" height="4" rx="2" fill="var(--scene-muted,#536970)"/></g>
<rect x="28" y="122" width="274" height="8" rx="4" fill="var(--scene-ink,#102a33)"/>
<g class="look-ahead-behavioral-carl-scenario-bank-mag"><circle cx="262" cy="30" r="11" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="3"/><path d="M270 38l9 9" stroke="var(--scene-ink,#102a33)" stroke-width="3.5" stroke-linecap="round"/></g>
<text class="look-ahead-behavioral-carl-scenario-bank-t" x="28" y="158">Five stories, fast</text>
</g>
</svg>
