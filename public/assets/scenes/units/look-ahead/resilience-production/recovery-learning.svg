<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Rollback is blocked by new-format data, so roll forward and repair">
<style>
.look-ahead-resilience-production-recovery-learning-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.look-ahead-resilience-production-recovery-learning-back{animation:look-ahead-resilience-production-recovery-learning-bump 4s ease-in-out infinite;animation-delay:-3s}
.look-ahead-resilience-production-recovery-learning-fwd{stroke-dasharray:6 6;animation:look-ahead-resilience-production-recovery-learning-dash 1s linear infinite;animation-delay:-.3s}
.look-ahead-resilience-production-recovery-learning-fix{animation:look-ahead-resilience-production-recovery-learning-heal 6s ease-in-out infinite;animation-delay:-3s}
.look-ahead-resilience-production-recovery-learning-ck{stroke-dasharray:30;animation:look-ahead-resilience-production-recovery-learning-draw 6s ease-out infinite;animation-delay:-3s}
@keyframes look-ahead-resilience-production-recovery-learning-bump{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
@keyframes look-ahead-resilience-production-recovery-learning-dash{to{stroke-dashoffset:-12}}
@keyframes look-ahead-resilience-production-recovery-learning-heal{0%,25%{fill:var(--scene-bad,#b3261e)}55%,100%{fill:var(--scene-good,#1f7a4d)}}
@keyframes look-ahead-resilience-production-recovery-learning-draw{0%,40%{stroke-dashoffset:30}60%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:30}}
</style>
<rect width="320" height="180" rx="10" fill="var(--scene-card,#fff)"/>
<g>
<rect x="125" y="46" width="70" height="78" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<rect x="135" y="56" width="50" height="12" rx="4" fill="var(--scene-ahead,#2f6fb3)"/>
<rect x="135" y="74" width="50" height="12" rx="4" fill="var(--scene-ahead,#2f6fb3)"/>
<rect x="135" y="92" width="50" height="12" rx="4" fill="var(--scene-bad,#b3261e)" class="look-ahead-resilience-production-recovery-learning-fix"/>
<rect x="135" y="108" width="50" height="10" rx="4" fill="var(--scene-bad,#b3261e)" class="look-ahead-resilience-production-recovery-learning-fix"/>
</g>
<g class="look-ahead-resilience-production-recovery-learning-back">
<path d="M112 36 H50 V80" fill="none" stroke="var(--scene-warn,#a15c00)" stroke-width="4" stroke-linecap="round"/>
<path d="M40 74 L50 88 L60 74Z" fill="var(--scene-warn,#a15c00)"/></g>
<circle cx="50" cy="108" r="16" fill="var(--scene-bad,#b3261e)"/>
<path d="M43 101 L57 115 M57 101 L43 115" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="60" y="146" text-anchor="middle" class="look-ahead-resilience-production-recovery-learning-t">Blocked</text>
<path d="M200 85 H258" stroke="var(--scene-good,#1f7a4d)" stroke-width="5" stroke-linecap="round" class="look-ahead-resilience-production-recovery-learning-fwd"/>
<path d="M256 74 L270 85 L256 96Z" fill="var(--scene-good,#1f7a4d)"/>
<circle cx="290" cy="85" r="16" fill="var(--scene-good,#1f7a4d)" opacity=".15"/>
<path d="M282 85 L288 92 L299 78" fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="look-ahead-resilience-production-recovery-learning-ck"/>
<text x="250" y="124" text-anchor="middle" class="look-ahead-resilience-production-recovery-learning-t">Roll forward</text>
</svg>
