<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Circuit opens to isolate a slow dependency while checkout keeps flowing">
<style>
.look-ahead-resilience-production-failure-containment-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.look-ahead-resilience-production-failure-containment-a{animation:look-ahead-resilience-production-failure-containment-go 6s linear infinite;animation-delay:-3s}
.look-ahead-resilience-production-failure-containment-b{animation:look-ahead-resilience-production-failure-containment-go 6s linear infinite;animation-delay:-5s}
.look-ahead-resilience-production-failure-containment-c{animation:look-ahead-resilience-production-failure-containment-go 6s linear infinite;animation-delay:-1s}
.look-ahead-resilience-production-failure-containment-x{animation:look-ahead-resilience-production-failure-containment-bounce 3s ease-in infinite;animation-delay:-1.4s}
.look-ahead-resilience-production-failure-containment-y{animation:look-ahead-resilience-production-failure-containment-bounce 3s ease-in infinite;animation-delay:-0.2s}
.look-ahead-resilience-production-failure-containment-sw{transform-origin:120px 56px;animation:look-ahead-resilience-production-failure-containment-open 6s ease-in-out infinite;animation-delay:-3s}
.look-ahead-resilience-production-failure-containment-s{animation:look-ahead-resilience-production-failure-containment-slow 2s ease-in-out infinite;animation-delay:-1s;transform-origin:262px 56px}
@keyframes look-ahead-resilience-production-failure-containment-go{0%{transform:translateX(0)}100%{transform:translateX(250px)}}
@keyframes look-ahead-resilience-production-failure-containment-bounce{0%{transform:translateX(0);opacity:1}60%{transform:translateX(26px);opacity:1}100%{transform:translateX(0);opacity:.2}}
@keyframes look-ahead-resilience-production-failure-containment-open{0%,15%{transform:rotate(0)}30%,100%{transform:rotate(-28deg)}}
@keyframes look-ahead-resilience-production-failure-containment-slow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style>
<rect width="320" height="180" rx="10" fill="var(--scene-card,#fff)"/>
<text x="14" y="22" class="look-ahead-resilience-production-failure-containment-t">Circuit open</text>
<rect x="14" y="46" width="190" height="20" rx="10" fill="var(--scene-accent-soft,#dcefed)"/>
<rect x="228" y="34" width="60" height="44" rx="8" fill="var(--scene-bad,#b3261e)" class="look-ahead-resilience-production-failure-containment-s"/>
<text x="258" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">8 s</text>
<line x1="204" y1="56" x2="228" y2="56" stroke="var(--scene-line,#cfdfdc)" stroke-width="4" stroke-dasharray="3 4"/>
<circle cx="120" cy="56" r="5" fill="var(--scene-ink,#102a33)"/>
<line x1="120" y1="56" x2="150" y2="56" stroke="var(--scene-warn,#a15c00)" stroke-width="5" stroke-linecap="round" class="look-ahead-resilience-production-failure-containment-sw"/>
<circle cx="150" cy="56" r="5" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<g transform="translate(14,56)"><circle r="5" fill="var(--scene-warn,#a15c00)" class="look-ahead-resilience-production-failure-containment-x"/></g>
<g transform="translate(40,56)"><circle r="5" fill="var(--scene-warn,#a15c00)" class="look-ahead-resilience-production-failure-containment-y"/></g>
<text x="14" y="108" class="look-ahead-resilience-production-failure-containment-t">Checkout flows</text>
<rect x="14" y="120" width="290" height="24" rx="12" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2"/>
<g transform="translate(20,132)"><circle r="7" fill="var(--scene-good,#1f7a4d)" class="look-ahead-resilience-production-failure-containment-a" style="transform-box:fill-box"/></g>
<g transform="translate(20,132)"><circle r="7" fill="var(--scene-good,#1f7a4d)" class="look-ahead-resilience-production-failure-containment-b"/></g>
<g transform="translate(20,132)"><circle r="7" fill="var(--scene-good,#1f7a4d)" class="look-ahead-resilience-production-failure-containment-c"/></g>
</svg>
