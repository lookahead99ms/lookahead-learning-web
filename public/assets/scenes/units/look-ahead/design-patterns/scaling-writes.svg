<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" class="scaling-writes-root" role="img" aria-label="Likes pour onto a viral video; each like lands in one of 16 slots and the count shown is the sum of the slots, rising every second.">
<style>
.scaling-writes-root text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.scaling-writes-t{fill:var(--scene-ink,#102a33)}
.scaling-writes-tx{fill:var(--scene-text,#28434a)}
.scaling-writes-mut{fill:var(--scene-muted,#536970)}
.scaling-writes-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.scaling-writes-soft{fill:var(--scene-accent-soft,#dcefed)}
.scaling-writes-acc{fill:var(--scene-accent,#006c73)}
.scaling-writes-ln{fill:var(--scene-line,#cfdfdc)}
.scaling-writes-cardf{fill:var(--scene-card,#fff)}
.scaling-writes-good{fill:var(--scene-good,#1f7a4d)}
.scaling-writes-warn{fill:var(--scene-warn,#a15c00)}
.scaling-writes-bad{fill:var(--scene-bad,#b3261e)}
.scaling-writes-link{fill:var(--scene-link,#245a88)}
.scaling-writes-out{fill:var(--scene-bubble-out,#d4ecea)}
.scaling-writes-sk{fill:none;stroke:var(--scene-muted,#536970);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.scaling-writes-sa{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scaling-writes-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:1.5;stroke-dasharray:3 3}
.scaling-writes-thumb{fill:var(--scene-ink,#102a33);opacity:.85}
.scaling-writes-slot{fill:var(--scene-accent,#006c73);opacity:.75}
.scaling-writes-heart{fill:var(--scene-bad,#b3261e);animation:scaling-writes-drop 6s infinite}
.scaling-writes-c1{animation:scaling-writes-c1 6s -3s infinite}.scaling-writes-c2{animation:scaling-writes-c2 6s -3s infinite}.scaling-writes-c3{animation:scaling-writes-c3 6s -3s infinite}
@keyframes scaling-writes-drop{0%{opacity:0;transform:translateY(0)}3%{opacity:1}18%{opacity:1;transform:translateY(30px)}22%{opacity:0;transform:translateY(34px)}33%{opacity:0;transform:translateY(0)}36%{opacity:1}51%{opacity:1;transform:translateY(30px)}55%{opacity:0;transform:translateY(34px)}66%{opacity:0;transform:translateY(0)}69%{opacity:1}84%{opacity:1;transform:translateY(30px)}88%,100%{opacity:0;transform:translateY(34px)}}
@keyframes scaling-writes-c1{0%,32%{opacity:1}34%,100%{opacity:0}}
@keyframes scaling-writes-c2{0%,32%{opacity:0}34%,65%{opacity:1}67%,100%{opacity:0}}
@keyframes scaling-writes-c3{0%,65%{opacity:0}67%,98%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.scaling-writes-root *{animation-play-state:paused!important}}
</style>
