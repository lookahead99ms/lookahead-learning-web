<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" class="scaling-reads-root" role="img" aria-label="A breaking story is read 60,000 times a second; copies of the page answer almost every reader, so the database sees only 900 reads a second.">
<style>
.scaling-reads-root text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.scaling-reads-t{fill:var(--scene-ink,#102a33)}
.scaling-reads-tx{fill:var(--scene-text,#28434a)}
.scaling-reads-mut{fill:var(--scene-muted,#536970)}
.scaling-reads-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.scaling-reads-soft{fill:var(--scene-accent-soft,#dcefed)}
.scaling-reads-acc{fill:var(--scene-accent,#006c73)}
.scaling-reads-ln{fill:var(--scene-line,#cfdfdc)}
.scaling-reads-cardf{fill:var(--scene-card,#fff)}
.scaling-reads-good{fill:var(--scene-good,#1f7a4d)}
.scaling-reads-warn{fill:var(--scene-warn,#a15c00)}
.scaling-reads-bad{fill:var(--scene-bad,#b3261e)}
.scaling-reads-link{fill:var(--scene-link,#245a88)}
.scaling-reads-out{fill:var(--scene-bubble-out,#d4ecea)}
.scaling-reads-sk{fill:none;stroke:var(--scene-muted,#536970);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.scaling-reads-sa{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scaling-reads-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:1.5;stroke-dasharray:3 3}
.scaling-reads-copy{fill:var(--scene-card,#fff);stroke:var(--scene-accent,#006c73);stroke-width:1.5}
.scaling-reads-head{fill:var(--scene-bad,#b3261e)}
.scaling-reads-meter{fill:var(--scene-good,#1f7a4d)}
.scaling-reads-lit{fill:var(--scene-accent,#006c73);animation:scaling-reads-lit 6s infinite}
.scaling-reads-fly{fill:var(--scene-accent,#006c73);animation:scaling-reads-fly 6s infinite}
.scaling-reads-refresh{animation:scaling-reads-refresh 6s -3s infinite}
@keyframes scaling-reads-lit{0%{opacity:.12}4%,70%{opacity:1}78%,100%{opacity:.12}}
@keyframes scaling-reads-fly{0%{opacity:0;transform:translate(0,0)}3%{opacity:1}28%{opacity:1;transform:translate(52px,-32px)}31%{opacity:0;transform:translate(52px,-32px)}
33%{opacity:0;transform:translate(0,0)}36%{opacity:1}61%{opacity:1;transform:translate(52px,0)}64%{opacity:0;transform:translate(52px,0)}
66%{opacity:0;transform:translate(0,0)}69%{opacity:1}94%{opacity:1;transform:translate(52px,32px)}97%,100%{opacity:0;transform:translate(52px,32px)}}
@keyframes scaling-reads-refresh{0%,74%{opacity:0;transform:translate(0,0)}77%{opacity:1}92%{opacity:1;transform:translate(30px,0)}95%,100%{opacity:0;transform:translate(30px,0)}}
@media (prefers-reduced-motion: reduce){.scaling-reads-root *{animation-play-state:paused!important}}
</style>
<rect x="8" y="20" width="40" height="52" rx="5" class="scaling-reads-box"/>
<rect x="14" y="27" width="28" height="6" rx="2" class="scaling-reads-head"/>
<rect x="14" y="38" width="28" height="4" rx="2" class="scaling-reads-ln"/><rect x="14" y="46" width="22" height="4" rx="2" class="scaling-reads-ln"/><rect x="14" y="54" width="28" height="4" rx="2" class="scaling-reads-ln"/>
<text x="28" y="94" font-size="14" font-weight="700" text-anchor="middle" class="scaling-reads-t">900/s</text>
<rect x="8" y="102" width="40" height="6" rx="3" class="scaling-reads-ln"/><rect x="8" y="102" width="6" height="6" rx="3" class="scaling-reads-meter"/>
<rect x="96" y="30" width="38" height="50" rx="5" class="scaling-reads-copy"/>
<rect x="90" y="36" width="38" height="50" rx="5" class="scaling-reads-copy"/>
<rect x="84" y="42" width="38" height="50" rx="5" class="scaling-reads-copy"/>
<rect x="90" y="50" width="26" height="6" rx="2" class="scaling-reads-head"/><rect x="90" y="61" width="26" height="4" rx="2" class="scaling-reads-ln"/><rect x="90" y="69" width="20" height="4" rx="2" class="scaling-reads-ln"/><rect x="90" y="77" width="26" height="4" rx="2" class="scaling-reads-ln"/>
<g class="scaling-reads-refresh"><rect x="50" y="60" width="8" height="11" rx="2" class="scaling-reads-acc"/></g>
<rect x="136" y="60" width="8" height="11" rx="2" class="scaling-reads-fly" style="animation-delay:-3s"/>
<rect x="136" y="60" width="8" height="11" rx="2" class="scaling-reads-fly" style="animation-delay:-4s"/>
<rect x="136" y="60" width="8" height="11" rx="2" class="scaling-reads-fly" style="animation-delay:-5s"/>
<text x="206" y="16" font-size="14" font-weight="700" text-anchor="middle" class="scaling-reads-t">60,000/s</text><rect x="194" y="24" width="20" height="28" rx="4" class="scaling-reads-box" style="stroke-width:1.3"/><rect x="198" y="30" width="12" height="5" rx="1" class="scaling-reads-lit" style="animation-delay:-3s"/><rect x="220" y="24" width="20" height="28" rx="4" class="scaling-reads-box" style="stroke-width:1.3"/><rect x="224" y="30" width="12" height="5" rx="1" class="scaling-reads-lit" style="animation-delay:-5.5s"/><rect x="194" y="58" width="20" height="28" rx="4" class="scaling-reads-box" style="stroke-width:1.3"/><rect x="198" y="64" width="12" height="5" rx="1" class="scaling-reads-lit" style="animation-delay:-3.8s"/><rect x="220" y="58" width="20" height="28" rx="4" class="scaling-reads-box" style="stroke-width:1.3"/><rect x="224" y="64" width="12" height="5" rx="1" class="scaling-reads-lit" style="animation-delay:-6.6s"/><rect x="194" y="92" width="20" height="28" rx="4" class="scaling-reads-box" style="stroke-width:1.3"/><rect x="198" y="98" width="12" height="5" rx="1" class="scaling-reads-lit" style="animation-delay:-4.6s"/><rect x="220" y="92" width="20" height="28" rx="4" class="scaling-reads-box" style="stroke-width:1.3"/><rect x="224" y="98" width="12" height="5" rx="1" class="scaling-reads-lit" style="animation-delay:-7.4s"/>
</svg>
