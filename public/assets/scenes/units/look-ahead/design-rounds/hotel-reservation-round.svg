<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" class="hotelr-root" role="img" aria-label="One guest holds a room for three nights and books it, while a second guest who wants the middle night is told it is sold out.">
<style>
.hotelr-root text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hotelr-t{fill:var(--scene-ink,#102a33)}
.hotelr-mut{fill:var(--scene-muted,#536970)}
.hotelr-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.hotelr-soft{fill:var(--scene-accent-soft,#dcefed)}
.hotelr-good{fill:var(--scene-good,#1f7a4d)}
.hotelr-warn{fill:var(--scene-warn,#a15c00)}
.hotelr-bad{fill:var(--scene-bad,#b3261e)}
.hotelr-a{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-3s}
.hotelr-stay{animation-name:hotelr-stay}@keyframes hotelr-stay{0%,12%{opacity:0}16%,100%{opacity:1}}
.hotelr-before{animation-name:hotelr-before}@keyframes hotelr-before{0%,14%{opacity:1}17%,100%{opacity:0}}
.hotelr-after{animation-name:hotelr-after}@keyframes hotelr-after{0%,14%{opacity:0}17%,100%{opacity:1}}
.hotelr-held{animation-name:hotelr-held}@keyframes hotelr-held{0%,15%{opacity:0}18%,62%{opacity:1}65%,100%{opacity:0}}
.hotelr-done{animation-name:hotelr-done}@keyframes hotelr-done{0%,64%{opacity:0}67%,100%{opacity:1}}
.hotelr-no{animation-name:hotelr-no}@keyframes hotelr-no{0%,36%{opacity:0}40%,60%{opacity:1}64%,100%{opacity:0}}
.hotelr-c1{animation-name:hotelr-c1}@keyframes hotelr-c1{0%{transform:translate(-60px,30px);opacity:0}4%{opacity:1}12%,100%{transform:translate(0,0);opacity:1}}
.hotelr-c2{animation-name:hotelr-c2}@keyframes hotelr-c2{0%,26%{transform:translate(60px,40px);opacity:0}30%{opacity:1}36%,60%{transform:translate(0,0);opacity:1}64%,100%{transform:translate(0,0);opacity:0}}
@media (prefers-reduced-motion: reduce){.hotelr-root *{animation-play-state:paused!important}}
</style>
<rect x="14" y="10" width="212" height="18" rx="9" class="hotelr-soft"/>
<text x="120" y="24" font-size="14" font-weight="700" text-anchor="middle" class="hotelr-t">Double room</text>
<rect x="22" y="36" width="60" height="58" rx="8" class="hotelr-box"/>
<rect x="90" y="36" width="60" height="58" rx="8" class="hotelr-box"/>
<rect x="158" y="36" width="60" height="58" rx="8" class="hotelr-box"/>
<rect class="hotelr-a hotelr-stay" x="20" y="34" width="200" height="62" rx="10" fill="none" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"/>
<text x="52" y="56" font-size="14" font-weight="700" text-anchor="middle" class="hotelr-t">Fri</text>
<text x="120" y="56" font-size="14" font-weight="700" text-anchor="middle" class="hotelr-t">Sat</text>
<text x="188" y="56" font-size="14" font-weight="700" text-anchor="middle" class="hotelr-t">Sun</text>
<g class="hotelr-a hotelr-before"><text x="52" y="82" font-size="14" text-anchor="middle" class="hotelr-mut">2 left</text><text x="120" y="82" font-size="14" text-anchor="middle" class="hotelr-mut">1 left</text><text x="188" y="82" font-size="14" text-anchor="middle" class="hotelr-mut">3 left</text></g>
<g class="hotelr-a hotelr-after"><text x="52" y="82" font-size="14" text-anchor="middle" class="hotelr-mut">1 left</text><text x="120" y="82" font-size="14" font-weight="700" text-anchor="middle" class="hotelr-bad">0 left</text><text x="188" y="82" font-size="14" text-anchor="middle" class="hotelr-mut">2 left</text></g>
<g class="hotelr-a hotelr-held"><rect x="22" y="104" width="112" height="24" rx="12" class="hotelr-box" style="stroke:var(--scene-warn,#a15c00)"/><text x="78" y="121" font-size="14" font-weight="700" text-anchor="middle" class="hotelr-warn">Held 9:59</text></g>
<g class="hotelr-a hotelr-done"><rect x="22" y="104" width="112" height="24" rx="12" class="hotelr-box" style="stroke:var(--scene-good,#1f7a4d)"/><text x="78" y="121" font-size="14" font-weight="700" text-anchor="middle" class="hotelr-good">Booked &#10003;</text></g>
<g class="hotelr-a hotelr-no"><rect x="142" y="104" width="78" height="24" rx="12" class="hotelr-bad" fill-opacity=".15"/><text x="181" y="121" font-size="14" font-weight="700" text-anchor="middle" class="hotelr-bad">Sold out</text></g>
<g class="hotelr-a hotelr-c1"><path d="M70 38 l0 16 l4.5 -4.5 l3.5 7.5 l3 -1.4 l-3.5 -7.5 l6 0z" style="fill:var(--scene-ink,#102a33);stroke:var(--scene-card,#fff);stroke-width:1"/></g>
<g class="hotelr-a hotelr-c2"><path d="M138 38 l0 16 l4.5 -4.5 l3.5 7.5 l3 -1.4 l-3.5 -7.5 l6 0z" style="fill:var(--scene-bad,#b3261e);stroke:var(--scene-card,#fff);stroke-width:1"/></g>
</svg>
