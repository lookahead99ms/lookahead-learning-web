<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Three copies: a write reaches two, a read asks two, and the overlap returns the newest version">
<title>Three copies: a write reaches two, a read asks two, and the overlap returns the newest version</title>
<style>
.look-ahead-distributed-systems-replication-quorums-t{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33)}

.look-ahead-distributed-systems-replication-quorums-w1{animation:look-ahead-distributed-systems-replication-quorums-wa 6s ease-in-out infinite;animation-delay:-4s}
.look-ahead-distributed-systems-replication-quorums-w2{animation:look-ahead-distributed-systems-replication-quorums-wb 6s ease-in-out infinite;animation-delay:-4s}
@keyframes look-ahead-distributed-systems-replication-quorums-wa{0%{transform:translate(0,0);opacity:0}4%{opacity:1}22%{transform:translate(-45px,28px);opacity:1}26%,100%{transform:translate(-45px,28px);opacity:0}}
@keyframes look-ahead-distributed-systems-replication-quorums-wb{0%{transform:translate(0,0);opacity:0}4%{opacity:1}22%{transform:translate(45px,28px);opacity:1}26%,100%{transform:translate(45px,28px);opacity:0}}
.look-ahead-distributed-systems-replication-quorums-r1{animation:look-ahead-distributed-systems-replication-quorums-ra 6s ease-in-out infinite;animation-delay:-4s}
.look-ahead-distributed-systems-replication-quorums-r2{animation:look-ahead-distributed-systems-replication-quorums-rb 6s ease-in-out infinite;animation-delay:-4s}
@keyframes look-ahead-distributed-systems-replication-quorums-ra{0%,48%{transform:translate(0,0);opacity:0}52%{opacity:1}72%{transform:translate(-45px,-30px);opacity:1}76%,100%{transform:translate(-45px,-30px);opacity:0}}
@keyframes look-ahead-distributed-systems-replication-quorums-rb{0%,48%{transform:translate(0,0);opacity:0}52%{opacity:1}72%{transform:translate(45px,-30px);opacity:1}76%,100%{transform:translate(45px,-30px);opacity:0}}
.look-ahead-distributed-systems-replication-quorums-v2{animation:look-ahead-distributed-systems-replication-quorums-vv 6s ease-in-out infinite;animation-delay:-4s}
@keyframes look-ahead-distributed-systems-replication-quorums-vv{0%,22%{opacity:0}30%,92%{opacity:1}100%{opacity:0}}
.look-ahead-distributed-systems-replication-quorums-glow{animation:look-ahead-distributed-systems-replication-quorums-gl 6s ease-in-out infinite;animation-delay:-4s}
@keyframes look-ahead-distributed-systems-replication-quorums-gl{0%,60%{opacity:0}75%,92%{opacity:1}100%{opacity:0}}
</style>

<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<text class="look-ahead-distributed-systems-replication-quorums-t" x="90" y="24" text-anchor="middle">Write W=2</text>
<text class="look-ahead-distributed-systems-replication-quorums-t" x="215" y="171" text-anchor="middle">Read R=2</text>
<g stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-dasharray="5 4"><line x1="115" y1="36" x2="70" y2="64"/><line x1="115" y1="36" x2="160" y2="64"/><line x1="205" y1="142" x2="160" y2="112"/><line x1="205" y1="142" x2="250" y2="112"/></g>
<g fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"><rect x="40" y="64" width="60" height="48" rx="9"/><rect x="130" y="64" width="60" height="48" rx="9"/><rect x="220" y="64" width="60" height="48" rx="9"/></g>
<rect class="look-ahead-distributed-systems-replication-quorums-glow" x="127" y="61" width="66" height="54" rx="11" fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="4"/>
<g font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle">
<text x="70" y="94" style="fill:var(--scene-muted,#536970)">v1</text><text x="160" y="94" style="fill:var(--scene-muted,#536970)">v1</text><text x="250" y="94" style="fill:var(--scene-muted,#536970)">v1</text>
<g class="look-ahead-distributed-systems-replication-quorums-v2"><rect x="46" y="76" width="48" height="26" rx="6" fill="var(--scene-accent-soft,#dcefed)"/><text x="70" y="94" style="fill:var(--scene-good,#1f7a4d)">v2</text><rect x="136" y="76" width="48" height="26" rx="6" fill="var(--scene-accent-soft,#dcefed)"/><text x="160" y="94" style="fill:var(--scene-good,#1f7a4d)">v2</text></g></g>
<circle class="look-ahead-distributed-systems-replication-quorums-w1" cx="115" cy="36" r="7" fill="var(--scene-accent,#006c73)"/><circle class="look-ahead-distributed-systems-replication-quorums-w2" cx="115" cy="36" r="7" fill="var(--scene-accent,#006c73)"/>
<circle class="look-ahead-distributed-systems-replication-quorums-r1" cx="205" cy="142" r="7" fill="var(--scene-link,#245a88)"/><circle class="look-ahead-distributed-systems-replication-quorums-r2" cx="205" cy="142" r="7" fill="var(--scene-link,#245a88)"/>
</svg>
