<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Events arrive out of order across skewed clocks and are sorted by sequence number">
<title>Events arrive out of order across skewed clocks and are sorted by sequence number</title>
<style>
.look-ahead-distributed-systems-time-ordering-t{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33)}

.look-ahead-distributed-systems-time-ordering-c1{animation:look-ahead-distributed-systems-time-ordering-m1 6s ease-in-out infinite;animation-delay:-4.2s}
.look-ahead-distributed-systems-time-ordering-c2{animation:look-ahead-distributed-systems-time-ordering-m2 6s ease-in-out infinite;animation-delay:-4.2s}
.look-ahead-distributed-systems-time-ordering-c3{animation:look-ahead-distributed-systems-time-ordering-m3 6s ease-in-out infinite;animation-delay:-4.2s}
@keyframes look-ahead-distributed-systems-time-ordering-m1{0%,40%{transform:translateX(0)}60%,100%{transform:translateX(-120px)}}
@keyframes look-ahead-distributed-systems-time-ordering-m2{0%,40%{transform:translateX(0)}60%,100%{transform:translateX(60px)}}
@keyframes look-ahead-distributed-systems-time-ordering-m3{0%,40%{transform:translateX(0)}60%,100%{transform:translateX(60px)}}
.look-ahead-distributed-systems-time-ordering-down{animation:look-ahead-distributed-systems-time-ordering-dn 6s ease-in-out infinite;animation-delay:-4.2s}
@keyframes look-ahead-distributed-systems-time-ordering-dn{0%,40%{transform:translateY(0)}60%,100%{transform:translateY(48px)}}
.look-ahead-distributed-systems-time-ordering-h1{transform-origin:50px 40px;animation:look-ahead-distributed-systems-time-ordering-sp 12s linear infinite;animation-delay:-4s}
.look-ahead-distributed-systems-time-ordering-h2{transform-origin:270px 40px;animation:look-ahead-distributed-systems-time-ordering-sp 12s linear infinite;animation-delay:-9s}
@keyframes look-ahead-distributed-systems-time-ordering-sp{to{transform:rotate(360deg)}}
</style>

<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<circle cx="50" cy="40" r="20" fill="var(--scene-card,#fff)" stroke="var(--scene-learn,#0f8a8a)" stroke-width="3"/>
<g class="look-ahead-distributed-systems-time-ordering-h1"><line x1="50" y1="40" x2="50" y2="27" stroke="var(--scene-learn,#0f8a8a)" stroke-width="3" stroke-linecap="round"/></g>
<circle cx="270" cy="40" r="20" fill="var(--scene-card,#fff)" stroke="var(--scene-grow,#b8457a)" stroke-width="3"/>
<g class="look-ahead-distributed-systems-time-ordering-h2"><line x1="270" y1="40" x2="270" y2="27" stroke="var(--scene-grow,#b8457a)" stroke-width="3" stroke-linecap="round"/></g>
<text class="look-ahead-distributed-systems-time-ordering-t" x="160" y="46" text-anchor="middle" style="fill:var(--scene-warn,#a15c00)">Clock +4s</text>
<g fill="none" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-dasharray="5 4"><rect x="82" y="116" width="156" height="0" /><rect x="78" y="118" width="44" height="36" rx="8"/><rect x="138" y="118" width="44" height="36" rx="8"/><rect x="198" y="118" width="44" height="36" rx="8"/></g>
<g font-family="system-ui,sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">
<g class="look-ahead-distributed-systems-time-ordering-c1"><g class="look-ahead-distributed-systems-time-ordering-down"><circle cx="220" cy="90" r="15" fill="var(--scene-good,#1f7a4d)"/><text x="220" y="95">1</text></g></g>
<g class="look-ahead-distributed-systems-time-ordering-c2"><g class="look-ahead-distributed-systems-time-ordering-down"><circle cx="100" cy="90" r="15" fill="var(--scene-ahead,#2f6fb3)"/><text x="100" y="95">2</text></g></g>
<g class="look-ahead-distributed-systems-time-ordering-c3"><g class="look-ahead-distributed-systems-time-ordering-down"><circle cx="160" cy="90" r="15" fill="var(--scene-grow,#b8457a)"/><text x="160" y="95">3</text></g></g>
</g>
<text class="look-ahead-distributed-systems-time-ordering-t" x="160" y="173" text-anchor="middle">Sort by sequence</text>
</svg>
