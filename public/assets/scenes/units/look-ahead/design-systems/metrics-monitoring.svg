<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" role="img" aria-label="Two of Callum's checkout servers go dark, the checkout error line climbs past the 5% rule, and Selma's phone buzzes with exactly one page">
<style>
.metrics-monitoring-t{font-family:system-ui, sans-serif;fill:var(--scene-ink,#102a33)}
.metrics-monitoring-tx{font-family:system-ui, sans-serif;fill:var(--scene-text,#28434a)}
.metrics-monitoring-tm{font-family:ui-monospace, Menlo, monospace;fill:var(--scene-ink,#102a33)}
.metrics-monitoring-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.metrics-monitoring-card{fill:var(--scene-card,#fff)}
.metrics-monitoring-soft{fill:var(--scene-muted,#536970)}
.metrics-monitoring-line{fill:var(--scene-line,#cfdfdc)}
.metrics-monitoring-acc{fill:var(--scene-accent,#006c73)}
.metrics-monitoring-accsoft{fill:var(--scene-accent-soft,#dcefed)}
.metrics-monitoring-good{fill:var(--scene-good,#1f7a4d)}
.metrics-monitoring-bad{fill:var(--scene-bad,#b3261e)}
.metrics-monitoring-warn{fill:var(--scene-warn,#a15c00)}
.metrics-monitoring-link{fill:var(--scene-link,#245a88)}
.metrics-monitoring-a{animation-duration:6s;animation-iteration-count:infinite;animation-delay:-4.4s;transform-box:fill-box}
@media (prefers-reduced-motion: reduce){.metrics-monitoring-a{animation-play-state:paused!important}}
.metrics-monitoring-draw{animation-name:metrics-monitoring-draw;animation-timing-function:linear}
@keyframes metrics-monitoring-draw{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
.metrics-monitoring-down{animation-name:metrics-monitoring-down}
@keyframes metrics-monitoring-down{0%,30%{fill:var(--scene-good,#1f7a4d)}34%,100%{fill:var(--scene-bad,#b3261e)}}
.metrics-monitoring-note{animation-name:metrics-monitoring-note}
@keyframes metrics-monitoring-note{0%,56%{opacity:0;transform:translateY(-8px)}62%,95%{opacity:1;transform:none}100%{opacity:0}}
.metrics-monitoring-buzz{animation-name:metrics-monitoring-buzz}
@keyframes metrics-monitoring-buzz{0%,58%{transform:none}60%{transform:rotate(-4deg)}62%{transform:rotate(4deg)}64%{transform:rotate(-3deg)}66%{transform:rotate(3deg)}68%,100%{transform:none}}
.metrics-monitoring-buzz{transform-origin:center}
</style>
<rect x="6" y="6" width="152" height="100" rx="10" class="metrics-monitoring-box"/>
<text class="metrics-monitoring-t" x="16" y="26" font-size="14" font-weight="700">Checkout errors</text>
<path d="M14 58 H150" stroke="var(--scene-bad,#b3261e)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<text class="metrics-monitoring-bad" style="font-family:system-ui, sans-serif" x="18" y="52" font-size="14" font-weight="700">5%</text>
<path d="M14 96 H150" stroke="var(--scene-line,#cfdfdc)" stroke-width="1.5" fill="none"/>
<path class="metrics-monitoring-a metrics-monitoring-draw" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" d="M16 92 L34 90 L52 93 L70 89 L88 91 L100 88 L114 70 L126 50 L140 42 L150 40" stroke="var(--scene-accent,#006c73)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="14" y="114" width="24" height="16" rx="3" class="metrics-monitoring-box"/><circle cx="20" cy="122" r="3" class="metrics-monitoring-good"/><rect x="25" y="120.5" width="9" height="3" rx="1.5" class="metrics-monitoring-line"/>
<rect x="43" y="114" width="24" height="16" rx="3" class="metrics-monitoring-box"/><circle cx="49" cy="122" r="3" class="metrics-monitoring-good"/><rect x="54" y="120.5" width="9" height="3" rx="1.5" class="metrics-monitoring-line"/>
<rect x="72" y="114" width="24" height="16" rx="3" class="metrics-monitoring-box"/><circle cx="78" cy="122" r="3" class="metrics-monitoring-a metrics-monitoring-down"/><rect x="83" y="120.5" width="9" height="3" rx="1.5" class="metrics-monitoring-line"/>
<rect x="101" y="114" width="24" height="16" rx="3" class="metrics-monitoring-box"/><circle cx="107" cy="122" r="3" class="metrics-monitoring-a metrics-monitoring-down"/><rect x="112" y="120.5" width="9" height="3" rx="1.5" class="metrics-monitoring-line"/>
<rect x="130" y="114" width="24" height="16" rx="3" class="metrics-monitoring-box"/><circle cx="136" cy="122" r="3" class="metrics-monitoring-good"/><rect x="141" y="120.5" width="9" height="3" rx="1.5" class="metrics-monitoring-line"/>
<g class="metrics-monitoring-a metrics-monitoring-buzz"><rect x="172" y="10" width="62" height="118" rx="12" class="metrics-monitoring-box"/>
<rect x="194" y="16" width="18" height="4" rx="2" class="metrics-monitoring-line"/>
<g class="metrics-monitoring-a metrics-monitoring-note"><rect x="177" y="34" width="52" height="58" rx="8" class="metrics-monitoring-accsoft" stroke="var(--scene-bad,#b3261e)" stroke-width="1.5"/>
<path d="M203 44 c-6 0 -9 4 -9 10 v6 l-3 4 h24 l-3 -4 v-6 c0 -6 -3 -10 -9 -10z M200 66 a3 3 0 0 0 6 0z" class="metrics-monitoring-bad"/>
<text class="metrics-monitoring-t" x="203" y="86" font-size="14" font-weight="700" text-anchor="middle">Selma</text></g>
</g>
</svg>
