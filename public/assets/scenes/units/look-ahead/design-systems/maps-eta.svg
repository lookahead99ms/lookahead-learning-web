<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" role="img" aria-label="A car drives along a route toward the destination, a crash closes the road ahead, a new route draws around it, and the arrival time changes from 18:05 to 18:09">
<style>
.maps-eta-t{font-family:system-ui, sans-serif;fill:var(--scene-ink,#102a33)}
.maps-eta-tx{font-family:system-ui, sans-serif;fill:var(--scene-text,#28434a)}
.maps-eta-tm{font-family:ui-monospace, Menlo, monospace;fill:var(--scene-ink,#102a33)}
.maps-eta-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.maps-eta-soft{fill:var(--scene-muted,#536970)}
.maps-eta-line{fill:var(--scene-line,#cfdfdc)}
.maps-eta-acc{fill:var(--scene-accent,#006c73)}
.maps-eta-accsoft{fill:var(--scene-accent-soft,#dcefed)}
.maps-eta-good{fill:var(--scene-good,#1f7a4d)}
.maps-eta-bad{fill:var(--scene-bad,#b3261e)}
.maps-eta-warn{fill:var(--scene-warn,#a15c00)}
.maps-eta-link{fill:var(--scene-link,#245a88)}
.maps-eta-card{fill:var(--scene-card,#fff)}
.maps-eta-ink{fill:var(--scene-ink,#102a33)}
.maps-eta-a{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-3s;animation-timing-function:ease-in-out}
@media (prefers-reduced-motion: reduce){.maps-eta-a{animation-play-state:paused!important}}

.maps-eta-car{animation-name:maps-eta-car;animation-timing-function:linear}
@keyframes maps-eta-car{0%{transform:translate(0,0)}22%,40%{transform:translate(60px,0)}52%{transform:translate(60px,-50px)}80%{transform:translate(156px,-50px)}92%,100%{transform:translate(156px,-62px)}}
.maps-eta-x{animation-name:maps-eta-x}
@keyframes maps-eta-x{0%,22%{opacity:0;transform:scale(.4)}27%,100%{opacity:1;transform:scale(1)}}
.maps-eta-old{animation-name:maps-eta-old}
@keyframes maps-eta-old{0%,26%{opacity:1}34%,100%{opacity:.18}}
.maps-eta-new{animation-name:maps-eta-new}
@keyframes maps-eta-new{0%,30%{stroke-dashoffset:200}44%,100%{stroke-dashoffset:0}}
.maps-eta-e1{animation-name:maps-eta-e1}
@keyframes maps-eta-e1{0%,40%{opacity:1}44%,100%{opacity:0}}
.maps-eta-e2{animation-name:maps-eta-e2}
@keyframes maps-eta-e2{0%,40%{opacity:0}44%,100%{opacity:1}}
</style>
<rect x="0" y="0" width="240" height="135" class="maps-eta-accsoft" opacity=".35"/>
<path d="M0 104 H240 M0 54 H240 M84 0 V135 M180 0 V135" stroke="var(--scene-line,#cfdfdc)" stroke-width="9" fill="none"/>
<path class="maps-eta-a maps-eta-old" d="M24 104 H212 V44" stroke="var(--scene-link,#245a88)" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path class="maps-eta-a maps-eta-new" d="M84 104 V54 H212 V44" stroke="var(--scene-accent,#006c73)" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="200" stroke-dashoffset="0"/>
<g transform="translate(140 104)"><g class="maps-eta-a maps-eta-x" style="transform-box:fill-box;transform-origin:center"><circle r="10" class="maps-eta-bad"/><path d="M-4.5 -4.5 l9 9 m0 -9 l-9 9" stroke="var(--scene-card,#fff)" stroke-width="2.4"/></g></g>
<g class="maps-eta-a maps-eta-x"><text class="maps-eta-t" x="140" y="130" font-size="14" font-weight="700" text-anchor="middle" style="fill:var(--scene-bad,#b3261e)">Road closed</text></g>
<path transform="translate(212 46)" d="M0 0 C-6 -8 -9 -12 -9 -16 A9 9 0 0 1 9 -16 C9 -12 6 -8 0 0Z" class="maps-eta-bad" stroke="var(--scene-card,#fff)" stroke-width="1.2"/><circle cx="212" cy="30" r="3.5" class="maps-eta-card"/>
<g class="maps-eta-a maps-eta-car"><circle cx="24" cy="104" r="8" class="maps-eta-link" stroke="var(--scene-card,#fff)" stroke-width="2.5"/><path d="M20 107 l4 -9 l4 9 l-4 -2.5z" class="maps-eta-card"/></g>
<rect x="8" y="8" width="104" height="26" rx="13" class="maps-eta-card" stroke="var(--scene-line,#cfdfdc)" stroke-width="1.5"/>
<text class="maps-eta-tm maps-eta-a maps-eta-e1" x="60" y="26" font-size="14" font-weight="700" text-anchor="middle">ETA 18:05</text>
<text class="maps-eta-tm maps-eta-a maps-eta-e2" x="60" y="26" font-size="14" font-weight="700" text-anchor="middle" style="fill:var(--scene-warn,#a15c00)">ETA 18:09</text>

</svg>
