<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" role="img" aria-label="Mirela's 12 MB photo is copied to three disks and only then marked Saved; later one disk fails, and a fresh copy is written to a spare disk so the photo is never lost">
<style>
.object-storage-s3-t{font-family:system-ui, sans-serif;fill:var(--scene-ink,#102a33)}
.object-storage-s3-tx{font-family:system-ui, sans-serif;fill:var(--scene-text,#28434a)}
.object-storage-s3-tm{font-family:ui-monospace, Menlo, monospace;fill:var(--scene-ink,#102a33)}
.object-storage-s3-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.object-storage-s3-soft{fill:var(--scene-muted,#536970)}
.object-storage-s3-line{fill:var(--scene-line,#cfdfdc)}
.object-storage-s3-acc{fill:var(--scene-accent,#006c73)}
.object-storage-s3-accsoft{fill:var(--scene-accent-soft,#dcefed)}
.object-storage-s3-good{fill:var(--scene-good,#1f7a4d)}
.object-storage-s3-bad{fill:var(--scene-bad,#b3261e)}
.object-storage-s3-warn{fill:var(--scene-warn,#a15c00)}
.object-storage-s3-link{fill:var(--scene-link,#245a88)}
.object-storage-s3-card{fill:var(--scene-card,#fff)}
.object-storage-s3-ink{fill:var(--scene-ink,#102a33)}
.object-storage-s3-a{animation-duration:7s;animation-iteration-count:infinite;animation-delay:-3s;animation-timing-function:ease-in-out}
@media (prefers-reduced-motion: reduce){.object-storage-s3-a{animation-play-state:paused!important}}

.object-storage-s3-f1{animation-name:object-storage-s3-f1}
@keyframes object-storage-s3-f1{0%,4%{transform:translate(0,0);opacity:0}7%{opacity:1}22%,100%{transform:translate(80px,0);opacity:1}}
.object-storage-s3-f2{animation-name:object-storage-s3-f2}
@keyframes object-storage-s3-f2{0%,4%{transform:translate(0,0);opacity:0}7%{opacity:1}22%,100%{transform:translate(116px,0);opacity:1}}
.object-storage-s3-f3{animation-name:object-storage-s3-f3}
@keyframes object-storage-s3-f3{0%,4%{transform:translate(0,0);opacity:0}7%{opacity:1}22%,54%{transform:translate(152px,0);opacity:1}60%,100%{transform:translate(152px,0);opacity:0}}
.object-storage-s3-ok{animation-name:object-storage-s3-ok}
@keyframes object-storage-s3-ok{0%,24%{opacity:0;transform:translateY(4px)}30%,94%{opacity:1;transform:none}100%{opacity:0}}
.object-storage-s3-fail{animation-name:object-storage-s3-fail}
@keyframes object-storage-s3-fail{0%,54%{opacity:0}58%,94%{opacity:1}100%{opacity:0}}
.object-storage-s3-dead{animation-name:object-storage-s3-dead}
@keyframes object-storage-s3-dead{0%,54%{opacity:1}58%,94%{opacity:.35}100%{opacity:1}}
.object-storage-s3-rep{animation-name:object-storage-s3-rep}
@keyframes object-storage-s3-rep{0%,62%{opacity:0;transform:translate(0,0)}65%{opacity:1}80%,94%{opacity:1;transform:translate(76px,0)}100%{opacity:0;transform:translate(76px,0)}}
.object-storage-s3-spare{animation-name:object-storage-s3-spare}
@keyframes object-storage-s3-spare{0%,78%{opacity:0}82%,94%{opacity:1}100%{opacity:0}}
</style>
<text class="object-storage-s3-tx" x="8" y="26" font-size="14">12 MB photo</text>
<rect x="8" y="40" width="58" height="66" rx="9" class="object-storage-s3-box"/>
<rect x="14" y="46" width="46" height="34" rx="4" class="object-storage-s3-accsoft"/>
<path d="M16 78 l12 -14 l8 9 l6 -5 l16 10z" class="object-storage-s3-acc"/><circle cx="48" cy="55" r="4" class="object-storage-s3-warn"/>
<text class="object-storage-s3-t" x="37" y="99" font-size="14" font-weight="700" text-anchor="middle">Mirela</text>
<g ><rect x="92" y="58" width="28" height="34" class="object-storage-s3-soft"/><ellipse cx="106" cy="92" rx="14" ry="5" class="object-storage-s3-soft"/><ellipse cx="106" cy="58" rx="14" ry="5" class="object-storage-s3-line" stroke="var(--scene-card,#fff)" stroke-width="1.5"/></g><g ><rect x="128" y="58" width="28" height="34" class="object-storage-s3-soft"/><ellipse cx="142" cy="92" rx="14" ry="5" class="object-storage-s3-soft"/><ellipse cx="142" cy="58" rx="14" ry="5" class="object-storage-s3-line" stroke="var(--scene-card,#fff)" stroke-width="1.5"/></g><g class="object-storage-s3-a object-storage-s3-dead"><rect x="164" y="58" width="28" height="34" class="object-storage-s3-soft"/><ellipse cx="178" cy="92" rx="14" ry="5" class="object-storage-s3-soft"/><ellipse cx="178" cy="58" rx="14" ry="5" class="object-storage-s3-line" stroke="var(--scene-card,#fff)" stroke-width="1.5"/></g>
<g><rect x="204" y="58" width="28" height="34" fill="none" stroke="var(--scene-muted,#536970)" stroke-width="1.3" stroke-dasharray="3 2"/><ellipse cx="218" cy="58" rx="14" ry="5" fill="none" stroke="var(--scene-muted,#536970)" stroke-width="1.3" stroke-dasharray="3 2"/></g>
<g class="object-storage-s3-a object-storage-s3-spare"><g ><rect x="204" y="58" width="28" height="34" class="object-storage-s3-soft"/><ellipse cx="218" cy="92" rx="14" ry="5" class="object-storage-s3-soft"/><ellipse cx="218" cy="58" rx="14" ry="5" class="object-storage-s3-line" stroke="var(--scene-card,#fff)" stroke-width="1.5"/></g></g>
<g class="object-storage-s3-a object-storage-s3-f1"><rect x="18" y="68" width="16" height="12" rx="2" class="object-storage-s3-acc" stroke="var(--scene-card,#fff)"/></g>
<g class="object-storage-s3-a object-storage-s3-f2"><rect x="18" y="68" width="16" height="12" rx="2" class="object-storage-s3-acc" stroke="var(--scene-card,#fff)"/></g>
<g class="object-storage-s3-a object-storage-s3-f3"><rect x="18" y="68" width="16" height="12" rx="2" class="object-storage-s3-acc" stroke="var(--scene-card,#fff)"/></g>
<g class="object-storage-s3-a object-storage-s3-rep"><rect x="134" y="68" width="16" height="12" rx="2" class="object-storage-s3-good" stroke="var(--scene-card,#fff)"/></g>
<g class="object-storage-s3-a object-storage-s3-fail"><circle cx="178" cy="110" r="9" class="object-storage-s3-bad"/><path d="M174 106 l8 8 m0 -8 l-8 8" stroke="var(--scene-card,#fff)" stroke-width="2.2"/></g>
<g class="object-storage-s3-a object-storage-s3-ok"><rect x="92" y="8" width="140" height="28" rx="14" class="object-storage-s3-good"/>
<text class="object-storage-s3-card" x="162" y="27" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Saved ✓ 3 copies</text></g>

</svg>
