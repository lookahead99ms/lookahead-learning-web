<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" class="distributed-cache-root" role="img" aria-label="Page reads are answered from the cache in about a millisecond; when the cached copy expires one reader refills it from the database while the others wait.">
<style>
.distributed-cache-root text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.distributed-cache-t{fill:var(--scene-ink,#102a33)}
.distributed-cache-tx{fill:var(--scene-text,#28434a)}
.distributed-cache-mut{fill:var(--scene-muted,#536970)}
.distributed-cache-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.distributed-cache-soft{fill:var(--scene-accent-soft,#dcefed)}
.distributed-cache-acc{fill:var(--scene-accent,#006c73)}
.distributed-cache-ln{fill:var(--scene-line,#cfdfdc)}
.distributed-cache-cardf{fill:var(--scene-card,#fff)}
.distributed-cache-good{fill:var(--scene-good,#1f7a4d)}
.distributed-cache-warn{fill:var(--scene-warn,#a15c00)}
.distributed-cache-bad{fill:var(--scene-bad,#b3261e)}
.distributed-cache-link{fill:var(--scene-link,#245a88)}
.distributed-cache-out{fill:var(--scene-bubble-out,#d4ecea)}
.distributed-cache-sk{fill:none;stroke:var(--scene-muted,#536970);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.distributed-cache-sa{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.distributed-cache-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:1.5;stroke-dasharray:3 3}
.distributed-cache-a{animation-duration:7s;animation-iteration-count:infinite;animation-delay:-3s}
.distributed-cache-hit{animation-name:distributed-cache-hit;animation-duration:1.4s!important;animation-timing-function:ease-in-out}
@keyframes distributed-cache-hit{0%{transform:translateX(0);opacity:0}10%{opacity:1}50%{transform:translateX(62px)}90%{opacity:1}100%{transform:translateX(0);opacity:0}}
.distributed-cache-bar{animation-name:distributed-cache-bar;animation-timing-function:linear}
@keyframes distributed-cache-bar{0%{width:72px}55%{width:0}75%{width:0}78%,100%{width:72px}}
.distributed-cache-exp{animation-name:distributed-cache-exp}@keyframes distributed-cache-exp{0%,54%{opacity:0}57%,76%{opacity:1}79%,100%{opacity:0}}
.distributed-cache-load{animation-name:distributed-cache-load}@keyframes distributed-cache-load{0%,56%{transform:translateY(0);opacity:0}58%{opacity:1}66%{transform:translateY(22px)}74%{transform:translateY(0);opacity:1}77%,100%{opacity:0}}
.distributed-cache-wait{animation-name:distributed-cache-wait}@keyframes distributed-cache-wait{0%,57%{opacity:0}60%,75%{opacity:1}78%,100%{opacity:0}}
.distributed-cache-bl{animation:distributed-cache-bl 1s infinite}@keyframes distributed-cache-bl{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.distributed-cache-root *{animation-play-state:paused!important}}
</style>
<rect x="6" y="12" width="56" height="112" rx="11" class="distributed-cache-box"/>
<rect x="12" y="24" width="44" height="40" rx="6" class="distributed-cache-soft"/>
<g transform="translate(18 28) scale(.8)"><path d="M10 38 h22 l-2 -18 q-9 -5 -18 0z" class="distributed-cache-acc"/><path d="M30 22 q8 2 6 12" stroke="var(--scene-accent,#006c73)" stroke-width="2.5" fill="none"/><path d="M12 26 l-7 -6" stroke="var(--scene-accent,#006c73)" stroke-width="3" stroke-linecap="round"/></g>
<rect x="14" y="74" width="30" height="6" rx="3" class="distributed-cache-mut"/><rect x="14" y="86" width="22" height="5" rx="2.5" class="distributed-cache-ln"/>
<circle cx="34" cy="108" r="6" class="distributed-cache-ln"/>
<circle class="distributed-cache-a distributed-cache-hit distributed-cache-good" cx="68" cy="38" r="5" style="animation-delay:-.2s"/>
<circle class="distributed-cache-a distributed-cache-hit distributed-cache-good" cx="68" cy="56" r="5" style="animation-delay:-.7s"/>
<circle class="distributed-cache-a distributed-cache-hit distributed-cache-good" cx="68" cy="74" r="5" style="animation-delay:-1.1s"/>
<rect x="140" y="26" width="92" height="56" rx="10" class="distributed-cache-box"/>
<g transform="translate(150 32) scale(.7)"><path d="M10 38 h22 l-2 -18 q-9 -5 -18 0z" class="distributed-cache-acc"/><path d="M12 26 l-7 -6" stroke="var(--scene-accent,#006c73)" stroke-width="3" stroke-linecap="round"/></g>
<rect x="150" y="66" width="72" height="7" rx="3.5" class="distributed-cache-ln"/>
<rect class="distributed-cache-a distributed-cache-bar distributed-cache-warn" x="150" y="66" width="72" height="7" rx="3.5"/>
<g class="distributed-cache-a distributed-cache-exp"><rect x="143" y="29" width="86" height="50" rx="8" fill="var(--scene-card,#fff)"/><text x="186" y="60" font-size="15" font-weight="700" text-anchor="middle" class="distributed-cache-bad">Expired</text></g>
<text x="186" y="18" font-size="14" font-weight="700" text-anchor="middle" class="distributed-cache-good">1 ms</text>
<g transform="translate(170 104)"><ellipse cx="16" cy="4" rx="16" ry="5" class="distributed-cache-box"/><path d="M0 4 V22 A16 5 0 0 0 32 22 V4" class="distributed-cache-box"/><ellipse cx="16" cy="4" rx="16" ry="5" class="distributed-cache-box"/></g>
<g class="distributed-cache-a distributed-cache-load"><circle cx="186" cy="84" r="5" class="distributed-cache-link"/></g>
<g class="distributed-cache-a distributed-cache-wait"><circle cx="90" cy="112" r="3.5" class="distributed-cache-mut distributed-cache-bl"/><circle cx="104" cy="112" r="3.5" class="distributed-cache-mut distributed-cache-bl" style="animation-delay:-.3s"/><circle cx="118" cy="112" r="3.5" class="distributed-cache-mut distributed-cache-bl" style="animation-delay:-.6s"/></g>
</svg>
