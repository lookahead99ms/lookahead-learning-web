<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" role="img" aria-label="Svetlana moves her knight and her clock stops with 2 seconds added while Akosua's clock starts; Akosua replies with a pawn and only her own thinking time is taken off her clock">
<style>
.online-chess-t{font-family:system-ui, sans-serif;fill:var(--scene-ink,#102a33)}
.online-chess-tx{font-family:system-ui, sans-serif;fill:var(--scene-text,#28434a)}
.online-chess-tm{font-family:ui-monospace, Menlo, monospace;fill:var(--scene-ink,#102a33)}
.online-chess-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.online-chess-card{fill:var(--scene-card,#fff)}
.online-chess-ink{fill:var(--scene-ink,#102a33)}
.online-chess-soft{fill:var(--scene-muted,#536970)}
.online-chess-line{fill:var(--scene-line,#cfdfdc)}
.online-chess-acc{fill:var(--scene-accent,#006c73)}
.online-chess-accsoft{fill:var(--scene-accent-soft,#dcefed)}
.online-chess-good{fill:var(--scene-good,#1f7a4d)}
.online-chess-bad{fill:var(--scene-bad,#b3261e)}
.online-chess-warn{fill:var(--scene-warn,#a15c00)}
.online-chess-link{fill:var(--scene-link,#245a88)}
.online-chess-a{animation-duration:6s;animation-iteration-count:infinite;animation-delay:-3s;animation-timing-function:ease-in-out}
@media (prefers-reduced-motion: reduce){.online-chess-a{animation-play-state:paused!important}}
.online-chess-knight{animation-name:online-chess-knight}
@keyframes online-chess-knight{0%,8%{transform:none}22%,92%{transform:translate(12px,-24px)}100%{transform:none}}
.online-chess-pawn{animation-name:online-chess-pawn}
@keyframes online-chess-pawn{0%,52%{transform:none}64%,92%{transform:translate(0,12px)}100%{transform:none}}
.online-chess-sOn{animation-name:online-chess-sOn}
@keyframes online-chess-sOn{0%,20%{opacity:1}24%,62%{opacity:0}66%,94%{opacity:1}100%{opacity:1}}
.online-chess-aOn{animation-name:online-chess-aOn}
@keyframes online-chess-aOn{0%,20%{opacity:0}24%,62%{opacity:1}66%,100%{opacity:0}}
.online-chess-s1{animation-name:online-chess-s1}
@keyframes online-chess-s1{0%,22%{opacity:1}24%,100%{opacity:0}}
.online-chess-s2{animation-name:online-chess-s2}
@keyframes online-chess-s2{0%,22%{opacity:0}24%,96%{opacity:1}100%{opacity:0}}
.online-chess-a1{animation-name:online-chess-a1}
@keyframes online-chess-a1{0%,62%{opacity:1}64%,100%{opacity:0}}
.online-chess-a2{animation-name:online-chess-a2}
@keyframes online-chess-a2{0%,62%{opacity:0}64%,96%{opacity:1}100%{opacity:0}}
.online-chess-plus{animation-name:online-chess-plus}
@keyframes online-chess-plus{0%,22%{opacity:0;transform:none}26%{opacity:1;transform:none}40%,100%{opacity:0;transform:translateY(-8px)}}
</style>
