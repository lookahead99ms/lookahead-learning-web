<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" class="hotelres-root" role="img" aria-label="Anouk holds a double room for the Friday, Saturday and Sunday nights and it is booked, while Yohannes taps Saturday and is told it is sold out.">
<style>
.hotelres-t{fill:var(--scene-ink,#102a33)}
.hotelres-mut{fill:var(--scene-muted,#536970)}
.hotelres-bg{fill:var(--scene-card,#fff)}
.hotelres-box{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.hotelres-top{fill:var(--scene-line,#cfdfdc)}
.hotelres-side{fill:var(--scene-ink,#102a33);opacity:.14}
.hotelres-shadow{fill:var(--scene-ink,#102a33);opacity:.09}
.hotelres-soft{fill:var(--scene-accent-soft,#dcefed)}
.hotelres-acc{fill:var(--scene-accent,#006c73)}
.hotelres-lnk{fill:var(--scene-link,#245a88)}
.hotelres-ink{fill:var(--scene-ink,#102a33)}
.hotelres-good{fill:var(--scene-good,#1f7a4d)}
.hotelres-warn{fill:var(--scene-warn,#a15c00)}
.hotelres-bad{fill:var(--scene-bad,#b3261e)}
.hotelres-wire{fill:none;stroke:var(--scene-muted,#536970);stroke-width:1.5;stroke-dasharray:3 3}
.hotelres-a{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-3s;animation-timing-function:linear}
.hotelres-dot1{animation-name:hotelres-dot1}@keyframes hotelres-dot1{0%{transform:translate(0,0);opacity:0}2%{opacity:1}10%{transform:translate(24px,0);opacity:1}12%,100%{transform:translate(24px,0);opacity:0}}
.hotelres-stay{animation-name:hotelres-stay}@keyframes hotelres-stay{0%,12%{opacity:0}15%,100%{opacity:1}}
.hotelres-before{animation-name:hotelres-before}@keyframes hotelres-before{0%,13%{opacity:1}16%,100%{opacity:0}}
.hotelres-after{animation-name:hotelres-after}@keyframes hotelres-after{0%,13%{opacity:0}16%,100%{opacity:1}}
.hotelres-held{animation-name:hotelres-held}@keyframes hotelres-held{0%,14%{opacity:0}17%,62%{opacity:1}65%,100%{opacity:0}}
.hotelres-done{animation-name:hotelres-done}@keyframes hotelres-done{0%,63%{opacity:0}66%,100%{opacity:1}}
.hotelres-dot2{animation-name:hotelres-dot2}@keyframes hotelres-dot2{0%,22%{transform:translate(0,0);opacity:0}23%{opacity:1}29%{transform:translate(-24px,0);opacity:1}31%,100%{transform:translate(-24px,0);opacity:0}}
.hotelres-tap{animation-name:hotelres-tap}@keyframes hotelres-tap{0%,29%{opacity:0}32%,62%{opacity:1}65%,100%{opacity:0}}
.hotelres-no{animation-name:hotelres-no}@keyframes hotelres-no{0%,30%{opacity:0}33%,62%{opacity:1}65%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.hotelres-root *{animation-play-state:paused}}
</style>
<rect width="320" height="180" class="hotelres-bg"/>
<!-- Anouk with her phone -->
<ellipse cx="34" cy="104" rx="26" ry="4" class="hotelres-shadow"/>
<circle cx="30" cy="58" r="10" class="hotelres-acc"/>
<path d="M12 102 v-12 q18 -26 36 0 v12 z" class="hotelres-acc"/>
<rect x="36" y="66" width="17" height="28" rx="3" class="hotelres-ink"/>
<rect x="38.5" y="70" width="12" height="19" rx="1.5" class="hotelres-soft"/>
<!-- Yohannes with his phone -->
<ellipse cx="286" cy="104" rx="26" ry="4" class="hotelres-shadow"/>
<circle cx="290" cy="58" r="10" class="hotelres-lnk"/>
<path d="M272 102 v-12 q18 -26 36 0 v12 z" class="hotelres-lnk"/>
<rect x="267" y="66" width="17" height="28" rx="3" class="hotelres-ink"/>
<rect x="269.5" y="70" width="12" height="19" rx="1.5" class="hotelres-soft"/>
<!-- wires and messages -->
<path d="M54 80 H78" class="hotelres-wire"/>
<path d="M242 80 H266" class="hotelres-wire"/>
<circle cx="54" cy="80" r="3.5" class="hotelres-a hotelres-dot1 hotelres-acc"/>
<circle cx="266" cy="80" r="3.5" class="hotelres-a hotelres-dot2 hotelres-lnk"/>
<!-- the room-type board: one cell per night -->
<ellipse cx="161" cy="128" rx="88" ry="5" class="hotelres-shadow"/>
<rect x="81" y="28" width="164" height="96" rx="10" class="hotelres-side"/>
<rect x="78" y="24" width="164" height="96" rx="10" class="hotelres-box"/>
<rect x="114" y="30" width="92" height="17" rx="8.5" class="hotelres-soft"/>
<text x="160" y="42.5" font-size="11.5" text-anchor="middle" class="hotelres-t">Double room</text>
<g>
<rect x="88" y="54" width="44" height="58" rx="6" class="hotelres-box"/><rect x="88" y="54" width="44" height="7" rx="3" class="hotelres-top"/>
<rect x="138" y="54" width="44" height="58" rx="6" class="hotelres-box"/><rect x="138" y="54" width="44" height="7" rx="3" class="hotelres-top"/>
<rect x="188" y="54" width="44" height="58" rx="6" class="hotelres-box"/><rect x="188" y="54" width="44" height="7" rx="3" class="hotelres-top"/>
</g>
<g class="hotelres-mut">
<rect x="96" y="84" width="28" height="7" rx="2"/><rect x="146" y="84" width="28" height="7" rx="2"/><rect x="196" y="84" width="28" height="7" rx="2"/>
</g>
<g class="hotelres-top">
<rect x="98" y="79" width="9" height="5" rx="2"/><rect x="148" y="79" width="9" height="5" rx="2"/><rect x="198" y="79" width="9" height="5" rx="2"/>
</g>
<text x="110" y="75" font-size="12" text-anchor="middle" class="hotelres-t">Fri</text>
<text x="160" y="75" font-size="12" text-anchor="middle" class="hotelres-t">Sat</text>
<text x="210" y="75" font-size="12" text-anchor="middle" class="hotelres-t">Sun</text>
<g class="hotelres-a hotelres-before"><text x="110" y="105" font-size="10.5" text-anchor="middle" class="hotelres-mut">2 left</text><text x="160" y="105" font-size="10.5" text-anchor="middle" class="hotelres-mut">1 left</text><text x="210" y="105" font-size="10.5" text-anchor="middle" class="hotelres-mut">3 left</text></g>
<g class="hotelres-a hotelres-after"><text x="110" y="105" font-size="10.5" text-anchor="middle" class="hotelres-mut">1 left</text><text x="160" y="105" font-size="10.5" text-anchor="middle" class="hotelres-bad">0 left</text><text x="210" y="105" font-size="10.5" text-anchor="middle" class="hotelres-mut">2 left</text></g>
<rect x="84" y="50" width="152" height="66" rx="9" fill="none" stroke="var(--scene-accent,#006c73)" stroke-width="2.5" class="hotelres-a hotelres-stay"/>
<circle cx="160" cy="86" r="9.5" fill="none" stroke="var(--scene-link,#245a88)" stroke-width="2" stroke-dasharray="4 3" class="hotelres-a hotelres-tap"/>
<text x="160" y="146" font-size="11" text-anchor="middle" class="hotelres-mut">3 nights, 12 to 15 June</text>
<!-- outcomes -->
<g class="hotelres-a hotelres-held"><rect x="6" y="132" width="76" height="22" rx="11" class="hotelres-box" style="stroke:var(--scene-warn,#a15c00)"/><text x="44" y="147" font-size="12" text-anchor="middle" class="hotelres-warn">Held 9:59</text></g>
<g class="hotelres-a hotelres-done"><rect x="6" y="132" width="76" height="22" rx="11" class="hotelres-box" style="stroke:var(--scene-good,#1f7a4d)"/><text x="44" y="147" font-size="12" text-anchor="middle" class="hotelres-good">Booked &#10003;</text></g>
<g class="hotelres-a hotelres-no"><rect x="244" y="132" width="70" height="22" rx="11" class="hotelres-bad" fill-opacity=".15"/><text x="279" y="147" font-size="12" text-anchor="middle" class="hotelres-bad">Sold out</text></g>
</svg>
