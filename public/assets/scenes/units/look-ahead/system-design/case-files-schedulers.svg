<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A file upload and a scheduled sandboxed run"><title>A file upload and a scheduled sandboxed run</title>
<style>
.look-ahead-system-design-case-files-schedulers-bg{fill:var(--scene-card,#fff)}
.look-ahead-system-design-case-files-schedulers-t{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33);text-anchor:middle}
.look-ahead-system-design-case-files-schedulers-n{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33);text-anchor:middle}
.look-ahead-system-design-case-files-schedulers-soft{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-accent,#006c73);stroke-width:2.5}
.look-ahead-system-design-case-files-schedulers-card{fill:var(--scene-card,#fff);stroke:var(--scene-ink,#102a33);stroke-width:2.5}
.look-ahead-system-design-case-files-schedulers-line{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:3;stroke-linecap:round}
.look-ahead-system-design-case-files-schedulers-dash{fill:none;stroke:var(--scene-muted,#536970);stroke-width:2.5;stroke-dasharray:5 5;stroke-linecap:round}

.look-ahead-system-design-case-files-schedulers-file{animation:6s linear -1.5s infinite look-ahead-system-design-case-files-schedulers-fl}
.look-ahead-system-design-case-files-schedulers-bk{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-accent,#006c73);stroke-width:3}
.look-ahead-system-design-case-files-schedulers-clock{fill:var(--scene-card,#fff);stroke:var(--scene-warn,#a15c00);stroke-width:3}
.look-ahead-system-design-case-files-schedulers-hd{stroke:var(--scene-warn,#a15c00);stroke-width:3;stroke-linecap:round;transform-origin:230px 40px;animation:6s linear -3s infinite look-ahead-system-design-case-files-schedulers-spin}
.look-ahead-system-design-case-files-schedulers-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-learn,#0f8a8a);stroke-width:3;stroke-dasharray:7 5}
.look-ahead-system-design-case-files-schedulers-gear{fill:none;stroke:var(--scene-learn,#0f8a8a);stroke-width:7;stroke-dasharray:4.4 4.4;transform-origin:240px 124px;animation:3s linear infinite look-ahead-system-design-case-files-schedulers-spin}
.look-ahead-system-design-case-files-schedulers-pulse{stroke:var(--scene-warn,#a15c00);stroke-width:3;stroke-linecap:round;animation:6s linear -3s infinite look-ahead-system-design-case-files-schedulers-pl}
@keyframes look-ahead-system-design-case-files-schedulers-fl{0%,5%{transform:translateX(0);opacity:0}10%{opacity:1;transform:translateX(0)}45%{transform:translateX(98px);opacity:1}50%,100%{transform:translateX(98px);opacity:0}}
@keyframes look-ahead-system-design-case-files-schedulers-spin{to{transform:rotate(360deg)}}
@keyframes look-ahead-system-design-case-files-schedulers-pl{0%,40%{opacity:0}50%,70%{opacity:1}80%,100%{opacity:0}}
</style>
<rect class="look-ahead-system-design-case-files-schedulers-bg" width="320" height="180"/>
<g class="look-ahead-system-design-case-files-schedulers-file"><rect x="22" y="48" width="26" height="34" rx="4" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2.5"/><line x1="28" y1="60" x2="42" y2="60" stroke="var(--scene-muted,#536970)" stroke-width="2.5"/><line x1="28" y1="70" x2="42" y2="70" stroke="var(--scene-muted,#536970)" stroke-width="2.5"/></g>
<path class="look-ahead-system-design-case-files-schedulers-bk" d="M108 30h62l-8 62h-46z"/><path d="M114 30h50" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<path class="look-ahead-system-design-case-files-schedulers-dash" d="M20 78H104"/>
<text class="look-ahead-system-design-case-files-schedulers-t" x="139" y="132">Upload</text>
<circle class="look-ahead-system-design-case-files-schedulers-clock" cx="230" cy="40" r="22"/><line class="look-ahead-system-design-case-files-schedulers-hd" x1="230" y1="40" x2="230" y2="25"/><circle cx="230" cy="40" r="3" fill="var(--scene-warn,#a15c00)"/>
<line class="look-ahead-system-design-case-files-schedulers-pulse" x1="230" y1="68" x2="230" y2="86"/>
<rect class="look-ahead-system-design-case-files-schedulers-box" x="190" y="92" width="100" height="58" rx="10"/><circle class="look-ahead-system-design-case-files-schedulers-gear" cx="240" cy="124" r="12"/><circle cx="240" cy="124" r="4" fill="var(--scene-learn,#0f8a8a)"/>
<text class="look-ahead-system-design-case-files-schedulers-t" x="240" y="170">Sandbox</text>
</svg>
