.look-ahead-system-design-interview-method-dash{fill:none;stroke:var(--scene-muted,#536970);stroke-width:2.5;stroke-dasharray:5 5;stroke-linecap:round}

.look-ahead-system-design-interview-method-board{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-accent,#006c73);stroke-width:3}
.look-ahead-system-design-interview-method-clip{fill:var(--scene-accent,#006c73)}
.look-ahead-system-design-interview-method-row{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:2}
