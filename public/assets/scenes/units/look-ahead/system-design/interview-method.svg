.look-ahead-system-design-interview-method-ck{fill:none;stroke:var(--scene-good,#1f7a4d);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:6s linear -3s infinite look-ahead-system-design-interview-method-k1}
