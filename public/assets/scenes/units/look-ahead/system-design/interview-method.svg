.look-ahead-system-design-interview-method-clock{fill:var(--scene-card,#fff);stroke:var(--scene-warn,#a15c00);stroke-width:3}
.look-ahead-system-design-interview-method-hand{stroke:var(--scene-warn,#a15c00);stroke-width:3;stroke-linecap:round;transform-origin:292px 70px;animation:6s linear -3s infinite look-ahead-system-design-interview-method-spin}
@keyframes look-ahead-system-design-interview-method-k1{0%,5%{stroke-dashoffset:1}15%,90%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:1}}
@keyframes look-ahead-system-design-interview-method-k2{0%,25%{stroke-dashoffset:1}35%,90%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:1}}
@keyframes look-ahead-system-design-interview-method-k3{0%,45%{stroke-dashoffset:1}55%,90%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:1}}
@keyframes look-ahead-system-design-interview-method-spin{to{transform:rotate(360deg)}}
</style>
