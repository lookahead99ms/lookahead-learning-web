<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A design answer built step by step"><title>A design answer built step by step</title>
<style>
.look-ahead-system-design-interview-method-bg{fill:var(--scene-card,#fff)}
