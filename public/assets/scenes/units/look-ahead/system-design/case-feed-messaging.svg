<path class="look-ahead-system-design-case-feed-messaging-bell" d="M240 14c-10 0-17 8-17 18v14l-9 10h52l-9-10V32c0-10-7-18-17-18z"/><circle class="look-ahead-system-design-case-feed-messaging-bell" cx="240" cy="66" r="6"/>
