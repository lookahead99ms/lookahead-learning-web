<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Chat messages arriving and a feed alert"><title>Chat messages arriving and a feed alert</title>
<style>
.look-ahead-system-design-case-feed-messaging-bg{fill:var(--scene-card,#fff)}
.look-ahead-system-design-case-feed-messaging-t{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33);text-anchor:middle}
.look-ahead-system-design-case-feed-messaging-n{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33);text-anchor:middle}
.look-ahead-system-design-case-feed-messaging-soft{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-accent,#006c73);stroke-width:2.5}
.look-ahead-system-design-case-feed-messaging-card{fill:var(--scene-card,#fff);stroke:var(--scene-ink,#102a33);stroke-width:2.5}
.look-ahead-system-design-case-feed-messaging-line{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:3;stroke-linecap:round}
.look-ahead-system-design-case-feed-messaging-dash{fill:none;stroke:var(--scene-muted,#536970);stroke-width:2.5;stroke-dasharray:5 5;stroke-linecap:round}

.look-ahead-system-design-case-feed-messaging-phone{fill:var(--scene-card,#fff);stroke:var(--scene-ink,#102a33);stroke-width:3}
.look-ahead-system-design-case-feed-messaging-in{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-accent,#006c73);stroke-width:2}
.look-ahead-system-design-case-feed-messaging-out{fill:var(--scene-accent,#006c73)}
.look-ahead-system-design-case-feed-messaging-m1{animation:6s ease-out -3s infinite look-ahead-system-design-case-feed-messaging-a1;transform-box:fill-box;transform-origin:0 100%}
.look-ahead-system-design-case-feed-messaging-m2{animation:6s ease-out -3s infinite look-ahead-system-design-case-feed-messaging-a2;transform-box:fill-box;transform-origin:100% 100%}
.look-ahead-system-design-case-feed-messaging-m3{animation:6s ease-out -3s infinite look-ahead-system-design-case-feed-messaging-a3;transform-box:fill-box;transform-origin:0 100%}
.look-ahead-system-design-case-feed-messaging-tk{fill:none;stroke:var(--scene-good,#1f7a4d);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:6s linear -3s infinite look-ahead-system-design-case-feed-messaging-a4}
.look-ahead-system-design-case-feed-messaging-dt{fill:var(--scene-muted,#536970)}
.look-ahead-system-design-case-feed-messaging-bell{fill:var(--scene-warn,#a15c00);transform-origin:240px 30px;animation:6s ease-in-out -3s infinite look-ahead-system-design-case-feed-messaging-ring}
.look-ahead-system-design-case-feed-messaging-badge{fill:var(--scene-bad,#b3261e)}
.look-ahead-system-design-case-feed-messaging-f1{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-accent,#006c73);stroke-width:2;animation:6s ease-out -3s infinite look-ahead-system-design-case-feed-messaging-s1}
.look-ahead-system-design-case-feed-messaging-f2{animation-name:look-ahead-system-design-case-feed-messaging-s2}
@keyframes look-ahead-system-design-case-feed-messaging-a1{0%,4%{opacity:0;transform:scale(.6)}12%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(.6)}}
@keyframes look-ahead-system-design-case-feed-messaging-a2{0%,24%{opacity:0;transform:scale(.6)}32%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(.6)}}
@keyframes look-ahead-system-design-case-feed-messaging-a3{0%,44%{opacity:0;transform:scale(.6)}52%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(.6)}}
@keyframes look-ahead-system-design-case-feed-messaging-a4{0%,40%{opacity:0}46%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes look-ahead-system-design-case-feed-messaging-ring{0%,30%{transform:rotate(0)}34%{transform:rotate(14deg)}38%{transform:rotate(-14deg)}42%{transform:rotate(8deg)}46%,100%{transform:rotate(0)}}
@keyframes look-ahead-system-design-case-feed-messaging-s1{0%,36%{opacity:0;transform:translateX(30px)}44%,92%{opacity:1;transform:translateX(0)}98%,100%{opacity:0;transform:translateX(30px)}}
@keyframes look-ahead-system-design-case-feed-messaging-s2{0%,44%{opacity:0;transform:translateX(30px)}52%,92%{opacity:1;transform:translateX(0)}98%,100%{opacity:0;transform:translateX(30px)}}
