<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A design holding up against what-if questions"><title>A design holding up against what-if questions</title>
<style>
.look-ahead-system-design-case-studies-bg{fill:var(--scene-card,#fff)}
.look-ahead-system-design-case-studies-t{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33);text-anchor:middle}
.look-ahead-system-design-case-studies-n{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33);text-anchor:middle}
.look-ahead-system-design-case-studies-soft{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-accent,#006c73);stroke-width:2.5}
.look-ahead-system-design-case-studies-card{fill:var(--scene-card,#fff);stroke:var(--scene-ink,#102a33);stroke-width:2.5}
.look-ahead-system-design-case-studies-line{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:3;stroke-linecap:round}
.look-ahead-system-design-case-studies-dash{fill:none;stroke:var(--scene-muted,#536970);stroke-width:2.5;stroke-dasharray:5 5;stroke-linecap:round}

.look-ahead-system-design-case-studies-bub{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-link,#245a88);stroke-width:2.5;transform-origin:250px 40px;animation:6s ease-in-out -3s infinite look-ahead-system-design-case-studies-pop}
.look-ahead-system-design-case-studies-bar{transform-box:fill-box;transform-origin:50% 100%;fill:var(--scene-learn,#0f8a8a)}
.look-ahead-system-design-case-studies-b1{animation:6s ease-in-out -3s infinite look-ahead-system-design-case-studies-g1}.look-ahead-system-design-case-studies-b2{animation:6s ease-in-out -3s infinite look-ahead-system-design-case-studies-g2}.look-ahead-system-design-case-studies-b3{animation:6s ease-in-out -3s infinite look-ahead-system-design-case-studies-g3}
.look-ahead-system-design-case-studies-shield{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-good,#1f7a4d);stroke-width:3.5;transform-origin:60px 92px;animation:6s ease-in-out -3s infinite look-ahead-system-design-case-studies-sh}
.look-ahead-system-design-case-studies-ck{fill:none;stroke:var(--scene-good,#1f7a4d);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.look-ahead-system-design-case-studies-blk{fill:var(--scene-learn,#0f8a8a)}
@keyframes look-ahead-system-design-case-studies-pop{0%,5%{transform:scale(.7);opacity:0}12%,85%{transform:scale(1);opacity:1}95%,100%{transform:scale(.7);opacity:0}}
@keyframes look-ahead-system-design-case-studies-g1{0%,15%{transform:scaleY(.25)}50%,85%{transform:scaleY(.6)}100%{transform:scaleY(.25)}}
@keyframes look-ahead-system-design-case-studies-g2{0%,15%{transform:scaleY(.35)}50%,85%{transform:scaleY(.85)}100%{transform:scaleY(.35)}}
@keyframes look-ahead-system-design-case-studies-g3{0%,15%{transform:scaleY(.45)}50%,85%{transform:scaleY(1)}100%{transform:scaleY(.45)}}
@keyframes look-ahead-system-design-case-studies-sh{0%,40%{transform:scale(1)}55%{transform:scale(1.12)}70%,100%{transform:scale(1)}}
</style>
<rect class="look-ahead-system-design-case-studies-bg" width="320" height="180"/>
<rect class="look-ahead-system-design-case-studies-card" x="14" y="20" width="92" height="140" rx="10"/>
<rect class="look-ahead-system-design-case-studies-blk" x="26" y="32" width="30" height="16" rx="3"/><rect class="look-ahead-system-design-case-studies-blk" x="64" y="32" width="30" height="16" rx="3"/>
<line class="look-ahead-system-design-case-studies-line" x1="26" y1="62" x2="94" y2="62"/><line class="look-ahead-system-design-case-studies-line" x1="26" y1="74" x2="80" y2="74"/>
<path class="look-ahead-system-design-case-studies-shield" d="M60 84 L88 94 V114 C88 130 74 140 60 146 C46 140 32 130 32 114 V94 Z"/>
<path class="look-ahead-system-design-case-studies-ck" d="M47 114l9 9 16-18"/>
<path class="look-ahead-system-design-case-studies-bub" d="M170 12h110a10 10 0 0 1 10 10v36a10 10 0 0 1-10 10h-82l-18 14 4-14h-14a10 10 0 0 1-10-10v-36a10 10 0 0 1 10-10z"/>
<text class="look-ahead-system-design-case-studies-t" x="225" y="46">What if?</text>
<line class="look-ahead-system-design-case-studies-line" x1="132" y1="160" x2="300" y2="160"/>
<rect class="look-ahead-system-design-case-studies-bar look-ahead-system-design-case-studies-b1" x="150" y="100" width="36" height="60" rx="4"/><rect class="look-ahead-system-design-case-studies-bar look-ahead-system-design-case-studies-b2" x="206" y="100" width="36" height="60" rx="4"/><rect class="look-ahead-system-design-case-studies-bar look-ahead-system-design-case-studies-b3" x="262" y="100" width="36" height="60" rx="4"/>
</svg>
