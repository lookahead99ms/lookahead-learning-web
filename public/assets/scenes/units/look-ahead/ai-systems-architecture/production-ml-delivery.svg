<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Labeled data trains a model, a version is promoted to production with rollback ready">
<style>
.look-ahead-ai-systems-architecture-production-ml-delivery-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.look-ahead-ai-systems-architecture-production-ml-delivery-line{animation:look-ahead-ai-systems-architecture-production-ml-delivery-line 6s ease-in-out infinite;animation-delay:-3s;transform-origin:70px 76px}
.look-ahead-ai-systems-architecture-production-ml-delivery-promo{animation:look-ahead-ai-systems-architecture-production-ml-delivery-promo 6s ease-in-out infinite;animation-delay:-3s}
.look-ahead-ai-systems-architecture-production-ml-delivery-roll{animation:look-ahead-ai-systems-architecture-production-ml-delivery-roll 6s ease-in-out infinite;animation-delay:-3s}
@keyframes look-ahead-ai-systems-architecture-production-ml-delivery-line{0%{transform:rotate(-30deg)}50%,100%{transform:rotate(0)}}
@keyframes look-ahead-ai-systems-architecture-production-ml-delivery-promo{0%,20%{transform:translateX(0)}60%,100%{transform:translateX(70px)}}
@keyframes look-ahead-ai-systems-architecture-production-ml-delivery-roll{0%,50%{opacity:.5}70%,90%{opacity:1}100%{opacity:.5}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="14" y="20" width="112" height="112" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2.5"/>
<g fill="var(--scene-good,#1f7a4d)"><circle cx="34" cy="44" r="5"/><circle cx="52" cy="38" r="5"/><circle cx="40" cy="62" r="5"/><circle cx="62" cy="52" r="5"/><circle cx="30" cy="80" r="5"/></g>
<g fill="var(--scene-bad,#b3261e)"><circle cx="86" cy="94" r="5"/><circle cx="104" cy="80" r="5"/><circle cx="96" cy="112" r="5"/><circle cx="72" cy="114" r="5"/><circle cx="108" cy="58" r="5"/></g>
<g class="look-ahead-ai-systems-architecture-production-ml-delivery-line"><path d="M26 112L114 40" stroke="var(--scene-link,#245a88)" stroke-width="4" stroke-linecap="round"/></g>
<path d="M136 76h20" stroke="var(--scene-muted,#536970)" stroke-width="3" stroke-linecap="round"/>
<rect x="160" y="50" width="52" height="52" rx="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"/>
<circle cx="174" cy="66" r="4" fill="var(--scene-accent,#006c73)"/><circle cx="198" cy="66" r="4" fill="var(--scene-accent,#006c73)"/><circle cx="186" cy="88" r="4" fill="var(--scene-accent,#006c73)"/><path d="M174 66l12 22 12-22M174 66h24" fill="none" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<path d="M222 76h86" stroke="var(--scene-line,#cfdfdc)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/>
