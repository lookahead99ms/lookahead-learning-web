<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A user submits a slow AI job, watches progress, and gets a fallback if AI is down">
<style>
.look-ahead-ai-systems-architecture-full-stack-ai-delivery-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.look-ahead-ai-systems-architecture-full-stack-ai-delivery-bar{animation:look-ahead-ai-systems-architecture-full-stack-ai-delivery-bar 6s ease-in-out infinite;animation-delay:-3s}
.look-ahead-ai-systems-architecture-full-stack-ai-delivery-spin{animation:look-ahead-ai-systems-architecture-full-stack-ai-delivery-spin 2s linear infinite;transform-origin:244px 52px}
.look-ahead-ai-systems-architecture-full-stack-ai-delivery-fb{animation:look-ahead-ai-systems-architecture-full-stack-ai-delivery-fb 6s ease-in-out infinite;animation-delay:-3s}
@keyframes look-ahead-ai-systems-architecture-full-stack-ai-delivery-bar{0%{width:10px}80%,100%{width:100px}}
@keyframes look-ahead-ai-systems-architecture-full-stack-ai-delivery-spin{to{transform:rotate(360deg)}}
@keyframes look-ahead-ai-systems-architecture-full-stack-ai-delivery-fb{0%,35%{opacity:.2}55%,90%{opacity:1}100%{opacity:.2}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="16" y="16" width="150" height="116" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2.5"/>
<rect x="16" y="16" width="150" height="20" rx="8" fill="var(--scene-accent-soft,#dcefed)"/>
<circle cx="28" cy="26" r="3.5" fill="var(--scene-bad,#b3261e)"/><circle cx="40" cy="26" r="3.5" fill="var(--scene-warn,#a15c00)"/><circle cx="52" cy="26" r="3.5" fill="var(--scene-good,#1f7a4d)"/>
<rect x="28" y="48" width="100" height="10" rx="5" fill="var(--scene-line,#cfdfdc)"/>
<rect class="look-ahead-ai-systems-architecture-full-stack-ai-delivery-bar" x="28" y="48" width="60" height="10" rx="5" fill="var(--scene-accent,#006c73)"/>
<rect x="28" y="72" width="126" height="14" rx="4" fill="var(--scene-accent-soft,#dcefed)"/><rect x="28" y="94" width="126" height="14" rx="4" fill="var(--scene-accent-soft,#dcefed)"/>
<circle cx="36" cy="79" r="3" fill="var(--scene-good,#1f7a4d)"/><circle cx="36" cy="101" r="3" fill="var(--scene-link,#245a88)"/>
<path d="M172 74h24" stroke="var(--scene-muted,#536970)" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>
<path d="M232 84h36a14 14 0 0 0 0-28 20 20 0 0 0-38-4 16 16 0 0 0 2 32z" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-ahead,#2f6fb3)" stroke-width="2.5" transform="translate(4 -6)"/>
<g class="look-ahead-ai-systems-architecture-full-stack-ai-delivery-spin"><path d="M244 52a8 8 0 1 1-8 8" fill="none" stroke="var(--scene-ahead,#2f6fb3)" stroke-width="3.5" stroke-linecap="round"/></g>
<g class="look-ahead-ai-systems-architecture-full-stack-ai-delivery-fb"><rect x="190" y="108" width="116" height="26" rx="6" fill="var(--scene-warn,#a15c00)"/><path d="M200 121h14M200 121l5-5M200 121l5 5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="222" y="117" width="72" height="8" rx="3" fill="#fff"/></g>
<text x="91" y="156" text-anchor="middle" class="look-ahead-ai-systems-architecture-full-stack-ai-delivery-t">Job in progress</text>
<text x="248" y="156" text-anchor="middle" class="look-ahead-ai-systems-architecture-full-stack-ai-delivery-t">Fallback ready</text>
</svg>
