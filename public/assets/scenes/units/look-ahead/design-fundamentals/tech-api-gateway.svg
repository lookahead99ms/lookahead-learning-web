<path class="tech-api-gateway-sg" style="stroke-width:3" d="M111 34 l5 5 l10 -11"/><path class="tech-api-gateway-sg" style="stroke-width:3" d="M111 62 l5 5 l10 -11"/>
<rect class="tech-api-gateway-card tech-api-gateway-svc" x="190" y="34" width="44" height="44" rx="8" style="stroke-width:2.5"/><rect class="tech-api-gateway-acc" x="202" y="46" width="20" height="8" rx="2"/><rect class="tech-api-gateway-lf" x="202" y="60" width="20" height="8" rx="2"/>
<g class="tech-api-gateway-p1"><rect class="tech-api-gateway-pk" x="46" y="44" width="20" height="14" rx="3"/></g>
