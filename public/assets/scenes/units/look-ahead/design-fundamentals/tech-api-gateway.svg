<g class="tech-api-gateway-no"><circle class="tech-api-gateway-bd" cx="80" cy="51" r="11"/><path class="tech-api-gateway-sb" style="stroke:var(--scene-card,#fff);stroke-width:3" d="M76 47 l8 8 m0 -8 l-8 8"/></g>
<g class="tech-api-gateway-ok"><text class="tech-api-gateway-g" x="120" y="118" font-size="16" font-weight="700" text-anchor="middle">Checks pass ✓</text>
</g><g class="tech-api-gateway-no"><text class="tech-api-gateway-b" x="120" y="118" font-size="16" font-weight="700" text-anchor="middle">401 · no key</text>
</g>
