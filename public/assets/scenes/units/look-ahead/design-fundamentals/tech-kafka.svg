<g class="tech-kafka-r3"><circle class="tech-kafka-gd" cx="60" cy="94" r="3.5"/><rect class="tech-kafka-lf" x="72" y="91" width="100" height="6" rx="2"/></g>
<g class="tech-kafka-r4"><circle class="tech-kafka-acc" cx="60" cy="105" r="3.5"/><rect class="tech-kafka-lf" x="72" y="102" width="80" height="6" rx="2"/></g>
<text class="tech-kafka-g" x="120" y="129" font-size="15" font-weight="700" text-anchor="middle">In order ✓</text>

