.tech-kafka-sa{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tech-kafka-sg{fill:none;stroke:var(--scene-good,#1f7a4d);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tech-kafka-sw{fill:none;stroke:var(--scene-warn,#a15c00);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tech-kafka-sb{fill:none;stroke:var(--scene-bad,#b3261e);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tech-kafka-sm{fill:none;stroke:var(--scene-muted,#536970);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tech-kafka-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tech-kafka-si{fill:none;stroke:var(--scene-ink,#102a33);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tech-kafka-box{animation:tech-kafka-box 8s -3.2s infinite;}
@keyframes tech-kafka-box{0%,4%{transform:translateX(0)}26%,30%{transform:translateX(56px)}52%,56%{transform:translateX(112px)}78%,94%{transform:translateX(168px)}100%{transform:translateX(168px);opacity:0}}
.tech-kafka-r2{animation:tech-kafka-r2 8s -3.2s infinite;}
@keyframes tech-kafka-r2{0%,27%{opacity:0}28%,100%{opacity:1}}
.tech-kafka-r3{animation:tech-kafka-r3 8s -3.2s infinite;}
