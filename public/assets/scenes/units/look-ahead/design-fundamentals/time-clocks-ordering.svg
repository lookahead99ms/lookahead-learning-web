.time-clocks-ordering-sm{fill:none;stroke:var(--scene-muted,#536970);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.time-clocks-ordering-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.time-clocks-ordering-si{fill:none;stroke:var(--scene-ink,#102a33);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.time-clocks-ordering-hd{animation:time-clocks-ordering-hd 4s linear infinite}
@keyframes time-clocks-ordering-hd{to{transform:rotate(360deg)}}
.time-clocks-ordering-c0{animation:time-clocks-ordering-c0 8s -3.2s infinite;}
@keyframes time-clocks-ordering-c0{0%,5%{opacity:0}6%,96%{opacity:1}97%,100%{opacity:0}}
.time-clocks-ordering-c1{animation:time-clocks-ordering-c1 8s -3.2s infinite;}
