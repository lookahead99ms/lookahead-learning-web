<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" role="img" aria-label="Ride requests from each city go to that city's shard, and busy Nairobi fills its shard">
<style>
.sharding-partitioning-t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-ink,#102a33)}
.sharding-partitioning-mu{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-muted,#536970)}
.sharding-partitioning-g{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-good,#1f7a4d)}
.sharding-partitioning-w{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-warn,#a15c00)}
.sharding-partitioning-b{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-bad,#b3261e)}
.sharding-partitioning-a{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-accent,#006c73)}
.sharding-partitioning-mono{font-family:ui-monospace,Menlo,monospace}
.sharding-partitioning-card{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.sharding-partitioning-soft{fill:var(--scene-accent-soft,#dcefed)}
.sharding-partitioning-acc{fill:var(--scene-accent,#006c73)}
.sharding-partitioning-gd{fill:var(--scene-good,#1f7a4d)}
.sharding-partitioning-wn{fill:var(--scene-warn,#a15c00)}
.sharding-partitioning-bd{fill:var(--scene-bad,#b3261e)}
.sharding-partitioning-ink{fill:var(--scene-ink,#102a33)}
.sharding-partitioning-mf{fill:var(--scene-muted,#536970)}
.sharding-partitioning-lf{fill:var(--scene-line,#cfdfdc)}
.sharding-partitioning-cf{fill:var(--scene-card,#fff)}
.sharding-partitioning-sa{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sharding-partitioning-sg{fill:none;stroke:var(--scene-good,#1f7a4d);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sharding-partitioning-sw{fill:none;stroke:var(--scene-warn,#a15c00);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sharding-partitioning-sb{fill:none;stroke:var(--scene-bad,#b3261e);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sharding-partitioning-sm{fill:none;stroke:var(--scene-muted,#536970);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sharding-partitioning-sl{fill:none;stroke:var(--scene-line,#cfdfdc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sharding-partitioning-si{fill:none;stroke:var(--scene-ink,#102a33);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sharding-partitioning-hot{animation:sharding-partitioning-hot 8s -3.2s infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes sharding-partitioning-hot{0%{transform:scaleY(.3)}60%,92%{transform:scaleY(.95)}100%{transform:scaleY(.3)}}
.sharding-partitioning-lvl{transform:scaleY(.32);transform-box:fill-box;transform-origin:center bottom}
.sharding-partitioning-dot{animation:sharding-partitioning-drop 2s linear infinite}
@keyframes sharding-partitioning-drop{0%{opacity:0;transform:translateY(0)}10%{opacity:1}70%{opacity:1;transform:translateY(40px)}80%,100%{opacity:0;transform:translateY(40px)}}
</style>
<rect class="sharding-partitioning-card" x="10" y="38" width="60" height="62" rx="8"/><rect class="sharding-partitioning-lf" x="18" y="46" width="44" height="46" rx="4"/>
<rect class="sharding-partitioning-gd sharding-partitioning-lvl" x="18" y="46" width="44" height="46" rx="4"/>
<circle class="sharding-partitioning-acc sharding-partitioning-dot" cx="40" cy="12" r="5" style="animation-delay:-0.5s"/>
<text class="sharding-partitioning-t" x="40" y="120" font-size="14" font-weight="700" text-anchor="middle">Cairo</text>

<rect class="sharding-partitioning-card" x="90" y="38" width="60" height="62" rx="8"/><rect class="sharding-partitioning-lf" x="98" y="46" width="44" height="46" rx="4"/>
<rect class="sharding-partitioning-gd sharding-partitioning-lvl" x="98" y="46" width="44" height="46" rx="4"/>
<circle class="sharding-partitioning-acc sharding-partitioning-dot" cx="120" cy="12" r="5" style="animation-delay:-1.1s"/>
<text class="sharding-partitioning-t" x="120" y="120" font-size="14" font-weight="700" text-anchor="middle">Lagos</text>

<rect class="sharding-partitioning-card" x="170" y="38" width="60" height="62" rx="8"/><rect class="sharding-partitioning-lf" x="178" y="46" width="44" height="46" rx="4"/>
<rect class="sharding-partitioning-bd sharding-partitioning-hot" x="178" y="46" width="44" height="46" rx="4"/>
<circle class="sharding-partitioning-acc sharding-partitioning-dot" cx="195" cy="12" r="5" style="animation-delay:-1.7s"/>
<circle class="sharding-partitioning-acc sharding-partitioning-dot" cx="205" cy="12" r="5" style="animation-delay:-2.7s"/>
<text class="sharding-partitioning-b" x="200" y="120" font-size="14" font-weight="700" text-anchor="middle">Nairobi</text>

</svg>
