<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" role="img" aria-label="Aigerim raises the New checkout flag from 10% to 50% and many servers switch to the new value together">
<style>
.tech-zookeeper-etcd-t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-ink,#102a33)}
