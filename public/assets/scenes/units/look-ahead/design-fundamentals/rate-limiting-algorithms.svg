.rate-limiting-algorithms-a{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--scene-accent,#006c73)}
.rate-limiting-algorithms-mono{font-family:ui-monospace,Menlo,monospace}
.rate-limiting-algorithms-card{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
