<g class="rate-limiting-algorithms-no"><circle class="rate-limiting-algorithms-bd" cx="139" cy="47" r="11"/><path class="rate-limiting-algorithms-sb" style="stroke:var(--scene-card,#fff);stroke-width:3" d="M134 42 l10 10 m0 -10 l-10 10"/></g>
