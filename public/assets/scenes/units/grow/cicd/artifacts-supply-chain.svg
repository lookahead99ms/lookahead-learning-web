<g class="grow-cicd-artifacts-supply-chain-lens" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="3" stroke-linecap="round">
<circle cx="112" cy="58" r="11" fill="var(--scene-card,#fff)" fill-opacity=".5"/><path d="M120 66l9 9"/>
</g>
</svg>
