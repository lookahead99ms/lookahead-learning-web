<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="The URL holds the shared filter, a draft holds half-typed input, and the server decides if the save worked">
<style>
.grow-react-routing-forms-t{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33)}
.grow-react-routing-forms-m{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33)}
.grow-react-routing-forms-c{animation:grow-react-routing-forms-blink 1s steps(1) infinite}
.grow-react-routing-forms-ap{animation:grow-react-routing-forms-press 6s ease-in-out infinite;transform-origin:150px 104px}
.grow-react-routing-forms-u{animation:grow-react-routing-forms-hl 6s steps(1) infinite}
.grow-react-routing-forms-s{animation:grow-react-routing-forms-ok 6s ease-out infinite;transform-origin:268px 120px}
@keyframes grow-react-routing-forms-blink{50%{opacity:0}}
@keyframes grow-react-routing-forms-press{0%,30%{transform:scale(1)}38%{transform:scale(.92)}46%,100%{transform:scale(1)}}
@keyframes grow-react-routing-forms-hl{0%,40%{fill:var(--scene-card,#fff)}40.1%,85%{fill:var(--scene-accent-soft,#dcefed)}85.1%,100%{fill:var(--scene-card,#fff)}}
@keyframes grow-react-routing-forms-ok{0%,55%{opacity:0;transform:scale(.4)}65%{opacity:1;transform:scale(1.15)}75%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="14" y="14" width="292" height="34" rx="17" stroke="var(--scene-link,#245a88)" stroke-width="2.5" class="grow-react-routing-forms-u" style="animation-delay:-3s"/>
<text x="30" y="36" class="grow-react-routing-forms-m" style="fill:var(--scene-link,#245a88)">?city=Oslo&amp;beds=2</text>
<text x="14" y="76" class="grow-react-routing-forms-t" style="fill:var(--scene-muted,#536970)">draft</text>
<rect x="14" y="84" width="100" height="40" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-grow,#b8457a)" stroke-width="2.5"/>
<text x="26" y="110" class="grow-react-routing-forms-m">$420</text><rect class="grow-react-routing-forms-c" style="animation-delay:-.3s" x="68" y="94" width="3" height="20" fill="var(--scene-grow,#b8457a)"/>
<g class="grow-react-routing-forms-ap" style="animation-delay:-3s"><rect x="124" y="88" width="52" height="32" rx="8" fill="var(--scene-accent,#006c73)"/><text x="150" y="109" text-anchor="middle" class="grow-react-routing-forms-t" style="fill:#fff">Apply</text></g>
<path d="M180 104 H212" stroke="var(--scene-muted,#536970)" stroke-width="2.5" stroke-dasharray="4 4"/>
<rect x="214" y="84" width="92" height="72" rx="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"/>
<text x="260" y="76" text-anchor="middle" class="grow-react-routing-forms-t" style="fill:var(--scene-muted,#536970)">server</text>
<g class="grow-react-routing-forms-s" style="animation-delay:-3s"><circle cx="260" cy="120" r="20" fill="var(--scene-good,#1f7a4d)"/><path d="M250 120 l7 8 l14 -16" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
