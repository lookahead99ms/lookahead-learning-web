<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A deploy sends SIGTERM to a Go service while a driver's end-trip request is in flight; a new request is refused, the shared car still locks, and the driver gets 200 before the server switches off">
<style>
.gs-cs-a,.gs-cs-b,.gs-cs-c,.gs-cs-d,.gs-cs-e,.gs-cs-f,.gs-cs-g,.gs-cs-h{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-5.2s;animation-timing-function:ease-in-out}
.gs-cs-a{animation-name:gs-cs-a}
@keyframes gs-cs-a{0%{transform:translateX(0);opacity:0}3%{opacity:1}16%{transform:translateX(46px);opacity:1}20%,100%{transform:translateX(46px);opacity:0}}
.gs-cs-b{animation-name:gs-cs-b}
@keyframes gs-cs-b{0%,18%{opacity:0}23%,92%{opacity:1}100%{opacity:0}}
.gs-cs-f{animation-name:gs-cs-f}
@keyframes gs-cs-f{0%,22%{transform:translateX(0);opacity:0}24%{opacity:1}34%{transform:translateX(30px);opacity:1}37%,100%{transform:translateX(30px);opacity:0}}
.gs-cs-h{animation-name:gs-cs-h}
@keyframes gs-cs-h{0%,35%{opacity:0}40%,92%{opacity:1}100%{opacity:0}}
.gs-cs-c{animation-name:gs-cs-c}
@keyframes gs-cs-c{0%,38%{transform:translateX(0);opacity:0}41%{opacity:1}48%{transform:translateX(36px);opacity:1}54%,92%{transform:translateX(18px);opacity:1}100%{transform:translateX(18px);opacity:0}}
.gs-cs-d{animation-name:gs-cs-d}
@keyframes gs-cs-d{0%,48%{opacity:0}52%,92%{opacity:1}100%{opacity:0}}
.gs-cs-e{animation-name:gs-cs-e}
@keyframes gs-cs-e{0%,56%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}
.gs-cs-g{animation-name:gs-cs-g}
@keyframes gs-cs-g{0%,76%{opacity:1}82%,96%{opacity:.15}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.gs-cs-a,.gs-cs-b,.gs-cs-c,.gs-cs-d,.gs-cs-e,.gs-cs-f,.gs-cs-g,.gs-cs-h{animation-play-state:paused}}
</style>
