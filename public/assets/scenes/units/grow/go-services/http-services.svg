<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A driver's app sends two start-charging requests to a Go service; the valid one is answered 201 and the charger starts, the one with a misspelled field is refused with 400">
<style>
.gs-hs-a,.gs-hs-b,.gs-hs-c,.gs-hs-d,.gs-hs-e,.gs-hs-f{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6.9s;animation-timing-function:ease-in-out}
.gs-hs-a{animation-name:gs-hs-a}
@keyframes gs-hs-a{0%,4%{transform:translateX(0);opacity:1}24%{transform:translateX(88px);opacity:1}28%,100%{transform:translateX(88px);opacity:0}}
.gs-hs-b{animation-name:gs-hs-b}
@keyframes gs-hs-b{0%,28%{transform:translateX(0);opacity:0}30%{opacity:1}44%{transform:translateX(78px);opacity:1}47%,100%{transform:translateX(78px);opacity:0}}
.gs-hs-c{animation-name:gs-hs-c}
@keyframes gs-hs-c{0%,44%{opacity:0}50%,96%{opacity:1}100%{opacity:0}}
.gs-hs-d{animation-name:gs-hs-d}
@keyframes gs-hs-d{0%,48%{transform:translate(0,0);opacity:0}50%{opacity:1}66%{transform:translate(88px,0);opacity:1}76%{transform:translate(20px,0);opacity:1}80%,100%{transform:translate(20px,0);opacity:0}}
.gs-hs-e{animation-name:gs-hs-e}
@keyframes gs-hs-e{0%,72%{opacity:0}78%,96%{opacity:1}100%{opacity:0}}
.gs-hs-f{animation-name:gs-hs-f}
@keyframes gs-hs-f{0%,26%{opacity:0}30%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.gs-hs-a,.gs-hs-b,.gs-hs-c,.gs-hs-d,.gs-hs-e,.gs-hs-f{animation-play-state:paused}}
</style>
