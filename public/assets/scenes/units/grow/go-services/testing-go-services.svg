<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="An engineer runs go test -race on a laptop: a test request goes through the Go toll trips service to a stand-in for the bank that issued the toll tag and back, two test rows turn green, and the race detector flags a third row when two goroutines touch the same value in the service">
<style>
.gs-tg-a,.gs-tg-b,.gs-tg-c,.gs-tg-d,.gs-tg-e,.gs-tg-f,.gs-tg-g,.gs-tg-h{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6.3s;animation-timing-function:ease-in-out}
.gs-tg-a{animation-name:gs-tg-a}
@keyframes gs-tg-a{0%{transform:translateX(0);opacity:0}3%{opacity:1}16%{transform:translateX(30px);opacity:1}19%,100%{transform:translateX(30px);opacity:0}}
.gs-tg-b{animation-name:gs-tg-b}
@keyframes gs-tg-b{0%,18%{transform:translateX(0);opacity:0}20%{opacity:1}30%{transform:translateX(38px);opacity:1}40%{transform:translateX(0);opacity:1}42%,100%{transform:translateX(0);opacity:0}}
.gs-tg-c{animation-name:gs-tg-c}
@keyframes gs-tg-c{0%,40%{opacity:0}44%,94%{opacity:1}100%{opacity:0}}
.gs-tg-d{animation-name:gs-tg-d}
@keyframes gs-tg-d{0%,50%{opacity:0}54%,94%{opacity:1}100%{opacity:0}}
.gs-tg-e{animation-name:gs-tg-e}
@keyframes gs-tg-e{0%,56%{transform:translateX(0);opacity:0}58%{opacity:1}70%{transform:translateX(16px);opacity:1}94%{transform:translateX(16px);opacity:1}100%{opacity:0}}
.gs-tg-f{animation-name:gs-tg-f}
@keyframes gs-tg-f{0%,56%{transform:translateX(0);opacity:0}58%{opacity:1}70%{transform:translateX(-16px);opacity:1}94%{transform:translateX(-16px);opacity:1}100%{opacity:0}}
.gs-tg-g{animation-name:gs-tg-g}
@keyframes gs-tg-g{0%,70%{opacity:0}74%,94%{opacity:1}100%{opacity:0}}
.gs-tg-h{animation-name:gs-tg-h}
@keyframes gs-tg-h{0%,72%{opacity:0}76%,94%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.gs-tg-a,.gs-tg-b,.gs-tg-c,.gs-tg-d,.gs-tg-e,.gs-tg-f,.gs-tg-g,.gs-tg-h{animation-play-state:paused}}
</style>
