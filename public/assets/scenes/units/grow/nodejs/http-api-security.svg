<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A gate lets a valid tenant request through and bounces an oversized one">
<style>
.grow-nodejs-http-api-security-t{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;fill:var(--scene-ink,#102a33)}
.grow-nodejs-http-api-security-ok{animation:grow-nodejs-http-api-security-pass 6s ease-in-out infinite}
.grow-nodejs-http-api-security-no{animation:grow-nodejs-http-api-security-bounce 6s ease-in-out infinite}
.grow-nodejs-http-api-security-x{animation:grow-nodejs-http-api-security-pulse 6s ease-in-out infinite}
@keyframes grow-nodejs-http-api-security-pass{0%{transform:translateX(0);opacity:0}10%{opacity:1}50%{transform:translateX(150px)}90%{transform:translateX(215px);opacity:1}100%{transform:translateX(220px);opacity:0}}
@keyframes grow-nodejs-http-api-security-bounce{0%{transform:translateX(0);opacity:0}10%{opacity:1}40%{transform:translateX(38px)}55%{transform:translateX(30px)}90%{transform:translateX(-5px);opacity:1}100%{opacity:0}}
@keyframes grow-nodejs-http-api-security-pulse{0%,35%{opacity:0;transform:scale(.6)}45%,80%{opacity:1;transform:scale(1)}100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<line x1="0" y1="55" x2="320" y2="55" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<line x1="0" y1="125" x2="320" y2="125" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<rect x="136" y="20" width="48" height="140" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<path d="M160 70 l20 7 v18 c0 14 -10 22 -20 27 c-10 -5 -20 -13 -20 -27 v-18z" fill="var(--scene-accent,#006c73)" transform="translate(0,-4) scale(1)" />
<path d="M151 92 l7 7 l12 -14" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="grow-nodejs-http-api-security-ok" style="animation-delay:-3s"><rect x="12" y="40" width="64" height="30" rx="6" fill="var(--scene-good,#1f7a4d)"/><text x="44" y="61" text-anchor="middle" class="grow-nodejs-http-api-security-t" style="fill:#fff">tenant</text></g>
<g class="grow-nodejs-http-api-security-no" style="animation-delay:-2.6s"><rect x="12" y="108" width="72" height="40" rx="6" fill="var(--scene-bad,#b3261e)"/><text x="48" y="133" text-anchor="middle" class="grow-nodejs-http-api-security-t" style="fill:#fff">10 MB</text></g>
<g class="grow-nodejs-http-api-security-x" style="animation-delay:-2.6s;transform-origin:100px 94px"><circle cx="100" cy="94" r="11" fill="var(--scene-card,#fff)" stroke="var(--scene-bad,#b3261e)" stroke-width="3"/><path d="M95 89 l10 10 M105 89 l-10 10" stroke="var(--scene-bad,#b3261e)" stroke-width="3" stroke-linecap="round"/></g>
<text x="285" y="104" text-anchor="middle" class="grow-nodejs-http-api-security-t" style="fill:var(--scene-good,#1f7a4d)">allowed</text>
<text x="160" y="176" text-anchor="middle" class="grow-nodejs-http-api-security-t" style="fill:var(--scene-bad,#b3261e);display:none">x</text>
</svg>
