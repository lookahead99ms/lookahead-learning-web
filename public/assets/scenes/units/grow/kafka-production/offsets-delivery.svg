<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A rider docks a bike; the ride-ended event is added at offset 3 of the Kafka log, the billing server writes one charge row for it to the database, and only then does the committed offset move past it">
<style>
.kod-t{font:600 9px system-ui,sans-serif;fill:var(--scene-muted,#4d6268)}
.kod-loop{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6.6s;animation-timing-function:linear}
.kod-dot{animation-name:kod-dot}
@keyframes kod-dot{0%,6%{transform:translate(0,0);opacity:0}8%{transform:translate(0,0);opacity:1}24%,30%{transform:translate(96px,-4px);opacity:1}44%,50%{transform:translate(147px,-36px);opacity:1}62%{transform:translate(196px,6px);opacity:1}64%,100%{transform:translate(196px,6px);opacity:0}}
.kod-cell{animation-name:kod-cell}
@keyframes kod-cell{0%,25%{opacity:0}27%,97%{opacity:1}100%{opacity:0}}
.kod-row{animation-name:kod-row}
@keyframes kod-row{0%,62%{opacity:0}64%,97%{opacity:1}100%{opacity:0}}
.kod-ok{animation-name:kod-ok}
@keyframes kod-ok{0%,64%{opacity:0}67%,97%{opacity:1}100%{opacity:0}}
.kod-mark{animation-name:kod-mark}
@keyframes kod-mark{0%,70%{transform:translate(0,0)}78%,97%{transform:translate(22px,0)}100%{transform:translate(0,0)}}
.kod-led{animation-name:kod-led}
@keyframes kod-led{0%,2%,10%,100%{opacity:1}5%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.kod-loop{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<!-- rider and the bike she just docked -->
<ellipse cx="46" cy="146" rx="38" ry="6" fill="var(--scene-ink,#102a33)" opacity="0.09"/>
<circle cx="34" cy="50" r="11" fill="var(--scene-accent,#006c73)"/>
<path d="M14 86a20 20 0 0 1 40 0Z" fill="var(--scene-accent,#006c73)"/>
<g fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<circle cx="24" cy="128" r="13"/><circle cx="62" cy="128" r="13"/>
<path d="M24 128L38 106H56L62 128M38 106L46 128H24M56 106L54 98H60M34 100H42"/>
</g>
<!-- dock post with its status light -->
<path d="M72 98l4-4h10l-4 4Z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M82 98l4-4v46l-4 4Z" fill="var(--scene-ink,#102a33)" opacity="0.14"/>
<rect x="72" y="98" width="10" height="46" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<circle class="kod-loop kod-led" cx="77" cy="106" r="2.5" fill="var(--scene-good,#1f7a4d)"/>
<!-- wires: dock to the log, log to the billing server, server to the database -->
<path d="M84 104L98 101M188 99L206 70M229 84L270 106" stroke="var(--scene-muted,#4d6268)" stroke-width="1.5" stroke-dasharray="3 5" fill="none" opacity="0.6"/>
<!-- Kafka partition log: offsets 0 to 2 already there, offset 3 is the new ride -->
<text class="kod-t" x="98" y="80">ride-ended</text>
<ellipse cx="142" cy="128" rx="48" ry="5" fill="var(--scene-ink,#102a33)" opacity="0.08"/>
<rect x="96" y="88" width="94" height="28" rx="4" fill="var(--scene-line,#cfdfdc)"/>
<rect x="96" y="114" width="94" height="4" rx="2" fill="var(--scene-ink,#102a33)" opacity="0.14"/>
<g fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="1.5">
<rect x="100" y="92" width="19" height="20" rx="3"/><rect x="122" y="92" width="19" height="20" rx="3"/><rect x="144" y="92" width="19" height="20" rx="3"/>
</g>
<rect class="kod-loop kod-cell" x="166" y="92" width="19" height="20" rx="3" fill="var(--scene-grow,#b8457a)"/>
<!-- the committed offset: a marker that moves only after the charge is saved -->
<g class="kod-loop kod-mark">
<path d="M165 132l4-8 4 8Z" fill="var(--scene-warn,#b26a00)"/>
<rect x="168" y="132" width="2" height="6" fill="var(--scene-warn,#b26a00)"/>
</g>
<text class="kod-t" x="180" y="150" text-anchor="middle">committed</text>
<!-- billing server -->
<ellipse cx="229" cy="96" rx="26" ry="4" fill="var(--scene-ink,#102a33)" opacity="0.08"/>
<path d="M206 58l6-6h40l-6 6Z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M246 58l6-6v26l-6 6Z" fill="var(--scene-ink,#102a33)" opacity="0.14"/>
<rect x="206" y="58" width="40" height="26" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<path d="M212 66H234M212 76H230" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"/>
<circle cx="240" cy="66" r="2.5" fill="var(--scene-good,#1f7a4d)"/><circle cx="240" cy="76" r="2.5" fill="var(--scene-good,#1f7a4d)"/>
<!-- billing database: one charge row per ride -->
<ellipse cx="282" cy="156" rx="30" ry="5" fill="var(--scene-ink,#102a33)" opacity="0.09"/>
<path d="M256 104v42a26 7 0 0 0 52 0v-42Z" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<ellipse cx="282" cy="104" rx="26" ry="7" fill="var(--scene-line,#cfdfdc)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<rect x="264" y="116" width="10" height="6" rx="2" fill="var(--scene-line,#cfdfdc)"/><rect x="277" y="116" width="22" height="6" rx="2" fill="var(--scene-accent-soft,#dcefed)"/>
<rect x="264" y="126" width="10" height="6" rx="2" fill="var(--scene-line,#cfdfdc)"/><rect x="277" y="126" width="18" height="6" rx="2" fill="var(--scene-accent-soft,#dcefed)"/>
<g class="kod-loop kod-row"><rect x="264" y="136" width="10" height="6" rx="2" fill="var(--scene-grow,#b8457a)"/><rect x="277" y="136" width="24" height="6" rx="2" fill="var(--scene-grow,#b8457a)"/></g>
<g class="kod-loop kod-ok"><circle cx="306" cy="98" r="9" fill="var(--scene-good,#1f7a4d)"/><path d="M302 98l3 3 6-6" stroke="var(--scene-card,#fff)" stroke-width="2.2" stroke-linecap="round" fill="none"/></g>
<!-- the ride-ended event travelling dock -> log -> server -> database -->
<g class="kod-loop kod-dot" opacity="0"><circle cx="80" cy="104" r="5" fill="var(--scene-grow,#b8457a)"/></g>
</svg>
