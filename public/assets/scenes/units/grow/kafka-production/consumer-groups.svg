<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Web servers write log lines into the six partitions of the app-logs topic; a third indexer joins the group and only partitions 4 and 5 move to it, while the other four keep flowing to their indexers and on to the search cluster">
<style>
.kcg-t{font:600 9px system-ui,sans-serif;fill:var(--scene-muted,#4d6268)}
.kcg-loop{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6.4s;animation-timing-function:linear}
.kcg-d0{animation-name:kcg-d0}
@keyframes kcg-d0{0%{transform:translate(0,0);opacity:0}3%{opacity:1}38%{transform:translate(46px,0px);opacity:1}40%,48%{transform:translate(46px,0px);opacity:0}49%{transform:translate(0,0);opacity:0}52%{opacity:1}88%{transform:translate(46px,0px);opacity:1}90%,100%{transform:translate(46px,0px);opacity:0}}
.kcg-d1{animation-name:kcg-d1}
@keyframes kcg-d1{0%{transform:translate(0,0);opacity:0}3%{opacity:1}38%{transform:translate(46px,-18px);opacity:1}40%,48%{transform:translate(46px,-18px);opacity:0}49%{transform:translate(0,0);opacity:0}52%{opacity:1}88%{transform:translate(46px,-18px);opacity:1}90%,100%{transform:translate(46px,-18px);opacity:0}}
.kcg-d2{animation-name:kcg-d2}
@keyframes kcg-d2{0%{transform:translate(0,0);opacity:0}3%{opacity:1}38%{transform:translate(46px,12px);opacity:1}40%,48%{transform:translate(46px,12px);opacity:0}49%{transform:translate(0,0);opacity:0}52%{opacity:1}88%{transform:translate(46px,12px);opacity:1}90%,100%{transform:translate(46px,12px);opacity:0}}
.kcg-d3{animation-name:kcg-d3}
@keyframes kcg-d3{0%{transform:translate(0,0);opacity:0}3%{opacity:1}38%{transform:translate(46px,-6px);opacity:1}40%,48%{transform:translate(46px,-6px);opacity:0}49%{transform:translate(0,0);opacity:0}52%{opacity:1}88%{transform:translate(46px,-6px);opacity:1}90%,100%{transform:translate(46px,-6px);opacity:0}}
.kcg-d4{animation-name:kcg-d4}
@keyframes kcg-d4{0%{transform:translate(0,0);opacity:0}3%{opacity:1}24%{transform:translate(46px,-24px);opacity:1}26%,54%{transform:translate(46px,-24px);opacity:0}55%{transform:translate(0,0);opacity:0}58%{opacity:1}88%{transform:translate(46px,24px);opacity:1}90%,100%{transform:translate(46px,24px);opacity:0}}
.kcg-d5{animation-name:kcg-d5}
@keyframes kcg-d5{0%{transform:translate(0,0);opacity:0}3%{opacity:1}24%{transform:translate(46px,-42px);opacity:1}26%,54%{transform:translate(46px,-42px);opacity:0}55%{transform:translate(0,0);opacity:0}58%{opacity:1}88%{transform:translate(46px,6px);opacity:1}90%,100%{transform:translate(46px,6px);opacity:0}}
.kcg-old{animation-name:kcg-old}@keyframes kcg-old{0%,30%{opacity:.6}36%,97%{opacity:0}100%{opacity:.6}}
.kcg-new{animation-name:kcg-new}@keyframes kcg-new{0%,36%{opacity:0}42%,97%{opacity:.6}100%{opacity:0}}
.kcg-pod{animation-name:kcg-pod}@keyframes kcg-pod{0%,28%{opacity:0}34%,97%{opacity:1}100%{opacity:0}}
.kcg-ok{animation-name:kcg-ok}@keyframes kcg-ok{0%,70%{opacity:0}74%,97%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.kcg-loop{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<!-- web servers writing log lines -->
