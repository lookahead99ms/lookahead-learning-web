<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A person posts comments from a phone onto a Kafka topic tray; a moderation server reads them in order, a broken comment with a red header drops into a dead-letter tray below with a warning mark, and the next good comment travels on to a laptop where the thread shows it with a check">
<style>
.krd-m{font:700 10px ui-monospace,Menlo,monospace;fill:var(--scene-text,#102a33)}
.krd-loop{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-7s;animation-timing-function:linear}
.krd-a{animation-name:krd-a}
@keyframes krd-a{0%{transform:translate(0,0);opacity:0}4%{opacity:1}22%{transform:translate(62px,0);opacity:1}38%{transform:translate(62px,0)}50%{transform:translate(62px,58px);opacity:1}97%{transform:translate(62px,58px);opacity:1}100%{transform:translate(62px,58px);opacity:0}}
.krd-b{animation-name:krd-b}
@keyframes krd-b{0%,44%{transform:translate(0,0);opacity:0}48%{opacity:1}62%{transform:translate(72px,0);opacity:1}80%{transform:translate(150px,-12px);opacity:1}84%,100%{transform:translate(150px,-12px);opacity:0}}
.krd-c{animation-name:krd-c}
@keyframes krd-c{0%,48%{opacity:0}52%,97%{opacity:1}100%{opacity:0}}
.krd-d{animation-name:krd-d}
@keyframes krd-d{0%,80%{opacity:0}84%,97%{opacity:1}100%{opacity:0}}
.krd-e{animation-name:krd-e;transform-origin:262px 62px}
@keyframes krd-e{0%,80%{transform:scaleX(0)}86%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.krd-loop{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<!-- a person posting from a phone -->
<ellipse cx="34" cy="124" rx="24" ry="4" fill="var(--scene-ink,#102a33)" opacity="0.08"/>
<circle cx="30" cy="62" r="9" fill="var(--scene-accent,#006c73)"/>
<path d="M14 98a16 16 0 0 1 32 0V118H14Z" fill="var(--scene-accent,#006c73)"/>
<rect x="38" y="80" width="16" height="28" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<rect x="41" y="85" width="10" height="3" rx="1" fill="var(--scene-accent-soft,#dcefed)"/>
<rect x="41" y="91" width="10" height="3" rx="1" fill="var(--scene-accent-soft,#dcefed)"/>
<!-- wires -->
<path d="M58 92H70M196 70H236" stroke="var(--scene-muted,#4d6268)" stroke-width="1.5" stroke-dasharray="3 5" fill="none" opacity="0.6"/>
<!-- the topic: a tray of comment cards, read left to right -->
<ellipse cx="118" cy="114" rx="50" ry="4" fill="var(--scene-ink,#102a33)" opacity="0.09"/>
<path d="M72 106h92l-6 6h-80Z" fill="var(--scene-ink,#102a33)" opacity="0.14"/>
<rect x="72" y="72" width="92" height="34" rx="4" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<g transform="translate(78 78)"><rect width="18" height="22" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-muted,#4d6268)" stroke-width="1.2"/><rect width="18" height="5" rx="1.5" fill="var(--scene-accent,#006c73)"/></g>
<!-- the moderation server -->
<ellipse cx="180" cy="114" rx="20" ry="3.5" fill="var(--scene-ink,#102a33)" opacity="0.08"/>
<path d="M166 46l5-5h22l-5 5Z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M188 46l5-5v58l-5 5Z" fill="var(--scene-ink,#102a33)" opacity="0.14"/>
<rect x="166" y="46" width="22" height="58" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<rect x="170" y="54" width="14" height="4" rx="1" fill="var(--scene-line,#cfdfdc)"/>
<rect x="170" y="64" width="14" height="4" rx="1" fill="var(--scene-line,#cfdfdc)"/>
<circle cx="177" cy="94" r="2" fill="var(--scene-good,#1f7a4d)"/>
<!-- the dead-letter tray below -->
<ellipse cx="160" cy="166" rx="42" ry="4" fill="var(--scene-ink,#102a33)" opacity="0.09"/>
<path d="M124 160h72l-6 5h-60Z" fill="var(--scene-ink,#102a33)" opacity="0.14"/>
<rect x="124" y="128" width="72" height="32" rx="4" fill="var(--scene-card,#fff)" stroke="var(--scene-muted,#4d6268)" stroke-width="2" stroke-dasharray="4 3"/>
<text class="krd-m" x="178" y="148" text-anchor="middle">DLT</text>
<path d="M150 108v14" stroke="var(--scene-muted,#4d6268)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>
<!-- the broken comment: red header, along the tray, then down into the DLT -->
<g class="krd-loop krd-a"><g transform="translate(78 78)"><rect width="18" height="22" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-bad,#b3261e)" stroke-width="1.4"/><rect width="18" height="5" rx="1.5" fill="var(--scene-bad,#b3261e)"/><path d="M5 12l8 6M13 12l-8 6" stroke="var(--scene-bad,#b3261e)" stroke-width="1.6"/></g></g>
<g class="krd-loop krd-c"><path d="M120 128l8-14 8 14Z" fill="var(--scene-warn,#b26a00)"/><rect x="127" y="119" width="2" height="5" fill="var(--scene-card,#fff)"/><rect x="127" y="125.5" width="2" height="2" fill="var(--scene-card,#fff)"/></g>
<!-- the next good comment: along the tray, through the server, to the laptop -->
<g class="krd-loop krd-b"><g transform="translate(78 78)"><rect width="18" height="22" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-accent,#006c73)" stroke-width="1.4"/><rect width="18" height="5" rx="1.5" fill="var(--scene-accent,#006c73)"/></g></g>
<!-- a reader behind a laptop with the thread -->
<ellipse cx="270" cy="124" rx="40" ry="5" fill="var(--scene-ink,#102a33)" opacity="0.09"/>
<circle cx="292" cy="22" r="9" fill="var(--scene-link,#1f5f8b)"/>
<path d="M274 54a18 18 0 0 1 36 0V72H274Z" fill="var(--scene-link,#1f5f8b)"/>
<rect x="238" y="40" width="64" height="44" rx="4" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<rect x="246" y="48" width="40" height="5" rx="1.5" fill="var(--scene-accent-soft,#dcefed)"/>
<g class="krd-loop krd-e"><rect x="246" y="60" width="32" height="5" rx="1.5" fill="var(--scene-accent,#006c73)"/></g>
<rect x="246" y="72" width="26" height="5" rx="1.5" fill="var(--scene-line,#cfdfdc)"/>
<path d="M232 84h78l-6 8h-66Z" fill="var(--scene-line,#cfdfdc)"/>
<g class="krd-loop krd-d"><circle cx="226" cy="44" r="7" fill="var(--scene-good,#1f7a4d)"/><path d="M222.5 44l2.5 2.5 4.5-5" stroke="var(--scene-card,#fff)" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>
</svg>
