<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="system-ui, sans-serif">
<style>
.grow-advanced-java-io-nio-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-advanced-java-io-nio-fill{transform-origin:28px 0;animation:grow-advanced-java-io-nio-f 6s linear infinite;animation-delay:-3s}
.grow-advanced-java-io-nio-pkg{animation:grow-advanced-java-io-nio-m 6s ease-in-out infinite;animation-delay:-3s}
.grow-advanced-java-io-nio-new{animation:grow-advanced-java-io-nio-n 6s ease-in-out infinite;animation-delay:-3s}
.grow-advanced-java-io-nio-old{animation:grow-advanced-java-io-nio-o 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-advanced-java-io-nio-f{0%{transform:scaleX(.05)}50%,100%{transform:scaleX(1)}}
@keyframes grow-advanced-java-io-nio-m{0%,50%{transform:translateX(0);opacity:1}75%{transform:translateX(150px);opacity:1}76%,100%{transform:translateX(150px);opacity:0}}
@keyframes grow-advanced-java-io-nio-n{0%,70%{opacity:0}78%,100%{opacity:1}}
@keyframes grow-advanced-java-io-nio-o{0%,70%{opacity:1}78%,100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="14" y="30" width="94" height="86" rx="8" fill="none" stroke="var(--scene-line,#cfdfdc)" stroke-dasharray="4 3"/>
<g class="grow-advanced-java-io-nio-pkg">
<rect x="26" y="42" width="70" height="60" rx="6" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<rect x="34" y="56" width="54" height="6" rx="3" fill="var(--scene-line,#cfdfdc)"/>
<rect x="34" y="70" width="54" height="6" rx="3" fill="var(--scene-line,#cfdfdc)"/>
<rect class="grow-advanced-java-io-nio-fill" x="28" y="86" width="60" height="8" rx="4" fill="var(--scene-learn,#0f8a8a)"/>
</g>
<text class="grow-advanced-java-io-nio-t" x="61" y="138" text-anchor="middle">staging</text>
<path d="M112 72h92" stroke="var(--scene-accent,#006c73)" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M204 64l10 8-10 8z" fill="var(--scene-accent,#006c73)"/>
<text class="grow-advanced-java-io-nio-t" x="160" y="58" text-anchor="middle">atomic move</text>
<rect x="214" y="30" width="92" height="86" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<g class="grow-advanced-java-io-nio-old"><rect x="236" y="42" width="48" height="60" rx="6" fill="var(--scene-line,#cfdfdc)"/><rect x="244" y="58" width="32" height="6" rx="3" fill="var(--scene-muted,#536970)"/><rect x="244" y="72" width="32" height="6" rx="3" fill="var(--scene-muted,#536970)"/></g>
<g class="grow-advanced-java-io-nio-new"><rect x="236" y="42" width="48" height="60" rx="6" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2"/><path d="M247 74l8 8 15-17" fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(260 148)"><path d="M-22 0q22-20 44 0q-22 20-44 0z" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2.5"/><circle r="6" fill="var(--scene-link,#245a88)"/></g>
<text class="grow-advanced-java-io-nio-t" x="210" y="153" text-anchor="end">readers</text>
