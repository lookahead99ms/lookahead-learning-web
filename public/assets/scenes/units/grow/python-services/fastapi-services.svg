<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A travel site sends two bookings for the same SUV to a FastAPI rentals service; the first is answered 201 and the car gets a booking tag, the second is refused with 409 because the car is taken">
<style>
.pyfa-a,.pyfa-b,.pyfa-c,.pyfa-d,.pyfa-e,.pyfa-f{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6.9s;animation-timing-function:ease-in-out}
.pyfa-a{animation-name:pyfa-a}
@keyframes pyfa-a{0%,4%{transform:translateX(0);opacity:1}24%{transform:translateX(88px);opacity:1}28%,100%{transform:translateX(88px);opacity:0}}
.pyfa-b{animation-name:pyfa-b}
@keyframes pyfa-b{0%,28%{transform:translateX(0);opacity:0}30%{opacity:1}44%{transform:translateX(36px);opacity:1}47%,100%{transform:translateX(36px);opacity:0}}
.pyfa-c{animation-name:pyfa-c}
@keyframes pyfa-c{0%,44%{opacity:0}50%,96%{opacity:1}100%{opacity:0}}
.pyfa-d{animation-name:pyfa-d}
@keyframes pyfa-d{0%,48%{transform:translate(0,0);opacity:0}50%{opacity:1}66%{transform:translate(88px,0);opacity:1}76%{transform:translate(20px,0);opacity:1}80%,100%{transform:translate(20px,0);opacity:0}}
.pyfa-e{animation-name:pyfa-e}
@keyframes pyfa-e{0%,72%{opacity:0}78%,96%{opacity:1}100%{opacity:0}}
.pyfa-f{animation-name:pyfa-f}
@keyframes pyfa-f{0%,26%{opacity:0}30%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.pyfa-a,.pyfa-b,.pyfa-c,.pyfa-d,.pyfa-e,.pyfa-f{animation-play-state:paused}}
</style>
