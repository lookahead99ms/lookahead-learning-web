<g class="pyfa-f"><rect x="62" y="26" width="46" height="22" rx="11" fill="var(--scene-good,#1f7a4d)"/><text x="85" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--scene-card,#fff)">201</text></g>
