<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A rider taps a bank card at a transit gate four times in one day; each tap travels to the fares service, which writes a charge into the day's ledger: 2.80, 2.80, 2.80 and then only 0.10, because the daily cap of 8.50 is reached, and a test's check mark confirms the capped total">
<style>
.pyts-a,.pyts-b,.pyts-c,.pyts-d,.pyts-e,.pyts-f,.pyts-g{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-7.2s;animation-timing-function:ease-in-out}
.pyts-a{animation-name:pyts-a}
@keyframes pyts-a{0%{transform:translateX(0);opacity:0}2%{opacity:1}12%{transform:translateX(70px);opacity:1}14%,22%{transform:translateX(70px);opacity:0}24%{transform:translateX(0);opacity:1}34%{transform:translateX(70px);opacity:1}36%,44%{transform:translateX(70px);opacity:0}46%{transform:translateX(0);opacity:1}56%{transform:translateX(70px);opacity:1}58%,66%{transform:translateX(70px);opacity:0}68%{transform:translateX(0);opacity:1}78%{transform:translateX(70px);opacity:1}80%,100%{transform:translateX(70px);opacity:0}}
.pyts-b{animation-name:pyts-b}
@keyframes pyts-b{0%,12%{opacity:0}16%,96%{opacity:1}100%{opacity:0}}
.pyts-c{animation-name:pyts-c}
@keyframes pyts-c{0%,34%{opacity:0}38%,96%{opacity:1}100%{opacity:0}}
.pyts-d{animation-name:pyts-d}
@keyframes pyts-d{0%,56%{opacity:0}60%,96%{opacity:1}100%{opacity:0}}
.pyts-e{animation-name:pyts-e}
@keyframes pyts-e{0%,78%{opacity:0}82%,96%{opacity:1}100%{opacity:0}}
.pyts-f{animation-name:pyts-f}
@keyframes pyts-f{0%,84%{opacity:0;transform:scale(.6)}88%,96%{opacity:1;transform:scale(1)}100%{opacity:0}}
.pyts-g{animation-name:pyts-g}
@keyframes pyts-g{0%,2%,22%,24%,44%,46%,66%,68%,88%,100%{opacity:0}4%,10%,26%,32%,48%,54%,70%,76%{opacity:1}}
@media (prefers-reduced-motion: reduce){.pyts-a,.pyts-b,.pyts-c,.pyts-d,.pyts-e,.pyts-f,.pyts-g{animation-play-state:paused}}
</style>
