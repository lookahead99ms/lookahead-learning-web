<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A seller's app sends a new gig to the gigs API; a validation gate in front of the service stops the request because one field is wrong and answers 422, then the corrected request passes, the gig is listed and the answer is 201">
<style>
.pydv-a,.pydv-b,.pydv-c,.pydv-e,.pydv-f,.pydv-g{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-3s;animation-timing-function:ease-in-out}
.pydv-a{animation-name:pydv-a}
@keyframes pydv-a{0%,4%{transform:translateX(0);opacity:1}20%,44%{transform:translateX(62px);opacity:1}48%,100%{transform:translateX(62px);opacity:0}}
.pydv-c{animation-name:pydv-c}
@keyframes pydv-c{0%,21%{opacity:0}24%,44%{opacity:1}48%,100%{opacity:0}}
.pydv-e{animation-name:pydv-e}
@keyframes pydv-e{0%,25%{opacity:0}29%,46%{opacity:1}50%,100%{opacity:0}}
.pydv-b{animation-name:pydv-b}
@keyframes pydv-b{0%,50%{transform:translateX(0);opacity:0}53%{transform:translateX(0);opacity:1}62%{transform:translateX(62px);opacity:1}72%{transform:translateX(118px);opacity:1}75%,100%{transform:translateX(118px);opacity:0}}
.pydv-f{animation-name:pydv-f}
@keyframes pydv-f{0%,73%{opacity:0}77%,96%{opacity:1}100%{opacity:0}}
.pydv-g{animation-name:pydv-g}
@keyframes pydv-g{0%,60%{opacity:0}63%,70%{opacity:1}74%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.pydv-a,.pydv-b,.pydv-c,.pydv-e,.pydv-f,.pydv-g{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
