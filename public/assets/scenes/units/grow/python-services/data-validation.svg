<g class="pydv-f"><rect x="224" y="128" width="32" height="16" rx="3" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="1.5"/><rect x="228" y="132" width="10" height="8" rx="1.5" fill="var(--scene-accent,#006c73)"/><rect x="241" y="133" width="11" height="3" rx="1.5" fill="var(--scene-accent,#006c73)"/><rect x="241" y="138" width="7" height="3" rx="1.5" fill="var(--scene-good,#1f7a4d)"/></g>
<g class="pydv-a"><rect x="84" y="90" width="30" height="40" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-grow,#7a4fb3)" stroke-width="2"/><rect x="84" y="90" width="30" height="6" rx="2" fill="var(--scene-grow,#7a4fb3)"/><g fill="var(--scene-line,#cfdfdc)"><rect x="88" y="100" width="22" height="4" rx="2"/><rect x="88" y="108" width="22" height="4" rx="2"/><rect x="88" y="116" width="22" height="4" rx="2"/><rect x="88" y="124" width="14" height="3" rx="1.5"/></g>
