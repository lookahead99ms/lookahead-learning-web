<g class="pydv-b"><rect x="84" y="90" width="30" height="40" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-grow,#7a4fb3)" stroke-width="2"/><rect x="84" y="90" width="30" height="6" rx="2" fill="var(--scene-grow,#7a4fb3)"/><g fill="var(--scene-line,#cfdfdc)"><rect x="88" y="100" width="22" height="4" rx="2"/><rect x="88" y="108" width="22" height="4" rx="2"/><rect x="88" y="116" width="22" height="4" rx="2"/><rect x="88" y="124" width="14" height="3" rx="1.5"/></g>
<g class="pydv-g"><circle cx="118" cy="86" r="8" fill="var(--scene-good,#1f7a4d)"/><path d="M114 86l3 3 5-6" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g class="pydv-e"><rect x="62" y="26" width="46" height="22" rx="11" fill="var(--scene-bad,#b3261e)"/><text x="85" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--scene-card,#fff)">422</text></g>
<g class="pydv-f"><rect x="62" y="26" width="46" height="22" rx="11" fill="var(--scene-good,#1f7a4d)"/><text x="85" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="var(--scene-card,#fff)">201</text></g>
</svg>
