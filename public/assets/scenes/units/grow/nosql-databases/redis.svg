<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Viewers of a live stream tap like; two chat servers send each like to Redis as one increment, and the comment's count climbs from 41 to 44 with none lost">
<style>
.nosql-redis-t{font:600 11px system-ui,sans-serif;fill:var(--scene-muted,#4d6268)}
.nosql-redis-v{font:700 16px ui-monospace,Menlo,monospace;fill:var(--scene-ink,#102a33)}
.nosql-redis-loop{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-7.2s;animation-timing-function:linear}
.nosql-redis-h1{animation-name:nosql-redis-h1}
.nosql-redis-h2{animation-name:nosql-redis-h2}
.nosql-redis-h3{animation-name:nosql-redis-h3}
@keyframes nosql-redis-h1{0%,4%{transform:translate(0,0);opacity:0}6%{opacity:1}14%{transform:translate(52px,-26px);opacity:1}26%{transform:translate(152px,-10px);opacity:1}29%,100%{transform:translate(152px,-10px);opacity:0}}
@keyframes nosql-redis-h2{0%,24%{transform:translate(0,0);opacity:0}26%{opacity:1}34%{transform:translate(52px,24px);opacity:1}46%{transform:translate(152px,8px);opacity:1}49%,100%{transform:translate(152px,8px);opacity:0}}
@keyframes nosql-redis-h3{0%,44%{transform:translate(0,0);opacity:0}46%{opacity:1}54%{transform:translate(52px,-26px);opacity:1}66%{transform:translate(152px,-10px);opacity:1}69%,100%{transform:translate(152px,-10px);opacity:0}}
.nosql-redis-c41{animation-name:nosql-redis-c41}
.nosql-redis-c42{animation-name:nosql-redis-c42}
.nosql-redis-c43{animation-name:nosql-redis-c43}
.nosql-redis-c44{animation-name:nosql-redis-c44}
@keyframes nosql-redis-c41{0%,27%{opacity:1}28%,100%{opacity:0}}
@keyframes nosql-redis-c42{0%,27%{opacity:0}28%,47%{opacity:1}48%,100%{opacity:0}}
@keyframes nosql-redis-c43{0%,47%{opacity:0}48%,67%{opacity:1}68%,100%{opacity:0}}
@keyframes nosql-redis-c44{0%,67%{opacity:0}68%,100%{opacity:1}}
.nosql-redis-ok{animation-name:nosql-redis-ok}
@keyframes nosql-redis-ok{0%,70%{opacity:0}74%,97%{opacity:1}100%{opacity:0}}
.nosql-redis-tap{animation-name:nosql-redis-tap;transform-origin:58px 134px}
@keyframes nosql-redis-tap{0%,3%,22%,23%,42%,43%,62%,100%{transform:scale(1)}6%,26%,46%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.nosql-redis-loop{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<!-- viewer holding a phone with the live stream -->
<ellipse cx="44" cy="156" rx="32" ry="6" fill="var(--scene-ink,#102a33)" opacity="0.09"/>
<circle cx="44" cy="40" r="12" fill="var(--scene-accent,#006c73)"/>
<path d="M22 74a22 22 0 0 1 44 0Z" fill="var(--scene-accent,#006c73)"/>
<rect x="18" y="66" width="52" height="84" rx="8" fill="var(--scene-ink,#102a33)"/>
<rect x="22" y="72" width="44" height="70" rx="4" fill="var(--scene-card,#fff)"/>
<rect x="24" y="74" width="40" height="26" rx="3" fill="var(--scene-accent-soft,#dcefed)"/>
<rect x="26" y="76" width="18" height="9" rx="2" fill="var(--scene-bad,#b3261e)"/>
<text x="35" y="83.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="700" fill="var(--scene-card,#fff)">LIVE</text>
<g stroke="var(--scene-line,#cfdfdc)" stroke-width="4" stroke-linecap="round"><path d="M27 108H58M27 118H50M27 128H56"/></g>
<g class="nosql-redis-loop nosql-redis-tap"><path d="M58 139c-6-4-8-7-8-9.5a3.6 3.6 0 0 1 8-1.5a3.6 3.6 0 0 1 8 1.5c0 2.5-2 5.5-8 9.5Z" fill="var(--scene-grow,#b8457a)"/></g>
<!-- wires: phone to the two chat servers, servers to Redis -->
<path d="M70 108L112 82M70 108L112 132M160 82L222 96M160 132L222 114" stroke="var(--scene-muted,#4d6268)" stroke-width="1.5" stroke-dasharray="3 5" fill="none" opacity="0.6"/>
<!-- two chat servers -->
<ellipse cx="136" cy="156" rx="30" ry="5" fill="var(--scene-ink,#102a33)" opacity="0.08"/>
<g>
<path d="M112 70l6-6h46l-6 6Z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M158 70l6-6v30l-6 6Z" fill="var(--scene-ink,#102a33)" opacity="0.14"/>
<rect x="112" y="70" width="46" height="30" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<path d="M118 80H144M118 90H144" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"/>
<circle cx="151" cy="80" r="2.5" fill="var(--scene-good,#1f7a4d)"/><circle cx="151" cy="90" r="2.5" fill="var(--scene-good,#1f7a4d)"/>
</g>
<g>
<path d="M112 120l6-6h46l-6 6Z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M158 120l6-6v30l-6 6Z" fill="var(--scene-ink,#102a33)" opacity="0.14"/>
<rect x="112" y="120" width="46" height="30" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<path d="M118 130H144M118 140H144" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"/>
<circle cx="151" cy="130" r="2.5" fill="var(--scene-good,#1f7a4d)"/><circle cx="151" cy="140" r="2.5" fill="var(--scene-good,#1f7a4d)"/>
</g>
<!-- Redis: an in-memory store with typed rows; the like counter row -->
<ellipse cx="264" cy="156" rx="40" ry="6" fill="var(--scene-ink,#102a33)" opacity="0.09"/>
<path d="M222 58l8-8h76l-8 8Z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M298 58l8-8v86l-8 8Z" fill="var(--scene-ink,#102a33)" opacity="0.14"/>
<rect x="222" y="58" width="76" height="86" rx="4" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<path d="M286 62l-6 10h5l-4 9 9-12h-5l4-7Z" fill="var(--scene-warn,#b26a00)"/>
<text class="nosql-redis-t" x="230" y="76">likes</text>
<rect x="230" y="82" width="60" height="26" rx="4" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="1.5"/>
<text class="nosql-redis-v nosql-redis-loop nosql-redis-c41" x="260" y="101" text-anchor="middle" opacity="0">41</text>
<text class="nosql-redis-v nosql-redis-loop nosql-redis-c42" x="260" y="101" text-anchor="middle" opacity="0">42</text>
<text class="nosql-redis-v nosql-redis-loop nosql-redis-c43" x="260" y="101" text-anchor="middle" opacity="0">43</text>
<text class="nosql-redis-v nosql-redis-loop nosql-redis-c44" x="260" y="101">44</text>
<rect x="230" y="116" width="16" height="8" rx="2" fill="var(--scene-line,#cfdfdc)"/><rect x="250" y="116" width="40" height="8" rx="2" fill="var(--scene-accent-soft,#dcefed)"/>
<rect x="230" y="129" width="16" height="8" rx="2" fill="var(--scene-line,#cfdfdc)"/><rect x="250" y="129" width="30" height="8" rx="2" fill="var(--scene-accent-soft,#dcefed)"/>
<!-- one like = one increment, travelling phone -> server -> Redis -->
<g class="nosql-redis-loop nosql-redis-h1" opacity="0"><circle cx="70" cy="108" r="5" fill="var(--scene-grow,#b8457a)"/></g>
<g class="nosql-redis-loop nosql-redis-h2" opacity="0"><circle cx="70" cy="108" r="5" fill="var(--scene-grow,#b8457a)"/></g>
<g class="nosql-redis-loop nosql-redis-h3" opacity="0"><circle cx="70" cy="108" r="5" fill="var(--scene-grow,#b8457a)"/></g>
<!-- every like counted -->
<g class="nosql-redis-loop nosql-redis-ok"><circle cx="300" cy="84" r="11" fill="var(--scene-good,#1f7a4d)"/><path d="M295 84l4 4 7-8" stroke="var(--scene-card,#fff)" stroke-width="2.5" stroke-linecap="round" fill="none"/></g>
</svg>
