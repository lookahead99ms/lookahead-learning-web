<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A driver pays for parking on a phone; the payment is written to one keyed row of a DynamoDB table, a repeated tap is refused, and a parking officer's handheld reads that row by plate and shows the car as paid">
<style>
.ddb-pk-a,.ddb-pk-b,.ddb-pk-c,.ddb-pk-d,.ddb-pk-e,.ddb-pk-f{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-7s;animation-timing-function:ease-in-out}
.ddb-pk-a{animation-name:ddb-pk-a}
@keyframes ddb-pk-a{0%,4%{transform:translateX(0);opacity:1}22%{transform:translateX(72px);opacity:1}26%,100%{transform:translateX(72px);opacity:0}}
.ddb-pk-b{animation-name:ddb-pk-b}
@keyframes ddb-pk-b{0%,22%{opacity:0}27%,96%{opacity:1}100%{opacity:0}}
.ddb-pk-c{animation-name:ddb-pk-c}
@keyframes ddb-pk-c{0%,30%{transform:translateX(0);opacity:0}32%{opacity:1}44%{transform:translateX(58px);opacity:1}54%{transform:translateX(10px);opacity:1}58%,100%{transform:translateX(10px);opacity:0}}
.ddb-pk-d{animation-name:ddb-pk-d}
@keyframes ddb-pk-d{0%,50%{opacity:0}54%,66%{opacity:1}70%,100%{opacity:0}}
.ddb-pk-e{animation-name:ddb-pk-e}
@keyframes ddb-pk-e{0%,62%{transform:translateX(0);opacity:0}64%{opacity:1}78%{transform:translateX(36px);opacity:1}80%,100%{transform:translateX(36px);opacity:0}}
.ddb-pk-f{animation-name:ddb-pk-f}
@keyframes ddb-pk-f{0%,78%{opacity:0}82%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.ddb-pk-a,.ddb-pk-b,.ddb-pk-c,.ddb-pk-d,.ddb-pk-e,.ddb-pk-f{animation-play-state:paused}}
</style>
