<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" font-family="system-ui, sans-serif">
<style>
.grow-distributed-systems-advanced-production-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-distributed-systems-advanced-production-m{font-size:16px;fill:var(--scene-text,#28434a)}
.grow-distributed-systems-advanced-production-fill{transform-box:fill-box;transform-origin:50% 100%;animation:grow-distributed-systems-advanced-production-gr 7s ease-in-out infinite;animation-delay:-3.5s}
.grow-distributed-systems-advanced-production-on{animation:grow-distributed-systems-advanced-production-onn 7s ease-in-out infinite;animation-delay:-3.5s}
@keyframes grow-distributed-systems-advanced-production-gr{0%{transform:scaleY(.1)}70%,100%{transform:scaleY(1)}}
@keyframes grow-distributed-systems-advanced-production-onn{0%,72%{opacity:0}80%,95%{opacity:1}100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="30" y="14" width="86" height="104" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2"/>
<rect x="38" y="22" width="70" height="22" rx="4" fill="var(--scene-accent-soft,#dcefed)"/><rect x="38" y="50" width="70" height="22" rx="4" fill="var(--scene-accent-soft,#dcefed)"/><rect x="38" y="78" width="70" height="22" rx="4" fill="var(--scene-accent-soft,#dcefed)"/>
<rect x="42" y="28" width="30" height="8" rx="3" fill="var(--scene-good,#1f7a4d)"/><rect x="42" y="56" width="30" height="8" rx="3" fill="var(--scene-good,#1f7a4d)"/><rect x="42" y="84" width="30" height="8" rx="3" fill="var(--scene-good,#1f7a4d)"/>
<rect x="204" y="14" width="86" height="104" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-link,#245a88)" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="212" y="22" width="70" height="88" rx="4" fill="var(--scene-accent-soft,#dcefed)"/>
<rect class="grow-distributed-systems-advanced-production-fill" x="212" y="22" width="70" height="88" rx="4" fill="var(--scene-link,#245a88)" opacity=".85"/>
<path d="M122 66H198" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-dasharray="4 4"/>
<g class="grow-distributed-systems-advanced-production-on"><path d="M140 66h40m-10 -10l10 10l-10 10" stroke="var(--scene-good,#1f7a4d)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="73" y="140" text-anchor="middle" class="grow-distributed-systems-advanced-production-t">Live view</text>
<text x="247" y="140" text-anchor="middle" class="grow-distributed-systems-advanced-production-t">New view</text>
<text x="160" y="168" text-anchor="middle" class="grow-distributed-systems-advanced-production-m">Rebuild, check, switch</text>
</svg>
