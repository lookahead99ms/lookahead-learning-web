<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" font-family="system-ui, sans-serif">
<style>
.grow-distributed-systems-consensus-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-distributed-systems-consensus-m{font-size:16px;fill:var(--scene-text,#28434a)}
.grow-distributed-systems-consensus-v1{animation:grow-distributed-systems-consensus-vt 6s linear infinite;animation-delay:-3s}
.grow-distributed-systems-consensus-v2{animation:grow-distributed-systems-consensus-vt2 6s linear infinite;animation-delay:-3s}
.grow-distributed-systems-consensus-crown{animation:grow-distributed-systems-consensus-cr 6s ease-in-out infinite;animation-delay:-3s}
.grow-distributed-systems-consensus-st{animation:grow-distributed-systems-consensus-stl 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-distributed-systems-consensus-vt{0%{transform:translate(0,0);opacity:0}10%{opacity:1}60%{transform:translate(48px,24px)}70%,100%{transform:translate(48px,24px);opacity:0}}
@keyframes grow-distributed-systems-consensus-vt2{0%{transform:translate(0,0);opacity:0}10%{opacity:1}60%{transform:translate(48px,-24px)}70%,100%{transform:translate(48px,-24px);opacity:0}}
@keyframes grow-distributed-systems-consensus-cr{0%,45%{opacity:0}60%,95%{opacity:1}100%{opacity:0}}
@keyframes grow-distributed-systems-consensus-stl{0%,50%{opacity:0}65%,95%{opacity:1}100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"><circle cx="40" cy="36" r="15"/><circle cx="40" cy="96" r="15"/><circle cx="116" cy="66" r="15"/></g>
<path d="M54 42L103 62M54 90L103 70M40 51V81" stroke="var(--scene-line,#cfdfdc)" stroke-width="3"/>
<g class="grow-distributed-systems-consensus-crown"><path d="M104 38l5-9 7 6 7-6 5 9z" fill="var(--scene-warn,#a15c00)"/></g>
<circle class="grow-distributed-systems-consensus-v1" cx="56" cy="40" r="5" fill="var(--scene-good,#1f7a4d)"/>
<circle class="grow-distributed-systems-consensus-v2" cx="56" cy="92" r="5" fill="var(--scene-good,#1f7a4d)"/>
<path d="M170 12V122" stroke="var(--scene-bad,#b3261e)" stroke-width="3" stroke-dasharray="6 5"/>
<g fill="var(--scene-card,#fff)" stroke="var(--scene-muted,#536970)" stroke-width="2"><circle cx="208" cy="40" r="15"/><circle cx="270" cy="96" r="15"/></g>
<path d="M219 51L259 85" stroke="var(--scene-line,#cfdfdc)" stroke-width="3"/>
<g class="grow-distributed-systems-consensus-st"><rect x="230" y="18" width="84" height="32" rx="6" fill="var(--scene-bad,#b3261e)"/><text x="272" y="39" text-anchor="middle" font-size="16" font-weight="700" style="fill:#fff">old token</text></g>
<text x="160" y="158" text-anchor="middle" class="grow-distributed-systems-consensus-t">Majority picks leader</text>
</svg>
