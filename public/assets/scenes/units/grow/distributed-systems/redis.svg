<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" font-family="system-ui, sans-serif">
<style>
.grow-distributed-systems-redis-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-distributed-systems-redis-m{font-size:16px;fill:var(--scene-text,#28434a)}
.grow-distributed-systems-redis-r1{animation:grow-distributed-systems-redis-rr 6s linear infinite;animation-delay:-3s}
.grow-distributed-systems-redis-r2{animation:grow-distributed-systems-redis-rr 6s linear infinite;animation-delay:-2.3s}
.grow-distributed-systems-redis-r3{animation:grow-distributed-systems-redis-rr 6s linear infinite;animation-delay:-1.6s}
.grow-distributed-systems-redis-bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow-distributed-systems-redis-fill 6s steps(5,end) infinite;animation-delay:-3s}
.grow-distributed-systems-redis-no{animation:grow-distributed-systems-redis-nn 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-distributed-systems-redis-rr{0%{transform:translate(0,0);opacity:0}8%{opacity:1}60%{transform:translate(48px,0);opacity:1}75%,100%{transform:translate(48px,0);opacity:0}}
@keyframes grow-distributed-systems-redis-fill{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
@keyframes grow-distributed-systems-redis-nn{0%,55%{opacity:0}70%,95%{opacity:1}100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-link,#245a88)"><circle cx="24" cy="36" r="9"/><circle cx="24" cy="72" r="9"/><circle cx="24" cy="108" r="9"/></g>
<path d="M36 36H108M36 72H108M36 108H108" stroke="var(--scene-line,#cfdfdc)" stroke-width="2" stroke-dasharray="3 4"/>
<rect class="grow-distributed-systems-redis-r1" x="40" y="30" width="14" height="12" rx="3" fill="var(--scene-grow,#b8457a)"/>
<rect class="grow-distributed-systems-redis-r2" x="40" y="66" width="14" height="12" rx="3" fill="var(--scene-grow,#b8457a)"/>
<rect class="grow-distributed-systems-redis-r3" x="40" y="102" width="14" height="12" rx="3" fill="var(--scene-grow,#b8457a)"/>
<rect x="114" y="14" width="40" height="124" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<rect class="grow-distributed-systems-redis-bar" x="122" y="22" width="24" height="108" rx="4" fill="var(--scene-warn,#a15c00)"/>
<path d="M108 40H160" stroke="var(--scene-bad,#b3261e)" stroke-width="3" stroke-dasharray="5 3"/>
<path d="M160 50H236" stroke="var(--scene-good,#1f7a4d)" stroke-width="3"/>
<rect x="240" y="30" width="62" height="40" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2"/>
<path d="M258 50l8 8 18-18" stroke="var(--scene-good,#1f7a4d)" stroke-width="4" fill="none"/>
<g class="grow-distributed-systems-redis-no"><path d="M160 110H236" stroke="var(--scene-bad,#b3261e)" stroke-width="3"/><rect x="240" y="90" width="62" height="40" rx="8" fill="var(--scene-bad,#b3261e)"/><text x="271" y="116" text-anchor="middle" font-size="16" font-weight="700" style="fill:#fff">429</text></g>
<text x="160" y="152" text-anchor="middle" class="grow-distributed-systems-redis-t">Counter with expiry</text>
<text x="160" y="173" text-anchor="middle" class="grow-distributed-systems-redis-m">Over limit, 429</text>
</svg>
