<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" font-family="system-ui, sans-serif">
<style>
.grow-distributed-systems-kafka-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-distributed-systems-kafka-m{font-size:16px;fill:var(--scene-text,#28434a)}
.grow-distributed-systems-kafka-ptr{animation:grow-distributed-systems-kafka-pt 7s linear infinite;animation-delay:-3.5s}
.grow-distributed-systems-kafka-boom{animation:grow-distributed-systems-kafka-bm 7s linear infinite;animation-delay:-3.5s}
.grow-distributed-systems-kafka-ck{animation:grow-distributed-systems-kafka-ckk 7s linear infinite;animation-delay:-3.5s}
@keyframes grow-distributed-systems-kafka-pt{0%{transform:translate(0,0)}35%{transform:translate(144px,0)}45%{transform:translate(144px,0)}60%{transform:translate(96px,0)}100%{transform:translate(240px,0)}}
@keyframes grow-distributed-systems-kafka-bm{0%,38%{opacity:0}42%,52%{opacity:1}56%,100%{opacity:0}}
@keyframes grow-distributed-systems-kafka-ckk{0%,58%{opacity:0}66%,90%{opacity:1}100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="14" y="44" width="43" height="40" rx="6" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<rect x="63" y="44" width="43" height="40" rx="6" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<rect x="112" y="44" width="43" height="40" rx="6" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<rect x="161" y="44" width="43" height="40" rx="6" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<rect x="210" y="44" width="43" height="40" rx="6" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<rect x="259" y="44" width="43" height="40" rx="6" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<g class="grow-distributed-systems-kafka-ptr"><path d="M35 92l-9 13h18z" fill="var(--scene-grow,#b8457a)"/><rect x="29" y="105" width="12" height="14" rx="2" fill="var(--scene-grow,#b8457a)"/></g>
<g class="grow-distributed-systems-kafka-boom"><path d="M178 4l-8 14h10l-8 14" stroke="var(--scene-bad,#b3261e)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="grow-distributed-systems-kafka-ck" stroke="var(--scene-good,#1f7a4d)" stroke-width="3" fill="none"><path d="M24 30l6 6 11-11"/><path d="M73 30l6 6 11-11"/><path d="M122 30l6 6 11-11"/></g>
<text x="160" y="146" text-anchor="middle" class="grow-distributed-systems-kafka-t">Crash, then replay</text>
<text x="160" y="168" text-anchor="middle" class="grow-distributed-systems-kafka-m">Seen ID, skip it</text>
</svg>
