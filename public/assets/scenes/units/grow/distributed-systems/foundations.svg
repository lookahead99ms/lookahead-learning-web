<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" font-family="system-ui, sans-serif">
<style>
.grow-distributed-systems-foundations-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-distributed-systems-foundations-m{font-size:16px;fill:var(--scene-text,#28434a)}
.grow-distributed-systems-foundations-req{animation:grow-distributed-systems-foundations-rq 6s linear infinite;animation-delay:-2s}
.grow-distributed-systems-foundations-rep{animation:grow-distributed-systems-foundations-rp 6s linear infinite;animation-delay:-3.6s}
.grow-distributed-systems-foundations-x{animation:grow-distributed-systems-foundations-xx 6s ease-in-out infinite;animation-delay:-3.6s}
.grow-distributed-systems-foundations-clk{transform-origin:50px 48px;animation:grow-distributed-systems-foundations-spin 3s linear infinite}
@keyframes grow-distributed-systems-foundations-rq{0%{transform:translate(0,0);opacity:0}5%{opacity:1}38%{transform:translate(96px,0);opacity:1}43%,100%{transform:translate(96px,0);opacity:0}}
@keyframes grow-distributed-systems-foundations-rp{0%,45%{transform:translate(0,0);opacity:0}50%{opacity:1}72%{transform:translate(-44px,0);opacity:1}80%,100%{transform:translate(-44px,0);opacity:0}}
@keyframes grow-distributed-systems-foundations-xx{0%,66%{opacity:0}74%,95%{opacity:1}100%{opacity:0}}
@keyframes grow-distributed-systems-foundations-spin{to{transform:rotate(360deg)}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="14" y="26" width="70" height="86" rx="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<rect x="24" y="36" width="50" height="24" rx="4" fill="var(--scene-card,#fff)" stroke="var(--scene-accent,#006c73)"/>
<circle cx="50" cy="48" r="8" fill="none" stroke="var(--scene-warn,#a15c00)" stroke-width="2"/>
<path class="grow-distributed-systems-foundations-clk" d="M50 48V42" stroke="var(--scene-warn,#a15c00)" stroke-width="2" stroke-linecap="round"/>
<rect x="30" y="70" width="40" height="8" rx="3" fill="var(--scene-accent,#006c73)"/>
<rect x="34" y="88" width="32" height="14" rx="3" fill="var(--scene-ink,#102a33)"/>
<rect x="236" y="26" width="70" height="86" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<rect x="246" y="38" width="50" height="14" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-good,#1f7a4d)"/>
<path d="M263 45l5 5 9-10" stroke="var(--scene-good,#1f7a4d)" stroke-width="3" fill="none"/>
<rect x="246" y="60" width="50" height="14" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)"/>
<rect x="246" y="82" width="50" height="14" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)"/>
<path d="M92 56H228M92 92H228" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-dasharray="4 4"/>
<g class="grow-distributed-systems-foundations-req"><rect x="98" y="46" width="36" height="22" rx="4" fill="var(--scene-ahead,#2f6fb3)"/><text x="116" y="62" text-anchor="middle" font-size="16" font-weight="700" style="fill:#fff">#7</text></g>
<g class="grow-distributed-systems-foundations-rep"><rect x="190" y="84" width="26" height="16" rx="4" fill="var(--scene-good,#1f7a4d)"/><path d="M197 92l4 4 8-8" stroke="#fff" stroke-width="2" fill="none"/></g>
<g class="grow-distributed-systems-foundations-x"><path d="M136 83l16 16M152 83l-16 16" stroke="var(--scene-bad,#b3261e)" stroke-width="4" stroke-linecap="round"/></g>
<text x="160" y="140" text-anchor="middle" class="grow-distributed-systems-foundations-t">Reply lost, work done</text>
<text x="160" y="164" text-anchor="middle" class="grow-distributed-systems-foundations-m">Retry with same ID</text>
</svg>
