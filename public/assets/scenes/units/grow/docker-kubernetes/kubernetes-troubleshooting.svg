<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A candidate waits at a laptop that shows 09:00 while one pod on the exam node keeps restarting; a magnifier over the pod reads its last exit code, exit 0, then the pod turns green and the exam questions appear on the laptop">
<style>
.k8s-tp-a,.k8s-tp-b,.k8s-tp-c,.k8s-tp-d,.k8s-tp-e,.k8s-tp-f,.k8s-tp-g{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-3.6s;animation-timing-function:ease-in-out}
.k8s-tp-a{animation-name:k8s-tp-a}
@keyframes k8s-tp-a{0%,58%{opacity:1}64%,94%{opacity:0}100%{opacity:1}}
.k8s-tp-b{animation-name:k8s-tp-b}
@keyframes k8s-tp-b{0%,60%{opacity:0}66%,92%{opacity:1}98%,100%{opacity:0}}
.k8s-tp-c{animation-name:k8s-tp-c;transform-origin:239px 95px;animation-timing-function:linear}
@keyframes k8s-tp-c{0%{transform:rotate(0deg);opacity:1}55%{transform:rotate(540deg);opacity:1}60%,100%{transform:rotate(600deg);opacity:0}}
.k8s-tp-d{animation-name:k8s-tp-d}
@keyframes k8s-tp-d{0%,16%{transform:translate(64px,46px);opacity:0}20%{opacity:1}34%,58%{transform:translate(0,0);opacity:1}70%,100%{transform:translate(64px,46px);opacity:0}}
.k8s-tp-e{animation-name:k8s-tp-e}
@keyframes k8s-tp-e{0%,34%{opacity:0}39%,58%{opacity:1}63%,100%{opacity:0}}
.k8s-tp-f{animation-name:k8s-tp-f}
@keyframes k8s-tp-f{0%,66%{transform:translateX(0);opacity:0}68%{opacity:1}78%{transform:translateX(-30px);opacity:1}80%,100%{transform:translateX(-30px);opacity:0}}
.k8s-tp-g{animation-name:k8s-tp-g}
@keyframes k8s-tp-g{0%,78%{opacity:0}83%,94%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.k8s-tp-a,.k8s-tp-b,.k8s-tp-c,.k8s-tp-d,.k8s-tp-e,.k8s-tp-f,.k8s-tp-g{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
