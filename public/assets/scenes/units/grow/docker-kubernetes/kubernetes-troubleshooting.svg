<g class="k8s-tp-g"><rect x="57" y="92" width="34" height="5" rx="2" fill="var(--scene-line,#cfdfdc)"/><rect x="57" y="102" width="26" height="5" rx="2" fill="var(--scene-line,#cfdfdc)"/><rect x="57" y="112" width="30" height="5" rx="2" fill="var(--scene-line,#cfdfdc)"/><circle cx="99" cy="98" r="6" fill="var(--scene-good,#1f7a4d)"/><path d="M96 98l2 2 4-4" stroke="var(--scene-card,#fff)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
