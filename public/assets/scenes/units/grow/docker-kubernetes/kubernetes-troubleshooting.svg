<g fill="var(--scene-good,#1f7a4d)"><circle cx="171" cy="104" r="3"/><circle cx="205" cy="104" r="3"/></g>
<g class="k8s-tp-a"><rect x="226" y="78" width="26" height="34" rx="4" fill="var(--scene-bad,#b3261e)"/><path d="M233 89l12 12M245 89l-12 12" stroke="var(--scene-card,#fff)" stroke-width="3" stroke-linecap="round"/></g>
<g class="k8s-tp-b"><rect x="226" y="78" width="26" height="34" rx="4" fill="var(--scene-good,#1f7a4d)"/><path d="M232 95l5 5 9-10" stroke="var(--scene-card,#fff)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="k8s-tp-c"><path d="M239 70a25 25 0 1 1-23 15" fill="none" stroke="var(--scene-warn,#9a6700)" stroke-width="2.5" stroke-linecap="round"/><path d="M211 81l5 5 3-7Z" fill="var(--scene-warn,#9a6700)"/></g>
<g class="k8s-tp-e"><rect x="244" y="20" width="66" height="26" rx="4" fill="var(--scene-card,#fff)" stroke="var(--scene-warn,#9a6700)" stroke-width="2"/><rect x="244" y="20" width="66" height="5" rx="2" fill="var(--scene-warn,#9a6700)"/><text x="277" y="40" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700" fill="var(--scene-ink,#102a33)">exit 0</text><path d="M258 46l-8 10" stroke="var(--scene-warn,#9a6700)" stroke-width="2"/></g>
<g class="k8s-tp-d"><circle cx="239" cy="95" r="21" fill="none" stroke="var(--scene-link,#2f6fb3)" stroke-width="3.5"/><path d="M254 110l14 14" stroke="var(--scene-link,#2f6fb3)" stroke-width="5" stroke-linecap="round"/></g>
