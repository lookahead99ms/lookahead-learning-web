<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A player saves a fantasy lineup on a phone before the 15:00 lock while the autoscaler adds a fourth, fifth and sixth server pod next to the three already running">
<style>
.k8sas-loop{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6.4s;animation-timing-function:ease-in-out}
.k8sas-dot1{animation-name:k8sas-wire}
.k8sas-dot2{animation-name:k8sas-wire;animation-delay:-5.4s}
.k8sas-p4{animation-name:k8sas-in4}
.k8sas-p5{animation-name:k8sas-in5}
.k8sas-p6{animation-name:k8sas-in6}
.k8sas-hand{animation-name:k8sas-tick}
@keyframes k8sas-wire{0%{transform:translate(0,0);opacity:0}10%{opacity:1}60%{transform:translate(92px,0);opacity:1}70%,100%{transform:translate(92px,0);opacity:0}}
@keyframes k8sas-in4{0%,20%{opacity:0;transform:translate(0,8px)}30%,92%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
@keyframes k8sas-in5{0%,38%{opacity:0;transform:translate(0,8px)}48%,92%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
@keyframes k8sas-in6{0%,56%{opacity:0;transform:translate(0,8px)}66%,92%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
@keyframes k8sas-tick{0%{transform:rotate(-60deg)}100%{transform:rotate(0deg)}}
@media (prefers-reduced-motion: reduce){.k8sas-loop{animation-play-state:paused}}
</style>
<defs>
<g id="k8sas-pod">
<path d="M0 6l6-6h34l-6 6z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M34 6l6-6v24l-6 6z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<rect x="0" y="6" width="34" height="24" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-muted,#536970)" stroke-width="1.5"/>
<rect x="5" y="12" width="17" height="3" rx="1.5" fill="var(--scene-muted,#536970)" opacity=".5"/>
<rect x="5" y="20" width="17" height="3" rx="1.5" fill="var(--scene-muted,#536970)" opacity=".5"/>
<circle cx="28" cy="13.5" r="2.4" fill="var(--scene-good,#1f7a4d)"/>
<circle cx="28" cy="21.5" r="2.4" fill="var(--scene-good,#1f7a4d)"/>
</g>
</defs>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<ellipse cx="52" cy="150" rx="34" ry="6" fill="var(--scene-ink,#102a33)" opacity=".09"/>
<circle cx="52" cy="72" r="15" fill="var(--scene-accent,#006c73)"/>
<path d="M24 148c0-30 12-44 28-44s28 14 28 44z" fill="var(--scene-accent,#006c73)"/>
<rect x="56" y="92" width="34" height="56" rx="6" fill="var(--scene-ink,#102a33)"/>
<rect x="59" y="97" width="28" height="44" rx="3" fill="var(--scene-good,#1f7a4d)" opacity=".85"/>
<path d="M73 97v44M59 119h28" stroke="var(--scene-card,#fff)" stroke-width="1" opacity=".7"/>
<circle cx="66" cy="106" r="2.6" fill="var(--scene-card,#fff)"/>
<circle cx="80" cy="106" r="2.6" fill="var(--scene-card,#fff)"/>
<circle cx="64" cy="122" r="2.6" fill="var(--scene-card,#fff)"/>
<circle cx="73" cy="128" r="2.6" fill="var(--scene-card,#fff)"/>
<circle cx="82" cy="122" r="2.6" fill="var(--scene-card,#fff)"/>
<circle cx="73" cy="136" r="2.6" fill="var(--scene-warn,#a15c00)"/>
<path d="M96 112H190" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="4 4"/>
<circle class="k8sas-loop k8sas-dot1" cx="98" cy="112" r="4" fill="var(--scene-link,#2f6fb3)"/>
<circle class="k8sas-loop k8sas-dot2" cx="98" cy="112" r="4" fill="var(--scene-link,#2f6fb3)"/>
<circle cx="146" cy="52" r="24" fill="var(--scene-card,#fff)" stroke="var(--scene-warn,#a15c00)" stroke-width="3"/>
<path d="M146 52V36" stroke="var(--scene-ink,#102a33)" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(146 52)"><path class="k8sas-loop k8sas-hand" d="M0 0L11 0" stroke="var(--scene-warn,#a15c00)" stroke-width="3" stroke-linecap="round"/></g>
<text x="146" y="96" text-anchor="middle" font-size="15" fill="var(--scene-warn,#a15c00)">15:00</text>
<ellipse cx="252" cy="160" rx="64" ry="7" fill="var(--scene-ink,#102a33)" opacity=".09"/>
<rect x="194" y="150" width="118" height="8" rx="2" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<use href="#k8sas-pod" x="196" y="78"/>
<use href="#k8sas-pod" x="236" y="78"/>
<use href="#k8sas-pod" x="276" y="78"/>
<g class="k8sas-loop k8sas-p4"><use href="#k8sas-pod" x="196" y="116"/></g>
<g class="k8sas-loop k8sas-p5"><use href="#k8sas-pod" x="236" y="116"/></g>
<g class="k8sas-loop k8sas-p6"><use href="#k8sas-pod" x="276" y="116"/></g>
<rect x="210" y="36" width="88" height="26" rx="13" fill="var(--scene-accent,#006c73)"/>
<text x="254" y="54" text-anchor="middle" font-size="15" fill="var(--scene-card,#fff)">3 → 6</text>
<path d="M254 62v12" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
</svg>
