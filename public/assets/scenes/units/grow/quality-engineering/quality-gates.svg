.grow-quality-engineering-quality-gates-arm{stroke:var(--scene-bad,#b3261e);stroke-width:6;stroke-linecap:round;transform-origin:172px 70px;transform-box:view-box}
.grow-quality-engineering-quality-gates-us{fill:var(--scene-good,#1f7a4d)}
.grow-quality-engineering-quality-gates-a{animation:grow-quality-engineering-quality-gates-a 6s ease-in-out infinite;animation-delay:-3s}
.grow-quality-engineering-quality-gates-r{animation:grow-quality-engineering-quality-gates-r 6s ease-in-out infinite;animation-delay:-3s}
.grow-quality-engineering-quality-gates-l1{animation:grow-quality-engineering-quality-gates-l1 6s linear infinite;animation-delay:-3s}
.grow-quality-engineering-quality-gates-l2{animation:grow-quality-engineering-quality-gates-l2 6s linear infinite;animation-delay:-3s}
.grow-quality-engineering-quality-gates-l3{animation:grow-quality-engineering-quality-gates-l3 6s linear infinite;animation-delay:-3s}
@keyframes grow-quality-engineering-quality-gates-a{0%{transform:translateX(0);opacity:0}6%{transform:translateX(0);opacity:1}35%,50%{transform:translateX(112px);opacity:1}80%{transform:translateX(205px);opacity:1}90%,100%{transform:translateX(205px);opacity:0}}
@keyframes grow-quality-engineering-quality-gates-r{0%,45%{transform:rotate(0)}58%,85%{transform:rotate(-90deg)}95%,100%{transform:rotate(0)}}
@keyframes grow-quality-engineering-quality-gates-l1{0%,10%{fill:var(--scene-muted,#536970)}15%,95%{fill:var(--scene-good,#1f7a4d)}100%{fill:var(--scene-muted,#536970)}}
@keyframes grow-quality-engineering-quality-gates-l2{0%,20%{fill:var(--scene-muted,#536970)}25%,95%{fill:var(--scene-good,#1f7a4d)}100%{fill:var(--scene-muted,#536970)}}
@keyframes grow-quality-engineering-quality-gates-l3{0%,30%{fill:var(--scene-muted,#536970)}35%,95%{fill:var(--scene-good,#1f7a4d)}100%{fill:var(--scene-muted,#536970)}}
</style>
