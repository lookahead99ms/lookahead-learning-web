<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A build crate waits at a gate until three evidence lights turn green, then passes to users">
<style>
.grow-quality-engineering-quality-gates-bg{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc)}
