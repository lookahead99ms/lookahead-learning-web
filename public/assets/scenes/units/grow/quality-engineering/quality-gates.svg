.grow-quality-engineering-quality-gates-cross{stroke:var(--scene-accent,#006c73);stroke-width:2.5}
.grow-quality-engineering-quality-gates-pan{fill:var(--scene-ink,#102a33)}
.grow-quality-engineering-quality-gates-led{fill:var(--scene-muted,#536970)}
