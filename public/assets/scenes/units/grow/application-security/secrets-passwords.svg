<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A member's password travels from the gym app to the server, which stores only a salted hash row in the members table, never the password">
<style>
.as-sp-t{font:600 11px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.as-sp-code{font:600 11px ui-monospace,Menlo,monospace;fill:var(--scene-ink,#102a33)}
.as-sp-chip{font:600 11px ui-monospace,Menlo,monospace;fill:var(--scene-card,#fff)}
.as-sp-pw{animation:as-sp-pw 8s linear infinite;animation-delay:-6.6s}
@keyframes as-sp-pw{0%,6%{transform:translate(0,0);opacity:0}10%{opacity:1}34%{transform:translate(84px,0);opacity:1}38%,100%{transform:translate(84px,0);opacity:0}}
.as-sp-hash{animation:as-sp-hash 8s linear infinite;animation-delay:-6.6s}
@keyframes as-sp-hash{0%,40%{transform:translate(0,0);opacity:0}44%{opacity:1}66%{transform:translate(78px,0);opacity:1}70%,100%{transform:translate(78px,0);opacity:0}}
.as-sp-row{animation:as-sp-row 8s ease-in-out infinite;animation-delay:-6.6s}
@keyframes as-sp-row{0%,68%{opacity:0}72%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.as-sp-pw,.as-sp-hash,.as-sp-row{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<!-- member holding a phone with the password field -->
<ellipse cx="44" cy="156" rx="30" ry="5" fill="var(--scene-ink,#102a33)" opacity="0.09"/>
<circle cx="36" cy="58" r="12" fill="var(--scene-accent,#006c73)"/>
<path d="M16 100a20 20 0 0 1 40 0Z" fill="var(--scene-accent,#006c73)"/>
<rect x="46" y="82" width="34" height="62" rx="6" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<rect x="51" y="92" width="24" height="10" rx="3" fill="var(--scene-accent-soft,#dcefed)"/>
<text class="as-sp-code" x="52" y="100">••••</text>
<rect x="51" y="108" width="24" height="9" rx="3" fill="var(--scene-accent,#006c73)"/>
<path d="M54 126h18M54 133h12" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"/>
<!-- wires: phone to server, server to members table -->
<path d="M82 106H132M182 106H230" fill="none" stroke="var(--scene-muted,#5f7478)" stroke-width="1.5" stroke-dasharray="3 4"/>
<!-- server: hashes with a salt; a small key for the secrets it holds -->
<ellipse cx="158" cy="156" rx="30" ry="5" fill="var(--scene-ink,#102a33)" opacity="0.09"/>
<path d="M136 72l8-6h36l-8 6Z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M172 72l8-6v74l-8 6Z" fill="var(--scene-ink,#102a33)" opacity="0.14"/>
<rect x="136" y="72" width="36" height="74" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="1.5"/>
<path d="M142 82h18M142 92h18M142 134h18" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"/>
<circle cx="165" cy="82" r="2" fill="var(--scene-good,#1f7a4d)"/>
<circle cx="165" cy="92" r="2" fill="var(--scene-good,#1f7a4d)"/>
<circle cx="148" cy="114" r="5" fill="none" stroke="var(--scene-warn,#a15c00)" stroke-width="2.5"/>
<path d="M153 114h12M161 114v5M165 114v4" fill="none" stroke="var(--scene-warn,#a15c00)" stroke-width="2.5" stroke-linecap="round"/>
<!-- members table: a database cylinder with key and value rows -->
<ellipse cx="270" cy="160" rx="38" ry="5" fill="var(--scene-ink,#102a33)" opacity="0.09"/>
<path d="M232 50c0-6 17-10 38-10s38 4 38 10v96c0 6-17 10-38 10s-38-4-38-10Z" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<ellipse cx="270" cy="50" rx="38" ry="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<rect x="240" y="70" width="16" height="10" rx="2" fill="var(--scene-line,#cfdfdc)"/>
<path d="M262 75h36" stroke="var(--scene-line,#cfdfdc)" stroke-width="5" stroke-linecap="round"/>
<rect x="240" y="88" width="16" height="10" rx="2" fill="var(--scene-line,#cfdfdc)"/>
<path d="M262 93h30" stroke="var(--scene-line,#cfdfdc)" stroke-width="5" stroke-linecap="round"/>
<!-- the new row: salt and hash, never the password -->
<g class="as-sp-row">
<rect x="238" y="104" width="64" height="20" rx="4" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="1.5"/>
<text class="as-sp-code" x="243" y="118">a61f…</text>
<circle cx="300" cy="138" r="9" fill="var(--scene-good,#1f7a4d)"/>
<path d="M296 138l3 3 6-6" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2" stroke-linecap="round"/>
</g>
<!-- the password travels to the server; the hash travels on to the table -->
<g class="as-sp-pw"><rect x="44" y="99" width="30" height="14" rx="4" fill="var(--scene-grow,#b8457a)"/><text class="as-sp-chip" x="48" y="110">•••</text></g>
<g class="as-sp-hash"><rect x="150" y="99" width="38" height="14" rx="4" fill="var(--scene-accent,#006c73)"/><text class="as-sp-chip" x="153" y="110">a61f</text></g>
</svg>
