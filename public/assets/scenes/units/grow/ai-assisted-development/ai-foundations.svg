<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Mail scored by a model, then sorted by a threshold into inbox or spam">
<style>
.grow-ai-assisted-development-ai-foundations-{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-ai-assisted-development-ai-foundations-m{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}

.grow-ai-assisted-development-ai-foundations-e{animation:grow-ai-assisted-development-ai-foundations-move 6s linear infinite;animation-delay:-3s}
.grow-ai-assisted-development-ai-foundations-e2{animation:grow-ai-assisted-development-ai-foundations-move 6s linear infinite;animation-delay:-0.5s}
@keyframes grow-ai-assisted-development-ai-foundations-move{0%{transform:translateX(0);opacity:0}8%{opacity:1}60%{transform:translateX(150px);opacity:1}100%{transform:translateX(150px);opacity:0}}
.grow-ai-assisted-development-ai-foundations-n{animation:grow-ai-assisted-development-ai-foundations-pulse 2s ease-in-out infinite;animation-delay:-1s;transform-box:fill-box;transform-origin:center}
@keyframes grow-ai-assisted-development-ai-foundations-pulse{0%,100%{opacity:.5}50%{opacity:1}}
</style>

<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g class="grow-ai-assisted-development-ai-foundations-e" style="transform-origin:0 0"><g transform="translate(14,66)"><rect width="34" height="24" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/><path d="M2 3L17 15L32 3" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="2"/></g></g>
<g class="grow-ai-assisted-development-ai-foundations-e2" style="transform-origin:0 0"><g transform="translate(14,66)"><rect width="34" height="24" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/><path d="M2 3L17 15L32 3" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="2"/></g></g>
<rect x="104" y="30" width="72" height="90" rx="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<g stroke="var(--scene-accent,#006c73)" stroke-width="1.5" opacity=".6"><path d="M118 50L140 75M118 50L140 100M118 75L140 50M118 75L140 100M118 100L140 75M118 100L140 50M140 50L162 75M140 75L162 62M140 100L162 75M140 75L162 90"/></g>
<g fill="var(--scene-accent,#006c73)"><circle class="grow-ai-assisted-development-ai-foundations-n" cx="118" cy="50" r="5"/><circle class="grow-ai-assisted-development-ai-foundations-n" cx="118" cy="75" r="5" style="animation-delay:-2s"/><circle class="grow-ai-assisted-development-ai-foundations-n" cx="118" cy="100" r="5"/><circle class="grow-ai-assisted-development-ai-foundations-n" cx="140" cy="50" r="5" style="animation-delay:-2s"/><circle class="grow-ai-assisted-development-ai-foundations-n" cx="140" cy="75" r="5"/><circle class="grow-ai-assisted-development-ai-foundations-n" cx="140" cy="100" r="5" style="animation-delay:-2s"/><circle class="grow-ai-assisted-development-ai-foundations-n" cx="162" cy="62" r="5"/><circle class="grow-ai-assisted-development-ai-foundations-n" cx="162" cy="90" r="5" style="animation-delay:-2s"/></g>
<text class="grow-ai-assisted-development-ai-foundations-" x="140" y="140" text-anchor="middle">Model</text>
<rect x="254" y="22" width="52" height="56" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2.5"/>
<path d="M266 52L274 60L294 38" fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="4" stroke-linecap="round"/>
<rect x="254" y="100" width="52" height="56" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-bad,#b3261e)" stroke-width="2.5"/>
<path d="M270 118L290 138M290 118L270 138" stroke="var(--scene-bad,#b3261e)" stroke-width="4" stroke-linecap="round"/>
<path d="M186 90H244" stroke="var(--scene-warn,#a15c00)" stroke-width="3" stroke-dasharray="6 4"/>
<text class="grow-ai-assisted-development-ai-foundations-" x="215" y="80" text-anchor="middle" fill="var(--scene-warn,#a15c00)" style="fill:var(--scene-warn,#a15c00)">Cutoff</text>
<text class="grow-ai-assisted-development-ai-foundations-" x="280" y="174" text-anchor="middle">Spam</text>
</svg>
