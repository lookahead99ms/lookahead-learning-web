<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="system-ui, sans-serif">
<style>
.grow-spring-boot-rest-communication-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-spring-boot-rest-communication-req{animation:grow-spring-boot-rest-communication-req 6s linear infinite;animation-delay:-3s}
@keyframes grow-spring-boot-rest-communication-req{0%{transform:translateX(0);opacity:0}5%{opacity:1}35%{transform:translateX(70px);opacity:1}40%,100%{transform:translateX(70px);opacity:0}}
.grow-spring-boot-rest-communication-lost{animation:grow-spring-boot-rest-communication-lost 6s linear infinite;animation-delay:-3s}
@keyframes grow-spring-boot-rest-communication-lost{0%,34%{opacity:0}40%,55%{opacity:1}62%,100%{opacity:0}}
.grow-spring-boot-rest-communication-rt{animation:grow-spring-boot-rest-communication-rt 6s linear infinite;animation-delay:-3s}
@keyframes grow-spring-boot-rest-communication-rt{0%,48%{transform:translateX(0);opacity:0}52%{opacity:1}75%{transform:translateX(150px);opacity:1}80%,100%{transform:translateX(150px);opacity:0}}
.grow-spring-boot-rest-communication-res{animation:grow-spring-boot-rest-communication-res 6s linear infinite;animation-delay:-3s}
@keyframes grow-spring-boot-rest-communication-res{0%,76%{transform:translateX(0);opacity:0}78%{opacity:1}96%{transform:translateX(-150px);opacity:1}100%{transform:translateX(-150px);opacity:0}}
.grow-spring-boot-rest-communication-hand{animation:grow-spring-boot-rest-communication-hand 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-spring-boot-rest-communication-hand{0%{transform:rotate(0)}40%,100%{transform:rotate(360deg)}}
.grow-spring-boot-rest-communication-ring{animation:grow-spring-boot-rest-communication-ring 6s step-end infinite;animation-delay:-3s}
@keyframes grow-spring-boot-rest-communication-ring{0%,40%{stroke:var(--scene-accent,#006c73)}45%,60%{stroke:var(--scene-bad,#b3261e)}65%,100%{stroke:var(--scene-accent,#006c73)}}
.grow-spring-boot-rest-communication-hand{transform-origin:160px 40px}

</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="12" y="54" width="62" height="78" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"/><rect x="24" y="68" width="38" height="8" rx="4" fill="var(--scene-accent,#006c73)"/><rect x="24" y="84" width="26" height="8" rx="4" fill="var(--scene-line,#cfdfdc)"/><rect x="24" y="100" width="38" height="8" rx="4" fill="var(--scene-line,#cfdfdc)"/>
<rect x="246" y="54" width="62" height="78" rx="8" fill="var(--scene-card,#fff)" stroke="var(--scene-ahead,#2f6fb3)" stroke-width="2.5"/><circle cx="277" cy="82" r="14" fill="none" stroke="var(--scene-ahead,#2f6fb3)" stroke-width="3"/><path d="M270 82l5 5 9-10" fill="none" stroke="var(--scene-ahead,#2f6fb3)" stroke-width="3" stroke-linecap="round"/><rect x="258" y="106" width="38" height="8" rx="4" fill="var(--scene-line,#cfdfdc)"/>
<path d="M82 78h156M238 108H82" stroke="var(--scene-line,#cfdfdc)" stroke-width="2.5" stroke-dasharray="5 5"/>
<g class="grow-spring-boot-rest-communication-req"><rect x="84" y="70" width="18" height="16" rx="4" fill="var(--scene-grow,#b8457a)"/></g>
<g class="grow-spring-boot-rest-communication-lost"><path d="M154 70l14 16m0-16l-14 16" stroke="var(--scene-bad,#b3261e)" stroke-width="4" stroke-linecap="round"/></g>
<g class="grow-spring-boot-rest-communication-rt"><rect x="84" y="70" width="18" height="16" rx="4" fill="var(--scene-grow,#b8457a)"/><circle cx="93" cy="78" r="4" fill="var(--scene-card,#fff)"/></g>
<g class="grow-spring-boot-rest-communication-res"><rect x="220" y="100" width="18" height="16" rx="4" fill="var(--scene-good,#1f7a4d)"/></g>
<circle cx="160" cy="40" r="15" fill="var(--scene-card,#fff)" stroke-width="3.5" class="grow-spring-boot-rest-communication-ring" stroke="var(--scene-accent,#006c73)"/><path class="grow-spring-boot-rest-communication-hand" d="M160 40V29" stroke="var(--scene-ink,#102a33)" stroke-width="3" stroke-linecap="round"/><path d="M155 21h10" stroke="var(--scene-ink,#102a33)" stroke-width="3" stroke-linecap="round"/>
<text class="grow-spring-boot-rest-communication-t" x="160" y="150" text-anchor="middle">timeout, then retry</text><text class="grow-spring-boot-rest-communication-t" x="160" y="172" text-anchor="middle">same key</text>

</svg>
