<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="system-ui, sans-serif">
<style>
.grow-spring-boot-boot-data-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-spring-boot-boot-data-f0{animation:grow-spring-boot-boot-data-f0 6s linear infinite;animation-delay:-3s}
@keyframes grow-spring-boot-boot-data-f0{0%,10%{opacity:0}25%,85%{opacity:1}95%,100%{opacity:0}}
.grow-spring-boot-boot-data-f1{animation:grow-spring-boot-boot-data-f1 6s linear infinite;animation-delay:-2.2s}
