.grow-spring-boot-boot-data-f3{animation:grow-spring-boot-boot-data-f3 6s linear infinite;animation-delay:-0.6s}
@keyframes grow-spring-boot-boot-data-f3{0%,10%{opacity:0}25%,85%{opacity:1}95%,100%{opacity:0}}
.grow-spring-boot-boot-data-pulse{animation:grow-spring-boot-boot-data-pulse 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-spring-boot-boot-data-pulse{0%,100%{opacity:.55}50%{opacity:1}}

</style>
