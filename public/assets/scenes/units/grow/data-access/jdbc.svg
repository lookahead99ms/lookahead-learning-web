<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" font-family="system-ui, sans-serif">
<style>
.grow-data-access-jdbc-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-data-access-jdbc-m{font-size:16px;fill:var(--scene-text,#28434a)}
.grow-data-access-jdbc-a{animation:grow-data-access-jdbc-go 6s linear infinite;animation-delay:-3s}
.grow-data-access-jdbc-b{animation:grow-data-access-jdbc-go 6s linear infinite;animation-delay:-5s}
.grow-data-access-jdbc-s{animation:grow-data-access-jdbc-lit 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-data-access-jdbc-go{0%{transform:translate(0,0);opacity:0}8%{opacity:1}35%{transform:translate(95px,0)}65%{transform:translate(95px,0)}92%{opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes grow-data-access-jdbc-lit{0%,100%{fill:var(--scene-accent-soft,#dcefed)}40%,60%{fill:var(--scene-good,#1f7a4d)}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="100" y="28" width="76" height="100" rx="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<rect x="114" y="40" width="48" height="20" rx="6" class="grow-data-access-jdbc-s"/>
<rect x="114" y="68" width="48" height="20" rx="6" fill="var(--scene-card,#fff)" stroke="var(--scene-accent,#006c73)"/>
<rect x="114" y="96" width="48" height="20" rx="6" fill="var(--scene-card,#fff)" stroke="var(--scene-accent,#006c73)"/>
<path d="M62 78H100M176 78H214" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-dasharray="4 4"/>
<g fill="var(--scene-link,#245a88)"><circle cx="30" cy="50" r="9"/><circle cx="30" cy="78" r="9"/><circle cx="30" cy="106" r="9"/></g>
<circle class="grow-data-access-jdbc-a" cx="52" cy="78" r="7" fill="var(--scene-warn,#a15c00)" style="transform-box:fill-box"/>
<circle class="grow-data-access-jdbc-b" cx="52" cy="50" r="7" fill="var(--scene-grow,#b8457a)"/>
<g transform="translate(250 0)" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-ink,#102a33)" stroke-width="2"><path d="M-30 40v70c0 10 14 16 30 16s30-6 30-16V40"/><ellipse cx="0" cy="40" rx="30" ry="10"/><path d="M-30 75c0 10 14 16 30 16s30-6 30-16" fill="none"/></g>
<text x="138" y="148" text-anchor="middle" class="grow-data-access-jdbc-t">Pool</text>
<text x="160" y="171" text-anchor="middle" class="grow-data-access-jdbc-m">Borrow, use, return</text>
</svg>
