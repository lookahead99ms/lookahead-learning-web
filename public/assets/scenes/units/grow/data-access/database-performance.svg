<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" font-family="system-ui, sans-serif">
<style>
.grow-data-access-database-performance-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-data-access-database-performance-s{animation:grow-data-access-database-performance-scan 5s linear infinite;animation-delay:-3s}
.grow-data-access-database-performance-h{animation:grow-data-access-database-performance-hop 5s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-data-access-database-performance-scan{0%{transform:translateY(0)}100%{transform:translateY(112px)}}
@keyframes grow-data-access-database-performance-hop{0%,15%{opacity:0}30%,80%{opacity:1}100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-ink,#102a33)" stroke-width="1.5">
<rect x="20" y="14" width="110" height="14"/><rect x="20" y="28" width="110" height="14"/><rect x="20" y="42" width="110" height="14"/><rect x="20" y="56" width="110" height="14"/><rect x="20" y="70" width="110" height="14"/><rect x="20" y="84" width="110" height="14"/><rect x="20" y="98" width="110" height="14"/><rect x="20" y="112" width="110" height="14"/></g>
<rect class="grow-data-access-database-performance-s" x="16" y="14" width="118" height="14" rx="3" fill="var(--scene-warn,#a15c00)" fill-opacity=".55" stroke="var(--scene-warn,#a15c00)" stroke-width="2"/>
<text x="75" y="150" text-anchor="middle" class="grow-data-access-database-performance-t">Full scan</text>
<path d="M165 20v130" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<g stroke="var(--scene-accent,#006c73)" stroke-width="2.5" fill="none"><path d="M250 38L222 76M250 38L278 76M222 76L206 110M222 76L238 110M278 76L262 110M278 76L294 110"/></g>
<g fill="var(--scene-card,#fff)" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"><circle cx="250" cy="34" r="12"/><circle cx="222" cy="76" r="10"/><circle cx="278" cy="76" r="10"/><circle cx="206" cy="112" r="9"/><circle cx="238" cy="112" r="9"/><circle cx="262" cy="112" r="9"/><circle cx="294" cy="112" r="9"/></g>
<g class="grow-data-access-database-performance-h" fill="var(--scene-good,#1f7a4d)"><circle cx="250" cy="34" r="12"/><circle cx="278" cy="76" r="10"/><circle cx="262" cy="112" r="9"/></g>
<text x="250" y="150" text-anchor="middle" class="grow-data-access-database-performance-t">Index lookup</text>
<text x="160" y="172" text-anchor="middle" style="font-size:16px;fill:var(--scene-text,#28434a)">Check the plan first</text>
</svg>
