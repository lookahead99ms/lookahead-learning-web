<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" font-family="system-ui, sans-serif">
<style>
.grow-data-access-transactions-locking-t{font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.grow-data-access-transactions-locking-a{animation:grow-data-access-transactions-locking-ra 5s ease-in-out infinite;animation-delay:-3s}
.grow-data-access-transactions-locking-b{animation:grow-data-access-transactions-locking-rb 5s ease-in-out infinite;animation-delay:-3s}
.grow-data-access-transactions-locking-w{animation:grow-data-access-transactions-locking-win 5s ease-in-out infinite;animation-delay:-3s}
.grow-data-access-transactions-locking-l{animation:grow-data-access-transactions-locking-lose 5s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-data-access-transactions-locking-ra{0%{transform:translateX(0)}40%,100%{transform:translateX(34px)}}
@keyframes grow-data-access-transactions-locking-rb{0%{transform:translateX(0)}40%{transform:translateX(0)}60%,100%{transform:translateX(-34px)}}
@keyframes grow-data-access-transactions-locking-win{0%,35%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
@keyframes grow-data-access-transactions-locking-lose{0%,50%{opacity:0}65%,90%{opacity:1}100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g class="grow-data-access-transactions-locking-a"><circle cx="40" cy="70" r="16" fill="var(--scene-link,#245a88)"/><path d="M28 98a12 12 0 0124 0z" fill="var(--scene-link,#245a88)"/></g>
<g class="grow-data-access-transactions-locking-b"><circle cx="280" cy="70" r="16" fill="var(--scene-grow,#b8457a)"/><path d="M268 98a12 12 0 0124 0z" fill="var(--scene-grow,#b8457a)"/></g>
<g transform="translate(160 72)"><rect x="-26" y="-36" width="52" height="40" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/><rect x="-32" y="4" width="64" height="14" rx="5" fill="var(--scene-accent,#006c73)"/><path d="M-20 18v16M20 18v16" stroke="var(--scene-accent,#006c73)" stroke-width="4"/></g>
<g class="grow-data-access-transactions-locking-w"><circle cx="160" cy="40" r="13" fill="var(--scene-good,#1f7a4d)"/><path d="M153 40l5 5 9-10" stroke="#fff" stroke-width="3" fill="none"/></g>
<g class="grow-data-access-transactions-locking-l"><rect x="246" y="124" width="56" height="26" rx="8" fill="var(--scene-bad,#b3261e)"/><text x="274" y="142" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#fff">409</text></g>
<text x="160" y="128" text-anchor="middle" class="grow-data-access-transactions-locking-t">One winner</text>
<text x="160" y="166" text-anchor="middle" style="font-size:16px;fill:var(--scene-text,#28434a)">Conditional UPDATE</text>
</svg>
