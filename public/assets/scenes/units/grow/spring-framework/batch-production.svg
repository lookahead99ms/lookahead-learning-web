<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A large file is split into partitions run in parallel; a failed one restarts from its checkpoint">
<style>.grow-spring-framework-batch-production-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.grow-spring-framework-batch-production-bg{fill:var(--scene-card,#fff)}.grow-spring-framework-batch-production-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}.grow-spring-framework-batch-production-ln{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round}.grow-spring-framework-batch-production-l1{animation:grow-spring-framework-batch-production-g 6s linear infinite;animation-delay:-3s;transform-box:fill-box;transform-origin:left}.grow-spring-framework-batch-production-l2{animation:grow-spring-framework-batch-production-g 5s linear infinite;animation-delay:-2s;transform-box:fill-box;transform-origin:left}.grow-spring-framework-batch-production-l3{animation:grow-spring-framework-batch-production-g 7s linear infinite;animation-delay:-4s;transform-box:fill-box;transform-origin:left}.grow-spring-framework-batch-production-l4{animation:grow-spring-framework-batch-production-h 6s ease-in-out infinite;animation-delay:-3s;transform-box:fill-box;transform-origin:left}
@keyframes grow-spring-framework-batch-production-g{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}@keyframes grow-spring-framework-batch-production-h{0%{transform:scaleX(0)}40%{transform:scaleX(.45)}60%{transform:scaleX(.45)}100%{transform:scaleX(1)}}</style>
<rect width="320" height="180" class="grow-spring-framework-batch-production-bg"/>
<rect x="14" y="40" width="52" height="100" rx="6" class="grow-spring-framework-batch-production-box"/><path d="M14 65H66M14 90H66M14 115H66" stroke="var(--scene-accent,#006c73)" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M70 52L110 52M70 77L110 77M70 102L110 102M70 127L110 127" stroke="var(--scene-line,#cfdfdc)" stroke-width="3"/>
<rect x="112" y="44" width="190" height="16" rx="8" fill="var(--scene-line,#cfdfdc)"/><rect x="112" y="69" width="190" height="16" rx="8" fill="var(--scene-line,#cfdfdc)"/><rect x="112" y="94" width="190" height="16" rx="8" fill="var(--scene-line,#cfdfdc)"/><rect x="112" y="119" width="190" height="16" rx="8" fill="var(--scene-line,#cfdfdc)"/>
<rect x="112" y="44" width="190" height="16" rx="8" fill="var(--scene-accent,#006c73)" class="grow-spring-framework-batch-production-l1"/><rect x="112" y="69" width="190" height="16" rx="8" fill="var(--scene-learn,#0f8a8a)" class="grow-spring-framework-batch-production-l2"/><rect x="112" y="94" width="190" height="16" rx="8" fill="var(--scene-ahead,#2f6fb3)" class="grow-spring-framework-batch-production-l3"/><rect x="112" y="119" width="190" height="16" rx="8" fill="var(--scene-good,#1f7a4d)" class="grow-spring-framework-batch-production-l4"/>
<path d="M198 138V154" stroke="var(--scene-bad,#b3261e)" stroke-width="3"/><path d="M198 138l14 5-14 5" fill="var(--scene-bad,#b3261e)"/>
