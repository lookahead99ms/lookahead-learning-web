<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A stream of items flows through a pipe to a slow consumer that signals how much it wants">
<style>.grow-spring-framework-webflux-reactor-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.grow-spring-framework-webflux-reactor-bg{fill:var(--scene-card,#fff)}.grow-spring-framework-webflux-reactor-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}.grow-spring-framework-webflux-reactor-ln{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round}.grow-spring-framework-webflux-reactor-fl{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:6;stroke-dasharray:2 22;stroke-linecap:round;animation:grow-spring-framework-webflux-reactor-d 1.2s linear infinite}.grow-spring-framework-webflux-reactor-fl2{fill:none;stroke:var(--scene-grow,#b8457a);stroke-width:6;stroke-dasharray:2 22;stroke-linecap:round;animation:grow-spring-framework-webflux-reactor-d 1.2s linear infinite;animation-delay:-.5s}
.grow-spring-framework-webflux-reactor-lv{animation:grow-spring-framework-webflux-reactor-lv 6s ease-in-out infinite;animation-delay:-3s;transform-box:fill-box;transform-origin:bottom}.grow-spring-framework-webflux-reactor-rq{animation:grow-spring-framework-webflux-reactor-bp 3s ease-in-out infinite;animation-delay:-1s}
@keyframes grow-spring-framework-webflux-reactor-d{to{stroke-dashoffset:-24}}@keyframes grow-spring-framework-webflux-reactor-lv{0%{transform:scaleY(.2)}80%,100%{transform:scaleY(.8)}}@keyframes grow-spring-framework-webflux-reactor-bp{0%,100%{opacity:1}50%{opacity:.3}}</style>
<rect width="320" height="180" class="grow-spring-framework-webflux-reactor-bg"/>
<rect x="10" y="62" width="196" height="40" rx="20" class="grow-spring-framework-webflux-reactor-box"/>
<path d="M30 82H190" class="grow-spring-framework-webflux-reactor-fl"/><path d="M40 72H196" class="grow-spring-framework-webflux-reactor-fl2" style="stroke-width:4"/>
<text x="108" y="40" text-anchor="middle" class="grow-spring-framework-webflux-reactor-t">Flux</text>
<rect x="242" y="40" width="58" height="92" rx="8" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="3"/><rect x="246" y="44" width="50" height="84" rx="5" fill="var(--scene-accent,#006c73)" class="grow-spring-framework-webflux-reactor-lv"/>
<path d="M206 82H242" stroke="var(--scene-accent,#006c73)" stroke-width="4"/>
<g class="grow-spring-framework-webflux-reactor-rq"><path d="M236 150H150" stroke="var(--scene-warn,#a15c00)" stroke-width="3" stroke-linecap="round"/><path d="M158 143l-9 7 9 7" stroke="var(--scene-warn,#a15c00)" stroke-width="3" fill="none" stroke-linecap="round"/></g>
<text x="12" y="157" class="grow-spring-framework-webflux-reactor-t" style="fill:var(--scene-warn,#a15c00)">Ask for 2</text>
</svg>
