<rect x="238" y="30" width="72" height="28" rx="6" class="grow-spring-framework-spring-mvc-box"/><rect x="238" y="76" width="72" height="28" rx="6" class="grow-spring-framework-spring-mvc-box"/><rect x="238" y="122" width="72" height="28" rx="6" class="grow-spring-framework-spring-mvc-box"/>
<g class="grow-spring-framework-spring-mvc-hi"><rect x="238" y="76" width="72" height="28" rx="6" fill="var(--scene-good,#1f7a4d)"/><text x="274" y="95" text-anchor="middle" class="grow-spring-framework-spring-mvc-t" style="fill:var(--scene-card,#fff)">JSON</text></g>
<text x="274" y="49" text-anchor="middle" class="grow-spring-framework-spring-mvc-t" opacity=".0">.</text>
