<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A request reaches the dispatcher, which routes it to one controller and returns JSON">
<style>.grow-spring-framework-spring-mvc-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.grow-spring-framework-spring-mvc-bg{fill:var(--scene-card,#fff)}.grow-spring-framework-spring-mvc-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}.grow-spring-framework-spring-mvc-ln{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round}.grow-spring-framework-spring-mvc-rq{animation:grow-spring-framework-spring-mvc-r 6s ease-in-out infinite;animation-delay:-3s}.grow-spring-framework-spring-mvc-hi{animation:grow-spring-framework-spring-mvc-h 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-spring-framework-spring-mvc-r{0%{transform:translateX(0)}35%,100%{transform:translateX(66px)}}
@keyframes grow-spring-framework-spring-mvc-h{0%,35%{opacity:.25}50%,90%{opacity:1}100%{opacity:.25}}</style>
