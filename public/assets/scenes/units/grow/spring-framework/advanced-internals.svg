<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A call passes through proxy layers to the object, but an inner self-call skips them silently">
<style>.grow-spring-framework-advanced-internals-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.grow-spring-framework-advanced-internals-bg{fill:var(--scene-card,#fff)}.grow-spring-framework-advanced-internals-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}.grow-spring-framework-advanced-internals-ln{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round}.grow-spring-framework-advanced-internals-in{animation:grow-spring-framework-advanced-internals-i 6s ease-in-out infinite;animation-delay:-3s}.grow-spring-framework-advanced-internals-sk{animation:grow-spring-framework-advanced-internals-s 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-spring-framework-advanced-internals-i{0%{transform:translateX(0);opacity:1}40%,60%{transform:translateX(72px);opacity:1}70%,100%{transform:translateX(72px);opacity:0}}
@keyframes grow-spring-framework-advanced-internals-s{0%,55%{opacity:.2}70%,95%{opacity:1}100%{opacity:.2}}</style>
<rect width="320" height="180" class="grow-spring-framework-advanced-internals-bg"/>
<circle cx="200" cy="102" r="64" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-link,#245a88)" stroke-width="3"/><circle cx="200" cy="102" r="42" fill="var(--scene-card,#fff)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/><circle cx="200" cy="102" r="20" fill="var(--scene-ink,#102a33)"/>
<text x="200" y="22" text-anchor="middle" class="grow-spring-framework-advanced-internals-t">Tx and cache</text>
<path d="M14 102H130" stroke="var(--scene-line,#cfdfdc)" stroke-width="3"/><g class="grow-spring-framework-advanced-internals-in"><circle cx="30" cy="102" r="11" fill="var(--scene-good,#1f7a4d)"/></g>
<g class="grow-spring-framework-advanced-internals-sk"><circle cx="200" cy="102" r="20" fill="none" stroke="var(--scene-bad,#b3261e)" stroke-width="3"/></g>
<text x="12" y="150" class="grow-spring-framework-advanced-internals-t" style="fill:var(--scene-bad,#b3261e)">Self-call: skipped</text>
</svg>
