<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A bulk message is split in three, replies are collected, and a timeout covers the missing one">
<style>.grow-spring-framework-integration-production-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.grow-spring-framework-integration-production-bg{fill:var(--scene-card,#fff)}.grow-spring-framework-integration-production-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}.grow-spring-framework-integration-production-ln{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round}.grow-spring-framework-integration-production-r1{animation:grow-spring-framework-integration-production-q 6s ease-in-out infinite;animation-delay:-3s}.grow-spring-framework-integration-production-r2{animation:grow-spring-framework-integration-production-q 6s ease-in-out infinite;animation-delay:-3.8s}.grow-spring-framework-integration-production-hd{animation:grow-spring-framework-integration-production-sp 6s linear infinite;animation-delay:-3s;transform-box:fill-box;transform-origin:center}
@keyframes grow-spring-framework-integration-production-q{0%,10%{transform:translateX(-72px);opacity:0}40%,100%{transform:translateX(0);opacity:1}}@keyframes grow-spring-framework-integration-production-sp{to{transform:rotate(360deg)}}</style>
<rect width="320" height="180" class="grow-spring-framework-integration-production-bg"/>
<rect x="8" y="64" width="52" height="52" rx="8" class="grow-spring-framework-integration-production-box"/><text x="34" y="46" text-anchor="middle" class="grow-spring-framework-integration-production-t">Split</text>
<path d="M60 90L112 52M60 90H112M60 90L112 128" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" fill="none"/>
<g class="grow-spring-framework-integration-production-r1"><rect x="130" y="40" width="34" height="24" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2.5"/></g>
<g class="grow-spring-framework-integration-production-r2"><rect x="130" y="78" width="34" height="24" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2.5"/></g>
<rect x="130" y="116" width="34" height="24" rx="3" fill="none" stroke="var(--scene-warn,#a15c00)" stroke-width="2.5" stroke-dasharray="4 3"/>
<path d="M170 52H206M170 90H206M170 128H206" stroke="var(--scene-line,#cfdfdc)" stroke-width="3"/>
<rect x="206" y="36" width="104" height="116" rx="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"/><text x="258" y="28" text-anchor="middle" class="grow-spring-framework-integration-production-t">Aggregate</text>
<rect x="222" y="48" width="72" height="20" rx="4" fill="var(--scene-good,#1f7a4d)"/><rect x="222" y="76" width="72" height="20" rx="4" fill="var(--scene-good,#1f7a4d)"/><rect x="222" y="104" width="72" height="20" rx="4" fill="none" stroke="var(--scene-warn,#a15c00)" stroke-width="2.5" stroke-dasharray="4 3"/>
<g transform="translate(258 140)"><circle r="0"/></g>
<circle cx="150" cy="166" r="0"/>
<g><circle cx="22" cy="152" r="12" fill="var(--scene-card,#fff)" stroke="var(--scene-warn,#a15c00)" stroke-width="3"/><path d="M22 145v7h6" stroke="var(--scene-warn,#a15c00)" stroke-width="2.5" fill="none" class="grow-spring-framework-integration-production-hd"/></g><text x="40" y="157" class="grow-spring-framework-integration-production-t" style="fill:var(--scene-warn,#a15c00)">Timeout</text>
</svg>
