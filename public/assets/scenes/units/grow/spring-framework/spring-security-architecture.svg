<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A request passes an identity check, then a permission check; another is turned away">
<style>.grow-spring-framework-spring-security-architecture-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.grow-spring-framework-spring-security-architecture-bg{fill:var(--scene-card,#fff)}.grow-spring-framework-spring-security-architecture-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}.grow-spring-framework-spring-security-architecture-ln{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round}.grow-spring-framework-spring-security-architecture-a{animation:grow-spring-framework-spring-security-architecture-pa 6s ease-in-out infinite;animation-delay:-3s}.grow-spring-framework-spring-security-architecture-b{animation:grow-spring-framework-spring-security-architecture-pb 6s ease-in-out infinite;animation-delay:-4.5s}.grow-spring-framework-spring-security-architecture-g{animation:grow-spring-framework-spring-security-architecture-gg 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-spring-framework-spring-security-architecture-pa{0%{transform:translateX(0)}60%,100%{transform:translateX(226px)}}
@keyframes grow-spring-framework-spring-security-architecture-pb{0%{transform:translateX(0)}35%,100%{transform:translateX(160px)}}
@keyframes grow-spring-framework-spring-security-architecture-gg{0%,100%{opacity:.35}50%{opacity:1}}</style>
