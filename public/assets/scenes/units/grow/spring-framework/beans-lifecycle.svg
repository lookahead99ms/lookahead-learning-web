<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A bean moves from creation through use to a clean shutdown">
<style>.grow-spring-framework-beans-lifecycle-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.grow-spring-framework-beans-lifecycle-bg{fill:var(--scene-card,#fff)}.grow-spring-framework-beans-lifecycle-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}.grow-spring-framework-beans-lifecycle-ln{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round}.grow-spring-framework-beans-lifecycle-mv{animation:grow-spring-framework-beans-lifecycle-go 6s linear infinite;animation-delay:-3s}
.grow-spring-framework-beans-lifecycle-s1{animation:grow-spring-framework-beans-lifecycle-st 6s infinite;animation-delay:-3s}
@keyframes grow-spring-framework-beans-lifecycle-go{0%{transform:translateX(0);opacity:0}6%{opacity:1}85%{transform:translateX(240px);opacity:1}95%,100%{transform:translateX(240px);opacity:0}}
@keyframes grow-spring-framework-beans-lifecycle-st{0%,100%{opacity:.5}50%{opacity:1}}</style>
<rect width="320" height="180" class="grow-spring-framework-beans-lifecycle-bg"/>
<path d="M40 100H280" stroke="var(--scene-line,#cfdfdc)" stroke-width="6" stroke-linecap="round"/>
<circle cx="40" cy="100" r="11" fill="var(--scene-good,#1f7a4d)"/><circle cx="160" cy="100" r="11" fill="var(--scene-accent,#006c73)"/><circle cx="280" cy="100" r="11" fill="var(--scene-bad,#b3261e)"/>
<text x="40" y="142" text-anchor="middle" class="grow-spring-framework-beans-lifecycle-t">Create</text><text x="160" y="142" text-anchor="middle" class="grow-spring-framework-beans-lifecycle-t">Use</text><text x="280" y="142" text-anchor="middle" class="grow-spring-framework-beans-lifecycle-t">Close</text>
<g class="grow-spring-framework-beans-lifecycle-mv"><circle cx="40" cy="62" r="14" fill="var(--scene-grow,#b8457a)"/><path d="M34 62l4 5 8-9" stroke="var(--scene-card,#fff)" stroke-width="3" fill="none"/><path d="M40 76V89" stroke="var(--scene-grow,#b8457a)" stroke-width="3"/></g>
<path d="M30 36h14M40 30v12" stroke="var(--scene-good,#1f7a4d)" stroke-width="3" opacity=".0"/>
</svg>
