<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A message is routed by a router to the right handler, with a separate error path">
<style>.grow-spring-framework-integration-fundamentals-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.grow-spring-framework-integration-fundamentals-bg{fill:var(--scene-card,#fff)}.grow-spring-framework-integration-fundamentals-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}.grow-spring-framework-integration-fundamentals-ln{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round}.grow-spring-framework-integration-fundamentals-m1{animation:grow-spring-framework-integration-fundamentals-a 6s ease-in-out infinite;animation-delay:-3s}.grow-spring-framework-integration-fundamentals-m2{animation:grow-spring-framework-integration-fundamentals-b 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-spring-framework-integration-fundamentals-a{0%{transform:translate(0,0)}40%{transform:translate(56px,0)}80%,100%{transform:translate(184px,-44px)}}
@keyframes grow-spring-framework-integration-fundamentals-b{0%,75%{opacity:0;transform:translate(56px,0)}80%{opacity:1;transform:translate(56px,0)}100%{opacity:1;transform:translate(184px,44px)}}</style>
<rect width="320" height="180" class="grow-spring-framework-integration-fundamentals-bg"/>
<path d="M30 90H114M148 78L236 44M148 102L236 136" stroke="var(--scene-line,#cfdfdc)" stroke-width="8" stroke-linecap="round" fill="none"/>
<path d="M148 102L236 136" stroke="var(--scene-bad,#b3261e)" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
<path d="M131 62l28 28-28 28-28-28z" fill="var(--scene-accent,#006c73)"/><text x="131" y="30" text-anchor="middle" class="grow-spring-framework-integration-fundamentals-t">Router</text>
<rect x="240" y="28" width="68" height="32" rx="6" class="grow-spring-framework-integration-fundamentals-box"/><text x="274" y="49" text-anchor="middle" class="grow-spring-framework-integration-fundamentals-t">Handler</text>
<rect x="240" y="120" width="68" height="32" rx="6" fill="var(--scene-card,#fff)" stroke="var(--scene-bad,#b3261e)" stroke-width="2.5"/><text x="274" y="141" text-anchor="middle" class="grow-spring-framework-integration-fundamentals-t" style="fill:var(--scene-bad,#b3261e)">Error</text>
<g class="grow-spring-framework-integration-fundamentals-m1"><rect x="14" y="78" width="30" height="24" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/><path d="M14 80l15 11 15-11" stroke="var(--scene-ink,#102a33)" stroke-width="2" fill="none"/></g>
<g class="grow-spring-framework-integration-fundamentals-m2" opacity="0"><rect x="14" y="78" width="30" height="24" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-bad,#b3261e)" stroke-width="2"/></g>
</svg>
