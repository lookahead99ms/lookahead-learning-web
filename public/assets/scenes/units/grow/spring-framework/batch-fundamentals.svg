<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Items are read, processed and written in chunks, with a checkpoint after each chunk">
<style>.grow-spring-framework-batch-fundamentals-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.grow-spring-framework-batch-fundamentals-bg{fill:var(--scene-card,#fff)}.grow-spring-framework-batch-fundamentals-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}.grow-spring-framework-batch-fundamentals-ln{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round}.grow-spring-framework-batch-fundamentals-ch{animation:grow-spring-framework-batch-fundamentals-c 6s linear infinite;animation-delay:-3s}.grow-spring-framework-batch-fundamentals-fg{animation:grow-spring-framework-batch-fundamentals-f 6s steps(1) infinite;animation-delay:-3s}
@keyframes grow-spring-framework-batch-fundamentals-c{0%{transform:translateX(-120px)}100%{transform:translateX(150px)}}@keyframes grow-spring-framework-batch-fundamentals-f{0%{opacity:0}50%,100%{opacity:1}}</style>
<rect width="320" height="180" class="grow-spring-framework-batch-fundamentals-bg"/>
<path d="M10 90H310" stroke="var(--scene-line,#cfdfdc)" stroke-width="22" stroke-linecap="butt"/>
<rect x="26" y="34" width="70" height="28" rx="6" class="grow-spring-framework-batch-fundamentals-box"/><rect x="125" y="34" width="70" height="28" rx="6" class="grow-spring-framework-batch-fundamentals-box"/><rect x="224" y="34" width="70" height="28" rx="6" class="grow-spring-framework-batch-fundamentals-box"/>
<text x="61" y="53" text-anchor="middle" class="grow-spring-framework-batch-fundamentals-t">Read</text><text x="160" y="53" text-anchor="middle" class="grow-spring-framework-batch-fundamentals-t">Process</text><text x="259" y="53" text-anchor="middle" class="grow-spring-framework-batch-fundamentals-t">Write</text>
<g class="grow-spring-framework-batch-fundamentals-ch"><rect x="106" y="78" width="26" height="24" rx="4" fill="var(--scene-accent,#006c73)"/><rect x="136" y="78" width="26" height="24" rx="4" fill="var(--scene-grow,#b8457a)"/><rect x="166" y="78" width="26" height="24" rx="4" fill="var(--scene-ahead,#2f6fb3)"/><rect x="100" y="72" width="98" height="36" rx="8" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="2.5" stroke-dasharray="5 3"/></g>
<g class="grow-spring-framework-batch-fundamentals-fg"><path d="M262 150V122l22 8-22 8" fill="var(--scene-good,#1f7a4d)" stroke="var(--scene-good,#1f7a4d)" stroke-width="3" stroke-linejoin="round"/></g>
<rect x="20" y="130" width="230" height="10" rx="5" fill="var(--scene-line,#cfdfdc)"/><rect x="20" y="130" width="140" height="10" rx="5" fill="var(--scene-good,#1f7a4d)"/>
</svg>
