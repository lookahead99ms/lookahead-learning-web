<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A repository saves a row; a second editor holding an old version is rejected">
<style>.grow-spring-framework-spring-data-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}.grow-spring-framework-spring-data-bg{fill:var(--scene-card,#fff)}.grow-spring-framework-spring-data-box{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}.grow-spring-framework-spring-data-ln{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-linecap:round}.grow-spring-framework-spring-data-pen1{animation:grow-spring-framework-spring-data-p1 6s ease-in-out infinite;animation-delay:-3s}.grow-spring-framework-spring-data-pen2{animation:grow-spring-framework-spring-data-p2 6s ease-in-out infinite;animation-delay:-3s}.grow-spring-framework-spring-data-v{animation:grow-spring-framework-spring-data-vv 6s steps(1) infinite;animation-delay:-3s}.grow-spring-framework-spring-data-v2{animation:grow-spring-framework-spring-data-vw 6s steps(1) infinite;animation-delay:-3s}.grow-spring-framework-spring-data-x{animation:grow-spring-framework-spring-data-xx 6s ease-in-out infinite;animation-delay:-3s;transform-box:fill-box;transform-origin:center}
@keyframes grow-spring-framework-spring-data-p1{0%,10%{transform:translateX(0)}30%,100%{transform:translateX(52px)}}
@keyframes grow-spring-framework-spring-data-p2{0%,45%{transform:translateX(0)}65%,100%{transform:translateX(52px)}}
@keyframes grow-spring-framework-spring-data-vv{0%{opacity:1}30%,100%{opacity:0}}@keyframes grow-spring-framework-spring-data-vw{0%{opacity:0}30%,100%{opacity:1}}
@keyframes grow-spring-framework-spring-data-xx{0%,60%{opacity:0;transform:scale(.5)}72%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}</style>
<rect width="320" height="180" class="grow-spring-framework-spring-data-bg"/>
<rect x="150" y="44" width="160" height="92" rx="8" class="grow-spring-framework-spring-data-box"/><path d="M150 74H310M150 104H310" stroke="var(--scene-line,#cfdfdc)" stroke-width="1.5"/>
<rect x="160" y="54" width="60" height="10" rx="5" fill="var(--scene-muted,#536970)"/><rect x="160" y="114" width="60" height="10" rx="5" fill="var(--scene-muted,#536970)"/><rect x="160" y="84" width="60" height="10" rx="5" fill="var(--scene-accent,#006c73)"/>
<g class="grow-spring-framework-spring-data-v"><text x="262" y="96" class="grow-spring-framework-spring-data-t">v3</text></g><g class="grow-spring-framework-spring-data-v2"><text x="262" y="96" class="grow-spring-framework-spring-data-t" style="fill:var(--scene-good,#1f7a4d)">v4</text></g>
<text x="12" y="28" class="grow-spring-framework-spring-data-t">Repository</text>
<g class="grow-spring-framework-spring-data-pen1"><circle cx="30" cy="70" r="13" fill="var(--scene-good,#1f7a4d)"/><path d="M44 70H88" stroke="var(--scene-good,#1f7a4d)" stroke-width="3"/></g>
<g class="grow-spring-framework-spring-data-pen2"><circle cx="30" cy="118" r="13" fill="var(--scene-warn,#a15c00)"/><path d="M44 118H88" stroke="var(--scene-warn,#a15c00)" stroke-width="3"/></g>
<g class="grow-spring-framework-spring-data-x"><circle cx="280" cy="150" r="0" /><text x="150" y="164" class="grow-spring-framework-spring-data-t" style="fill:var(--scene-bad,#b3261e)">Stale: v3</text><path d="M112 108l12 12M124 108l-12 12" stroke="var(--scene-bad,#b3261e)" stroke-width="4"/></g>
</svg>
