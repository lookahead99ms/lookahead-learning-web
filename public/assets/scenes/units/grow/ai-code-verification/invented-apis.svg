<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="An engineer's AI draft sends checked code along to the cloud server, while a package with an unknown name is stopped at the dependency review barrier with a red cross">
<style>
.acvia-a,.acvia-b,.acvia-c,.acvia-d{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-5.2s;animation-timing-function:ease-in-out}
.acvia-a{animation-name:acvia-a}
@keyframes acvia-a{0%,6%{transform:translateX(0);opacity:0}10%{opacity:1}40%,94%{transform:translateX(26px);opacity:1}100%{transform:translateX(26px);opacity:0}}
.acvia-b{animation-name:acvia-b}
@keyframes acvia-b{0%,42%{opacity:0}48%,92%{opacity:1}98%,100%{opacity:0}}
.acvia-c{animation-name:acvia-c;animation-timing-function:linear}
@keyframes acvia-c{0%,8%{transform:translateX(0);opacity:0}12%{opacity:1}60%{transform:translateX(124px);opacity:1}64%,100%{transform:translateX(124px);opacity:0}}
.acvia-d{animation-name:acvia-d}
@keyframes acvia-d{0%,60%{opacity:0}66%,94%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.acvia-a,.acvia-b,.acvia-c,.acvia-d{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-ink,#102a33)" opacity=".09"><ellipse cx="58" cy="152" rx="40" ry="6"/><ellipse cx="190" cy="152" rx="20" ry="5"/><ellipse cx="270" cy="156" rx="34" ry="6"/></g>
<!-- engineer behind a laptop with the assistant's draft on screen -->
<circle cx="58" cy="32" r="11" fill="var(--scene-accent,#006c73)"/>
<path d="M37 66a21 21 0 0 1 42 0Z" fill="var(--scene-accent,#006c73)"/>
<rect x="20" y="66" width="78" height="56" rx="5" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<path d="M28 78h30M28 88h46M28 98h24M28 108h38" stroke="var(--scene-line,#cfdfdc)" stroke-width="4" stroke-linecap="round"/>
<path d="M62 78h18" stroke="var(--scene-accent,#006c73)" stroke-width="4" stroke-linecap="round"/>
<path d="M56 98h22" stroke="var(--scene-warn,#a15c00)" stroke-width="4" stroke-linecap="round"/>
<path d="M12 122h94l-8 16H20Z" fill="var(--scene-line,#cfdfdc)" stroke="var(--scene-ink,#102a33)" stroke-width="1.5"/>
<!-- wires: the package path (top) and the checked code path (bottom) -->
<path d="M104 92H236M104 132H236" fill="none" stroke="var(--scene-muted,#5f7478)" stroke-width="1.5" stroke-dasharray="3 4"/>
<!-- dependency review barrier: a post and a boom across the top wire -->
<rect x="184" y="70" width="10" height="80" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="1.5"/>
<path d="M194 70l5-4v80l-5 4Z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<rect x="160" y="88" width="26" height="8" rx="2" fill="var(--scene-warn,#a15c00)"/>
<path d="M168 88l-4 8M177 88l-4 8M186 88l-4 8" stroke="var(--scene-card,#fff)" stroke-width="2"/>
<!-- cloud server: a box with a top face, a side face, slots and LEDs -->
<path d="M240 56l8-6h40l-8 6Z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M280 56l8-6v90l-8 6Z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<rect x="240" y="56" width="40" height="90" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="1.5"/>
<path d="M247 68h20M247 82h20M247 96h20M247 110h20" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"/>
<g fill="var(--scene-good,#1f7a4d)"><circle cx="273" cy="68" r="2.2"/><circle cx="273" cy="82" r="2.2"/><circle cx="273" cy="96" r="2.2"/><circle cx="273" cy="110" r="2.2"/></g>
<!-- checked code reaches the server -->
<g class="acvia-c"><rect x="104" y="125" width="18" height="14" rx="3" fill="var(--scene-accent,#006c73)"/><path d="M108 132l3 3 6-6" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2" stroke-linecap="round"/></g>
<g class="acvia-d"><circle cx="286" cy="130" r="9" fill="var(--scene-good,#1f7a4d)"/><path d="M282 130l3 3 6-6" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2" stroke-linecap="round"/></g>
<!-- the package with an unknown name travels to the barrier and stops -->
<g class="acvia-a">
<path d="M104 80l5-4h22l-5 4Z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M126 80l5-4v22l-5 4Z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<rect x="104" y="80" width="22" height="22" rx="2" fill="var(--scene-grow,#b8457a)"/>
<text x="115" y="96" text-anchor="middle" font-size="14" fill="var(--scene-card,#fff)">?</text>
</g>
<g class="acvia-b"><circle cx="172" cy="64" r="10" fill="var(--scene-bad,#b4442c)"/><path d="M168 60l8 8M176 60l-8 8" stroke="var(--scene-card,#fff)" stroke-width="2.2" stroke-linecap="round"/></g>
</svg>
