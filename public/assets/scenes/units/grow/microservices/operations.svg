<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Stopping a worker: close intake, drain running work, hand unfinished jobs back to the outbox">
<style>
.grow-microservices-operations-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;text-anchor:middle;fill:var(--scene-ink,#102a33)}
.grow-microservices-operations-env1{animation:grow-microservices-operations-bounce 3s ease-in-out infinite;animation-delay:-1.2s}
.grow-microservices-operations-bar{transform-box:fill-box;transform-origin:top;animation:grow-microservices-operations-drop 6s ease-in-out infinite;animation-delay:-3s}
.grow-microservices-operations-ring{stroke-dasharray:100;animation:grow-microservices-operations-fill 6s linear infinite;animation-delay:-3s}
.grow-microservices-operations-env3{animation:grow-microservices-operations-down 4s ease-in infinite;animation-delay:-2s}
@keyframes grow-microservices-operations-bounce{0%{transform:translateX(0);opacity:0}15%{opacity:1}50%{transform:translateX(18px)}100%{transform:translateX(-6px);opacity:0}}
@keyframes grow-microservices-operations-drop{0%,10%{transform:scaleY(0)}30%,100%{transform:scaleY(1)}}
@keyframes grow-microservices-operations-fill{0%{stroke-dashoffset:100}80%,100%{stroke-dashoffset:0}}
@keyframes grow-microservices-operations-down{0%{transform:translateY(-34px);opacity:0}25%{opacity:1}80%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
</style>
<rect width="320" height="180" rx="12" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"><rect x="8" y="14" width="96" height="118" rx="10"/><rect x="112" y="14" width="96" height="118" rx="10"/><rect x="216" y="14" width="96" height="118" rx="10"/></g>
<g fill="var(--scene-accent,#006c73)"><path d="M106 70l4 4-4 4z"/><path d="M210 70l4 4-4 4z"/></g>
<!-- 1 close intake -->
<rect x="60" y="38" width="9" height="70" rx="3" fill="var(--scene-muted,#536970)" opacity=".4"/>
<rect class="grow-microservices-operations-bar" x="60" y="38" width="9" height="70" rx="3" fill="var(--scene-bad,#b3261e)"/>
<g class="grow-microservices-operations-env1"><rect x="18" y="62" width="26" height="18" rx="3" fill="var(--scene-link,#245a88)"/><path d="M18 64l13 9 13-9" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2"/></g>
<rect x="76" y="74" width="24" height="18" rx="4" fill="var(--scene-bad,#b3261e)" opacity="0"/>
<!-- 2 drain -->
<circle cx="160" cy="68" r="26" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="7"/>
<circle class="grow-microservices-operations-ring" cx="160" cy="68" r="26" fill="none" stroke="var(--scene-warn,#a15c00)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 160 68)" pathLength="100"/>
<path d="M160 52v16l10 6" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g><rect x="146" y="106" width="28" height="14" rx="3" fill="var(--scene-good,#1f7a4d)"/><path d="M153 113l4 4 7-8" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- 3 outbox -->
<g><path d="M236 98h56v26a6 6 0 0 1-6 6h-44a6 6 0 0 1-6-6z" fill="var(--scene-accent,#006c73)" fill-opacity=".3" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"/></g>
<g class="grow-microservices-operations-env3"><rect x="251" y="56" width="26" height="18" rx="3" fill="var(--scene-warn,#a15c00)"/><path d="M251 58l13 9 13-9" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2"/></g>
<rect x="236" y="92" width="56" height="8" rx="2" fill="var(--scene-accent,#006c73)"/>
<g class="grow-microservices-operations-t"><text x="56" y="156">Stop new</text><text x="160" y="156">Drain</text><text x="264" y="156">Outbox</text></g>
<g class="grow-microservices-operations-t" style="display:none"></g>
</svg>
