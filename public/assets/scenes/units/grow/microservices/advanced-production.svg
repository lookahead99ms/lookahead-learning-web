<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A booking saga: flight, hotel and car succeed, payment fails, and finished steps are undone in reverse order">
<style>
.grow-microservices-advanced-production-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700}
.grow-microservices-advanced-production-k1{animation:grow-microservices-advanced-production-k1 7s infinite;animation-delay:-5.2s}
.grow-microservices-advanced-production-k2{animation:grow-microservices-advanced-production-k2 7s infinite;animation-delay:-5.2s}
.grow-microservices-advanced-production-k3{animation:grow-microservices-advanced-production-k3 7s infinite;animation-delay:-5.2s}
.grow-microservices-advanced-production-k4{animation:grow-microservices-advanced-production-k4 7s infinite;animation-delay:-5.2s}
.grow-microservices-advanced-production-arc{stroke-dasharray:1;animation:grow-microservices-advanced-production-arc 7s linear infinite;animation-delay:-5.2s}
.grow-microservices-advanced-production-hd{animation:grow-microservices-advanced-production-hd 7s linear infinite;animation-delay:-5.2s}
@keyframes grow-microservices-advanced-production-k1{0%,5%{opacity:0}10%,100%{opacity:1}}
@keyframes grow-microservices-advanced-production-k2{0%,17%{opacity:0}22%,100%{opacity:1}}
@keyframes grow-microservices-advanced-production-k3{0%,29%{opacity:0}34%,100%{opacity:1}}
@keyframes grow-microservices-advanced-production-k4{0%,41%{opacity:0}46%,100%{opacity:1}}
@keyframes grow-microservices-advanced-production-arc{0%,50%{stroke-dashoffset:1}80%,100%{stroke-dashoffset:0}}
@keyframes grow-microservices-advanced-production-hd{0%,78%{opacity:0}82%,100%{opacity:1}}
</style>
<rect width="320" height="180" rx="12" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"><rect x="17" y="26" width="56" height="56" rx="10"/><rect x="97" y="26" width="56" height="56" rx="10"/><rect x="177" y="26" width="56" height="56" rx="10"/></g>
<rect x="257" y="26" width="56" height="56" rx="10" fill="var(--scene-bad,#b3261e)" fill-opacity=".12" stroke="var(--scene-bad,#b3261e)" stroke-width="2.5"/>
<g stroke-width="2" stroke="var(--scene-line,#cfdfdc)"><path d="M73 54h24M153 54h24M233 54h24"/></g>
<!-- plane -->
<path d="M33 60l22-6-22-6 4 6z M45 54l-10-14 4 0 10 14z M45 54l-10 14 4 0 10-14z" fill="var(--scene-accent,#006c73)"/>
<!-- bed -->
<g fill="var(--scene-accent,#006c73)"><rect x="108" y="58" width="34" height="5" rx="2"/><rect x="108" y="44" width="4" height="19"/><rect x="138" y="52" width="4" height="11"/><rect x="113" y="50" width="12" height="7" rx="3"/><rect x="127" y="52" width="11" height="6" rx="2"/></g>
<!-- car -->
<g fill="var(--scene-accent,#006c73)"><path d="M187 58v-8l5-8h16l5 8v8z"/><circle cx="194" cy="60" r="4" stroke="var(--scene-accent-soft,#dcefed)" stroke-width="2"/><circle cx="214" cy="60" r="4" stroke="var(--scene-accent-soft,#dcefed)" stroke-width="2"/></g>
<!-- card -->
<g><rect x="267" y="40" width="36" height="26" rx="4" fill="var(--scene-bad,#b3261e)"/><rect x="267" y="46" width="36" height="6" fill="var(--scene-card,#fff)"/><rect x="271" y="58" width="12" height="3" fill="var(--scene-card,#fff)"/></g>
<!-- badges -->
<g class="grow-microservices-advanced-production-k1"><circle cx="45" cy="100" r="9" fill="var(--scene-good,#1f7a4d)"/><path d="M40 100l4 4 7-8" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="grow-microservices-advanced-production-k2"><circle cx="125" cy="100" r="9" fill="var(--scene-good,#1f7a4d)"/><path d="M120 100l4 4 7-8" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="grow-microservices-advanced-production-k3"><circle cx="205" cy="100" r="9" fill="var(--scene-good,#1f7a4d)"/><path d="M200 100l4 4 7-8" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="grow-microservices-advanced-production-k4"><circle cx="285" cy="100" r="9" fill="var(--scene-bad,#b3261e)"/><path d="M281 96l8 8M289 96l-8 8" stroke="var(--scene-card,#fff)" stroke-width="2.5" stroke-linecap="round"/></g>
<text class="grow-microservices-advanced-production-t" x="313" y="18" text-anchor="end" fill="var(--scene-bad,#b3261e)">Payment fails</text>
<path class="grow-microservices-advanced-production-arc" pathLength="1" d="M285 116Q165 178 51 116" fill="none" stroke="var(--scene-warn,#a15c00)" stroke-width="3" stroke-linecap="round"/>
<path class="grow-microservices-advanced-production-hd" d="M43 118l16-2-8 12z" fill="var(--scene-warn,#a15c00)"/>
<text class="grow-microservices-advanced-production-t" x="165" y="170" text-anchor="middle" fill="var(--scene-warn,#a15c00)">Undo in reverse</text>
</svg>
