<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Three services each own their database; calls cross by API, direct writes to another database are blocked">
<style>
.grow-microservices-boundaries-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33);text-anchor:middle}
.grow-microservices-boundaries-pk{offset-path:path("M268 40 Q160 -8 52 40");offset-rotate:0deg;animation:grow-microservices-boundaries-go 6s linear infinite;animation-delay:-3s}
.grow-microservices-boundaries-x{transform-box:fill-box;transform-origin:center;animation:grow-microservices-boundaries-blink 3s ease-in-out infinite;animation-delay:-1s}
.grow-microservices-boundaries-ln{animation:grow-microservices-boundaries-dash 1.5s linear infinite}
@keyframes grow-microservices-boundaries-go{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes grow-microservices-boundaries-blink{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
@keyframes grow-microservices-boundaries-dash{to{stroke-dashoffset:-12}}
</style>
<rect width="320" height="180" rx="12" fill="var(--scene-card,#fff)"/>
<g fill="none" stroke="var(--scene-line,#cfdfdc)" stroke-width="2" stroke-dasharray="5 4">
<rect x="10" y="28" width="84" height="142" rx="10"/><rect x="118" y="28" width="84" height="142" rx="10"/><rect x="226" y="28" width="84" height="142" rx="10"/></g>
<g fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2">
<rect x="20" y="40" width="64" height="34" rx="7"/><rect x="128" y="40" width="64" height="34" rx="7"/><rect x="236" y="40" width="64" height="34" rx="7"/></g>
<g class="grow-microservices-boundaries-t"><text x="52" y="62">Stock</text><text x="160" y="62">Pricing</text><text x="268" y="62">Orders</text></g>
<g stroke="var(--scene-accent,#006c73)" stroke-width="2"><path d="M52 74V114M160 74V114M268 74V114"/></g>
<g fill="var(--scene-accent,#006c73)" stroke="var(--scene-accent,#006c73)" stroke-width="2">
<path d="M32 124v22a20 7 0 0 0 40 0v-22z" fill-opacity=".25"/><ellipse cx="52" cy="124" rx="20" ry="7"/>
<path d="M140 124v22a20 7 0 0 0 40 0v-22z" fill-opacity=".25"/><ellipse cx="160" cy="124" rx="20" ry="7"/>
<path d="M248 124v22a20 7 0 0 0 40 0v-22z" fill-opacity=".25"/><ellipse cx="268" cy="124" rx="20" ry="7"/></g>
<path d="M268 40 Q160 -8 52 40" fill="none" stroke="var(--scene-link,#245a88)" stroke-width="2.5"/>
<path d="M46 34l12 0-6 10z" fill="var(--scene-link,#245a88)"/>
<circle class="grow-microservices-boundaries-pk" r="6" fill="var(--scene-link,#245a88)" stroke="var(--scene-card,#fff)" stroke-width="2"/>
<path class="grow-microservices-boundaries-ln" d="M236 66L182 116" fill="none" stroke="var(--scene-bad,#b3261e)" stroke-width="2.5" stroke-dasharray="6 6"/>
<g class="grow-microservices-boundaries-x"><circle cx="209" cy="91" r="10" fill="var(--scene-bad,#b3261e)"/><path d="M204 86l10 10M214 86l-10 10" stroke="var(--scene-card,#fff)" stroke-width="2.5" stroke-linecap="round"/></g>
</svg>
