<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Release gate lets passing builds through and blocks unknown or failed ones">
<style>
.grow-vue-testing-delivery-t{font:600 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.grow-vue-testing-delivery-q{font:700 20px system-ui,sans-serif}
.grow-vue-testing-delivery-g{animation:grow-vue-testing-delivery-go 6s linear infinite;animation-delay:-1s}
.grow-vue-testing-delivery-u{animation:grow-vue-testing-delivery-stop 6s linear infinite;animation-delay:-4s}
@keyframes grow-vue-testing-delivery-go{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateX(236px);opacity:0}}
@keyframes grow-vue-testing-delivery-stop{0%{transform:translateX(0);opacity:0}8%{opacity:1}45%,80%{transform:translateX(84px);opacity:1}100%{transform:translateX(84px);opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<path d="M14 110h292" stroke="var(--scene-line,#cfdfdc)" stroke-width="6" stroke-linecap="round"/>
<g fill="var(--scene-card,#fff)" stroke-width="2.5">
<g class="grow-vue-testing-delivery-g"><rect x="14" y="88" width="28" height="22" rx="4" stroke="var(--scene-good,#1f7a4d)"/><path d="M21 99l5 5 9-10" fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="3" stroke-linecap="round"/></g>
<g class="grow-vue-testing-delivery-u"><rect x="14" y="88" width="28" height="22" rx="4" stroke="var(--scene-warn,#a15c00)"/><text class="grow-vue-testing-delivery-q" x="28" y="106" text-anchor="middle" fill="var(--scene-warn,#a15c00)" stroke="none">?</text></g>
</g>
<path d="M140 110V34h40v76" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="8" stroke-linejoin="round"/>
<path d="M132 34h56" stroke="var(--scene-bad,#b3261e)" stroke-width="8" stroke-linecap="round"/>
<rect x="238" y="62" width="62" height="48" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2.5"/>
<path d="M255 86h28M275 78l8 8-8 8" fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="grow-vue-testing-delivery-t" x="160" y="140" text-anchor="middle">Release gate</text>
<text class="grow-vue-testing-delivery-t" x="160" y="166" text-anchor="middle" style="fill:var(--scene-warn,#a15c00)">unknown = blocked</text>
</svg>
