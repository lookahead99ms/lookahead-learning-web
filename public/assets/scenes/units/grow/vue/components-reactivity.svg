<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Parent passes props down, child reports an event up, only one child redraws">
<style>
.grow-vue-components-reactivity-t{font:600 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.grow-vue-components-reactivity-p{animation:grow-vue-components-reactivity-down 6s linear infinite;animation-delay:-1s}
.grow-vue-components-reactivity-p2{animation-delay:-3s}
.grow-vue-components-reactivity-e{animation:grow-vue-components-reactivity-up 6s linear infinite;animation-delay:-4s}
.grow-vue-components-reactivity-hit{animation:grow-vue-components-reactivity-flash 6s ease-in-out infinite;animation-delay:-3.2s}
@keyframes grow-vue-components-reactivity-down{0%{transform:translateY(0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translateY(46px);opacity:0}}
@keyframes grow-vue-components-reactivity-up{0%{transform:translateY(46px);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes grow-vue-components-reactivity-flash{0%,45%{fill:var(--scene-card,#fff)}55%,80%{fill:var(--scene-accent-soft,#dcefed)}100%{fill:var(--scene-card,#fff)}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="90" y="14" width="140" height="40" rx="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"/>
<text class="grow-vue-components-reactivity-t" x="160" y="39" text-anchor="middle">Form owns data</text>
<g stroke="var(--scene-line,#cfdfdc)" stroke-width="3"><path d="M130 54V100M190 54V100"/></g>
<g fill="var(--scene-ahead,#2f6fb3)"><circle class="grow-vue-components-reactivity-p" cx="130" cy="56" r="5"/><circle class="grow-vue-components-reactivity-p grow-vue-components-reactivity-p2" cx="130" cy="56" r="5"/></g>
<circle class="grow-vue-components-reactivity-e" cx="190" cy="56" r="5" fill="var(--scene-grow,#b8457a)"/>
<rect class="grow-vue-components-reactivity-hit" x="30" y="100" width="100" height="40" rx="10" stroke="var(--scene-accent,#006c73)" stroke-width="2.5"/>
<rect x="190" y="100" width="100" height="40" rx="10" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2.5"/>
<path d="M45 125h70" stroke="var(--scene-muted,#536970)" stroke-width="4" stroke-linecap="round"/><path d="M205 125h70" stroke="var(--scene-line,#cfdfdc)" stroke-width="4" stroke-linecap="round"/>
<path d="M130 100V54" stroke="none"/>
<text class="grow-vue-components-reactivity-t" x="80" y="164" text-anchor="middle" style="fill:var(--scene-ahead,#2f6fb3)">props down</text>
<text class="grow-vue-components-reactivity-t" x="240" y="164" text-anchor="middle" style="fill:var(--scene-grow,#b8457a)">events up</text>
</svg>
