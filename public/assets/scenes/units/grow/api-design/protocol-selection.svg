<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="One need fans out to three interaction styles: one answer, live push, queued job">
<style>
.grow-api-design-protocol-selection-t{font:600 13px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.grow-api-design-protocol-selection-h1{animation:grow-api-design-protocol-selection-h1 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-api-design-protocol-selection-h1{0%,31.3%{opacity:1}34.3%,97%{opacity:0}100%{opacity:1}}
.grow-api-design-protocol-selection-h2{animation:grow-api-design-protocol-selection-h2 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-api-design-protocol-selection-h2{0%,32.3%{opacity:0}35.3%,64.6%{opacity:1}67.6%,100%{opacity:0}}
.grow-api-design-protocol-selection-h3{animation:grow-api-design-protocol-selection-h3 6s ease-in-out infinite;animation-delay:-3s}
