<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A service saves an order and its outbox row in one commit, then the event is sent once">
<style>
.grow-api-design-service-communication-t{font:600 13px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.grow-api-design-service-communication-sv{animation:grow-api-design-service-communication-sv 6s ease-in-out infinite;animation-delay:-4.0s}
@keyframes grow-api-design-service-communication-sv{0%,4%{opacity:0}10%,86%{opacity:1}95%,100%{opacity:0}}
.grow-api-design-service-communication-bolt{animation:grow-api-design-service-communication-bolt 6s ease-in-out infinite;animation-delay:-4.0s}
