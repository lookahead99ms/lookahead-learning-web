<g class="grow-api-design-service-communication-sv"><rect x="108" y="72" width="64" height="20" rx="4" fill="var(--scene-accent,#006c73)"/><rect x="108" y="98" width="64" height="20" rx="4" fill="var(--scene-warn,#a15c00)"/></g>
<path d="M92 66H88V124H92M188 66H192V124H188" fill="none" stroke="none"/>
