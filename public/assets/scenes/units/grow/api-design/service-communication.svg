<path d="M70 84H100" stroke="var(--scene-muted,#536970)" stroke-width="3" stroke-linecap="round"/><path d="M96 78l6 6-6 6" fill="none" stroke="var(--scene-muted,#536970)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
