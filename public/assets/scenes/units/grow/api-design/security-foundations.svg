.grow-api-design-security-foundations-ok{animation:grow-api-design-security-foundations-ok 6s ease-in-out infinite;animation-delay:-4.4s}
@keyframes grow-api-design-security-foundations-ok{0%,26%{opacity:0}32%,90%{opacity:1}96%,100%{opacity:0}}
.grow-api-design-security-foundations-no{animation:grow-api-design-security-foundations-no 6s ease-in-out infinite;animation-delay:-4.4s}
@keyframes grow-api-design-security-foundations-no{0%,64%{opacity:0}70%,92%{opacity:1}98%,100%{opacity:0}}
</style>
