<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A signed three-part token is verified, runs down its expiry bar, then is refreshed">
<style>
.grow-api-design-jwt-sessions-t{font:600 13px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.grow-api-design-jwt-sessions-bar{animation:grow-api-design-jwt-sessions-bar 6s linear infinite;animation-delay:-3s}
@keyframes grow-api-design-jwt-sessions-bar{0%{transform:scaleX(1)}80%,86%{transform:scaleX(0)}87%,100%{transform:scaleX(1)}}
.grow-api-design-jwt-sessions-ck{animation:grow-api-design-jwt-sessions-ck 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-api-design-jwt-sessions-ck{0%,20%{opacity:0}28%,80%{opacity:1}86%,100%{opacity:0}}
.grow-api-design-jwt-sessions-nw{animation:grow-api-design-jwt-sessions-nw 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-api-design-jwt-sessions-nw{0%,80%{transform:translateY(0);opacity:0}86%{opacity:1}93%,100%{transform:translateY(0);opacity:0}}
.grow-api-design-jwt-sessions-rf{animation:grow-api-design-jwt-sessions-rf 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-api-design-jwt-sessions-rf{0%,78%{opacity:.7}84%,96%{opacity:1}100%{opacity:.7}}
.grow-api-design-jwt-sessions-bar{transform-box:fill-box;transform-origin:left center}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g stroke="var(--scene-ink,#102a33)" stroke-width="3" stroke-linejoin="round"><rect x="40" y="30" width="62" height="32" rx="6" fill="var(--scene-accent,#006c73)"/><rect x="102" y="30" width="108" height="32" fill="var(--scene-ahead,#2f6fb3)"/><rect x="210" y="30" width="70" height="32" rx="6" fill="var(--scene-warn,#a15c00)"/></g>
<g stroke="var(--scene-card,#fff)" stroke-width="3" stroke-linecap="round" opacity=".9"><path d="M52 46H90M114 40H196M114 52H170M222 46H268"/></g>
<g class="grow-api-design-jwt-sessions-ck"><circle cx="300" cy="46" r="11" fill="var(--scene-good,#1f7a4d)"/><path d="M294 46l4 4 8-9" fill="none" stroke="var(--scene-card,#fff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="grow-api-design-jwt-sessions-t" x="160" y="90" text-anchor="middle">signed, not secret</text>
<rect x="40" y="108" width="240" height="14" rx="7" fill="var(--scene-line,#cfdfdc)"/>
<rect class="grow-api-design-jwt-sessions-bar" x="40" y="108" width="240" height="14" rx="7" fill="var(--scene-warn,#a15c00)"/>
<text class="grow-api-design-jwt-sessions-t" x="40" y="152">expires</text>
<g class="grow-api-design-jwt-sessions-rf"><g transform="translate(-14 0)"><path d="M236 138a9 9 0 1 1 3 8" fill="none" stroke="var(--scene-accent,#006c73)" stroke-width="3" stroke-linecap="round"/><path d="M236 133v6h6" fill="none" stroke="var(--scene-accent,#006c73)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text class="grow-api-design-jwt-sessions-t" x="250" y="152" style="fill:var(--scene-accent,#006c73)">refresh</text></g>
</svg>
