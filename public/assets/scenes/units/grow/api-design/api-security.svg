<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Requests pass three gates: identity, permission and rate limit; bad or excess calls are stopped">
<style>
.grow-api-design-api-security-t{font:600 13px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.grow-api-design-api-security-g{animation:grow-api-design-api-security-g 6s linear infinite;animation-delay:-2.7s}
@keyframes grow-api-design-api-security-g{0%,4%{transform:translateX(0);opacity:0}8%{opacity:1}50%{transform:translateX(280px);opacity:1}56%,100%{transform:translateX(280px);opacity:0}}
.grow-api-design-api-security-r{animation:grow-api-design-api-security-r 6s linear infinite;animation-delay:-2.7s}
