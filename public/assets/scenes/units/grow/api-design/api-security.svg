.grow-api-design-api-security-rx{animation:grow-api-design-api-security-rx 6s ease-in-out infinite;animation-delay:-2.7s}
@keyframes grow-api-design-api-security-rx{0%,36%{opacity:0}40%,56%{opacity:1}62%,100%{opacity:0}}
.grow-api-design-api-security-o{animation:grow-api-design-api-security-o 6s linear infinite;animation-delay:-2.7s}
@keyframes grow-api-design-api-security-o{0%,58%{transform:translateX(0);opacity:0}62%{opacity:1}78%,92%{transform:translateX(120px);opacity:1}98%,100%{transform:translateX(120px);opacity:0}}
</style>
