<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Clients migrate from version 1 to version 2 while the old version is sunset">
<style>
.grow-api-design-api-lifecycle-t{font:600 13px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.grow-api-design-api-lifecycle-v1{animation:grow-api-design-api-lifecycle-v1 6s linear infinite;animation-delay:-3s}
@keyframes grow-api-design-api-lifecycle-v1{0%,10%{transform:scaleX(1)}80%,100%{transform:scaleX(.42)}}
.grow-api-design-api-lifecycle-v1{transform-box:fill-box;transform-origin:left center}
.grow-api-design-api-lifecycle-m1{animation:grow-api-design-api-lifecycle-m1 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-api-design-api-lifecycle-m1{0%,8%{transform:translateY(0)}26%,100%{transform:translateY(70px)}}
.grow-api-design-api-lifecycle-m2{animation:grow-api-design-api-lifecycle-m2 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-api-design-api-lifecycle-m2{0%,28%{transform:translateY(0)}46%,100%{transform:translateY(70px)}}
.grow-api-design-api-lifecycle-m3{animation:grow-api-design-api-lifecycle-m3 6s ease-in-out infinite;animation-delay:-3s}
@keyframes grow-api-design-api-lifecycle-m3{0%,48%{transform:translateY(0)}66%,100%{transform:translateY(70px)}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<text class="grow-api-design-api-lifecycle-t" x="12" y="58">v1</text><text class="grow-api-design-api-lifecycle-t" x="12" y="128">v2</text>
<rect class="grow-api-design-api-lifecycle-v1" x="42" y="42" width="258" height="26" rx="7" fill="var(--scene-warn,#a15c00)" opacity=".85"/>
<rect x="42" y="112" width="258" height="26" rx="7" fill="var(--scene-good,#1f7a4d)"/>
<g stroke="var(--scene-muted,#536970)" stroke-width="2.5" stroke-dasharray="3 4"><path d="M86 68V112M126 68V112M166 68V112"/></g>
<g stroke="var(--scene-card,#fff)" stroke-width="3"><circle class="grow-api-design-api-lifecycle-m1" cx="86" cy="55" r="9" fill="var(--scene-accent,#006c73)"/><circle class="grow-api-design-api-lifecycle-m2" cx="126" cy="55" r="9" fill="var(--scene-grow,#b8457a)"/><circle class="grow-api-design-api-lifecycle-m3" cx="166" cy="55" r="9" fill="var(--scene-link,#245a88)"/></g>
<g fill="none" stroke="var(--scene-warn,#a15c00)" stroke-width="3" stroke-linecap="round"><rect x="268" y="82" width="28" height="22" rx="4" fill="var(--scene-card,#fff)"/><path d="M268 90H296M276 78v8M288 78v8"/></g>
<text class="grow-api-design-api-lifecycle-t" x="160" y="168" text-anchor="middle" style="fill:var(--scene-warn,#a15c00)">sunset</text>
</svg>
