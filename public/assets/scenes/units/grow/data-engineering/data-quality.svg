<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A player buys a game on a phone; the day's purchases file passes a check station, one row with a bad price drops into a quarantine tray, and the checked rows reach the publisher revenue report, which gets a check mark">
<style>
.dq-a,.dq-b,.dq-c,.dq-d,.dq-e,.dq-f{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6.6s;animation-timing-function:ease-in-out}
.dq-a{animation-name:dq-a}
@keyframes dq-a{0%,4%{transform:translateX(0);opacity:1}26%{transform:translateX(76px);opacity:1}30%,100%{transform:translateX(76px);opacity:0}}
.dq-b{animation-name:dq-b}
@keyframes dq-b{0%,30%{transform:translate(0,0);opacity:0}34%{opacity:1}48%,94%{transform:translate(2px,34px);opacity:1}100%{transform:translate(2px,34px);opacity:0}}
.dq-c{animation-name:dq-c}
@keyframes dq-c{0%,44%{transform:translateX(0);opacity:0}48%{opacity:1}64%{transform:translateX(62px);opacity:1}68%,100%{transform:translateX(62px);opacity:0}}
.dq-d{animation-name:dq-d;transform-origin:268px 132px;transform-box:view-box}
@keyframes dq-d{0%,64%{transform:scaleY(.35)}74%,96%{transform:scaleY(1)}100%{transform:scaleY(.35)}}
.dq-e{animation-name:dq-e}
@keyframes dq-e{0%,72%{opacity:0}78%,96%{opacity:1}100%{opacity:0}}
.dq-f{animation-name:dq-f}
@keyframes dq-f{0%,40%{opacity:0}46%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.dq-a,.dq-b,.dq-c,.dq-d,.dq-e,.dq-f{animation-play-state:paused}}
</style>
