<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A rider's phone asks the trip planner for a route; while the server answers, its flight recorder sends sample dots into the rush.jfr file, three profile bars grow beside it, and a warning badge marks the longest bar, the method that uses the most CPU">
<style>
.jfr-a{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6.4s;animation-timing-function:ease-in-out}
.jfr-t{font:600 11px system-ui,sans-serif;fill:var(--scene-muted,#536970);text-anchor:middle}
.jfr-req{animation-name:jfr-req}
.jfr-reply{animation-name:jfr-reply}
.jfr-s1{animation-name:jfr-s;animation-timing-function:linear}
.jfr-s2{animation-name:jfr-s;animation-timing-function:linear;animation-delay:-5.6s}
.jfr-s3{animation-name:jfr-s;animation-timing-function:linear;animation-delay:-4.8s}
.jfr-rec{animation-name:jfr-rec}
.jfr-b1{animation-name:jfr-b1;transform-box:fill-box;transform-origin:left center}
.jfr-b2{animation-name:jfr-b2;transform-box:fill-box;transform-origin:left center}
.jfr-b3{animation-name:jfr-b3;transform-box:fill-box;transform-origin:left center}
.jfr-warn{animation-name:jfr-warn;transform-box:fill-box;transform-origin:center}
@keyframes jfr-req{0%{transform:translate(0,0);opacity:0}4%{opacity:1}18%{transform:translate(58px,0);opacity:1}22%,100%{transform:translate(58px,0);opacity:0}}
@keyframes jfr-reply{0%,58%{transform:translate(0,0);opacity:0}62%{opacity:1}76%{transform:translate(-58px,0);opacity:1}80%,100%{transform:translate(-58px,0);opacity:0}}
@keyframes jfr-s{0%{transform:translate(0,0);opacity:0}10%{opacity:1}36%{transform:translate(52px,-22px);opacity:1}40%,100%{transform:translate(52px,-22px);opacity:0}}
@keyframes jfr-rec{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes jfr-b1{0%,10%{transform:scaleX(.1)}70%,100%{transform:scaleX(1)}}
@keyframes jfr-b2{0%,10%{transform:scaleX(.2)}70%,100%{transform:scaleX(1)}}
@keyframes jfr-b3{0%,10%{transform:scaleX(.3)}70%,100%{transform:scaleX(1)}}
@keyframes jfr-warn{0%,70%{opacity:0;transform:scale(.6)}76%,96%{opacity:1;transform:scale(1)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.jfr-a{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-ink,#102a33)" opacity=".08"><ellipse cx="32" cy="160" rx="28" ry="5"/><ellipse cx="128" cy="160" rx="44" ry="7"/><ellipse cx="256" cy="160" rx="54" ry="6"/></g>
<circle cx="26" cy="92" r="11" fill="var(--scene-accent,#006c73)"/>
<path d="M6 158q0-44 20-44t20 44z" fill="var(--scene-accent,#006c73)"/>
<rect x="38" y="104" width="18" height="32" rx="4" fill="var(--scene-ink,#102a33)"/>
<rect x="41" y="108" width="12" height="22" rx="1.5" fill="var(--scene-card,#fff)"/>
<g stroke="var(--scene-link,#1f5f8b)" stroke-width="2" stroke-linecap="round"><path d="M44 113v12"/><circle cx="44" cy="113" r="1.6" fill="var(--scene-card,#fff)"/><circle cx="50" cy="125" r="1.6" fill="var(--scene-card,#fff)"/><path d="M44 125h6"/></g>
<path d="M60 116H94" fill="none" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="4 4"/>
<g class="jfr-a jfr-req"><rect x="40" y="108" width="20" height="15" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-link,#1f5f8b)" stroke-width="2"/><rect x="40" y="108" width="20" height="4" rx="2" fill="var(--scene-link,#1f5f8b)"/></g>
<g class="jfr-a jfr-reply"><rect x="94" y="108" width="20" height="15" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-good,#1f7a4d)" stroke-width="2"/><rect x="94" y="108" width="20" height="4" rx="2" fill="var(--scene-good,#1f7a4d)"/></g>
<path d="M98 50l12-9h52l-12 9z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M150 50l12-9v100l-12 9z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<rect x="98" y="50" width="52" height="100" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<g fill="var(--scene-good,#1f7a4d)"><circle cx="106" cy="60" r="2.5"/><circle cx="114" cy="60" r="2.5"/></g>
<g stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"><path d="M122 60h20M106 72h36M106 82h36M106 92h28"/></g>
<rect x="104" y="112" width="40" height="28" rx="4" fill="var(--scene-ink,#102a33)"/>
<circle class="jfr-a jfr-rec" cx="114" cy="126" r="5" fill="var(--scene-bad,#b4442c)"/>
<g stroke="var(--scene-card,#fff)" stroke-width="2" stroke-linecap="round"><path d="M124 121h14M124 127h10M124 133h12"/></g>
<path d="M146 120L196 98" fill="none" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="4 4"/>
<circle class="jfr-a jfr-s1" cx="146" cy="120" r="4" fill="var(--scene-accent,#006c73)"/>
<circle class="jfr-a jfr-s2" cx="146" cy="120" r="4" fill="var(--scene-accent,#006c73)"/>
<circle class="jfr-a jfr-s3" cx="146" cy="120" r="4" fill="var(--scene-accent,#006c73)"/>
<path d="M190 70h26l8 8v34h-34z" fill="var(--scene-card,#fff)" stroke="var(--scene-link,#1f5f8b)" stroke-width="2"/>
<path d="M216 70v8h8" fill="none" stroke="var(--scene-link,#1f5f8b)" stroke-width="2"/>
<g stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"><path d="M196 86h20M196 94h22M196 102h16"/></g>
<text class="jfr-t" x="207" y="128">rush.jfr</text>
<path d="M236 46l8-6h66l-8 6z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M302 46l8-6v104l-8 6z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<rect x="236" y="46" width="66" height="104" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<g fill="var(--scene-accent-soft,#dcefed)"><rect x="244" y="62" width="50" height="14" rx="3"/><rect x="244" y="88" width="50" height="14" rx="3"/><rect x="244" y="114" width="50" height="14" rx="3"/></g>
<rect class="jfr-a jfr-b1" x="244" y="62" width="48" height="14" rx="3" fill="var(--scene-warn,#a15c00)"/>
<rect class="jfr-a jfr-b2" x="244" y="88" width="14" height="14" rx="3" fill="var(--scene-link,#1f5f8b)"/>
<rect class="jfr-a jfr-b3" x="244" y="114" width="7" height="14" rx="3" fill="var(--scene-link,#1f5f8b)"/>
<g class="jfr-a jfr-warn"><circle cx="292" cy="40" r="10" fill="var(--scene-warn,#a15c00)"/><path d="M292 34v7" stroke="var(--scene-card,#fff)" stroke-width="2.5" stroke-linecap="round"/><circle cx="292" cy="45.5" r="1.6" fill="var(--scene-card,#fff)"/></g>
</svg>
