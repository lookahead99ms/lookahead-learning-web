<text x="50" y="140" text-anchor="middle" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="var(--scene-ink,#102a33)">with</text>
<text x="160" y="140" text-anchor="middle" font-size="16" font-weight="700" font-family="system-ui, sans-serif" fill="var(--scene-bad,#b3261e)">error</text>
<text x="270" y="140" text-anchor="middle" font-size="16" font-weight="700" font-family="system-ui, sans-serif" fill="var(--scene-good,#1f7a4d)">cleanup</text>
