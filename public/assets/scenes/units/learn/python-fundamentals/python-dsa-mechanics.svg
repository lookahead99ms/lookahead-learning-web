<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A new smaller item bubbles up a heap to the top">
<style>

.learn-python-fundamentals-python-dsa-mechanics-tree{animation:learn-python-fundamentals-python-dsa-mechanics-fade 6s ease-in-out infinite;animation-delay:-3s}
@keyframes learn-python-fundamentals-python-dsa-mechanics-fade{0%{opacity:0}6%,92%{opacity:1}100%{opacity:0}}
.learn-python-fundamentals-python-dsa-mechanics-new{animation:learn-python-fundamentals-python-dsa-mechanics-new 6s ease-in-out infinite;animation-delay:-3s}
@keyframes learn-python-fundamentals-python-dsa-mechanics-new{0%,18%{transform:translate(0,0)}38%,46%{transform:translate(-30px,-50px)}66%,100%{transform:translate(-90px,-100px)}}
.learn-python-fundamentals-python-dsa-mechanics-m4{animation:learn-python-fundamentals-python-dsa-mechanics-m4 6s ease-in-out infinite;animation-delay:-3s}
@keyframes learn-python-fundamentals-python-dsa-mechanics-m4{0%,18%{transform:translate(0,0)}38%,100%{transform:translate(30px,50px)}}
.learn-python-fundamentals-python-dsa-mechanics-m2{animation:learn-python-fundamentals-python-dsa-mechanics-m2 6s ease-in-out infinite;animation-delay:-3s}
@keyframes learn-python-fundamentals-python-dsa-mechanics-m2{0%,46%{transform:translate(0,0)}66%,100%{transform:translate(60px,50px)}}
.learn-python-fundamentals-python-dsa-mechanics-top{animation:learn-python-fundamentals-python-dsa-mechanics-top 6s ease-in-out infinite;animation-delay:-3s}
@keyframes learn-python-fundamentals-python-dsa-mechanics-top{0%,60%{opacity:.8}70%,92%{opacity:1}100%{opacity:.8}}

</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>

<g class="learn-python-fundamentals-python-dsa-mechanics-tree">
<g stroke="var(--scene-muted,#536970)" stroke-width="3">
<line x1="160" y1="40" x2="100" y2="90"/><line x1="160" y1="40" x2="220" y2="90"/>
<line x1="100" y1="90" x2="70" y2="140"/><line x1="100" y1="90" x2="130" y2="140"/>
<line x1="220" y1="90" x2="190" y2="140"/><line x1="220" y1="90" x2="250" y2="140"/>
</g>
<g class="learn-python-fundamentals-python-dsa-mechanics-m2"><circle cx="160" cy="40" r="17" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/><text x="160" y="46" text-anchor="middle" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="var(--scene-ink,#102a33)">4</text></g>
<circle cx="100" cy="90" r="17" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/><text x="100" y="96" text-anchor="middle" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="var(--scene-ink,#102a33)">5</text>
<g class="learn-python-fundamentals-python-dsa-mechanics-m4"><circle cx="220" cy="90" r="17" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/><text x="220" y="96" text-anchor="middle" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="var(--scene-ink,#102a33)">6</text></g>
<circle cx="70" cy="140" r="17" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/><text x="70" y="146" text-anchor="middle" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="var(--scene-ink,#102a33)">9</text>
<circle cx="130" cy="140" r="17" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/><text x="130" y="146" text-anchor="middle" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="var(--scene-ink,#102a33)">7</text>
<circle cx="190" cy="140" r="17" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/><text x="190" y="146" text-anchor="middle" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="var(--scene-ink,#102a33)">8</text>
<g class="learn-python-fundamentals-python-dsa-mechanics-new"><circle cx="250" cy="140" r="17" fill="var(--scene-grow,#b8457a)"/><text x="250" y="146" text-anchor="middle" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#fff">1</text></g>
</g>
<text class="learn-python-fundamentals-python-dsa-mechanics-top" x="14" y="44" font-size="16" font-weight="700" font-family="system-ui, sans-serif" fill="var(--scene-accent,#006c73)">min on top</text>
<text x="268" y="174" text-anchor="middle" font-size="16" font-weight="700" font-family="system-ui, sans-serif" fill="var(--scene-grow,#b8457a)">new item</text>
</svg>
