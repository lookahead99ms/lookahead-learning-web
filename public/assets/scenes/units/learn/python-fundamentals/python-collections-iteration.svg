<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Reviews ride a belt into a set; a repeated one is bounced out">
<style>

.learn-python-fundamentals-python-collections-iteration-belt{stroke-dasharray:8 6;animation:learn-python-fundamentals-python-collections-iteration-dash 1s linear infinite}
@keyframes learn-python-fundamentals-python-collections-iteration-dash{to{stroke-dashoffset:-14}}
.learn-python-fundamentals-python-collections-iteration-d{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:linear}
.learn-python-fundamentals-python-collections-iteration-a{animation-name:learn-python-fundamentals-python-collections-iteration-go;animation-delay:-5s}
.learn-python-fundamentals-python-collections-iteration-b{animation-name:learn-python-fundamentals-python-collections-iteration-go;animation-delay:-3.6s}
.learn-python-fundamentals-python-collections-iteration-c{animation-name:learn-python-fundamentals-python-collections-iteration-go;animation-delay:-2.2s}
.learn-python-fundamentals-python-collections-iteration-x{animation-name:learn-python-fundamentals-python-collections-iteration-bounce;animation-delay:-0.2s}
@keyframes learn-python-fundamentals-python-collections-iteration-go{0%{transform:translateX(0);opacity:0}6%{opacity:1}50%{transform:translateX(150px);opacity:1}58%,100%{transform:translateX(165px);opacity:0}}
@keyframes learn-python-fundamentals-python-collections-iteration-bounce{0%{transform:translate(0,0);opacity:0}6%{opacity:1}50%{transform:translate(110px,0);opacity:1}75%{transform:translate(140px,-48px);opacity:1}88%,100%{transform:translate(160px,-70px);opacity:0}}

</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>

<text x="16" y="34" font-size="16" font-weight="700" font-family="system-ui, sans-serif" fill="var(--scene-ink,#102a33)">reviews</text>
<line x1="12" y1="112" x2="196" y2="112" stroke="var(--scene-line,#cfdfdc)" stroke-width="12" stroke-linecap="round"/>
<line class="learn-python-fundamentals-python-collections-iteration-belt" x1="12" y1="112" x2="196" y2="112" stroke="var(--scene-muted,#536970)" stroke-width="2"/>
<g class="learn-python-fundamentals-python-collections-iteration-d learn-python-fundamentals-python-collections-iteration-a"><circle cx="24" cy="100" r="11" fill="var(--scene-learn,#0f8a8a)"/></g>
<g class="learn-python-fundamentals-python-collections-iteration-d learn-python-fundamentals-python-collections-iteration-b"><circle cx="24" cy="100" r="11" fill="var(--scene-grow,#b8457a)"/></g>
<g class="learn-python-fundamentals-python-collections-iteration-d learn-python-fundamentals-python-collections-iteration-c"><circle cx="24" cy="100" r="11" fill="var(--scene-ahead,#2f6fb3)"/></g>
<g class="learn-python-fundamentals-python-collections-iteration-d learn-python-fundamentals-python-collections-iteration-x"><circle cx="24" cy="100" r="11" fill="var(--scene-learn,#0f8a8a)"/><line x1="17" y1="93" x2="31" y2="107" stroke="var(--scene-bad,#b3261e)" stroke-width="3"/><line x1="31" y1="93" x2="17" y2="107" stroke="var(--scene-bad,#b3261e)" stroke-width="3"/></g>
<rect x="206" y="72" width="102" height="68" rx="12" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<circle cx="230" cy="106" r="11" fill="var(--scene-learn,#0f8a8a)"/>
<circle cx="257" cy="106" r="11" fill="var(--scene-grow,#b8457a)"/>
<circle cx="284" cy="106" r="11" fill="var(--scene-ahead,#2f6fb3)"/>
<text x="257" y="162" text-anchor="middle" font-size="16" font-weight="700" font-family="system-ui, sans-serif" fill="var(--scene-accent,#006c73)">set: unique</text>
</svg>
