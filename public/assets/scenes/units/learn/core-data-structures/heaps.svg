<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A new urgent item bubbles up past larger parents to reach the top of the heap"><style>.learn-core-data-structures-heaps-g{animation:learn-core-data-structures-heaps-go 7s infinite ease-in-out;animation-delay:-3s}
.learn-core-data-structures-heaps-N{animation:learn-core-data-structures-heaps-nn 7s infinite ease-in-out;animation-delay:-3s}
.learn-core-data-structures-heaps-A{animation:learn-core-data-structures-heaps-aa 7s infinite ease-in-out;animation-delay:-3s}
.learn-core-data-structures-heaps-B{animation:learn-core-data-structures-heaps-bb 7s infinite ease-in-out;animation-delay:-3s}
@keyframes learn-core-data-structures-heaps-go{0%{opacity:0}4%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes learn-core-data-structures-heaps-nn{0%,15%{transform:translate(0,0)}35%,40%{transform:translate(40px,-50px)}60%,100%{transform:translate(100px,-100px)}}
@keyframes learn-core-data-structures-heaps-aa{0%,15%{transform:translate(0,0)}35%,100%{transform:translate(-40px,50px)}}
