" fill="var(--scene-good,#1f7a4d)"/><text x="60" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-card,#fff)" class="">1</text></g><g class="learn-core-data-structures-heaps-A"><circle cx="100" cy="84" r="15" fill="var(--scene-link,#245a88)"/><text x="100" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-card,#fff)" class="">5</text></g><g class="learn-core-data-structures-heaps-B"><circle cx="160" cy="34" r="15" fill="var(--scene-grow,#b8457a)"/><text x="160" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-card,#fff)" class="">3</text></g></g><text x="190" y="38" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-ink,#102a33)" class="">most urgent</text><text x="160" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-good,#1f7a4d)" class="">swap up</text></svg>
