<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A key goes through a hash function straight to its slot"><style>.learn-core-data-structures-hash-tables-dot{animation:learn-core-data-structures-hash-tables-dt 6s infinite ease-in-out;animation-delay:-3s}
