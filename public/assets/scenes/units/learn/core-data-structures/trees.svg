<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A search descends one side of a binary search tree at each step"><style>.learn-core-data-structures-trees-n{animation:learn-core-data-structures-trees-nl 6s infinite;fill:var(--scene-card,#fff);stroke:var(--scene-accent,#006c73);stroke-width:2.5}
.learn-core-data-structures-trees-t{animation:learn-core-data-structures-trees-tl 6s infinite;fill:var(--scene-ink,#102a33)}
.learn-core-data-structures-trees-e{animation:learn-core-data-structures-trees-el 6s infinite;stroke:var(--scene-line,#cfdfdc);stroke-width:3}
.learn-core-data-structures-trees-d0{animation-delay:-3s}.learn-core-data-structures-trees-d1{animation-delay:-2.1s}.learn-core-data-structures-trees-d2{animation-delay:-1.2s}
@keyframes learn-core-data-structures-trees-nl{0%,8%{fill:var(--scene-card,#fff)}16%,84%{fill:var(--scene-accent,#006c73)}95%,100%{fill:var(--scene-card,#fff)}}
@keyframes learn-core-data-structures-trees-tl{0%,8%{fill:var(--scene-ink,#102a33)}16%,84%{fill:var(--scene-card,#fff)}95%,100%{fill:var(--scene-ink,#102a33)}}
@keyframes learn-core-data-structures-trees-el{0%,8%{stroke:var(--scene-line,#cfdfdc)}16%,84%{stroke:var(--scene-accent,#006c73)}95%,100%{stroke:var(--scene-line,#cfdfdc)}}</style><rect width="320" height="180" fill="var(--scene-card,#fff)"/><line class="" x1="160" y1="34" x2="100" y2="80" stroke="var(--scene-line,#cfdfdc)" stroke-width="3"/><line class="learn-core-data-structures-trees-e learn-core-data-structures-trees-d0" x1="160" y1="34" x2="220" y2="80"/><line class="" x1="100" y1="80" x2="70" y2="126" stroke="var(--scene-line,#cfdfdc)" stroke-width="3"/><line class="" x1="100" y1="80" x2="130" y2="126" stroke="var(--scene-line,#cfdfdc)" stroke-width="3"/><line class="learn-core-data-structures-trees-e learn-core-data-structures-trees-d1" x1="220" y1="80" x2="190" y2="126"/><line class="" x1="220" y1="80" x2="250" y2="126" stroke="var(--scene-line,#cfdfdc)" stroke-width="3"/><circle class="learn-core-data-structures-trees-n learn-core-data-structures-trees-d0" cx="160" cy="34" r="15"/><text x="160" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-text,#28434a)" class="learn-core-data-structures-trees-t learn-core-data-structures-trees-d0">8</text><circle cx="100" cy="80" r="15" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2.5"/><text x="100" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-muted,#536970)" class="">4</text><circle class="learn-core-data-structures-trees-n learn-core-data-structures-trees-d1" cx="220" cy="80" r="15"/><text x="220" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-text,#28434a)" class="learn-core-data-structures-trees-t learn-core-data-structures-trees-d1">12</text><circle cx="70" cy="126" r="15" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2.5"/><text x="70" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-muted,#536970)" class="">2</text><circle cx="130" cy="126" r="15" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2.5"/><text x="130" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-muted,#536970)" class="">6</text><circle class="learn-core-data-structures-trees-n learn-core-data-structures-trees-d2" cx="190" cy="126" r="15"/><text x="190" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-text,#28434a)" class="learn-core-data-structures-trees-t learn-core-data-structures-trees-d2">10</text><circle cx="250" cy="126" r="15" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2.5"/><text x="250" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-muted,#536970)" class="">14</text><text x="16" y="28" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-ink,#102a33)" class="">find 10</text><text x="160" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="var(--scene-accent,#006c73)" class="">one side per step</text></svg>
