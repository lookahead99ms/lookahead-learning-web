<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Plates are pushed on top and popped off the top"><style>.learn-core-data-structures-stacks-pl{animation:learn-core-data-structures-stacks-pp 6s infinite ease-in-out;animation-delay:-3s}
.learn-core-data-structures-stacks-u{animation:learn-core-data-structures-stacks-ua 6s infinite ease-in-out;animation-delay:-3s}
.learn-core-data-structures-stacks-d{animation:learn-core-data-structures-stacks-da 6s infinite ease-in-out;animation-delay:-3s}
@keyframes learn-core-data-structures-stacks-pp{0%,6%{transform:translateY(-52px);opacity:0}12%{opacity:1}30%,52%{transform:translateY(0);opacity:1}72%{transform:translateY(-52px);opacity:1}80%,100%{transform:translateY(-52px);opacity:0}}
@keyframes learn-core-data-structures-stacks-da{0%,6%,40%,100%{opacity:.55}12%,30%{opacity:1}}
