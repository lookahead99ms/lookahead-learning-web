<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A failing line is isolated, fixed, and the test turns green">
<style>
.learn-developer-workflow-debug-build-test-t{font-family:system-ui,sans-serif;font-size:17px;font-weight:700;fill:var(--scene-ink,#102a33)}
.learn-developer-workflow-debug-build-test-bug{animation:learn-developer-workflow-debug-build-test-bugk 6s infinite;animation-delay:-3s}
.learn-developer-workflow-debug-build-test-fix{animation:learn-developer-workflow-debug-build-test-fixk 6s infinite;animation-delay:-3s}
.learn-developer-workflow-debug-build-test-red{animation:learn-developer-workflow-debug-build-test-redk 6s infinite;animation-delay:-3s}
.learn-developer-workflow-debug-build-test-grn{animation:learn-developer-workflow-debug-build-test-grnk 6s infinite;animation-delay:-3s}
.learn-developer-workflow-debug-build-test-lens{animation:learn-developer-workflow-debug-build-test-lensk 6s ease-in-out infinite;animation-delay:-3s}
@keyframes learn-developer-workflow-debug-build-test-bugk{0%,70%{opacity:1}80%,100%{opacity:0}}
@keyframes learn-developer-workflow-debug-build-test-fixk{0%,70%{opacity:0}80%,100%{opacity:1}}
@keyframes learn-developer-workflow-debug-build-test-redk{0%,70%{opacity:1}80%,100%{opacity:0}}
@keyframes learn-developer-workflow-debug-build-test-grnk{0%,70%{opacity:0}80%,100%{opacity:1}}
@keyframes learn-developer-workflow-debug-build-test-lensk{0%{transform:translate(0,-34px)}25%{transform:translate(0,0)}50%{transform:translate(0,0)}75%{transform:translate(0,-34px)}100%{transform:translate(0,-34px)}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="14" y="20" width="170" height="140" rx="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<g fill="var(--scene-muted,#536970)">
<rect x="28" y="36" width="90" height="8" rx="4"/><rect x="40" y="56" width="110" height="8" rx="4"/>
<rect x="28" y="96" width="70" height="8" rx="4"/><rect x="40" y="116" width="100" height="8" rx="4"/><rect x="28" y="136" width="60" height="8" rx="4"/></g>
<rect x="22" y="72" width="154" height="18" rx="6" class="learn-developer-workflow-debug-build-test-bug" fill="var(--scene-bad,#b3261e)" opacity=".18"/>
<rect x="22" y="72" width="154" height="18" rx="6" class="learn-developer-workflow-debug-build-test-fix" fill="var(--scene-good,#1f7a4d)" opacity="0"/>
<rect x="40" y="77" width="100" height="8" rx="4" class="learn-developer-workflow-debug-build-test-bug" fill="var(--scene-bad,#b3261e)"/>
<rect x="40" y="77" width="100" height="8" rx="4" class="learn-developer-workflow-debug-build-test-fix" fill="var(--scene-good,#1f7a4d)" opacity="0"/>
<circle cx="30" cy="81" r="5" class="learn-developer-workflow-debug-build-test-bug" fill="var(--scene-bad,#b3261e)"/>
<g class="learn-developer-workflow-debug-build-test-lens"><g transform="translate(138,92)">
<circle cx="0" cy="0" r="17" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="4"/>
<path d="M12 12L26 26" stroke="var(--scene-ink,#102a33)" stroke-width="5" stroke-linecap="round"/></g></g>
<rect x="206" y="40" width="100" height="100" rx="10" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<circle cx="256" cy="80" r="26" class="learn-developer-workflow-debug-build-test-red" fill="var(--scene-bad,#b3261e)"/>
<circle cx="256" cy="80" r="26" class="learn-developer-workflow-debug-build-test-grn" fill="var(--scene-good,#1f7a4d)" opacity="0"/>
<path class="learn-developer-workflow-debug-build-test-red" d="M246 70L266 90M266 70L246 90" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<path class="learn-developer-workflow-debug-build-test-grn" d="M243 80L252 89L270 70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
<text x="256" y="128" text-anchor="middle" class="learn-developer-workflow-debug-build-test-t">Test</text>
</svg>
