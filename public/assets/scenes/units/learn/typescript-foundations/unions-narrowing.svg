<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Parcels are routed by status into one of three states">
<style>
.learn-typescript-foundations-unions-narrowing-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.learn-typescript-foundations-unions-narrowing-p{animation:learn-typescript-foundations-unions-narrowing-p 6s linear infinite}
@keyframes learn-typescript-foundations-unions-narrowing-p{0%{transform:translate(0,-6px);opacity:0}6%{opacity:1}25%{transform:translate(0,40px)}60%{transform:translate(var(--dx),68px);opacity:1}70%,100%{transform:translate(var(--dx),68px);opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<path d="M160 52V76M160 76H64V98M160 76V98M160 76H256V98" fill="none" stroke="var(--scene-line,#cfdfdc)" stroke-width="4" stroke-linejoin="round"/>
<rect x="18" y="98" width="92" height="56" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-warn,#a15c00)" stroke-width="3"/>
<rect x="114" y="98" width="92" height="56" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-good,#1f7a4d)" stroke-width="3"/>
<rect x="210" y="98" width="92" height="56" rx="8" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-bad,#b3261e)" stroke-width="3"/>
<circle cx="64" cy="118" r="6" fill="var(--scene-warn,#a15c00)"/>
<path d="M155 118l4 5 8-10" fill="none" stroke="var(--scene-good,#1f7a4d)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M251 113l10 10M261 113l-10 10" stroke="var(--scene-bad,#b3261e)" stroke-width="4" stroke-linecap="round"/>
<text x="64" y="146" text-anchor="middle" class="learn-typescript-foundations-unions-narrowing-t">in transit</text>
<text x="160" y="146" text-anchor="middle" class="learn-typescript-foundations-unions-narrowing-t">delivered</text>
<text x="256" y="146" text-anchor="middle" class="learn-typescript-foundations-unions-narrowing-t">failed</text>
<polygon points="160,44 178,60 160,76 142,60" fill="var(--scene-ink,#102a33)"/>
<g class="learn-typescript-foundations-unions-narrowing-p" style="--dx:-96px;animation-delay:-3s"><rect x="150" y="6" width="20" height="20" rx="4" fill="var(--scene-link,#245a88)"/><path d="M150 16h20M160 6v20" stroke="var(--scene-card,#fff)" stroke-width="2"/></g>
<g class="learn-typescript-foundations-unions-narrowing-p" style="--dx:0px;animation-delay:-1s"><rect x="150" y="6" width="20" height="20" rx="4" fill="var(--scene-link,#245a88)"/><path d="M150 16h20M160 6v20" stroke="var(--scene-card,#fff)" stroke-width="2"/></g>
<g class="learn-typescript-foundations-unions-narrowing-p" style="--dx:96px;animation-delay:-5s"><rect x="150" y="6" width="20" height="20" rx="4" fill="var(--scene-link,#245a88)"/><path d="M150 16h20M160 6v20" stroke="var(--scene-card,#fff)" stroke-width="2"/></g>
</svg>
