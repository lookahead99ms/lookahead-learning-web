<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Unknown data is checked at a gate; valid data comes out typed, null is stopped">
<style>
.learn-typescript-foundations-strict-null-unknown-validation-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.learn-typescript-foundations-strict-null-unknown-validation-u{animation:learn-typescript-foundations-strict-null-unknown-validation-u 6s linear infinite;animation-delay:-2s}
.learn-typescript-foundations-strict-null-unknown-validation-o{animation:learn-typescript-foundations-strict-null-unknown-validation-o 6s linear infinite;animation-delay:-2s}
.learn-typescript-foundations-strict-null-unknown-validation-nl{animation:learn-typescript-foundations-strict-null-unknown-validation-nl 6s linear infinite;animation-delay:-1.4s}
@keyframes learn-typescript-foundations-strict-null-unknown-validation-u{0%{transform:translateX(0);opacity:1}38%{transform:translateX(60px);opacity:1}42%,100%{transform:translateX(60px);opacity:0}}
@keyframes learn-typescript-foundations-strict-null-unknown-validation-o{0%,40%{opacity:0;transform:translateX(-10px)}55%,90%{opacity:1;transform:translateX(0)}100%{opacity:0}}
@keyframes learn-typescript-foundations-strict-null-unknown-validation-nl{0%{transform:translateX(0)}30%{transform:translateX(54px)}60%,100%{transform:translateX(0)}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="0" y="94" width="320" height="8" rx="2" fill="var(--scene-line,#cfdfdc)"/>
<rect x="130" y="18" width="60" height="116" rx="10" fill="var(--scene-ink,#102a33)"/>
<path d="M147 62l9 9 17-19" fill="none" stroke="var(--scene-card,#fff)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="learn-typescript-foundations-strict-null-unknown-validation-u"><rect x="24" y="72" width="40" height="40" rx="7" fill="var(--scene-muted,#536970)"/><text x="44" y="100" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" font-weight="700" fill="var(--scene-card,#fff)">?</text></g>
<g class="learn-typescript-foundations-strict-null-unknown-validation-nl"><rect x="20" y="22" width="48" height="30" rx="7" fill="var(--scene-card,#fff)" stroke="var(--scene-bad,#b3261e)" stroke-width="3" stroke-dasharray="5 4"/><text x="44" y="42" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="700" fill="var(--scene-bad,#b3261e)">null</text></g>
<g class="learn-typescript-foundations-strict-null-unknown-validation-o"><rect x="232" y="72" width="76" height="40" rx="7" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-good,#1f7a4d)" stroke-width="3"/><text x="270" y="97" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="700" fill="var(--scene-good,#1f7a4d)">string</text></g>
<text x="160" y="164" text-anchor="middle" class="learn-typescript-foundations-strict-null-unknown-validation-t">check, then trust</text>
</svg>
