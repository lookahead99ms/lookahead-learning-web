<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A factory builds only valid products and rejects unknown orders">
<style>
.learn-solid-design-patterns-creational-patterns-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.learn-solid-design-patterns-creational-patterns-m{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.learn-solid-design-patterns-creational-patterns-a1{animation:learn-solid-design-patterns-creational-patterns-in 6s linear infinite;animation-delay:-4s}
@keyframes learn-solid-design-patterns-creational-patterns-in{0%{transform:translateX(-30px);opacity:0}10%{opacity:1}30%{transform:translateX(30px);opacity:1}38%{transform:translateX(40px);opacity:0}100%{transform:translateX(40px);opacity:0}}
.learn-solid-design-patterns-creational-patterns-a2{animation:learn-solid-design-patterns-creational-patterns-out 6s linear infinite;animation-delay:-4s}
@keyframes learn-solid-design-patterns-creational-patterns-out{0%,35%{transform:translateX(-40px);opacity:0}45%{opacity:1}85%{transform:translateX(30px);opacity:1}95%,100%{transform:translateX(40px);opacity:0}}
.learn-solid-design-patterns-creational-patterns-a3{animation:learn-solid-design-patterns-creational-patterns-bad 6s ease-out infinite;animation-delay:-4s}
@keyframes learn-solid-design-patterns-creational-patterns-bad{0%,55%{opacity:0;transform:translate(0,0)}65%{opacity:1;transform:translate(0,10px)}90%{opacity:1;transform:translate(0,30px)}100%{opacity:0;transform:translate(0,34px)}}
.learn-solid-design-patterns-creational-patterns-a4{animation:learn-solid-design-patterns-creational-patterns-gear 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes learn-solid-design-patterns-creational-patterns-gear{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){[class*="learn-solid-design-patterns-creational-patterns-a"]{animation:none!important}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<line x1="10" y1="100" x2="310" y2="100" stroke="var(--scene-line,#cfdfdc)" stroke-width="4"/>
<rect x="110" y="40" width="100" height="84" rx="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<rect x="124" y="56" width="72" height="16" rx="4" fill="var(--scene-card,#fff)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/><text class="learn-solid-design-patterns-creational-patterns-m" x="160" y="70" text-anchor="middle" style="font-size:16px">build()</text>
<g class="learn-solid-design-patterns-creational-patterns-a4"><circle cx="160" cy="99" r="9" fill="none" stroke="var(--scene-accent,#006c73)" stroke-width="3" stroke-dasharray="4 3"/></g>
<g class="learn-solid-design-patterns-creational-patterns-a1"><rect x="40" y="78" width="26" height="18" rx="3" fill="var(--scene-grow,#b8457a)"/><path d="M45 84h16M45 90h10" stroke="#fff" stroke-width="2.5"/></g>
<g class="learn-solid-design-patterns-creational-patterns-a2"><rect x="238" y="82" width="32" height="14" rx="3" fill="var(--scene-good,#1f7a4d)"/><circle cx="246" cy="100" r="4" fill="var(--scene-ink,#102a33)"/><circle cx="262" cy="100" r="4" fill="var(--scene-ink,#102a33)"/></g>
<g class="learn-solid-design-patterns-creational-patterns-a3"><rect x="150" y="124" width="26" height="18" rx="3" fill="var(--scene-bad,#b3261e)"/><path d="M158 128l10 10m0-10l-10 10" stroke="#fff" stroke-width="2.5"/></g>
<text class="learn-solid-design-patterns-creational-patterns-t" x="160" y="26" text-anchor="middle">Factory</text>
<text class="learn-solid-design-patterns-creational-patterns-t" x="160" y="168" text-anchor="middle" fill="var(--scene-bad,#b3261e)" style="fill:var(--scene-bad,#b3261e)">Unknown: rejected</text>
<text class="learn-solid-design-patterns-creational-patterns-t" x="276" y="132" text-anchor="middle" style="fill:var(--scene-good,#1f7a4d)">Valid</text>
</svg>
