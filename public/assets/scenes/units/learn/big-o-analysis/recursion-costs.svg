<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A call tree where only one root-to-leaf path is alive at a time"><style>.learn-big-o-analysis-recursion-costs-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.learn-big-o-analysis-recursion-costs-m{font-family:system-ui,sans-serif;font-size:16px;font-weight:600;fill:var(--scene-muted,#536970)}
.learn-big-o-analysis-recursion-costs-n{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-accent,#006c73);stroke-width:2}
.learn-big-o-analysis-recursion-costs-live{fill:var(--scene-grow,#b8457a);stroke:var(--scene-grow,#b8457a);stroke-width:2;animation:learn-big-o-analysis-recursion-costs-wk 6s linear infinite;animation-delay:-1.8s;opacity:0}
.learn-big-o-analysis-recursion-costs-e{stroke:var(--scene-line,#cfdfdc);stroke-width:3;fill:none}
.learn-big-o-analysis-recursion-costs-pe{stroke:var(--scene-grow,#b8457a);stroke-width:4;fill:none;opacity:0;animation:learn-big-o-analysis-recursion-costs-wk 6s linear infinite;animation-delay:-1.8s}
@keyframes learn-big-o-analysis-recursion-costs-wk{0%,3%{opacity:0}6%,45%{opacity:1}50%,100%{opacity:0}}
@keyframes learn-big-o-analysis-recursion-costs-wk2{0%,53%{opacity:0}56%,94%{opacity:1}100%{opacity:0}}
.learn-big-o-analysis-recursion-costs-w2{animation-name:learn-big-o-analysis-recursion-costs-wk2}
.learn-big-o-analysis-recursion-costs-fr{animation:learn-big-o-analysis-recursion-costs-grow 3s ease-in-out infinite;animation-delay:-1s;transform-origin:center;transform-box:fill-box}
@keyframes learn-big-o-analysis-recursion-costs-grow{0%,100%{opacity:.6}50%{opacity:1}}</style><rect width="320" height="180" fill="var(--scene-card,#fff)"/><text class="learn-big-o-analysis-recursion-costs-t" x="16" y="22">every call = time</text><path class="learn-big-o-analysis-recursion-costs-e" d="M160 36L100 80"/><path class="learn-big-o-analysis-recursion-costs-e" d="M160 36L220 80"/><path class="learn-big-o-analysis-recursion-costs-e" d="M100 80L70 126"/><path class="learn-big-o-analysis-recursion-costs-e" d="M100 80L130 126"/><path class="learn-big-o-analysis-recursion-costs-e" d="M220 80L190 126"/><path class="learn-big-o-analysis-recursion-costs-e" d="M220 80L250 126"/><path class="learn-big-o-analysis-recursion-costs-pe" d="M160 36L100 80L70 126"/><path class="learn-big-o-analysis-recursion-costs-pe learn-big-o-analysis-recursion-costs-w2" d="M160 36L220 80L250 126"/><circle class="learn-big-o-analysis-recursion-costs-n" cx="160" cy="36" r="11"/><circle class="learn-big-o-analysis-recursion-costs-n" cx="100" cy="80" r="11"/><circle class="learn-big-o-analysis-recursion-costs-n" cx="220" cy="80" r="11"/><circle class="learn-big-o-analysis-recursion-costs-n" cx="70" cy="126" r="11"/><circle class="learn-big-o-analysis-recursion-costs-n" cx="130" cy="126" r="11"/><circle class="learn-big-o-analysis-recursion-costs-n" cx="190" cy="126" r="11"/><circle class="learn-big-o-analysis-recursion-costs-n" cx="250" cy="126" r="11"/><circle class="learn-big-o-analysis-recursion-costs-live" cx="160" cy="36" r="11"/><circle class="learn-big-o-analysis-recursion-costs-live" cx="100" cy="80" r="11"/><circle class="learn-big-o-analysis-recursion-costs-live" cx="70" cy="126" r="11"/><g class="learn-big-o-analysis-recursion-costs-w2"><circle class="learn-big-o-analysis-recursion-costs-live learn-big-o-analysis-recursion-costs-w2" cx="160" cy="36" r="11"/><circle class="learn-big-o-analysis-recursion-costs-live learn-big-o-analysis-recursion-costs-w2" cx="220" cy="80" r="11"/><circle class="learn-big-o-analysis-recursion-costs-live learn-big-o-analysis-recursion-costs-w2" cx="250" cy="126" r="11"/></g><text class="learn-big-o-analysis-recursion-costs-t" x="16" y="166" style="fill:var(--scene-grow,#b8457a)">live path = stack</text></svg>