<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Scanning 100 names is short work, scanning 100,000 is far longer"><style>.learn-big-o-analysis-big-o-foundations-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
