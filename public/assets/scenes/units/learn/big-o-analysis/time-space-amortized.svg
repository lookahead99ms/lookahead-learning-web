<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="An array fills up, copies into one twice as big, then keeps appending"><style>.learn-big-o-analysis-time-space-amortized-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
