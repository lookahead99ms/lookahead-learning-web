<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="sliding window">
<style>
.learn-algorithmic-patterns-sliding-window-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}.learn-algorithmic-patterns-sliding-window-w{font:700 16px system-ui,sans-serif;fill:#fff}
@keyframes learn-algorithmic-patterns-sliding-window-w{0%{transform:translateX(0px);opacity:0}4%{transform:translateX(0px);opacity:1}20%{transform:translateX(0px)}32%{transform:translateX(62px)}44%{transform:translateX(62px)}56%{transform:translateX(124px)}68%{transform:translateX(124px)}80%{transform:translateX(186px)}92%{transform:translateX(186px);opacity:1}98%{transform:translateX(186px);opacity:0}100%{transform:translateX(0px);opacity:0}}
.learn-algorithmic-patterns-sliding-window-w{animation:learn-algorithmic-patterns-sliding-window-w 7s ease-in-out infinite;animation-delay:-3.5s;}
.learn-algorithmic-patterns-sliding-window-bg{fill:var(--scene-card,#fff)}
</style>
<rect class="learn-algorithmic-patterns-sliding-window-bg" width="320" height="180" rx="12"/>
<rect x="20" y="110" width="24" height="30" rx="4" fill="var(--scene-learn,#0f8a8a)"/>
<rect x="51" y="88" width="24" height="52" rx="4" fill="var(--scene-learn,#0f8a8a)"/>
<rect x="82" y="114" width="24" height="26" rx="4" fill="var(--scene-learn,#0f8a8a)"/>
<rect x="113" y="78" width="24" height="62" rx="4" fill="var(--scene-learn,#0f8a8a)"/>
<rect x="144" y="94" width="24" height="46" rx="4" fill="var(--scene-learn,#0f8a8a)"/>
<rect x="175" y="104" width="24" height="36" rx="4" fill="var(--scene-learn,#0f8a8a)"/>
<rect x="206" y="84" width="24" height="56" rx="4" fill="var(--scene-learn,#0f8a8a)"/>
<rect x="237" y="112" width="24" height="28" rx="4" fill="var(--scene-learn,#0f8a8a)"/>
<rect x="268" y="98" width="24" height="42" rx="4" fill="var(--scene-learn,#0f8a8a)"/>
<line x1="12" y1="142" x2="308" y2="142" stroke="var(--scene-ink,#102a33)" stroke-width="3"/>
<rect class="learn-algorithmic-patterns-sliding-window-w" x="14" y="52" width="98" height="96" rx="9" fill="var(--scene-accent-soft,#dcefed)" fill-opacity=".5" stroke="var(--scene-grow,#b8457a)" stroke-width="4"/>
<text class="learn-algorithmic-patterns-sliding-window-t" x="160" y="28" text-anchor="middle">window slides along</text>
<text class="learn-algorithmic-patterns-sliding-window-t" x="160" y="170" text-anchor="middle">add one, drop one</text>
</svg>
