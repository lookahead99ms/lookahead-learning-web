<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="choosing family">
<style>
.learn-algorithmic-patterns-choosing-family-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}.learn-algorithmic-patterns-choosing-family-w{font:700 16px system-ui,sans-serif;fill:#fff}
@keyframes learn-algorithmic-patterns-choosing-family-i1{0%{opacity:0}36%{opacity:0}42%{opacity:1}72%{opacity:1}76%{opacity:0}100%{opacity:0}}
.learn-algorithmic-patterns-choosing-family-i1{animation:learn-algorithmic-patterns-choosing-family-i1 8s linear infinite;animation-delay:-3.2s;}
@keyframes learn-algorithmic-patterns-choosing-family-i2{0%{opacity:0}82%{opacity:0}87%{opacity:1}98%{opacity:1}100%{opacity:0}}
.learn-algorithmic-patterns-choosing-family-i2{animation:learn-algorithmic-patterns-choosing-family-i2 8s linear infinite;animation-delay:-3.2s;}
@keyframes learn-algorithmic-patterns-choosing-family-k1{0%{transform:translate(16px,80px);opacity:1}15%{transform:translate(110px,80px);opacity:1}30%{transform:translate(164px,80px);opacity:1}38%{transform:translate(192px,46px);opacity:1}46%{transform:translate(222px,46px);opacity:1}50%{transform:translate(222px,46px);opacity:0}100%{transform:translate(222px,46px);opacity:0}}
.learn-algorithmic-patterns-choosing-family-k1{animation:learn-algorithmic-patterns-choosing-family-k1 8s ease-in-out infinite;animation-delay:-3.2s;}
@keyframes learn-algorithmic-patterns-choosing-family-k2{0%{transform:translate(16px,80px);opacity:0}50%{transform:translate(16px,80px);opacity:0}52%{transform:translate(16px,80px);opacity:1}65%{transform:translate(110px,80px);opacity:1}70%{transform:translate(110px,118px);opacity:1}78%{transform:translate(110px,142px);opacity:1}88%{transform:translate(222px,142px);opacity:1}93%{transform:translate(222px,142px);opacity:0}100%{transform:translate(16px,80px);opacity:0}}
.learn-algorithmic-patterns-choosing-family-k2{animation:learn-algorithmic-patterns-choosing-family-k2 8s ease-in-out infinite;animation-delay:-3.2s;}
.learn-algorithmic-patterns-choosing-family-bg{fill:var(--scene-card,#fff)}
</style>
