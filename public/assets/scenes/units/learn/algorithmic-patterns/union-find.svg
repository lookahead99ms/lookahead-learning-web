<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="union find">
<style>
.learn-algorithmic-patterns-union-find-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}.learn-algorithmic-patterns-union-find-w{font:700 16px system-ui,sans-serif;fill:#fff}
@keyframes learn-algorithmic-patterns-union-find-br{0%{stroke-dashoffset:1}26%{stroke-dashoffset:1}40%{stroke-dashoffset:0}92%{stroke-dashoffset:0}97%{stroke-dashoffset:1}100%{stroke-dashoffset:1}}
.learn-algorithmic-patterns-union-find-br{animation:learn-algorithmic-patterns-union-find-br 7s ease-in-out infinite;animation-delay:-3.6s;}.learn-algorithmic-patterns-union-find-br{stroke-dasharray:1}
@keyframes learn-algorithmic-patterns-union-find-rc{0%{opacity:0}42%{opacity:0}50%{opacity:1}92%{opacity:1}97%{opacity:0}100%{opacity:0}}
