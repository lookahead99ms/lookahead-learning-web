<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="heap priority queue">
<style>
.learn-algorithmic-patterns-heap-priority-queue-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}.learn-algorithmic-patterns-heap-priority-queue-w{font:700 16px system-ui,sans-serif;fill:#fff}
@keyframes learn-algorithmic-patterns-heap-priority-queue-f{0%{transform:translate(0,0);opacity:0}10%{transform:translate(0,0);opacity:1}30%{transform:translate(0,0) scale(1.15);opacity:1}70%{transform:translate(100px,-26px);opacity:1}85%{transform:translate(100px,-26px);opacity:0}100%{transform:translate(0,0);opacity:0}}
.learn-algorithmic-patterns-heap-priority-queue-f{animation:learn-algorithmic-patterns-heap-priority-queue-f 6.5s ease-in-out infinite;animation-delay:-3.4s;}.learn-algorithmic-patterns-heap-priority-queue-f{transform-box:fill-box;transform-origin:center}
.learn-algorithmic-patterns-heap-priority-queue-bg{fill:var(--scene-card,#fff)}
</style>
<rect class="learn-algorithmic-patterns-heap-priority-queue-bg" width="320" height="180" rx="12"/>
<line x1="160" y1="60" x2="105" y2="104" stroke="var(--scene-muted,#536970)" stroke-width="3"/>
<line x1="160" y1="60" x2="215" y2="104" stroke="var(--scene-muted,#536970)" stroke-width="3"/>
<line x1="105" y1="104" x2="70" y2="150" stroke="var(--scene-muted,#536970)" stroke-width="3"/>
<line x1="105" y1="104" x2="140" y2="150" stroke="var(--scene-muted,#536970)" stroke-width="3"/>
<line x1="215" y1="104" x2="180" y2="150" stroke="var(--scene-muted,#536970)" stroke-width="3"/>
<line x1="215" y1="104" x2="250" y2="150" stroke="var(--scene-muted,#536970)" stroke-width="3"/>
<circle cx="160" cy="60" r="18" fill="var(--scene-accent,#006c73)"/>
<text class="learn-algorithmic-patterns-heap-priority-queue-w" x="160" y="65" text-anchor="middle">1</text>
<circle cx="105" cy="104" r="15" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<text class="learn-algorithmic-patterns-heap-priority-queue-t" x="105" y="109" text-anchor="middle">3</text>
<circle cx="215" cy="104" r="15" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<text class="learn-algorithmic-patterns-heap-priority-queue-t" x="215" y="109" text-anchor="middle">2</text>
<circle cx="70" cy="150" r="15" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<text class="learn-algorithmic-patterns-heap-priority-queue-t" x="70" y="155" text-anchor="middle">7</text>
<circle cx="140" cy="150" r="15" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<text class="learn-algorithmic-patterns-heap-priority-queue-t" x="140" y="155" text-anchor="middle">4</text>
<circle cx="180" cy="150" r="15" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<text class="learn-algorithmic-patterns-heap-priority-queue-t" x="180" y="155" text-anchor="middle">5</text>
<circle cx="250" cy="150" r="15" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<text class="learn-algorithmic-patterns-heap-priority-queue-t" x="250" y="155" text-anchor="middle">9</text>
<g class="learn-algorithmic-patterns-heap-priority-queue-f"><circle cx="160" cy="60" r="18" fill="var(--scene-good,#1f7a4d)"/><text class="learn-algorithmic-patterns-heap-priority-queue-w" x="160" y="65" text-anchor="middle">1</text></g>
<text class="learn-algorithmic-patterns-heap-priority-queue-t" x="160" y="24" text-anchor="middle">smallest comes out first</text>
</svg>
