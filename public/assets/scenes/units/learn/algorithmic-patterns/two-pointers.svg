<g class="learn-algorithmic-patterns-two-pointers-r"><path d="M275 138l-9 12h18z" fill="var(--scene-ahead,#2f6fb3)"/><rect x="263" y="150" width="24" height="20" rx="5" fill="var(--scene-ahead,#2f6fb3)"/><text class="learn-algorithmic-patterns-two-pointers-w" x="275" y="165" text-anchor="middle">R</text></g>
