<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="two pointers">
<style>
.learn-algorithmic-patterns-two-pointers-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}.learn-algorithmic-patterns-two-pointers-w{font:700 16px system-ui,sans-serif;fill:#fff}
@keyframes learn-algorithmic-patterns-two-pointers-l{0%{transform:translateX(0px)}15%{transform:translateX(0px)}25%{transform:translateX(34px)}40%{transform:translateX(34px)}50%{transform:translateX(68px)}65%{transform:translateX(68px)}75%{transform:translateX(102px)}95%{transform:translateX(102px)}100%{transform:translateX(0px)}}
@keyframes learn-algorithmic-patterns-two-pointers-r{0%{transform:translateX(0px)}15%{transform:translateX(0px)}25%{transform:translateX(-34px)}40%{transform:translateX(-34px)}50%{transform:translateX(-68px)}65%{transform:translateX(-68px)}75%{transform:translateX(-102px)}95%{transform:translateX(-102px)}100%{transform:translateX(0px)}}
@keyframes learn-algorithmic-patterns-two-pointers-dl{0%{transform:scaleX(0)}15%{transform:scaleX(0)}25%{transform:scaleX(1)}40%{transform:scaleX(1)}50%{transform:scaleX(2)}65%{transform:scaleX(2)}75%{transform:scaleX(3)}95%{transform:scaleX(3)}100%{transform:scaleX(0)}}
@keyframes learn-algorithmic-patterns-two-pointers-dr{0%{transform:scaleX(0)}15%{transform:scaleX(0)}25%{transform:scaleX(1)}40%{transform:scaleX(1)}50%{transform:scaleX(2)}65%{transform:scaleX(2)}75%{transform:scaleX(3)}95%{transform:scaleX(3)}100%{transform:scaleX(0)}}
.learn-algorithmic-patterns-two-pointers-l{animation:learn-algorithmic-patterns-two-pointers-l 6.5s ease-in-out infinite;animation-delay:-3.2s;}
.learn-algorithmic-patterns-two-pointers-r{animation:learn-algorithmic-patterns-two-pointers-r 6.5s ease-in-out infinite;animation-delay:-3.2s;}
.learn-algorithmic-patterns-two-pointers-dl{animation:learn-algorithmic-patterns-two-pointers-dl 6.5s ease-in-out infinite;animation-delay:-3.2s;}
.learn-algorithmic-patterns-two-pointers-dr{animation:learn-algorithmic-patterns-two-pointers-dr 6.5s ease-in-out infinite;animation-delay:-3.2s;}
.learn-algorithmic-patterns-two-pointers-dl,.learn-algorithmic-patterns-two-pointers-dr{transform-box:fill-box}.learn-algorithmic-patterns-two-pointers-dl{transform-origin:0 50%}.learn-algorithmic-patterns-two-pointers-dr{transform-origin:100% 50%}
.learn-algorithmic-patterns-two-pointers-bg{fill:var(--scene-card,#fff)}
</style>
<rect class="learn-algorithmic-patterns-two-pointers-bg" width="320" height="180" rx="12"/>
<rect x="24" y="106" width="30" height="22" rx="4" fill="var(--scene-accent,#006c73)"/>
<rect x="58" y="98" width="30" height="30" rx="4" fill="var(--scene-accent,#006c73)"/>
<rect x="92" y="90" width="30" height="38" rx="4" fill="var(--scene-accent,#006c73)"/>
<rect x="126" y="82" width="30" height="46" rx="4" fill="var(--scene-accent,#006c73)"/>
<rect x="160" y="74" width="30" height="54" rx="4" fill="var(--scene-accent,#006c73)"/>
<rect x="194" y="66" width="30" height="62" rx="4" fill="var(--scene-accent,#006c73)"/>
<rect x="228" y="58" width="30" height="70" rx="4" fill="var(--scene-accent,#006c73)"/>
<rect x="262" y="50" width="30" height="78" rx="4" fill="var(--scene-accent,#006c73)"/>
