<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A left join keeps a customer with no order as NULL, an index lookup jumps to a row, a transaction commits">
<style>
.learn-sql-sql-query-and-storage-l{fill:var(--scene-card,#fff);stroke:var(--scene-learn,#0f8a8a);stroke-width:2}
.learn-sql-sql-query-and-storage-r{fill:var(--scene-card,#fff);stroke:var(--scene-ahead,#2f6fb3);stroke-width:2}
.learn-sql-sql-query-and-storage-k{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:2.5;stroke-dasharray:6 5;animation:learn-sql-sql-query-and-storage-flow 1.2s linear infinite}
.learn-sql-sql-query-and-storage-n{fill:none;stroke:var(--scene-warn,#a15c00);stroke-width:2.5;stroke-dasharray:3 5;animation:learn-sql-sql-query-and-storage-pulse 6s ease-in-out infinite;animation-delay:-3s}
.learn-sql-sql-query-and-storage-nb{fill:var(--scene-warn,#a15c00);animation:learn-sql-sql-query-and-storage-pulse 6s ease-in-out infinite;animation-delay:-3s}
.learn-sql-sql-query-and-storage-c{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5;animation:learn-sql-sql-query-and-storage-hit 6s steps(1) infinite}
.learn-sql-sql-query-and-storage-p{fill:var(--scene-grow,#b8457a);animation:learn-sql-sql-query-and-storage-hop 6s steps(1) infinite;animation-delay:-3s}
.learn-sql-sql-query-and-storage-d{fill:var(--scene-line,#cfdfdc);animation:learn-sql-sql-query-and-storage-dot 6s infinite}
.learn-sql-sql-query-and-storage-cm{fill:var(--scene-good,#1f7a4d);animation:learn-sql-sql-query-and-storage-pop 6s ease-in-out infinite;animation-delay:-3s}
.learn-sql-sql-query-and-storage-t{font:700 16px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.learn-sql-sql-query-and-storage-w{font:700 16px system-ui,sans-serif;fill:#fff}
@keyframes learn-sql-sql-query-and-storage-flow{to{stroke-dashoffset:-22}}
@keyframes learn-sql-sql-query-and-storage-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes learn-sql-sql-query-and-storage-hop{0%{transform:translateX(0)}25%{transform:translateX(60px)}50%{transform:translateX(100px)}75%{transform:translateX(120px)}100%{transform:translateX(0)}}
@keyframes learn-sql-sql-query-and-storage-dot{0%,15%{fill:var(--scene-line,#cfdfdc)}30%,85%{fill:var(--scene-good,#1f7a4d)}100%{fill:var(--scene-line,#cfdfdc)}}
@keyframes learn-sql-sql-query-and-storage-pop{0%,35%{opacity:.35;transform:scale(.96)}55%,90%{opacity:1;transform:scale(1)}100%{opacity:.35}}
@keyframes learn-sql-sql-query-and-storage-hit{0%,100%{}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<text class="learn-sql-sql-query-and-storage-t" x="160" y="16" text-anchor="middle">LEFT JOIN</text>
<rect class="learn-sql-sql-query-and-storage-l" x="14" y="28" width="84" height="22" rx="4"/><circle cx="28" cy="39" r="5" fill="var(--scene-learn,#0f8a8a)"/><rect x="40" y="36" width="44" height="6" rx="3" fill="var(--scene-line,#cfdfdc)"/><rect class="learn-sql-sql-query-and-storage-l" x="14" y="54" width="84" height="22" rx="4"/><circle cx="28" cy="65" r="5" fill="var(--scene-learn,#0f8a8a)"/><rect x="40" y="62" width="44" height="6" rx="3" fill="var(--scene-line,#cfdfdc)"/><rect class="learn-sql-sql-query-and-storage-l" x="14" y="80" width="84" height="22" rx="4"/><circle cx="28" cy="91" r="5" fill="var(--scene-learn,#0f8a8a)"/><rect x="40" y="88" width="44" height="6" rx="3" fill="var(--scene-line,#cfdfdc)"/><rect class="learn-sql-sql-query-and-storage-r" x="222" y="28" width="84" height="22" rx="4"/><rect x="234" y="36" width="52" height="6" rx="3" fill="var(--scene-line,#cfdfdc)"/><rect class="learn-sql-sql-query-and-storage-r" x="222" y="54" width="84" height="22" rx="4"/><rect x="234" y="62" width="52" height="6" rx="3" fill="var(--scene-line,#cfdfdc)"/>
<path class="learn-sql-sql-query-and-storage-k" d="M98 39 H222"/><path class="learn-sql-sql-query-and-storage-k" d="M98 65 H222"/>
<path class="learn-sql-sql-query-and-storage-n" d="M98 91 H222"/>
<rect class="learn-sql-sql-query-and-storage-nb" x="222" y="80" width="84" height="22" rx="4" style="opacity:.9"/>
<text class="learn-sql-sql-query-and-storage-w" x="264" y="96" text-anchor="middle">NULL</text>
<line x1="14" y1="112" x2="306" y2="112" stroke="var(--scene-line,#cfdfdc)" stroke-width="1.5"/>
<rect class="learn-sql-sql-query-and-storage-c" x="14" y="120" width="18" height="26" rx="3"/><rect class="learn-sql-sql-query-and-storage-c" x="34" y="120" width="18" height="26" rx="3"/><rect class="learn-sql-sql-query-and-storage-c" x="54" y="120" width="18" height="26" rx="3"/><rect class="learn-sql-sql-query-and-storage-c" x="74" y="120" width="18" height="26" rx="3"/><rect class="learn-sql-sql-query-and-storage-c" x="94" y="120" width="18" height="26" rx="3"/><rect class="learn-sql-sql-query-and-storage-c" x="114" y="120" width="18" height="26" rx="3"/><rect class="learn-sql-sql-query-and-storage-c" x="134" y="120" width="18" height="26" rx="3"/><rect class="learn-sql-sql-query-and-storage-c" x="154" y="120" width="18" height="26" rx="3"/>
<rect x="94" y="120" width="18" height="26" rx="3" fill="var(--scene-accent,#006c73)"><animate attributeName="x" values="14;74;114;134;14" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="6s" begin="-3s" repeatCount="indefinite"/></rect>
<g class="learn-sql-sql-query-and-storage-p"><path d="M23 164 L14 174 H32 Z"/></g>
<circle class="learn-sql-sql-query-and-storage-d" cx="196" cy="133" r="5" style="animation-delay:-3s"/><circle class="learn-sql-sql-query-and-storage-d" cx="212" cy="133" r="5" style="animation-delay:-2.5s"/>
<g class="learn-sql-sql-query-and-storage-cm" style="transform-origin:268px 133px"><rect x="228" y="120" width="78" height="26" rx="13"/><text class="learn-sql-sql-query-and-storage-w" x="267" y="138" text-anchor="middle">COMMIT</text></g>
</svg>