<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" role="img" aria-label="Log lines flow through a pipe into counts, then a process is stopped with SIGTERM">
<style>
.learn-linux-linux-shell-and-processes-t{font-family:system-ui,sans-serif;font-size:14px;font-weight:700;fill:var(--scene-ink,#102a33)}
.learn-linux-linux-shell-and-processes-ln{animation:learn-linux-linux-shell-and-processes-flow 6s linear infinite}
.learn-linux-linux-shell-and-processes-er{animation:learn-linux-linux-shell-and-processes-flow2 6s linear infinite}
.learn-linux-linux-shell-and-processes-b{transform-box:fill-box;transform-origin:50% 100%;animation:learn-linux-linux-shell-and-processes-bar 6s ease-in-out infinite}
.learn-linux-linux-shell-and-processes-sig{animation:learn-linux-linux-shell-and-processes-sig 6s ease-in-out infinite}
.learn-linux-linux-shell-and-processes-pr{animation:learn-linux-linux-shell-and-processes-proc 6s ease-in-out infinite}
.learn-linux-linux-shell-and-processes-ck{animation:learn-linux-linux-shell-and-processes-chk 6s ease-in-out infinite}
@keyframes learn-linux-linux-shell-and-processes-flow{0%{transform:translate(0,0);opacity:1}45%{transform:translate(48px,0);opacity:1}60%{transform:translate(60px,0);opacity:0}100%{transform:translate(60px,0);opacity:0}}
@keyframes learn-linux-linux-shell-and-processes-flow2{0%{transform:translate(0,0);opacity:1}70%{transform:translate(78px,0);opacity:1}85%{transform:translate(90px,0);opacity:0}100%{transform:translate(90px,0);opacity:0}}
@keyframes learn-linux-linux-shell-and-processes-bar{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(1)}}
@keyframes learn-linux-linux-shell-and-processes-sig{0%,20%{transform:translate(0,0);opacity:0}30%{opacity:1}70%{transform:translate(14px,0);opacity:1}80%,100%{transform:translate(14px,0);opacity:0}}
@keyframes learn-linux-linux-shell-and-processes-proc{0%,70%{opacity:1}85%,100%{opacity:.35}}
@keyframes learn-linux-linux-shell-and-processes-chk{0%,72%{opacity:0}85%,100%{opacity:1}}
</style>
<rect width="240" height="135" fill="var(--scene-card,#fff)"/>
<text x="8" y="16" class="learn-linux-linux-shell-and-processes-t">logs</text>
<text x="160" y="16" class="learn-linux-linux-shell-and-processes-t">counts</text>
<rect x="8" y="24" width="42" height="58" rx="6" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-line,#cfdfdc)"/>
<g fill="var(--scene-muted,#536970)"><rect x="14" y="30" width="30" height="8" rx="3"/><rect x="14" y="42" width="30" height="8" rx="3"/><rect x="14" y="66" width="30" height="8" rx="3"/></g>
<rect x="14" y="54" width="30" height="8" rx="3" fill="var(--scene-bad,#b3261e)"/>
<rect x="50" y="40" width="96" height="26" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<path d="M80 40v26M116 40v26" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<g class="learn-linux-linux-shell-and-processes-ln" style="animation-delay:-3s"><rect x="54" y="43" width="18" height="6" rx="2" fill="var(--scene-muted,#536970)"/></g>
<g class="learn-linux-linux-shell-and-processes-ln" style="animation-delay:-5s"><rect x="54" y="57" width="18" height="6" rx="2" fill="var(--scene-muted,#536970)"/></g>
<g class="learn-linux-linux-shell-and-processes-er" style="animation-delay:-2s"><rect x="54" y="50" width="18" height="6" rx="2" fill="var(--scene-bad,#b3261e)"/></g>
<g class="learn-linux-linux-shell-and-processes-er" style="animation-delay:-5.2s"><rect x="54" y="50" width="18" height="6" rx="2" fill="var(--scene-bad,#b3261e)"/></g>
<path d="M146 53h8" stroke="var(--scene-accent,#006c73)" stroke-width="3"/>
<path d="M153 47l7 6-7 6z" fill="var(--scene-accent,#006c73)"/>
<line x1="166" y1="82" x2="230" y2="82" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<rect class="learn-linux-linux-shell-and-processes-b" style="animation-delay:-3s" x="168" y="30" width="18" height="52" fill="var(--scene-bad,#b3261e)"/>
<rect class="learn-linux-linux-shell-and-processes-b" style="animation-delay:-1s" x="190" y="52" width="18" height="30" fill="var(--scene-warn,#a15c00)"/>
<rect class="learn-linux-linux-shell-and-processes-b" style="animation-delay:-4s" x="212" y="68" width="18" height="14" fill="var(--scene-muted,#536970)"/>
<line x1="8" y1="94" x2="232" y2="94" stroke="var(--scene-line,#cfdfdc)"/>
<g class="learn-linux-linux-shell-and-processes-pr" style="animation-delay:-3s"><rect x="8" y="102" width="40" height="26" rx="6" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2"/>
<circle cx="28" cy="115" r="5" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="2"/></g>
<g class="learn-linux-linux-shell-and-processes-sig" style="animation-delay:-3s"><path d="M54 115h18" stroke="var(--scene-warn,#a15c00)" stroke-width="3"/><path d="M72 108l9 7-9 7z" fill="var(--scene-warn,#a15c00)"/></g>
<text x="102" y="121" class="learn-linux-linux-shell-and-processes-t">SIGTERM</text>
<g class="learn-linux-linux-shell-and-processes-ck" style="animation-delay:-3s"><circle cx="214" cy="115" r="11" fill="var(--scene-good,#1f7a4d)"/><path d="M208 115l4 4 8-9" fill="none" stroke="#fff" stroke-width="3"/></g>
</svg>
