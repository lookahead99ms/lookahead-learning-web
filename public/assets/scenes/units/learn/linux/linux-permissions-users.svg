<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A visitor's request reaches the nginx server, which reads the site's public page and gets it, then tries the site's locked database password file and is refused">
<style>
.lpu-w{font-family:system-ui,sans-serif;font-size:12px;font-weight:700;fill:var(--scene-muted,#536970)}
.lpu-loop{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear;animation-delay:-7s}
.lpu-in{animation-name:lpu-in}
.lpu-page{animation-name:lpu-page}
.lpu-key{animation-name:lpu-key}
.lpu-ok{animation-name:lpu-ok}
.lpu-no{animation-name:lpu-no}
.lpu-led{animation-name:lpu-led}
@keyframes lpu-in{0%,4%{transform:translateX(0);opacity:0}6%{opacity:1}22%{transform:translateX(56px);opacity:1}25%,100%{transform:translateX(56px);opacity:0}}
@keyframes lpu-page{0%,26%{transform:translate(0,0);opacity:0}28%{opacity:1}42%{transform:translate(70px,-22px);opacity:1}45%,100%{transform:translate(70px,-22px);opacity:0}}
@keyframes lpu-key{0%,50%{transform:translate(0,0);opacity:0}52%{opacity:1}66%{transform:translate(70px,24px);opacity:1}69%,100%{transform:translate(70px,24px);opacity:0}}
@keyframes lpu-ok{0%,43%{opacity:0}46%,96%{opacity:1}99%,100%{opacity:0}}
@keyframes lpu-no{0%,67%{opacity:0}70%,96%{opacity:1}99%,100%{opacity:0}}
@keyframes lpu-led{0%,24%{opacity:.3}26%,68%{opacity:1}72%,100%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.lpu-loop{animation-play-state:paused}}
</style>
