<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A shopper opens a product page on her phone: the product, price and stock services answer and fill their rows, the delivery service is still busy, so its row shows a default text and the page is ready with a green check">
<style>
.cf-a{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6s;animation-timing-function:ease-in-out}
.cf-t{font:600 10px system-ui,sans-serif;fill:var(--scene-muted,#536970);text-anchor:middle}
.cf-v{font:700 12px ui-monospace,Menlo,monospace;fill:var(--scene-ink,#102a33)}
.cf-dp{animation-name:cf-go-product}
.cf-dr{animation-name:cf-go-price}
.cf-ds{animation-name:cf-go-stock}
.cf-dd{animation-name:cf-go-delivery}
.cf-rp{animation-name:cf-row-product}
.cf-rr{animation-name:cf-row-price}
.cf-rs{animation-name:cf-row-stock}
.cf-rd{animation-name:cf-row-default}
.cf-ok{animation-name:cf-ok}
.cf-clock{animation-name:cf-clock}
.cf-hand{animation-name:cf-hand;transform-box:view-box;transform-origin:304px 152px}
@keyframes cf-go-product{0%{transform:translate(0,0);opacity:0}3%{opacity:1}16%{transform:translate(-54px,24px);opacity:1}19%,100%{transform:translate(-54px,24px);opacity:0}}
@keyframes cf-go-stock{0%{transform:translate(0,0);opacity:0}3%{opacity:1}17%{transform:translate(-54px,-8px);opacity:1}20%,100%{transform:translate(-54px,-8px);opacity:0}}
@keyframes cf-go-price{0%,18%{transform:translate(0,0);opacity:0}21%{opacity:1}34%{transform:translate(-54px,6px);opacity:1}37%,100%{transform:translate(-54px,6px);opacity:0}}
@keyframes cf-go-delivery{0%{transform:translate(0,0);opacity:0}3%{opacity:1}40%{transform:translate(-24px,-9px);opacity:1}46%,100%{transform:translate(-24px,-9px);opacity:0}}
@keyframes cf-row-product{0%,17%{opacity:0}20%,94%{opacity:1}100%{opacity:0}}
@keyframes cf-row-stock{0%,18%{opacity:0}21%,94%{opacity:1}100%{opacity:0}}
@keyframes cf-row-price{0%,35%{opacity:0}38%,94%{opacity:1}100%{opacity:0}}
@keyframes cf-row-default{0%,45%{opacity:0}48%,94%{opacity:1}100%{opacity:0}}
@keyframes cf-ok{0%,50%{opacity:0;transform:scale(.6)}54%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
@keyframes cf-clock{0%,4%{opacity:0}8%,94%{opacity:1}100%{opacity:0}}
@keyframes cf-hand{0%{transform:rotate(0)}45%,100%{transform:rotate(330deg)}}
@media (prefers-reduced-motion:reduce){.cf-a{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-ink,#102a33)" opacity=".08"><ellipse cx="36" cy="164" rx="26" ry="5"/><ellipse cx="118" cy="168" rx="50" ry="6"/><ellipse cx="262" cy="170" rx="44" ry="5"/></g>
<circle cx="34" cy="98" r="11" fill="var(--scene-accent,#006c73)"/>
<path d="M14 160q0-42 20-42t20 42z" fill="var(--scene-accent,#006c73)"/>
<path d="M76 28h86l6 6v128l-6 6h-86l-6-6v-128z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<rect x="70" y="22" width="92" height="140" rx="10" fill="var(--scene-ink,#102a33)"/>
<rect x="75" y="30" width="82" height="124" rx="4" fill="var(--scene-card,#fff)"/>
<rect x="80" y="35" width="72" height="34" rx="3" fill="var(--scene-accent-soft,#dcefed)"/>
<path d="M92 60q8-14 20-12l10 4q14 2 18 8z" fill="var(--scene-link,#1f5f8b)"/>
<path d="M90 61h52" stroke="var(--scene-ink,#102a33)" stroke-width="2" stroke-linecap="round"/>
<g fill="var(--scene-line,#cfdfdc)"><rect x="80" y="76" width="72" height="8" rx="2"/><rect x="80" y="92" width="72" height="14" rx="3"/><rect x="80" y="112" width="72" height="14" rx="3"/><rect x="80" y="132" width="72" height="14" rx="3"/></g>
<rect class="cf-a cf-rp" x="80" y="76" width="56" height="8" rx="2" fill="var(--scene-ink,#102a33)"/>
<g class="cf-a cf-rr"><rect x="80" y="92" width="72" height="14" rx="3" fill="var(--scene-accent-soft,#dcefed)"/><text class="cf-v" x="84" y="103">89.99</text></g>
<g class="cf-a cf-rs"><rect x="80" y="112" width="72" height="14" rx="3" fill="var(--scene-accent-soft,#dcefed)"/><text class="cf-v" x="84" y="123">3 left</text></g>
<g class="cf-a cf-rd"><rect x="80" y="132" width="72" height="14" rx="3" fill="none" stroke="var(--scene-muted,#536970)" stroke-width="1.5" stroke-dasharray="3 2"/><text class="cf-t" x="116" y="143">at checkout</text></g>
<g class="cf-a cf-ok" style="transform-box:fill-box;transform-origin:center"><circle cx="160" cy="26" r="10" fill="var(--scene-good,#1f7a4d)"/><path d="M155 26l3.5 3.5 6.5-7" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g fill="none" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="4 4"><path d="M220 56L166 80"/><path d="M220 92L166 98"/><path d="M220 126L166 118"/><path d="M220 160L166 138"/></g>
<g id="cf-server">
<path d="M222 44l7-6h55l-7 6z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M277 44l7-6v22l-7 6z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<rect x="222" y="44" width="55" height="22" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<circle cx="280" cy="41" r="1.8" fill="var(--scene-good,#1f7a4d)"/>
</g>
<use href="#cf-server" y="38"/>
<use href="#cf-server" y="72"/>
<use href="#cf-server" y="106"/>
<g class="cf-t"><text x="249.5" y="59">product</text><text x="249.5" y="97">price</text><text x="249.5" y="131">stock</text><text x="249.5" y="165">delivery</text></g>
<circle class="cf-a cf-dp" cx="220" cy="56" r="4.5" fill="var(--scene-accent,#006c73)"/>
<circle class="cf-a cf-dr" cx="220" cy="92" r="4.5" fill="var(--scene-accent,#006c73)"/>
<circle class="cf-a cf-ds" cx="220" cy="126" r="4.5" fill="var(--scene-accent,#006c73)"/>
<circle class="cf-a cf-dd" cx="220" cy="160" r="4.5" fill="var(--scene-warn,#a15c00)"/>
<g class="cf-a cf-clock"><circle cx="304" cy="152" r="10" fill="var(--scene-card,#fff)" stroke="var(--scene-warn,#a15c00)" stroke-width="2.5"/><path class="cf-a cf-hand" d="M304 152V145" stroke="var(--scene-warn,#a15c00)" stroke-width="2.5" stroke-linecap="round"/></g>
</svg>
