<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="An on-call engineer runs jcmd against the check-in service: a thread dump slides from the server to the laptop, and the highlighted line shows six request threads waiting behind one thread that holds the seat-map lock while its call to the loyalty service hangs">
<style>
.td-a{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-5.2s;animation-timing-function:ease-in-out}
.td-t{font:600 11px system-ui,sans-serif;fill:var(--scene-muted,#536970);text-anchor:middle}
.td-dot{animation-name:td-call;animation-timing-function:linear}
.td-doc{animation-name:td-slide}
.td-lens{animation-name:td-lens}
.td-mark{animation-name:td-mark}
.td-warn{animation-name:td-warn;transform-box:fill-box;transform-origin:center}
@keyframes td-call{0%{transform:translate(0,0);opacity:0}5%{opacity:1}85%{transform:translate(46px,-30px);opacity:1}92%,100%{transform:translate(46px,-30px);opacity:0}}
@keyframes td-slide{0%,18%{transform:translate(0,0);opacity:0}24%{opacity:1}44%,92%{transform:translate(-114px,34px);opacity:1}98%,100%{transform:translate(-114px,34px);opacity:0}}
@keyframes td-lens{0%,48%{opacity:0;transform:translate(8px,8px)}56%,92%{opacity:1;transform:translate(0,0)}98%,100%{opacity:0}}
@keyframes td-mark{0%,50%{opacity:0}56%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes td-warn{0%,30%{opacity:0;transform:scale(.6)}36%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.td-a{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-ink,#102a33)" opacity=".08"><ellipse cx="54" cy="160" rx="46" ry="6"/><ellipse cx="200" cy="162" rx="56" ry="7"/><ellipse cx="284" cy="66" rx="24" ry="4"/></g>
<path d="M226 52L264 30" fill="none" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="4 4"/>
<circle class="td-a td-dot" cx="226" cy="52" r="4.5" fill="var(--scene-accent,#006c73)"/>
<path d="M266 22l8-6h28l-8 6z" fill="var(--scene-line,#cfdfdc)"/>
