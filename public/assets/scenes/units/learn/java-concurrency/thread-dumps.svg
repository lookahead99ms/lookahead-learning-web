<rect x="266" y="22" width="28" height="38" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<g stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"><path d="M271 32h12M271 40h12M271 48h12"/></g>
<circle cx="288" cy="32" r="2.5" fill="var(--scene-warn,#a15c00)"/>
<text class="td-t" x="280" y="76">loyalty</text>
<path d="M148 46l14-10h96l-14 10z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M244 46l14-10v108l-14 10z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
