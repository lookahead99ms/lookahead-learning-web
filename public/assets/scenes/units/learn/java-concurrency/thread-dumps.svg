<path d="M25 136l5-35h64l5 35z" fill="var(--scene-accent-soft,#dcefed)"/>
<g class="td-a td-doc">
<path d="M160 64h40l8 8v48h-48z" fill="var(--scene-card,#fff)" stroke="var(--scene-muted,#536970)" stroke-width="1.5"/>
<path d="M200 64v8h8" fill="none" stroke="var(--scene-muted,#536970)" stroke-width="1.5"/>
<g stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"><path d="M166 78h26M166 86h34M166 102h30M166 110h22"/></g>
<rect class="td-a td-mark" x="164" y="91" width="38" height="7" rx="2" fill="var(--scene-warn,#a15c00)" opacity=".75"/>
<g class="td-a td-lens"><circle cx="196" cy="98" r="9" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="2.5"/><path d="M202 105l6 7" stroke="var(--scene-ink,#102a33)" stroke-width="3" stroke-linecap="round"/></g>
</g>
</svg>
