<rect x="156" y="54" width="64" height="12" rx="3" fill="var(--scene-accent,#006c73)"/>
<g transform="translate(224 52)"><path d="M3 6v-2.5a4 4 0 0 1 8 0v2.5" fill="none" stroke="var(--scene-ink,#102a33)" stroke-width="2"/><rect x="1" y="6" width="12" height="9" rx="2" fill="var(--scene-ink,#102a33)"/></g>
<g fill="var(--scene-warn,#a15c00)" opacity=".85"><rect x="156" y="74" width="44" height="10" rx="3"/><rect x="156" y="88" width="44" height="10" rx="3"/><rect x="156" y="102" width="44" height="10" rx="3"/><rect x="156" y="116" width="44" height="10" rx="3"/><rect x="156" y="130" width="44" height="10" rx="3"/><rect x="156" y="144" width="44" height="6" rx="3" opacity=".6"/></g>
<g fill="none" stroke="var(--scene-muted,#536970)" stroke-width="1.5" stroke-dasharray="2 3"><path d="M204 79h24v-13M204 93h24M204 107h24M204 121h24M204 135h24v-56"/></g>
<g class="td-a td-warn"><circle cx="236" cy="96" r="9" fill="var(--scene-warn,#a15c00)"/><path d="M236 91v6" stroke="var(--scene-card,#fff)" stroke-width="2.4" stroke-linecap="round"/><circle cx="236" cy="101" r="1.4" fill="var(--scene-card,#fff)"/></g>
<circle cx="40" cy="74" r="11" fill="var(--scene-link,#1f5f8b)"/><path d="M20 114q0-26 20-26t20 26z" fill="var(--scene-link,#1f5f8b)"/>
