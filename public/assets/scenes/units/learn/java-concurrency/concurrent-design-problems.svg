<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A partner app sends four requests to an API gateway: the first three each spend a token from the client's bucket and wait in the request queue for a worker server, and the fourth finds the bucket empty and is refused with 429">
<style>
.cdp-a{animation-duration:8s;animation-iteration-count:infinite;animation-delay:-6.4s;animation-timing-function:ease-in-out}
.cdp-v{font:700 11px ui-monospace,Menlo,monospace;fill:var(--scene-bad,#b3261e);text-anchor:middle}
.cdp-d1{animation-name:cdp-go1}
.cdp-d2{animation-name:cdp-go2}
.cdp-d3{animation-name:cdp-go3}
.cdp-d4{animation-name:cdp-go4}
.cdp-t1{animation-name:cdp-spend1}
.cdp-t2{animation-name:cdp-spend2}
.cdp-t3{animation-name:cdp-spend3}
.cdp-c1{animation-name:cdp-card1}
.cdp-c2{animation-name:cdp-card2}
.cdp-c3{animation-name:cdp-card3}
.cdp-no{animation-name:cdp-no}
@keyframes cdp-go1{0%{transform:translate(0,0);opacity:0}2%{opacity:1}14%{transform:translate(52px,0);opacity:1}16%,100%{transform:translate(52px,0);opacity:0}}
@keyframes cdp-go2{0%,20%{transform:translate(0,0);opacity:0}22%{opacity:1}34%{transform:translate(52px,0);opacity:1}36%,100%{transform:translate(52px,0);opacity:0}}
@keyframes cdp-go3{0%,40%{transform:translate(0,0);opacity:0}42%{opacity:1}54%{transform:translate(52px,0);opacity:1}56%,100%{transform:translate(52px,0);opacity:0}}
@keyframes cdp-go4{0%,60%{transform:translate(0,0);opacity:0}62%{opacity:1}72%{transform:translate(52px,0);opacity:1}74%,100%{transform:translate(52px,0);opacity:0}}
@keyframes cdp-spend1{0%,14%{opacity:1}17%,95%{opacity:0}100%{opacity:1}}
@keyframes cdp-spend2{0%,34%{opacity:1}37%,95%{opacity:0}100%{opacity:1}}
@keyframes cdp-spend3{0%,54%{opacity:1}57%,95%{opacity:0}100%{opacity:1}}
@keyframes cdp-card1{0%,15%{transform:translate(0,0);opacity:0}17%{opacity:1}30%,93%{transform:translate(28px,34px);opacity:1}97%,100%{transform:translate(28px,34px);opacity:0}}
@keyframes cdp-card2{0%,35%{transform:translate(0,0);opacity:0}37%{opacity:1}50%,93%{transform:translate(46px,34px);opacity:1}97%,100%{transform:translate(46px,34px);opacity:0}}
@keyframes cdp-card3{0%,55%{transform:translate(0,0);opacity:0}57%{opacity:1}70%,93%{transform:translate(64px,34px);opacity:1}97%,100%{transform:translate(64px,34px);opacity:0}}
@keyframes cdp-no{0%,73%{opacity:0}76%,93%{opacity:1}97%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cdp-a{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-ink,#102a33)" opacity=".09"><ellipse cx="32" cy="128" rx="26" ry="5"/><ellipse cx="160" cy="146" rx="52" ry="7"/><ellipse cx="250" cy="152" rx="36" ry="5"/><ellipse cx="286" cy="110" rx="26" ry="5"/></g>
<g fill="none" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="4 4"><path d="M62 92H112"/><path d="M208 104L226 124"/><path d="M276 126L282 108"/></g>
<circle cx="28" cy="78" r="9" fill="var(--scene-accent,#006c73)"/><path d="M12 124q0-30 16-30t16 30z" fill="var(--scene-accent,#006c73)"/>
<rect x="40" y="80" width="16" height="26" rx="3" fill="var(--scene-ink,#102a33)"/><rect x="42" y="83" width="12" height="18" rx="1.5" fill="var(--scene-accent-soft,#dcefed)"/>
<circle class="cdp-a cdp-d1" cx="60" cy="92" r="4.5" fill="var(--scene-accent,#006c73)"/>
<circle class="cdp-a cdp-d2" cx="60" cy="92" r="4.5" fill="var(--scene-accent,#006c73)"/>
<circle class="cdp-a cdp-d3" cx="60" cy="92" r="4.5" fill="var(--scene-accent,#006c73)"/>
<circle class="cdp-a cdp-d4" cx="60" cy="92" r="4.5" fill="var(--scene-accent,#006c73)"/>
