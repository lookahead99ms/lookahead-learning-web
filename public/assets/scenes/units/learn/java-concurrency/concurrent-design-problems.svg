<g fill="var(--scene-good,#1f7a4d)"><circle cx="186" cy="62" r="3"/><circle cx="176" cy="62" r="3"/></g>
<path d="M128 80h56l-7 44h-42z" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2" stroke-linejoin="round"/>
<path d="M156 70v6" stroke="var(--scene-accent,#006c73)" stroke-width="2" stroke-linecap="round"/>
<circle class="cdp-a cdp-t1" cx="144" cy="114" r="6" fill="var(--scene-warn,#a15c00)"/>
<circle class="cdp-a cdp-t2" cx="157" cy="114" r="6" fill="var(--scene-warn,#a15c00)"/>
<circle class="cdp-a cdp-t3" cx="170" cy="114" r="6" fill="var(--scene-warn,#a15c00)"/>
<path d="M218 144h64l-6 8h-52z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<rect x="218" y="122" width="64" height="22" rx="3" fill="none" stroke="var(--scene-muted,#536970)" stroke-width="2"/>
<g class="cdp-a cdp-c1"><rect x="196" y="96" width="14" height="18" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-link,#1f5f8b)" stroke-width="2"/><rect x="196" y="96" width="14" height="5" rx="2" fill="var(--scene-link,#1f5f8b)"/></g>
<g class="cdp-a cdp-c2"><rect x="196" y="96" width="14" height="18" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-link,#1f5f8b)" stroke-width="2"/><rect x="196" y="96" width="14" height="5" rx="2" fill="var(--scene-link,#1f5f8b)"/></g>
<g class="cdp-a cdp-c3"><rect x="196" y="96" width="14" height="18" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-link,#1f5f8b)" stroke-width="2"/><rect x="196" y="96" width="14" height="5" rx="2" fill="var(--scene-link,#1f5f8b)"/></g>
<path d="M266 46l10-8h30l-10 8z" fill="var(--scene-line,#cfdfdc)"/>
<path d="M296 46l10-8v58l-10 8z" fill="var(--scene-ink,#102a33)" opacity=".14"/>
<rect x="266" y="46" width="30" height="58" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="2"/>
<g stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-linecap="round"><path d="M271 58h14M271 70h14M271 82h14"/></g>
<g fill="var(--scene-good,#1f7a4d)"><circle cx="290" cy="58" r="2.5"/><circle cx="290" cy="70" r="2.5"/><circle cx="290" cy="82" r="2.5"/></g>
<g class="cdp-a cdp-no"><circle cx="76" cy="62" r="11" fill="var(--scene-bad,#b3261e)"/><path d="M71.5 57.5l9 9M80.5 57.5l-9 9" stroke="var(--scene-card,#fff)" stroke-width="2.5" stroke-linecap="round"/><text class="cdp-v" x="76" y="44">429</text></g>
</svg>
