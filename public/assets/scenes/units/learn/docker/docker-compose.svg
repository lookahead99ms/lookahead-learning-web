<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A compose file starts a database container, which turns healthy before the stations API container starts; a rider's phone then asks the API and shows the bikes left at a station, while the database keeps its data in a volume">
<style>
.dc-bg{fill:var(--scene-card,#fff)}
.dc-t{font-family:system-ui,sans-serif;font-size:13px;font-weight:600;fill:var(--scene-ink,#102a33)}
.dc-code{font-family:ui-monospace,monospace;font-size:11px;font-weight:600;fill:var(--scene-muted,#536970)}
.dc-doc{fill:var(--scene-card,#fff);stroke:var(--scene-ink,#102a33);stroke-width:1.5}
.dc-fold{fill:var(--scene-line,#cfdfdc)}
.dc-bar{fill:var(--scene-muted,#536970);opacity:.55}
.dc-key{fill:var(--scene-accent,#006c73)}
.dc-net{fill:none;stroke:var(--scene-muted,#536970);stroke-width:1.5;stroke-dasharray:5 4}
.dc-shadow{fill:var(--scene-ink,#102a33);opacity:.09}
.dc-front{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-line,#cfdfdc);stroke-width:1.5}
.dc-top{fill:var(--scene-line,#cfdfdc)}
.dc-side{fill:var(--scene-ink,#102a33);opacity:.14}
.dc-slot{fill:var(--scene-muted,#536970);opacity:.35}
.dc-led{fill:var(--scene-good,#1f7a4d)}
.dc-cyl{fill:var(--scene-accent-soft,#dcefed);stroke:var(--scene-link,#245a88);stroke-width:1.5}
.dc-row{fill:var(--scene-link,#245a88);opacity:.5}
.dc-disk{fill:var(--scene-card,#fff);stroke:var(--scene-learn,#0f8a8a);stroke-width:1.5}
.dc-wire{fill:none;stroke:var(--scene-muted,#536970);stroke-width:1.5;stroke-dasharray:4 4}
.dc-dot{fill:var(--scene-accent,#006c73)}
.dc-ok{fill:var(--scene-good,#1f7a4d)}
.dc-okmark{fill:none;stroke:var(--scene-card,#fff);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dc-phone{fill:var(--scene-card,#fff);stroke:var(--scene-ink,#102a33);stroke-width:2}
.dc-screen{fill:var(--scene-accent-soft,#dcefed)}
.dc-bike{fill:none;stroke:var(--scene-ink,#102a33);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dc-num{font-family:system-ui,sans-serif;font-size:18px;font-weight:700;fill:var(--scene-good,#1f7a4d)}
.dc-loop{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-delay:-6.4s}
.dc-start-db{animation-name:dc-start-db}
.dc-start-api{animation-name:dc-start-api}
.dc-healthy{animation-name:dc-healthy;transform-box:fill-box;transform-origin:center}
.dc-api-on{animation-name:dc-api-on}
.dc-ask{animation-name:dc-ask}
.dc-query{animation-name:dc-query}
.dc-answer{animation-name:dc-answer}
@keyframes dc-start-db{0%,4%{transform:translate(0,0);opacity:0}6%{opacity:1}20%{transform:translate(124px,-6px);opacity:1}23%,100%{transform:translate(124px,-6px);opacity:0}}
@keyframes dc-healthy{0%,22%{opacity:0;transform:scale(.6)}30%,96%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes dc-start-api{0%,32%{transform:translate(0,0);opacity:0}34%{opacity:1}46%{transform:translate(56px,-6px);opacity:1}49%,100%{transform:translate(56px,-6px);opacity:0}}
@keyframes dc-api-on{0%,48%{opacity:.2}52%,96%{opacity:1}100%{opacity:.2}}
@keyframes dc-ask{0%,54%{transform:translate(0,0);opacity:0}56%{opacity:1}66%{transform:translate(-138px,0);opacity:1}68%,100%{transform:translate(-138px,0);opacity:0}}
@keyframes dc-query{0%,66%{transform:translate(0,0);opacity:0}68%{opacity:1}76%{transform:translate(54px,0);opacity:1}78%,100%{transform:translate(54px,0);opacity:0}}
@keyframes dc-answer{0%,78%{opacity:0}82%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.dc-loop{animation-play-state:paused}}
</style>
<rect width="320" height="180" class="dc-bg"/>
<!-- compose.yaml: a document with a folded corner -->
<ellipse cx="40" cy="138" rx="30" ry="5" class="dc-shadow"/>
<path d="M14 40 H52 L66 54 V132 H14 Z" class="dc-doc"/>
<path d="M52 40 V54 H66 Z" class="dc-fold"/>
<rect x="20" y="62" width="20" height="4" rx="2" class="dc-key"/>
<rect x="26" y="72" width="30" height="4" rx="2" class="dc-bar"/>
<rect x="26" y="80" width="24" height="4" rx="2" class="dc-bar"/>
<rect x="20" y="92" width="20" height="4" rx="2" class="dc-key"/>
<rect x="26" y="102" width="32" height="4" rx="2" class="dc-bar"/>
<rect x="26" y="110" width="22" height="4" rx="2" class="dc-bar"/>
<text x="10" y="30" class="dc-code">compose.yaml</text>
<!-- the project network -->
<rect x="88" y="40" width="168" height="126" rx="12" class="dc-net"/>
<!-- api: a server box -->
<ellipse cx="120" cy="120" rx="28" ry="5" class="dc-shadow"/>
<polygon points="94,70 102,62 150,62 142,70" class="dc-top"/>
<polygon points="142,70 150,62 150,108 142,116" class="dc-side"/>
<rect x="94" y="70" width="48" height="46" rx="3" class="dc-front"/>
<rect x="100" y="80" width="26" height="4" rx="2" class="dc-slot"/>
<rect x="100" y="88" width="26" height="4" rx="2" class="dc-slot"/>
<circle cx="134" cy="82" r="3" class="dc-led dc-loop dc-api-on"/>
<text x="100" y="108" class="dc-t">api</text>
<!-- db: a database cylinder -->
<ellipse cx="204" cy="118" rx="30" ry="5" class="dc-shadow"/>
<path d="M180 60 V108 A24 7 0 0 0 228 108 V60" class="dc-cyl"/>
<ellipse cx="204" cy="60" rx="24" ry="7" class="dc-cyl"/>
<rect x="190" y="74" width="10" height="4" rx="2" class="dc-key"/>
<rect x="203" y="74" width="18" height="4" rx="2" class="dc-row"/>
<rect x="190" y="83" width="10" height="4" rx="2" class="dc-key"/>
<rect x="203" y="83" width="14" height="4" rx="2" class="dc-row"/>
<text x="194" y="104" class="dc-t">db</text>
<g class="dc-loop dc-healthy"><circle cx="230" cy="56" r="8" class="dc-ok"/><path d="M226 56 L229 59 L234 53" class="dc-okmark"/></g>
<!-- the named volume under db -->
<path d="M184 134 V144 A20 5 0 0 0 224 144 V134" class="dc-disk"/>
<ellipse cx="204" cy="134" rx="20" ry="5" class="dc-disk"/>
<path d="M204 122 V128" class="dc-wire"/>
<text x="122" y="148" class="dc-code">pgdata</text>
<!-- wires and messages -->
<path d="M66 88 H94" class="dc-wire"/>
<path d="M150 92 H178" class="dc-wire"/>
<path d="M262 92 H254" class="dc-wire"/>
<circle cx="70" cy="80" r="4" class="dc-dot dc-loop dc-start-db"/>
<circle cx="70" cy="94" r="4" class="dc-dot dc-loop dc-start-api"/>
<circle cx="270" cy="92" r="4" class="dc-dot dc-loop dc-ask"/>
<circle cx="140" cy="96" r="4" class="dc-dot dc-loop dc-query"/>
<!-- a rider's phone: bikes at the station -->
<ellipse cx="287" cy="150" rx="20" ry="4" class="dc-shadow"/>
<rect x="268" y="46" width="38" height="98" rx="6" class="dc-phone"/>
<rect x="272" y="54" width="30" height="82" rx="2" class="dc-screen"/>
<g class="dc-bike"><circle cx="280" cy="78" r="5"/><circle cx="295" cy="78" r="5"/><path d="M280 78 L285 70 H292 L295 78 M285 70 L288 78 H280 M290 66 H293"/></g>
<g class="dc-loop dc-answer"><text x="287" y="110" class="dc-num" text-anchor="middle">6</text></g>
</svg>
