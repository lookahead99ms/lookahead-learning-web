<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A failure is thrown inside try and caught, and the resource is closed">
<style>
.learn-core-java-error-handling-t{font:600 17px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.learn-core-java-error-handling-ball{animation:learn-core-java-error-handling-roll 6s linear infinite;animation-delay:-3s}
.learn-core-java-error-handling-bolt{transform-box:fill-box;transform-origin:center;animation:learn-core-java-error-handling-zap 6s ease-in-out infinite;animation-delay:-3s}
.learn-core-java-error-handling-lid{transform-box:fill-box;transform-origin:0 50%;animation:learn-core-java-error-handling-shut 6s ease-in-out infinite;animation-delay:-3s}
@keyframes learn-core-java-error-handling-roll{0%{transform:translate(0,0)}35%{transform:translate(108px,0)}55%{transform:translate(166px,50px)}75%,100%{transform:translate(208px,48px)}}
@keyframes learn-core-java-error-handling-zap{0%,30%{opacity:0;transform:scale(.5)}40%,60%{opacity:1;transform:scale(1.15)}75%,100%{opacity:0;transform:scale(1)}}
@keyframes learn-core-java-error-handling-shut{0%,60%{transform:rotate(-18deg)}80%,100%{transform:rotate(0)}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<rect x="14" y="34" width="186" height="64" rx="10" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2.5" stroke-dasharray="7 5"/>
<text class="learn-core-java-error-handling-t" x="26" y="54">try</text>
<path d="M24 86H190" stroke="var(--scene-muted,#536970)" stroke-width="4" stroke-linecap="round"/>
<path d="M142 86l8-6 6 10 8-6" fill="none" stroke="var(--scene-bad,#b3261e)" stroke-width="4" stroke-linejoin="round"/>
<g class="learn-core-java-error-handling-ball"><circle cx="34" cy="76" r="9" fill="var(--scene-link,#245a88)"/></g>
<path class="learn-core-java-error-handling-bolt" d="M158 40l-10 16h8l-6 16 16-20h-9l7-12z" fill="var(--scene-warn,#a15c00)"/>
<path d="M206 108h72l-10 44h-52z" fill="var(--scene-good,#1f7a4d)" opacity=".18" stroke="var(--scene-good,#1f7a4d)" stroke-width="3" stroke-linejoin="round"/>
<text class="learn-core-java-error-handling-t" x="242" y="136" text-anchor="middle">catch</text>
<rect x="30" y="124" width="64" height="32" rx="6" fill="var(--scene-card,#fff)" stroke="var(--scene-ink,#102a33)" stroke-width="2.5"/>
<rect class="learn-core-java-error-handling-lid" x="30" y="116" width="64" height="9" rx="3" fill="var(--scene-ink,#102a33)"/>
<text class="learn-core-java-error-handling-t" x="62" y="174" text-anchor="middle">close</text>
</svg>
