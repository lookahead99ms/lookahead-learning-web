<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A typed list accepts a seat and the compiler rejects a string">
<style>
.learn-core-java-generics-t{font:600 17px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.learn-core-java-generics-ok{animation:learn-core-java-generics-in 6s ease-in infinite;animation-delay:-3s}
.learn-core-java-generics-no{animation:learn-core-java-generics-out 6s ease-in infinite;animation-delay:-3s}
.learn-core-java-generics-x{animation:learn-core-java-generics-xs 6s ease-in infinite;animation-delay:-3s}
@keyframes learn-core-java-generics-in{0%{transform:translate(0,0);opacity:1}40%{transform:translate(0,0)}50%{transform:translate(0,58px)}75%,90%{transform:translate(0,58px);opacity:1}100%{opacity:0}}
@keyframes learn-core-java-generics-out{0%{transform:translate(0,0);opacity:1}30%{transform:translate(0,38px)}50%{transform:translate(26px,26px) rotate(18deg)}80%{transform:translate(60px,-8px) rotate(30deg);opacity:1}100%{transform:translate(70px,-12px);opacity:0}}
@keyframes learn-core-java-generics-xs{0%,28%{opacity:0}34%,62%{opacity:1}75%,100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<path d="M80 98V150H236V98" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="3.5" stroke-linejoin="round"/>
<text class="learn-core-java-generics-t" x="158" y="172" text-anchor="middle">List&lt;Seat&gt;</text>
<g fill="var(--scene-good,#1f7a4d)"><rect x="92" y="126" width="34" height="18" rx="4"/><rect x="132" y="126" width="34" height="18" rx="4"/></g>
<g class="learn-core-java-generics-ok"><rect x="102" y="20" width="34" height="18" rx="4" fill="var(--scene-good,#1f7a4d)"/></g>
<g class="learn-core-java-generics-no"><rect x="172" y="18" width="58" height="26" rx="13" fill="var(--scene-grow,#b8457a)"/><text x="201" y="37" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="700" fill="var(--scene-card,#fff)">"hi"</text></g>
<g class="learn-core-java-generics-x" stroke="var(--scene-bad,#b3261e)" stroke-width="5" stroke-linecap="round"><path d="M188 72l24 24M212 72l-24 24"/></g>
<text class="learn-core-java-generics-t" x="260" y="116" text-anchor="middle" fill="var(--scene-bad,#b3261e)" style="fill:var(--scene-bad,#b3261e)">rejected</text>
</svg>
