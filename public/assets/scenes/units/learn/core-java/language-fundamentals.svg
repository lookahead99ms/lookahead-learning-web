<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Copying an int gives an independent value; copying a reference shares one object">
<style>
.learn-core-java-language-fundamentals-t{font:600 17px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.learn-core-java-language-fundamentals-n{font:700 17px ui-monospace,Menlo,monospace;fill:var(--scene-ink,#102a33)}
.learn-core-java-language-fundamentals-cell{animation:learn-core-java-language-fundamentals-flash 6s ease-in-out infinite;animation-delay:-3s}
.learn-core-java-language-fundamentals-p{stroke-dasharray:6 5;animation:learn-core-java-language-fundamentals-dash 1.2s linear infinite;animation-delay:-3s}
.learn-core-java-language-fundamentals-cp{animation:learn-core-java-language-fundamentals-hop 6s ease-in-out infinite;animation-delay:-3s}
@keyframes learn-core-java-language-fundamentals-flash{0%,35%{fill:var(--scene-card,#fff)}50%,85%{fill:var(--scene-warn,#a15c00);opacity:.9}100%{fill:var(--scene-card,#fff)}}
@keyframes learn-core-java-language-fundamentals-dash{to{stroke-dashoffset:-11}}
@keyframes learn-core-java-language-fundamentals-hop{0%,15%{transform:translateX(-34px);opacity:0}35%,100%{transform:translateX(0);opacity:1}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
