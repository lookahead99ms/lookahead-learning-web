<g fill="var(--scene-card,#fff)" font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="700"><text x="157" y="85">01</text><text x="157" y="104">10</text></g>
<text class="learn-core-java-java-platform-t" x="170" y="136" text-anchor="middle">bytecode</text>
