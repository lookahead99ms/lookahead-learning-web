<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Source is compiled to bytecode, then the JVM warms up hot code">
<style>
.learn-core-java-java-platform-t{font:600 17px system-ui,sans-serif;fill:var(--scene-ink,#102a33)}
.learn-core-java-java-platform-pk{animation:learn-core-java-java-platform-run 6s linear infinite;animation-delay:-3s}
.learn-core-java-java-platform-gear{transform-box:fill-box;transform-origin:center;animation:learn-core-java-java-platform-spin 6s linear infinite;animation-delay:-3s}
.learn-core-java-java-platform-b1,.learn-core-java-java-platform-b2,.learn-core-java-java-platform-b3{transform-box:fill-box;transform-origin:50% 100%;animation:learn-core-java-java-platform-grow 6s ease-in-out infinite}
.learn-core-java-java-platform-b1{animation-delay:-3s}.learn-core-java-java-platform-b2{animation-delay:-2.5s}.learn-core-java-java-platform-b3{animation-delay:-2s}
@keyframes learn-core-java-java-platform-run{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(206px);opacity:0}}
@keyframes learn-core-java-java-platform-spin{to{transform:rotate(360deg)}}
@keyframes learn-core-java-java-platform-grow{0%{transform:scaleY(.25)}60%,100%{transform:scaleY(1)}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<path d="M50 88H264" stroke="var(--scene-line,#cfdfdc)" stroke-width="3" stroke-dasharray="5 5"/>
