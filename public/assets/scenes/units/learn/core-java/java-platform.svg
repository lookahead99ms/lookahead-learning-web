<rect x="14" y="58" width="44" height="56" rx="5" fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2"/>
<g stroke="var(--scene-accent,#006c73)" stroke-width="3" stroke-linecap="round"><path d="M22 74H46M22 86H40M22 98H48"/></g>
