<text class="learn-go-fundamentals-go-language-architecture-n" x="185" y="106">3</text>
<text class="learn-go-fundamentals-go-language-architecture-n" x="235" y="106">4</text>
<path class="learn-go-fundamentals-go-language-architecture-pb" d="M110 122V134H260V122M185 134V146" fill="none" stroke="var(--scene-ahead,#2f6fb3)" stroke-linejoin="round"/>
<rect x="130" y="146" width="110" height="28" rx="6" fill="var(--scene-card,#fff)" stroke="var(--scene-ahead,#2f6fb3)" stroke-width="2"/>
<text class="learn-go-fundamentals-go-language-architecture-t" x="185" y="165" text-anchor="middle">slice b</text>
</svg>
