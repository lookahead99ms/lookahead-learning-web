<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Workers read jobs from one channel, send results to another, and stop when the context deadline fires">
<style>
.learn-go-fundamentals-go-concurrency-model-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.learn-go-fundamentals-go-concurrency-model-j{animation:learn-go-fundamentals-go-concurrency-model-in 3s linear infinite}
.learn-go-fundamentals-go-concurrency-model-r{animation:learn-go-fundamentals-go-concurrency-model-out 3s linear infinite}
.learn-go-fundamentals-go-concurrency-model-d1{animation-delay:-3s}.learn-go-fundamentals-go-concurrency-model-d2{animation-delay:-2s}.learn-go-fundamentals-go-concurrency-model-d3{animation-delay:-1s}
.learn-go-fundamentals-go-concurrency-model-sweep{transform-origin:160px 26px;animation:learn-go-fundamentals-go-concurrency-model-sw 8s linear infinite;animation-delay:-3s}
.learn-go-fundamentals-go-concurrency-model-w{animation:learn-go-fundamentals-go-concurrency-model-wk 8s infinite;animation-delay:-3s}
.learn-go-fundamentals-go-concurrency-model-stop{animation:learn-go-fundamentals-go-concurrency-model-st 8s infinite;animation-delay:-3s}
@keyframes learn-go-fundamentals-go-concurrency-model-in{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(70px);opacity:0}}
@keyframes learn-go-fundamentals-go-concurrency-model-out{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(70px);opacity:0}}
@keyframes learn-go-fundamentals-go-concurrency-model-sw{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes learn-go-fundamentals-go-concurrency-model-wk{0%,80%{fill:var(--scene-learn,#0f8a8a)}85%,95%{fill:var(--scene-muted,#536970)}100%{fill:var(--scene-learn,#0f8a8a)}}
@keyframes learn-go-fundamentals-go-concurrency-model-st{0%,80%{opacity:0}85%,95%{opacity:1}100%{opacity:0}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<circle cx="160" cy="26" r="16" fill="var(--scene-card,#fff)" stroke="var(--scene-warn,#a15c00)" stroke-width="3"/>
<path class="learn-go-fundamentals-go-concurrency-model-sweep" d="M160 26V14" stroke="var(--scene-warn,#a15c00)" stroke-width="3" stroke-linecap="round"/>
<text class="learn-go-fundamentals-go-concurrency-model-t" x="184" y="31">deadline</text>
<g fill="var(--scene-accent-soft,#dcefed)" stroke="var(--scene-accent,#006c73)" stroke-width="2">
<rect x="10" y="85" width="80" height="26" rx="13"/><rect x="230" y="85" width="80" height="26" rx="13"/>
</g>
<g fill="var(--scene-accent,#006c73)">
<g class="learn-go-fundamentals-go-concurrency-model-j learn-go-fundamentals-go-concurrency-model-d1"><circle cx="20" cy="98" r="6"/></g>
<g class="learn-go-fundamentals-go-concurrency-model-j learn-go-fundamentals-go-concurrency-model-d2"><circle cx="20" cy="98" r="6"/></g>
<g class="learn-go-fundamentals-go-concurrency-model-j learn-go-fundamentals-go-concurrency-model-d3"><circle cx="20" cy="98" r="6"/></g>
</g>
<g fill="var(--scene-good,#1f7a4d)">
<g class="learn-go-fundamentals-go-concurrency-model-r learn-go-fundamentals-go-concurrency-model-d1"><rect x="240" y="92" width="12" height="12" rx="2"/></g>
<g class="learn-go-fundamentals-go-concurrency-model-r learn-go-fundamentals-go-concurrency-model-d2"><rect x="240" y="92" width="12" height="12" rx="2"/></g>
<g class="learn-go-fundamentals-go-concurrency-model-r learn-go-fundamentals-go-concurrency-model-d3"><rect x="240" y="92" width="12" height="12" rx="2"/></g>
</g>
<g stroke="var(--scene-ink,#102a33)" stroke-width="2" fill="none">
<path d="M90 98H104M216 98H230M104 98L118 66M104 98H118M104 98L118 130M202 66L216 98M202 98H216M202 130L216 98"/>
</g>
<g stroke="var(--scene-ink,#102a33)" stroke-width="2">
<rect class="learn-go-fundamentals-go-concurrency-model-w" x="118" y="52" width="84" height="28" rx="8"/>
<rect class="learn-go-fundamentals-go-concurrency-model-w" x="118" y="84" width="84" height="28" rx="8"/>
<rect class="learn-go-fundamentals-go-concurrency-model-w" x="118" y="116" width="84" height="28" rx="8"/>
</g>
<g fill="#fff" font-family="ui-monospace,Menlo,monospace" font-size="16" font-weight="700" text-anchor="middle">
<text x="160" y="71">go work</text><text x="160" y="103">go work</text><text x="160" y="135">go work</text>
</g>
<g class="learn-go-fundamentals-go-concurrency-model-stop">
<rect x="104" y="152" width="112" height="24" rx="12" fill="var(--scene-bad,#b3261e)"/>
<text x="160" y="170" fill="#fff" font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle">all return</text>
</g>
</svg>
