@keyframes learn-networking-basics-tcp-udp-led{0%,40%{opacity:.35}46%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.learn-networking-basics-tcp-udp-loop{animation-play-state:paused}}
