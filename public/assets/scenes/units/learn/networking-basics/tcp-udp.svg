@keyframes learn-networking-basics-tcp-udp-ca{0%,5%{transform:translateX(0);opacity:0}8%{opacity:1}42%{transform:translateX(118px);opacity:1}46%,100%{transform:translateX(118px);opacity:0}}
@keyframes learn-networking-basics-tcp-udp-cb{0%,50%{transform:translateX(0);opacity:0}53%{opacity:1}87%{transform:translateX(118px);opacity:1}91%,100%{transform:translateX(118px);opacity:0}}
@keyframes learn-networking-basics-tcp-udp-ok{0%,43%{opacity:0}47%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes learn-networking-basics-tcp-udp-d1{0%{transform:translateX(0);opacity:1}18%{transform:translateX(136px);opacity:1}20%,100%{transform:translateX(136px);opacity:0}}
@keyframes learn-networking-basics-tcp-udp-d2{0%,15%{transform:translateX(0);opacity:0}16%{opacity:1}33%{transform:translateX(136px);opacity:1}35%,100%{transform:translateX(136px);opacity:0}}
@keyframes learn-networking-basics-tcp-udp-d3{0%,30%{transform:translate(0,0);opacity:0}31%{opacity:1}39%{transform:translate(64px,0);opacity:1}44%{transform:translate(70px,22px);opacity:.6}46%,100%{transform:translate(70px,22px);opacity:0}}
@keyframes learn-networking-basics-tcp-udp-d4{0%,45%{transform:translateX(0);opacity:0}46%{opacity:1}63%{transform:translateX(136px);opacity:1}65%,100%{transform:translateX(136px);opacity:0}}
@keyframes learn-networking-basics-tcp-udp-d5{0%,60%{transform:translateX(0);opacity:0}61%{opacity:1}78%{transform:translateX(136px);opacity:1}80%,100%{transform:translateX(136px);opacity:0}}
