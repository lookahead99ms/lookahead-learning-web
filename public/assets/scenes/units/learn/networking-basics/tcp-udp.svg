<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A player in a voice channel: a JOIN command travels to the voice server over TCP and is confirmed, while audio frames stream over UDP and one lost frame is skipped">
<style>
.learn-networking-basics-tcp-udp-w{font-family:system-ui,sans-serif;font-size:14px;font-weight:700;fill:var(--scene-muted,#536970)}
