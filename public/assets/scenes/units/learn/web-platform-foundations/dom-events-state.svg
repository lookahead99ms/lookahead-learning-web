.learn-web-platform-foundations-dom-events-state-cur{animation:learn-web-platform-foundations-dom-events-state-cur 6s ease-in-out infinite;animation-delay:-3.4s}
@keyframes learn-web-platform-foundations-dom-events-state-cur{0%{transform:translate(30px,26px);opacity:0}6%,12%{transform:translate(0,0);opacity:1}16%{transform:translate(0,0) scale(.85)}20%,38%{transform:translate(0,0);opacity:1}42%{opacity:0}50%{transform:translate(30px,26px);opacity:0}56%,62%{transform:translate(0,0);opacity:1}66%{transform:translate(0,0) scale(.85)}70%,90%{transform:translate(0,0);opacity:1}96%,100%{opacity:0}}
.learn-web-platform-foundations-dom-events-state-flash{animation:learn-web-platform-foundations-dom-events-state-fl 6s linear infinite;animation-delay:-3s;opacity:0}
@keyframes learn-web-platform-foundations-dom-events-state-fl{0%,14%{opacity:0}18%{opacity:.9}28%,60%{opacity:0}66%{opacity:.9}78%,100%{opacity:0}}
.learn-web-platform-foundations-dom-events-state-ar{fill:none;stroke:var(--scene-accent,#006c73);stroke-width:3;stroke-dasharray:6 6;animation:learn-web-platform-foundations-dom-events-state-d 1s linear infinite}
@keyframes learn-web-platform-foundations-dom-events-state-d{to{stroke-dashoffset:-12}}
