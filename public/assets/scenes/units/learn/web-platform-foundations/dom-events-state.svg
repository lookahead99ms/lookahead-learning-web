.learn-web-platform-foundations-dom-events-state-v1{animation-name:learn-web-platform-foundations-dom-events-state-v1}.learn-web-platform-foundations-dom-events-state-v2{animation-name:learn-web-platform-foundations-dom-events-state-v2}.learn-web-platform-foundations-dom-events-state-v3{animation-name:learn-web-platform-foundations-dom-events-state-v3}
@keyframes learn-web-platform-foundations-dom-events-state-v1{0%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes learn-web-platform-foundations-dom-events-state-v2{0%,32%{opacity:0}33%,65%{opacity:1}66%,100%{opacity:0}}
