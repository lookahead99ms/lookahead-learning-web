<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="browser-http-security">
<style>
.learn-web-platform-foundations-browser-http-security-t{font-family:system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.learn-web-platform-foundations-browser-http-security-m{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;fill:var(--scene-ink,#102a33)}
.learn-web-platform-foundations-browser-http-security-card{fill:var(--scene-card,#fff);stroke:var(--scene-line,#cfdfdc);stroke-width:2}

.learn-web-platform-foundations-browser-http-security-bg{fill:var(--scene-accent-soft,#dcefed)}
.learn-web-platform-foundations-browser-http-security-pk{animation:learn-web-platform-foundations-browser-http-security-pk 6s linear infinite}
.learn-web-platform-foundations-browser-http-security-pkc{animation:learn-web-platform-foundations-browser-http-security-pkc 6s linear infinite}
@keyframes learn-web-platform-foundations-browser-http-security-pk{0%{transform:translateX(0);opacity:0}4%{opacity:1}30%{transform:translateX(100px);opacity:1}38%{transform:translateX(100px)}66%{transform:translateX(0);opacity:1}70%,100%{opacity:0;transform:translateX(0)}}
@keyframes learn-web-platform-foundations-browser-http-security-pkc{0%{transform:translateX(0);opacity:0}4%{opacity:1}30%{transform:translateX(50px);opacity:1}34%,100%{transform:translateX(50px);opacity:0}}
.learn-web-platform-foundations-browser-http-security-x{opacity:0;animation:learn-web-platform-foundations-browser-http-security-x 6s linear infinite}
@keyframes learn-web-platform-foundations-browser-http-security-x{0%,30%{opacity:0}34%,92%{opacity:1}96%,100%{opacity:0}}
.learn-web-platform-foundations-browser-http-security-chip{opacity:0;animation:learn-web-platform-foundations-browser-http-security-chip 6s linear infinite}
@keyframes learn-web-platform-foundations-browser-http-security-chip{0%,28%{opacity:0}34%,92%{opacity:1}96%,100%{opacity:0}}
</style>
<rect class="learn-web-platform-foundations-browser-http-security-bg" width="320" height="180"/>
<rect class="learn-web-platform-foundations-browser-http-security-card" x="16" y="18" width="34" height="32" rx="6"/><rect x="16" y="18" width="34" height="9" rx="4" fill="var(--scene-link,#245a88)"/>
<rect class="learn-web-platform-foundations-browser-http-security-card" x="170" y="18" width="34" height="32" rx="6"/><rect x="177" y="25" width="20" height="5" rx="2" fill="var(--scene-accent,#006c73)"/><rect x="177" y="35" width="20" height="5" rx="2" fill="var(--scene-accent,#006c73)"/>
<path d="M54 34H166" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="3 5"/>
<g class="learn-web-platform-foundations-browser-http-security-pk" style="animation-delay:-3s"><rect x="54" y="28" width="14" height="12" rx="3" fill="var(--scene-good,#1f7a4d)"/></g>

<g class="learn-web-platform-foundations-browser-http-security-chip" style="animation-delay:-3s"><rect x="214" y="19" width="94" height="30" rx="15" fill="var(--scene-good,#1f7a4d)"/>
<text x="261" y="39" text-anchor="middle" style="font:700 16px system-ui,sans-serif;fill:#fff">200 OK</text></g>
<rect class="learn-web-platform-foundations-browser-http-security-card" x="16" y="74" width="34" height="32" rx="6"/><rect x="16" y="74" width="34" height="9" rx="4" fill="var(--scene-link,#245a88)"/>
<rect class="learn-web-platform-foundations-browser-http-security-card" x="170" y="74" width="34" height="32" rx="6"/><rect x="177" y="81" width="20" height="5" rx="2" fill="var(--scene-accent,#006c73)"/><rect x="177" y="91" width="20" height="5" rx="2" fill="var(--scene-accent,#006c73)"/>
<path d="M54 90H166" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="3 5"/>
<g class="learn-web-platform-foundations-browser-http-security-pk" style="animation-delay:-3.3s"><rect x="54" y="84" width="14" height="12" rx="3" fill="var(--scene-warn,#a15c00)"/></g>

<g class="learn-web-platform-foundations-browser-http-security-chip" style="animation-delay:-3.3s"><rect x="214" y="75" width="94" height="30" rx="15" fill="var(--scene-warn,#a15c00)"/>
<text x="261" y="95" text-anchor="middle" style="font:700 16px system-ui,sans-serif;fill:#fff">404</text></g>
<rect class="learn-web-platform-foundations-browser-http-security-card" x="16" y="130" width="34" height="32" rx="6"/><rect x="16" y="130" width="34" height="9" rx="4" fill="var(--scene-link,#245a88)"/>
<rect class="learn-web-platform-foundations-browser-http-security-card" x="170" y="130" width="34" height="32" rx="6"/><rect x="177" y="137" width="20" height="5" rx="2" fill="var(--scene-accent,#006c73)"/><rect x="177" y="147" width="20" height="5" rx="2" fill="var(--scene-accent,#006c73)"/>
<path d="M54 146H166" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="3 5"/>
<g class="learn-web-platform-foundations-browser-http-security-pkc" style="animation-delay:-3.6s"><rect x="54" y="140" width="14" height="12" rx="3" fill="var(--scene-bad,#b3261e)"/></g>
<g class="learn-web-platform-foundations-browser-http-security-x" style="animation-delay:-3.6s"><path d="M104 137L120 155M120 137L104 155" stroke="var(--scene-bad,#b3261e)" stroke-width="4" stroke-linecap="round"/></g>
<g class="learn-web-platform-foundations-browser-http-security-chip" style="animation-delay:-3.6s"><rect x="214" y="131" width="94" height="30" rx="15" fill="var(--scene-bad,#b3261e)"/>
<text x="261" y="151" text-anchor="middle" style="font:700 16px system-ui,sans-serif;fill:#fff">No reply</text></g>
</svg>
