<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A courier puts a parcel into a door of a parcel locker: the locker controller writes the deposit through to its drive with fsync, a new journal row appears, and only then does the customer's phone receive the pickup code">
<style>
.os-files-io-w{font-family:system-ui,sans-serif;font-size:13px;font-weight:700;fill:var(--scene-muted,#536970)}
.os-files-io-loop{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear;animation-delay:-6.6s}
.os-files-io-box{animation-name:os-files-io-box}
.os-files-io-door{animation-name:os-files-io-door}
.os-files-io-dot{animation-name:os-files-io-dot}
.os-files-io-row{animation-name:os-files-io-row}
.os-files-io-msg{animation-name:os-files-io-msg}
.os-files-io-ok{animation-name:os-files-io-ok}
@keyframes os-files-io-box{0%,4%{transform:translateX(0);opacity:0}7%{opacity:1}26%{transform:translateX(52px);opacity:1}30%,100%{transform:translateX(52px);opacity:0}}
@keyframes os-files-io-door{0%,28%{opacity:0}32%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes os-files-io-dot{0%,33%{transform:translateX(0);opacity:0}35%{opacity:1}53%{transform:translateX(64px);opacity:1}56%,100%{transform:translateX(64px);opacity:0}}
@keyframes os-files-io-row{0%,55%{opacity:0}60%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes os-files-io-msg{0%,62%{transform:translateY(6px);opacity:0}68%,94%{transform:translateY(0);opacity:1}98%,100%{opacity:0}}
@keyframes os-files-io-ok{0%,72%{opacity:0}76%,94%{opacity:1}98%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.os-files-io-loop{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
