<rect x="160" y="70" width="44" height="42" rx="5" fill="var(--scene-ink,#102a33)" opacity=".85"/>
<text class="learn-os-cpu-sched-w" x="182" y="128" text-anchor="middle">CPU</text>
<g class="learn-os-cpu-sched-loop learn-os-cpu-sched-rz"><rect x="166" y="77" width="32" height="28" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-muted,#536970)" stroke-width="1.5"/><path d="M170 84h24M170 90h24M170 96h24M176 80v22M182 80v22M188 80v22" stroke="var(--scene-line,#cfdfdc)" stroke-width="1.2"/><rect x="178" y="88" width="8" height="8" fill="var(--scene-warn,#a15c00)"/></g>
<g class="learn-os-cpu-sched-loop learn-os-cpu-sched-up"><rect x="122" y="97" width="32" height="28" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-link,#245a88)" stroke-width="1.5"/><rect x="122" y="97" width="32" height="7" rx="2" fill="var(--scene-link,#245a88)"/><path d="M126 120l6-7 4 4 3-3 5 6z" fill="var(--scene-link,#245a88)"/></g>
<path d="M240 100H254" stroke="var(--scene-muted,#536970)" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
<g class="learn-os-cpu-sched-loop learn-os-cpu-sched-t1"><rect x="258" y="70" width="40" height="40" rx="3" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="1.5"/><path d="M262 106l11-13 6 6 5-5 10 12z" fill="var(--scene-accent,#006c73)"/></g>
<g class="learn-os-cpu-sched-loop learn-os-cpu-sched-t2"><rect x="262" y="116" width="24" height="24" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="1.5"/><path d="M264 138l7-8 4 4 3-3 6 7z" fill="var(--scene-accent,#006c73)"/></g>
<g class="learn-os-cpu-sched-loop learn-os-cpu-sched-t3"><rect x="290" y="124" width="14" height="14" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-line,#cfdfdc)" stroke-width="1.2"/><path d="M291 137l4-5 3 3 2-2 3 4z" fill="var(--scene-accent,#006c73)"/></g>
<g class="learn-os-cpu-sched-loop learn-os-cpu-sched-ok"><circle cx="300" cy="66" r="9" fill="var(--scene-good,#1f7a4d)"/><path d="M295 66l4 4 6-7" stroke="var(--scene-card,#fff)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
