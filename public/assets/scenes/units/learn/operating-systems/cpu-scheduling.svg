<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A photographer uploads a photo to a thumbnail service: the upload request takes the CPU core from a resize job, which waits in the run queue, then the resize job gets the core back and three thumbnails appear">
<style>
.learn-os-cpu-sched-w{font-family:system-ui,sans-serif;font-size:12px;font-weight:700;fill:var(--scene-muted,#536970)}
.learn-os-cpu-sched-loop{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear;animation-delay:-2.6s}
.learn-os-cpu-sched-photo{animation-name:learn-os-cpu-sched-photo}
.learn-os-cpu-sched-up{animation-name:learn-os-cpu-sched-up}
.learn-os-cpu-sched-rz{animation-name:learn-os-cpu-sched-rz}
.learn-os-cpu-sched-t1{animation-name:learn-os-cpu-sched-t1}
.learn-os-cpu-sched-t2{animation-name:learn-os-cpu-sched-t2}
.learn-os-cpu-sched-t3{animation-name:learn-os-cpu-sched-t3}
.learn-os-cpu-sched-ok{animation-name:learn-os-cpu-sched-ok}
.learn-os-cpu-sched-led{animation-name:learn-os-cpu-sched-led}
@keyframes learn-os-cpu-sched-photo{0%{transform:translateX(0);opacity:0}3%{opacity:1}18%{transform:translateX(52px);opacity:1}21%,100%{transform:translateX(52px);opacity:0}}
@keyframes learn-os-cpu-sched-up{0%,18%{transform:translate(0,0);opacity:0}21%{transform:translate(0,0);opacity:1}27%,44%{transform:translate(44px,-20px);opacity:1}50%{transform:translate(70px,-44px);opacity:0}100%{transform:translate(70px,-44px);opacity:0}}
@keyframes learn-os-cpu-sched-rz{0%,20%{transform:translate(0,0)}27%,44%{transform:translate(-44px,20px)}51%,100%{transform:translate(0,0)}}
@keyframes learn-os-cpu-sched-t1{0%,56%{opacity:0;transform:translateY(6px)}60%,94%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
@keyframes learn-os-cpu-sched-t2{0%,64%{opacity:0;transform:translateY(6px)}68%,94%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
@keyframes learn-os-cpu-sched-t3{0%,72%{opacity:0;transform:translateY(6px)}76%,94%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
@keyframes learn-os-cpu-sched-ok{0%,78%{opacity:0}82%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes learn-os-cpu-sched-led{0%,20%{opacity:.35}22%,46%{opacity:1}50%,100%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.learn-os-cpu-sched-loop{animation-play-state:paused}}
</style>
<rect width="320" height="180" fill="var(--scene-card,#fff)"/>
<g fill="var(--scene-ink,#102a33)" opacity=".09"><ellipse cx="44" cy="152" rx="36" ry="7"/><ellipse cx="176" cy="156" rx="72" ry="8"/><ellipse cx="282" cy="150" rx="32" ry="6"/></g>
<path d="M22 140c0-20 9-30 22-30s22 10 22 30z" fill="var(--scene-accent,#006c73)"/>
<circle cx="44" cy="94" r="12" fill="var(--scene-accent,#006c73)"/>
<rect x="52" y="104" width="20" height="34" rx="4" fill="var(--scene-ink,#102a33)"/>
<rect x="55" y="108" width="14" height="22" rx="2" fill="var(--scene-accent-soft,#dcefed)"/>
