<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A shopper searches a store from her phone: the search node's page fault reads a page of the index from disk into a free RAM frame, and the results reach her phone">
<style>
.learn-os-vm-w{font-family:system-ui,sans-serif;font-size:12px;font-weight:700;fill:var(--scene-muted,#536970)}
.learn-os-vm-loop{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear;animation-delay:-6.2s}
.learn-os-vm-req{animation-name:learn-os-vm-req}
.learn-os-vm-page{animation-name:learn-os-vm-page}
.learn-os-vm-cell{animation-name:learn-os-vm-cell}
.learn-os-vm-result{animation-name:learn-os-vm-result}
.learn-os-vm-ok{animation-name:learn-os-vm-ok}
.learn-os-vm-led{animation-name:learn-os-vm-led}
@keyframes learn-os-vm-req{0%{transform:translateX(0);opacity:0}3%{opacity:1}22%{transform:translateX(62px);opacity:1}25%,100%{transform:translateX(62px);opacity:0}}
@keyframes learn-os-vm-page{0%,25%{transform:translateX(0);opacity:0}28%{opacity:1}48%{transform:translateX(-88px);opacity:1}51%,100%{transform:translateX(-88px);opacity:0}}
@keyframes learn-os-vm-cell{0%,48%{opacity:0}52%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes learn-os-vm-result{0%,53%{transform:translateX(0);opacity:0}56%{opacity:1}76%{transform:translateX(-56px);opacity:1}80%,100%{transform:translateX(-56px);opacity:0}}
@keyframes learn-os-vm-ok{0%,74%{opacity:0}78%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes learn-os-vm-led{0%,25%{opacity:.35}30%,50%{opacity:1}55%,100%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.learn-os-vm-loop{animation-play-state:paused}}
</style>
