<circle class="learn-os-vm-loop learn-os-vm-req" cx="62" cy="104" r="4.5" fill="var(--scene-link,#245a88)"/>
<g class="learn-os-vm-loop learn-os-vm-page"><rect x="244" y="102" width="20" height="16" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-accent,#006c73)" stroke-width="1.5"/><path d="M248 107h12M248 112h8" stroke="var(--scene-accent,#006c73)" stroke-width="1.5"/></g>
<g class="learn-os-vm-loop learn-os-vm-result"><rect x="148" y="92" width="22" height="22" rx="2" fill="var(--scene-card,#fff)" stroke="var(--scene-link,#245a88)" stroke-width="1.5"/><path d="M152 99h14M152 104h10M152 109h12" stroke="var(--scene-link,#245a88)" stroke-width="1.5" stroke-linecap="round"/></g>
<g class="learn-os-vm-loop learn-os-vm-ok"><circle cx="94" cy="88" r="9" fill="var(--scene-good,#1f7a4d)"/><path d="M89.5 88l3 3 6-6" fill="none" stroke="var(--scene-card,#fff)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
