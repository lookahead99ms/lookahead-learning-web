<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 150" role="img" aria-label="A ticket system: fan app, gateway, reservation service and seats database. AI notes that 90 percent of requests are reads, you answer right there to add a cache, and the cache attaches to the reservation service">
<style>
.system-design-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); }
.system-design-tm { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: var(--scene-text, #28434a); }
.system-design-b { font-weight: 700; }
.system-design-box { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.system-design-acc { fill: var(--scene-accent, #006c73); }
.system-design-mut { fill: var(--scene-muted, #536970); }
.system-design-good { fill: var(--scene-good, #1f7a4d); }
.system-design-bad { fill: var(--scene-bad, #b3261e); }
.system-design-on-acc { fill: var(--scene-card, #ffffff); }
.system-design-wire { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 1.5; }
.system-design-dash { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 1.5; stroke-dasharray: 4 3; }
.system-design-spark { fill: var(--scene-accent, #006c73); }
.system-design-ai-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.system-design-aibox { fill: var(--scene-card, #ffffff); stroke: var(--scene-accent, #006c73); stroke-width: 1.5; }
.system-design-you-bg { fill: var(--scene-ink, #102a33); stroke: var(--scene-ink, #102a33); stroke-width: 1.5; }
.system-design-you-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-card, #ffffff); font-weight: 700; }
.system-design-bad-t { fill: var(--scene-bad, #b3261e); }
.system-design-good-t { fill: var(--scene-good, #1f7a4d); }

.system-design-soft { fill: var(--scene-card, #ffffff); stroke: var(--scene-ahead, #245a88); stroke-width: 1.5; }
.system-design-ai { animation: system-design-kf-ai 9s infinite; }
@keyframes system-design-kf-ai { 0%, 12% { opacity: 0; } 16%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
.system-design-you { animation: system-design-kf-you 9s infinite; }
@keyframes system-design-kf-you { 0%, 32% { opacity: 0; } 36%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
.system-design-cache { animation: system-design-kf-cache 9s infinite; }
@keyframes system-design-kf-cache { 0%, 48% { opacity: 0; } 52%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }

.system-design-ai, .system-design-you, .system-design-cache { animation-delay: -7s; }
</style>
<g class="system-design-ai"><g class="system-design-ai-mark" transform="translate(8 8)"><g transform="translate(0 4.5)"><path class="system-design-spark" d="M5.46 2.08 Q6.33 6.67 10.92 7.54 Q6.33 8.41 5.46 13 Q4.59 8.41 0 7.54 Q4.59 6.67 5.46 2.08Z M11.18 -0.13 Q11.53 1.73 13.39 2.08 Q11.53 2.43 11.18 4.29 Q10.83 2.43 8.97 2.08 Q10.83 1.73 11.18 -0.13Z M11.7 9.75 Q11.93 10.95 13.13 11.18 Q11.93 11.41 11.7 12.61 Q11.47 11.41 10.27 11.18 Q11.47 10.95 11.7 9.75Z"/></g><text class="system-design-ai-t" x="16" y="15.32" font-size="12">AI</text></g><text class="system-design-t" x="58" y="23.68" font-size="13">90% are reads</text></g>
<g class="system-design-you"><rect class="system-design-you-bg" x="8" y="36" width="44" height="22" rx="11"/><text class="system-design-you-t" x="30" y="51.32" font-size="12" text-anchor="middle">You</text><text class="system-design-t system-design-b" x="58" y="51.68" font-size="13">add a cache</text></g>
<g class="system-design-cache"><path class="system-design-dash" d="M224 36 V64"/><rect class="system-design-soft" x="184" y="8" width="80" height="28" rx="6"/><text class="system-design-t system-design-b" x="224" y="27" font-size="13" text-anchor="middle">Cache</text></g>
<rect class="system-design-box" x="8" y="72" width="66" height="30" rx="6"/><text class="system-design-t" x="41" y="91.5" font-size="13" text-anchor="middle">Fan's app</text>
<path class="system-design-wire" d="M74 87 H88"/>
<rect class="system-design-box" x="88" y="72" width="70" height="30" rx="6"/><text class="system-design-t" x="123" y="91.5" font-size="13" text-anchor="middle">Gateway</text>
<path class="system-design-wire" d="M158 87 H174"/>
<rect class="system-design-box" x="174" y="64" width="100" height="46" rx="6"/><text class="system-design-t" x="224" y="84" font-size="13" text-anchor="middle">Reservation</text><text class="system-design-t" x="224" y="101" font-size="13" text-anchor="middle">service</text>
<path class="system-design-wire" d="M224 110 V118"/>
<rect class="system-design-soft" x="184" y="118" width="80" height="26" rx="6"/><text class="system-design-t" x="224" y="136" font-size="13" text-anchor="middle">Seats DB</text>
</svg>
