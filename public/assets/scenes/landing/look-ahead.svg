.look-ahead-play .look-ahead-green { animation: look-ahead-kf-green 19.5s 1; }
@keyframes look-ahead-kf-green { 0%, 7.69%, 68.41% { opacity: 0; } 71.69%, 86.46% { opacity: 1; } 89.74%, 100%, 89.74%, 100% { opacity: 0; } }

.look-ahead-beam { transform-box: view-box; transform-origin: 169px 114px; }
.look-ahead-play .look-ahead-beam { animation: look-ahead-kf-beam 19.5s ease-in-out 1; }
@keyframes look-ahead-kf-beam { 0%, 7.69%, 49.54% { transform: rotate(0deg); } 54.46%, 86.46% { transform: rotate(6deg); } 89.74%, 100% { transform: rotate(0deg); } }
