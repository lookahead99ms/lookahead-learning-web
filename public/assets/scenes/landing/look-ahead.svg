.look-ahead-play .look-ahead-summary { animation: look-ahead-kf-summary 19.5s 1; }
@keyframes look-ahead-kf-summary { 0%, 5.64% { opacity: 1; } 7.69%, 84.82% { opacity: 0; } 86.87%, 100% { opacity: 1; } }
.look-ahead-play.look-ahead-paused * { animation-play-state: paused; }
</style>
