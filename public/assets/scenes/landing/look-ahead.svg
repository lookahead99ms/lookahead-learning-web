.look-ahead-alarm { fill: none; stroke: var(--scene-bad, #b3261e); stroke-width: 2; }
.look-ahead-chev { fill: none; stroke: var(--scene-bad, #b3261e); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
