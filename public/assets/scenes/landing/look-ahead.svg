<svg xmlns="http://www.w3.org/2000/svg" data-story-ms="19500" viewBox="0 0 240 135" role="img" aria-label="Look ahead to design what the team delivers. AI joins the system, you choose how. A phone app calls a Feed service that reads from a database; too many reads pile up until a cache goes between the Feed service and the database and reads hit the cache; then an AI ranker is attached to the Feed service, with sorting by likes as its fallback. When the ranker times out, the likes fallback keeps the feed loading and the balance tips toward available, because a slightly stale feed beats an empty one; you set a 50 ms budget for the ranker and everything is green again">
<style>
.look-ahead-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); }
.look-ahead-tm { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: var(--scene-text, #28434a); }
.look-ahead-b { font-weight: 700; }
.look-ahead-box { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
.look-ahead-acc { fill: var(--scene-accent, #006c73); }
.look-ahead-mut { fill: var(--scene-muted, #536970); }
.look-ahead-good { fill: var(--scene-good, #1f7a4d); }
.look-ahead-bad { fill: var(--scene-bad, #b3261e); }
.look-ahead-on-acc { fill: var(--scene-card, #ffffff); }
.look-ahead-wire { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 1.5; }
.look-ahead-dash { fill: none; stroke: var(--scene-muted, #536970); stroke-width: 1.5; stroke-dasharray: 4 3; }
.look-ahead-spark { fill: var(--scene-accent, #006c73); }
.look-ahead-ai-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); font-weight: 700; }
.look-ahead-aibox { fill: var(--scene-card, #ffffff); stroke: var(--scene-accent, #006c73); stroke-width: 1.5; }
.look-ahead-you-bg { fill: var(--scene-ink, #102a33); stroke: var(--scene-ink, #102a33); stroke-width: 1.5; }
.look-ahead-you-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-card, #ffffff); font-weight: 700; }
.look-ahead-bad-t { fill: var(--scene-bad, #b3261e); }
.look-ahead-good-t { fill: var(--scene-good, #1f7a4d); }

.look-ahead-svc { fill: var(--scene-card, #ffffff); stroke: var(--scene-ahead, #245a88); stroke-width: 2; }
.look-ahead-cache-bx { fill: var(--scene-card, #ffffff); stroke: var(--scene-ahead, #245a88); stroke-width: 1.5; }
.look-ahead-phone { fill: var(--scene-card, #ffffff); stroke: var(--scene-ink, #102a33); stroke-width: 1.5; }
.look-ahead-screen { fill: var(--scene-accent-soft, #dcefed); }
