<svg xmlns="http://www.w3.org/2000/svg" data-story-ms="19500" viewBox="0 0 240 135" role="img" aria-label="Grow to deliver what the team designs. AI writes with you, you run it. Build, ship, fix with AI. Plan: you ask to add an order export, AI offers three options, CSV, PDF or JSON, and you pick CSV. Build: AI writes the code and tests, you ship it. Fix: totals come out wrong in production, AI reads the logs and points to a null currency, you choose a default currency and it is fixed">
