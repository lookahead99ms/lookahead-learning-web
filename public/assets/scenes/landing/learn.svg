<svg xmlns="http://www.w3.org/2000/svg" data-story-ms="19500" viewBox="0 0 240 135" role="img" aria-label="Learn to solve it on your own. AI hints, you think. Looking for 42 in sorted prices one by one is slow; you ask for a faster way, AI hints that the list is sorted so you can halve the range, you halve it twice and find 42, and explain it back: halving takes about 6 steps, not 64. Then a new task, the first price of at least 40, and you solve it with the same idea on your own, no hint needed">
