.blaze-aibox { fill: var(--scene-card, #ffffff); stroke: var(--scene-accent, #006c73); stroke-width: 1.5; }
.blaze-you-bg { fill: var(--scene-ink, #102a33); stroke: var(--scene-ink, #102a33); stroke-width: 1.5; }
.blaze-you-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-card, #ffffff); font-weight: 700; }
.blaze-bad-t { fill: var(--scene-bad, #b3261e); }
.blaze-good-t { fill: var(--scene-good, #1f7a4d); }

.blaze-svc { fill: var(--scene-card, #ffffff); stroke: var(--scene-ahead, #245a88); stroke-width: 2; }
