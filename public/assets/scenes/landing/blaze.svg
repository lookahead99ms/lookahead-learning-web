<svg xmlns="http://www.w3.org/2000/svg" data-story-ms="19500" viewBox="0 0 240 135" role="img" aria-label="Blaze ahead to design what the team delivers. AI joins the system, you choose how. A phone app calls a Feed service that reads from a database; too many reads pile up until a cache goes between the Feed service and the database and reads hit the cache; then an AI ranker is attached to the Feed service, with sorting by likes as its fallback. When the ranker times out, the likes fallback keeps the feed loading and the balance tips toward available, because a slightly stale feed beats an empty one; you set a 50 ms budget for the ranker and everything is green again">
<style>
.blaze-t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--scene-ink, #102a33); }
.blaze-tm { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: var(--scene-text, #28434a); }
.blaze-b { font-weight: 700; }
.blaze-box { fill: var(--scene-card, #ffffff); stroke: var(--scene-line, #cfdfdc); stroke-width: 1.5; }
