<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LookAhead | Learn. Grow. Blaze.</title>
    <!-- DLV-941: default for every page; PageTitleStrategy replaces it per route after start-up. -->
    <meta
      name="description"
      content="Guided lessons and interview practice for software engineers: programming foundations, data structures and algorithms, production backend work and system design, so you can understand and verify the code AI writes."
    />
    <meta property="og:site_name" content="LookAhead" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LookAhead | Learn. Grow. Blaze." />
    <meta
      property="og:description"
      content="Guided lessons and interview practice for software engineers: programming foundations, data structures and algorithms, production backend work and system design, so you can understand and verify the code AI writes."
    />
    <meta name="twitter:card" content="summary" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Same rule as PlatformThemeService, before the app starts: the learner's stored choice,
      // otherwise dark. Without it the first paint would use the light tokens.
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('look-ahead-theme-v1');
          if (stored === 'light') theme = 'light';
          else if (stored === 'system')
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
