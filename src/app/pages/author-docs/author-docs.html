<app-platform-header />
<main id="main-content" class="admin-workspace docs-page">
  <app-author-admin-menu pageId="docs" />
  <div class="workspace-content">
    @if (selectedGroup(); as group) {
      <app-author-workspace-nav [tabbed]="true" [pageTitle]="group.label" pageId="docs">
        <p description class="reader">{{ group.reader }}</p>
      </app-author-workspace-nav>
      <nav class="page-grid" [attr.aria-label]="group.label + ' pages'" [style.--group-accent]="group.accent">
        @for (page of group.pages; track page.id) {
          <a [routerLink]="page.href">
            <span class="page-icon" aria-hidden="true">{{ page.icon }}</span>
            <strong>{{ page.label }}</strong>
            <span class="page-description">{{ page.description }}</span>
          </a>
        }
      </nav>
    } @else {
      <header class="docs-home-heading">
        <p class="eyebrow">Admin</p>
        <h1>Documentation</h1>
      </header>
      <nav class="page-grid group-grid" aria-label="Documentation group choices">
        @for (group of groups(); track group.id) {
          <a [href]="groupHref(group.id)" [style.--group-accent]="group.accent">
            <span class="page-icon" aria-hidden="true">{{ group.icon }}</span>
            <strong>{{ group.label }}</strong>
            <span class="page-description">{{ group.reader }}</span>
          </a>
        }
      </nav>
    }
  </div>
</main>
