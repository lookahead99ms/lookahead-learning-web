<div class="sidebar-header">
  <app-sidebar-toggle
    side="left"
    [open]="sidebarOpen()"
    [controls]="sidebarContentId"
    [label]="sidebarOpen() ? 'Close left sidebar' : 'Open left sidebar'"
    (toggled)="sidebarOpen.set(!sidebarOpen())"
  />
  <div class="workspace-heading">
    <p class="eyebrow">Admin</p>
    @if (headingLevel === 1) {
      <h1>{{ pageTitle }}</h1>
    } @else {
      <h2>{{ pageTitle }}</h2>
    }
  </div>
</div>
<div
  class="author-sidebar-content"
  [id]="sidebarContentId"
  [hidden]="!sidebarOpen()"
  [attr.inert]="sidebarOpen() ? null : ''"
>
  <ng-content select="[description]"></ng-content>
  @if (outline.length) {
    <nav class="heading-outline shared-sidebar-outline" [attr.aria-label]="pageTitle + ' outline'">
      <p class="outline-label">On this page</p>
      @for (item of outline; track item.href) {
        <a
          [href]="linkHref(item.href)"
          [attr.aria-current]="sectionIsCurrent(item) ? 'location' : null"
          (click)="followSection($event, item)"
          >{{ item.label }}</a
        >
      }
    </nav>
  }
  <ng-content></ng-content>
</div>
